[advisories]
yanked = "deny"
unused-ignored-advisory = "allow"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 is lockfile-only and absent from every activated all-target and all-workspace normal+build graph; any Cargo command failure or reachability expansion fails the custom gate" },
  { id = "RUSTSEC-2026-0214", reason = "gumdrop 0.8.1 is confined to tendermint-testgen dev metadata and is absent from normal+build execution for every workspace package" },
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is an unmaintained compile-time proc macro permitted only in the exact hepta-research-league -> trnm-finality-verifier -> tendermint -> flex-error path; every other workspace package and any path/version expansion is forbidden" },
]

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[[licenses.exceptions]]
name = "webpki-roots"
version = "=0.26.11"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
name = "webpki-roots"
version = "=1.0.9"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
