[workspace]
members = [
  "crates/shared-types",
  "crates/shared-errors",
  "crates/shared-tracing",
  "crates/shared-config",
  "crates/hepta-paper-raid-contracts",
  "services/identity-service",
  "services/ledger-service",
  "services/gateway-service",
  "services/execution-service",
  "services/audit-service",
  "services/capability-service",
  "services/consumer-entry-api",
  "services/hepta-research-league",
  "services/matrix-entry-adapter",
  "apps/matrix-bot-relay",
  "apps/matrix-bot-poller"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["Qi Team"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
term-exchange-protocol = { package = "trnm-economy-protocol", version = "=2.4.0", path = "vendor/trnm-economy-protocol" }
trnm-research-protocol = { version = "=0.1.0", path = "vendor/trnm-research-protocol" }
trnm-finality-types = { version = "=0.1.0", path = "vendor/trnm-finality-types" }
trnm-finality-verifier = { version = "=0.1.0", path = "vendor/trnm-finality-verifier" }
hepta-paper-raid-contracts = { path = "crates/hepta-paper-raid-contracts" }
