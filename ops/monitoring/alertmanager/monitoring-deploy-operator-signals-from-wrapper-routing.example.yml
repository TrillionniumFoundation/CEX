# Example Alertmanager routing/inhibition for wrapper-derived monitoring deploy signals.
# Intended for the metrics rendered by scripts/render-operator-signals-prometheus.sh.

route:
  receiver: cex-operator-chat
  group_by:
    - service
    - family
    - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - matchers:
        - family="monitoring-deploy"
      receiver: cex-operator-chat
      continue: false

receivers:
  - name: cex-operator-chat
    webhook_configs:
      - url: http://127.0.0.1:19093/example-chat-webhook
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - alertname="CexMonitoringDeployMetadataUnreadable"
    target_matchers:
      - alertname="CexMonitoringDeployPostActionStatus"
    equal:
      - service
