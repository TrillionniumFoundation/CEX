# Generated by scripts/assemble-monitoring-bundles.sh from ops/monitoring/monitoring-bundle-manifest.example.yml
# Bundle kind: prometheus
# Source files:
# - ops/monitoring/prometheus/consumer-entry-identity-governance-alerts.example.yml
# - ops/monitoring/prometheus/consumer-entry-trillionnium-route-runner-handoff-alerts.example.yml
# - ops/monitoring/prometheus/core-runtime-operator-signals-from-wrapper.example.yml
# - ops/monitoring/prometheus/product-edge-operator-signals-from-wrapper.example.yml
# - ops/monitoring/prometheus/monitoring-deploy-operator-signals-from-wrapper.example.yml

groups:
- name: cex-consumer-entry-identity-governance
  rules:
  - alert: CexConsumerEntryIdentityGovernanceInvalid
    expr: cex_consumer_entry_identity_governance_valid == 0
    for: 5m
    labels:
      severity: warning
      service: consumer-entry-api
      family: entry-identity
      route_hint: chat
    annotations:
      summary: consumer-entry identity governance is invalid
      description: 'consumer-entry-api reports identity_governance_valid=0.

        Check /health.identity_governance_overview to see which governance checks
        failed

        before attempting reload or rollback.

        '
      runbook: docs/operator-runbook-v1.md
      first_action: curl -s http://127.0.0.1:8090/health | jq '.identity_governance_overview'
  - alert: CexConsumerEntryIdentityBindingNotLoaded
    expr: cex_consumer_entry_identity_binding_loaded == 0
    for: 2m
    labels:
      severity: critical
      service: consumer-entry-api
      family: entry-identity
      route_hint: page
    annotations:
      summary: consumer-entry identity binding store is not loaded
      description: 'Binding metadata did not load successfully. This is closer to
        live identity resolution loss

        than a soft governance gap, so treat it as a paging candidate.

        '
      runbook: docs/operator-runbook-v1.md
      first_action: curl -s http://127.0.0.1:8090/health | jq '.identity_governance_overview,
        .identity_binding_metadata'
  - alert: CexConsumerEntryIdentityRegistryNotLoaded
    expr: cex_consumer_entry_identity_registry_loaded == 0
    for: 2m
    labels:
      severity: critical
      service: consumer-entry-api
      family: entry-identity
      route_hint: page
    annotations:
      summary: consumer-entry identity registry is not loaded
      description: 'The separate repo-local identity registry did not load successfully.

        Check registry metadata and registry path drift before retrying reload.

        '
      runbook: docs/operator-runbook-v1.md
      first_action: curl -s http://127.0.0.1:8090/health | jq '.identity_governance_overview,
        .identity_registry_metadata'
  - alert: CexConsumerEntryIdentityRefIntegrityBroken
    expr: cex_consumer_entry_identity_ref_integrity_ok == 0
    for: 2m
    labels:
      severity: critical
      service: consumer-entry-api
      family: entry-identity
      route_hint: page
    annotations:
      summary: consumer-entry identity ref-integrity is broken
      description: 'product_user_id references are broken in the active binding/registry
        pair.

        Fix the broken references first; do not treat this as just an actor/approval
        policy issue.

        '
      runbook: docs/operator-runbook-v1.md
      first_action: curl -s http://127.0.0.1:8090/health | jq '.identity_governance_overview,
        .identity_source_of_truth, .identity_binding_counts'
  - alert: CexConsumerEntryIdentityActorGateInvalid
    expr: cex_consumer_entry_identity_actor_gate_valid == 0
    for: 15m
    labels:
      severity: warning
      service: consumer-entry-api
      family: entry-identity
      route_hint: chat
    annotations:
      summary: consumer-entry identity actor gate is invalid
      description: 'Actor gate configuration does not currently satisfy governance
        requirements.

        This is usually a control-plane gap, not immediate live identity loss.

        '
      runbook: docs/operator-runbook-v1.md
      first_action: 'curl -s -H ''x-entry-token: <token>'' http://127.0.0.1:8090/v1/admin/identity-actors/status
        | jq'
  - alert: CexConsumerEntryIdentityApprovalSourceInvalid
    expr: cex_consumer_entry_identity_approval_source_valid == 0
    for: 15m
    labels:
      severity: warning
      service: consumer-entry-api
      family: entry-identity
      route_hint: chat
    annotations:
      summary: consumer-entry identity approval source is invalid
      description: 'The approved-revision source itself is empty, missing, or failed
        to load.

        Review the current approval source before retrying reload.

        '
      runbook: docs/operator-runbook-v1.md
      first_action: 'curl -s -H ''x-entry-token: <token>'' http://127.0.0.1:8090/v1/admin/identity-approval/source?limit=20
        | jq'
  - alert: CexConsumerEntryIdentityApprovalCoverageInvalid
    expr: cex_consumer_entry_identity_approval_coverage_valid == 0
    for: 15m
    labels:
      severity: warning
      service: consumer-entry-api
      family: entry-identity
      route_hint: chat
    annotations:
      summary: consumer-entry identity approval coverage is invalid
      description: 'The current effective identity revision is not covered by the
        approved-revision source.

        This is a governance gap, even if binding and registry still load.

        '
      runbook: docs/operator-runbook-v1.md
      first_action: 'curl -s -H ''x-entry-token: <token>'' http://127.0.0.1:8090/v1/admin/identity-approval/status
        | jq'
  - alert: CexConsumerEntrySessionAuthIssuerRegistryGovernanceInvalid
    expr: cex_consumer_entry_session_auth_issuer_registry_governance_valid == 0
    for: 10m
    labels:
      severity: warning
      service: consumer-entry-api
      family: entry-identity
      route_hint: chat
    annotations:
      summary: consumer-entry session-auth issuer registry governance is invalid
      description: 'The repo-local session-auth issuer registry governance line is
        not healthy.

        Check /health.session_auth_issuer_registry_governance_overview to see whether

        the issue is load status, revision metadata, actor gate, approval source,
        or approval coverage.

        '
      runbook: docs/operator-runbook-v1.md
      first_action: curl -s http://127.0.0.1:8090/health | jq '.session_auth_issuer_registry_governance_overview'
  - alert: CexConsumerEntrySessionAuthIssuerRegistryActorGateInvalid
    expr: cex_consumer_entry_session_auth_issuer_registry_actor_gate_valid == 0
    for: 15m
    labels:
      severity: warning
      service: consumer-entry-api
      family: entry-identity
      route_hint: chat
    annotations:
      summary: consumer-entry session-auth issuer registry actor gate is invalid
      description: 'The actor gate for repo-local session-auth issuer registry governance
        is enabled but

        not configured correctly.

        '
      runbook: docs/operator-runbook-v1.md
      first_action: 'curl -s -H ''x-entry-token: <token>'' http://127.0.0.1:8090/v1/admin/session-auth/issuer-registry/actors/status
        | jq'
  - alert: CexConsumerEntrySessionAuthIssuerRegistryApprovalSourceInvalid
    expr: cex_consumer_entry_session_auth_issuer_registry_approval_source_valid ==
      0
    for: 15m
    labels:
      severity: warning
      service: consumer-entry-api
      family: entry-identity
      route_hint: chat
    annotations:
      summary: consumer-entry session-auth issuer registry approval source is invalid
      description: 'The approved-revision source for the repo-local session-auth issuer
        registry is missing,

        empty, or failed to load.

        '
      runbook: docs/operator-runbook-v1.md
      first_action: 'curl -s -H ''x-entry-token: <token>'' http://127.0.0.1:8090/v1/admin/session-auth/issuer-registry/approval/status?limit=20
        | jq'
  - alert: CexConsumerEntrySessionAuthIssuerRegistryApprovalCoverageInvalid
    expr: cex_consumer_entry_session_auth_issuer_registry_approval_coverage_valid
      == 0
    for: 15m
    labels:
      severity: warning
      service: consumer-entry-api
      family: entry-identity
      route_hint: chat
    annotations:
      summary: consumer-entry session-auth issuer registry approval coverage is invalid
      description: 'The current live session-auth issuer registry revision is not
        covered by the current

        approved-revision source.

        '
      runbook: docs/operator-runbook-v1.md
      first_action: 'curl -s -H ''x-entry-token: <token>'' http://127.0.0.1:8090/v1/admin/session-auth/issuer-registry/approval/validate?limit=20
        | jq'
- name: cex-consumer-entry-trillionnium-route-runner-handoff
  rules:
  - alert: CexTrillionniumRouteRunnerHandoffAllGatesNotGreen
    expr: cex_consumer_entry_trillionnium_route_runner_handoff_all_gates_green ==
      0
    for: 5m
    labels:
      severity: critical
      service: consumer-entry-api
      family: product-edge
      component: trillionnium-route-runner-handoff
      owner: product-ops
      route_hint: page
    annotations:
      summary: Trillionnium route-runner handoff gates are not all green
      description: 'At least one of the route-runner handoff readiness gates is not
        green across

        playability, closed-beta, real-user beta, or public-commercial health evidence.

        This blocks a production signoff-quality Trillionnium handoff posture.

        '
      runbook: docs/operator-runbook-v1.md
      first_action: curl -s http://127.0.0.1:8090/health | jq '.trillionnium_world_playability_scorecard.route_runner_handoff_gate,
        .trillionnium_world_closed_beta_prototype.route_runner_handoff_gate, .trillionnium_world_real_user_beta.route_runner_handoff_gate,
        .trillionnium_world_public_commercial_product.route_runner_handoff_gate'
  - alert: CexTrillionniumRouteRunnerHandoffFeedSourceMissing
    expr: cex_consumer_entry_trillionnium_route_runner_handoff_feed_source_count <
      7
    for: 5m
    labels:
      severity: critical
      service: consumer-entry-api
      family: product-edge
      component: trillionnium-route-runner-handoff
      owner: product-ops
      route_hint: page
    annotations:
      summary: Trillionnium route-runner handoff feed source is missing or incomplete
      description: 'The client feed source count dropped below the expected handoff-ready
        source set.

        The route_runner_handoff source may have disappeared from /feed or /app feed
        hydration.

        '
      runbook: docs/operator-runbook-v1.md
      first_action: curl -s http://127.0.0.1:8090/health | jq '.trillionnium_world_playability_scorecard.route_runner_handoff_gate'
  - alert: CexTrillionniumRouteRunnerHandoffRunnerCountZero
    expr: cex_consumer_entry_trillionnium_route_runner_handoff_runner_count == 0
    for: 10m
    labels:
      severity: warning
      service: consumer-entry-api
      family: product-edge
      component: trillionnium-route-runner-handoff
      owner: product-ops
      route_hint: chat
    annotations:
      summary: Trillionnium route-runner handoff has no active runners
      description: 'Route-runner handoff evidence exists but currently reports zero
        runners.

        Check whether world map projection, feed hydration, or seeded first-session
        routes regressed.

        '
      runbook: docs/operator-runbook-v1.md
      first_action: curl -s http://127.0.0.1:8090/metrics | grep cex_consumer_entry_trillionnium_route_runner_handoff
  - alert: CexTrillionniumRouteRunnerHandoffActionsMissing
    expr: cex_consumer_entry_trillionnium_route_runner_handoff_reward_claim_action_count
      == 0 or cex_consumer_entry_trillionnium_route_runner_handoff_next_route_action_count
      == 0
    for: 10m
    labels:
      severity: warning
      service: consumer-entry-api
      family: product-edge
      component: trillionnium-route-runner-handoff
      owner: product-ops
      route_hint: chat
    annotations:
      summary: Trillionnium route-runner handoff actions are missing
      description: 'Reward-claim or next-route handoff actions dropped to zero. Players
        may see runners

        without a clear claim-reward / open-next-route path.

        '
      runbook: docs/operator-runbook-v1.md
      first_action: curl -s http://127.0.0.1:8090/health | jq '.trillionnium_world_playability_scorecard.route_runner_handoff_gate
        | {reward_claim_action_count, next_route_action_count, first_next_route_status}'
  - alert: CexTrillionniumRouteRunnerHandoffRouteMasteryMissing
    expr: cex_consumer_entry_trillionnium_route_runner_handoff_route_mastery_contract_visible
      == 0 or cex_consumer_entry_trillionnium_route_runner_handoff_route_mastery_runner_count
      == 0 or cex_consumer_entry_trillionnium_route_runner_handoff_first_route_mastery_xp
      == 0
    for: 10m
    labels:
      severity: warning
      service: consumer-entry-api
      family: product-edge
      component: trillionnium-route-runner-handoff
      owner: product-ops
      route_hint: chat
    annotations:
      summary: Trillionnium route-runner mastery progression is missing
      description: 'Route-runner handoff is expected to expose the trillionnium_route_mastery_v1
        contract,

        at least one mastery runner, and non-zero first-runner XP. If this fires,
        players may

        still see route runners but lose visible XP/tier/next-goal progression.

        '
      runbook: docs/operator-runbook-v1.md
      first_action: curl -s http://127.0.0.1:8090/metrics | grep 'cex_consumer_entry_trillionnium_route_runner_handoff_.*mastery'
- name: cex-core-runtime-operator-signals-from-wrapper
  rules:
  - alert: CexGatewayInfoEndpointUnreachable
    expr: cex_operator_signal_source_fetch_ok{source="gateway"} == 0
    for: 2m
    labels:
      severity: critical
      service: gateway-service
      family: upstream
      route_hint: page
    annotations:
      summary: gateway /v1/info is unreachable
      description: 'The unified operator-signal wrapper could not fetch gateway /v1/info.

        Treat this as core runtime unreachability, not just a product-edge warning.

        '
      first_action: curl -s http://127.0.0.1:8080/health && curl -s http://127.0.0.1:8080/v1/info
        | jq
      runbook: docs/operator-runbook-v1.md
  - alert: CexExecutionInfoEndpointUnreachable
    expr: cex_operator_signal_source_fetch_ok{source="execution"} == 0
    for: 2m
    labels:
      severity: critical
      service: execution-service
      family: execution-runtime
      route_hint: page
    annotations:
      summary: execution /v1/info is unreachable
      description: 'The unified operator-signal wrapper could not fetch execution
        /v1/info.

        This usually means execution-service itself or one of its immediate dependencies
        is unavailable.

        '
      first_action: curl -s http://127.0.0.1:7003/health && curl -s http://127.0.0.1:7003/v1/info
        | jq
      runbook: docs/operator-runbook-v1.md
  - alert: CexGatewayInvocationCreateUpstreamFailures
    expr: cex_operator_signal_active{service="gateway",name="invocation_create_upstream_failures"}
      == 1
    for: 5m
    labels:
      severity: warning
      service: gateway-service
      family: upstream
      route_hint: chat
    annotations:
      summary: gateway invocation_create_upstream_failures is active
      description: 'gateway-service is reporting upstream invocation-create failures
        through the wrapper signal surface.

        Check execution before restarting gateway blindly.

        '
      first_action: curl -s http://127.0.0.1:8080/v1/info | jq && curl -s http://127.0.0.1:7003/v1/info
        | jq
      runbook: docs/operator-runbook-v1.md
  - alert: CexExecutionApprovalBacklog
    expr: cex_operator_signal_active{service="execution",name="approval_backlog"}
      == 1
    for: 10m
    labels:
      severity: warning
      service: execution-service
      family: approval
      route_hint: chat
    annotations:
      summary: execution approval backlog is active
      description: 'execution-service reports approval backlog above threshold.

        This is often a policy/operator bottleneck rather than a worker crash.

        '
      first_action: curl -s http://127.0.0.1:7003/v1/info | jq '.runtime.awaiting_approval,
        .operator_signals.approval_backlog, .policy'
      runbook: docs/operator-runbook-v1.md
  - alert: CexExecutionQueuedWorkerLeaseExpired
    expr: cex_operator_signal_active{service="execution",name="queued_worker_lease_expired"}
      == 1
    for: 5m
    labels:
      severity: warning
      service: execution-service
      family: worker
      route_hint: chat
    annotations:
      summary: execution queued-worker lease expired churn is active
      description: 'execution-service reports expired worker leases above threshold.

        Check whether workers are missing, stuck, or simply too slow.

        '
      first_action: curl -s http://127.0.0.1:7003/v1/info | jq '.runtime.queued_worker,
        .operator_signals.queued_worker_lease_expired'
      runbook: docs/operator-runbook-v1.md
  - alert: CexExecutionQueuedWorkerRetryBudgetExhausted
    expr: cex_operator_signal_active{service="execution",name="queued_worker_retry_budget_exhausted"}
      == 1
    for: 5m
    labels:
      severity: warning
      service: execution-service
      family: worker
      route_hint: chat
    annotations:
      summary: execution queued-worker retry budget exhausted is active
      description: 'execution-service reports retry-budget exhaustion in the queued
        worker path.

        Inspect failing executions before bulk requeue.

        '
      first_action: curl -s http://127.0.0.1:7003/v1/info | jq '.runtime.queued_worker,
        .operator_signals.queued_worker_retry_budget_exhausted'
      runbook: docs/operator-runbook-v1.md
  - alert: CexExecutionProviderDeadLetters
    expr: cex_operator_signal_active{service="execution",name="provider_dead_letters"}
      == 1
    for: 5m
    labels:
      severity: critical
      service: execution-service
      family: provider
      route_hint: page
    annotations:
      summary: execution provider dead-letter failures are active
      description: 'execution-service reports terminal provider failures that should
        not be blindly retried.

        This includes non-retryable provider errors and retryable errors whose attempt
        budget is exhausted.

        '
      first_action: curl -s http://127.0.0.1:7003/v1/info | jq '.runtime.provider_failures,
        .operator_signals.provider_dead_letters'
      runbook: docs/operator-runbook-v1.md
  - alert: CexExecutionProviderRetryBudgetExhausted
    expr: cex_operator_signal_active{service="execution",name="provider_retry_budget_exhausted"}
      == 1
    for: 5m
    labels:
      severity: critical
      service: execution-service
      family: provider
      route_hint: page
    annotations:
      summary: execution provider retry budget exhausted is active
      description: 'execution-service reports provider-backed executions that consumed
        their retry budget and reached terminal failure.

        Inspect the provider failure class before any manual retry or provider switch.

        '
      first_action: curl -s http://127.0.0.1:7003/v1/info | jq '.runtime.provider_failures,
        .operator_signals.provider_retry_budget_exhausted'
      runbook: docs/operator-runbook-v1.md
  - alert: CexExecutionAuditFailures
    expr: cex_operator_signal_active{service="execution",name="audit_failures"} ==
      1
    for: 5m
    labels:
      severity: warning
      service: execution-service
      family: audit
      route_hint: chat
    annotations:
      summary: execution audit_failures is active
      description: 'execution-service reports audit write failures.

        This is an integrity degradation even if the business path still partially
        works.

        '
      first_action: curl -s http://127.0.0.1:7004/health && curl -s http://127.0.0.1:7003/v1/info
        | jq '.metrics.audit_failures, .operator_signals.audit_failures'
      runbook: docs/operator-runbook-v1.md
  - alert: CexExecutionRefundFailures
    expr: cex_operator_signal_active{service="execution",name="refund_failures"} ==
      1
    for: 2m
    labels:
      severity: critical
      service: execution-service
      family: refund
      route_hint: page
    annotations:
      summary: execution refund_failures is active
      description: 'execution-service reports refund failures above threshold.

        Treat this as a consistency-impacting incident, not a low-priority warning.

        '
      first_action: curl -s http://127.0.0.1:7002/health && curl -s http://127.0.0.1:7003/v1/info
        | jq '.metrics.refund_failures, .operator_signals.refund_failures'
      runbook: docs/operator-runbook-v1.md
- name: cex-product-edge-operator-signals-from-wrapper
  rules:
  - alert: CexConsumerEntryHealthEndpointUnreachable
    expr: cex_operator_signal_source_fetch_ok{source="consumer_entry"} == 0
    for: 5m
    labels:
      severity: warning
      service: consumer-entry-api
      family: product-edge
      route_hint: chat
    annotations:
      summary: consumer-entry /health is unreachable
      description: 'The unified wrapper could not fetch consumer-entry-api /health.

        This is a product-edge availability issue even if core runtime remains reachable.

        '
      first_action: curl -s http://127.0.0.1:8090/health | jq
      runbook: docs/operator-runbook-v1.md
  - alert: CexConsumerEntryHealthStatusNotOk
    expr: cex_operator_signal_active{service="consumer_entry",name="health_status_not_ok"}
      == 1
    for: 10m
    labels:
      severity: warning
      service: consumer-entry-api
      family: product-edge
      route_hint: chat
    annotations:
      summary: consumer-entry health status is not ok
      description: 'consumer-entry-api /health is reachable but reports status !=
        ok.

        Inspect the health payload before assuming ingress abuse or runtime unreachability.

        '
      first_action: curl -s http://127.0.0.1:8090/health | jq
      runbook: docs/operator-runbook-v1.md
  - alert: CexConsumerEntryRateLimitedRequests
    expr: cex_operator_signal_active{service="consumer_entry",name="rate_limited_requests"}
      == 1
    for: 10m
    labels:
      severity: warning
      service: consumer-entry-api
      family: entry-abuse
      route_hint: chat
    annotations:
      summary: consumer-entry rate_limited_requests is active
      description: 'consumer-entry-api reports rate-limited requests above the configured
        wrapper threshold.

        This may be abuse, a noisy integration, or an undersized threshold.

        '
      first_action: curl -s http://127.0.0.1:8090/health | jq '.metrics, .rate_limit_window_secs,
        .rate_limit_max_requests'
      runbook: docs/operator-runbook-v1.md
  - alert: CexConsumerEntryIngressAuthFailures
    expr: cex_operator_signal_active{service="consumer_entry",name="ingress_auth_failures"}
      == 1
    for: 10m
    labels:
      severity: warning
      service: consumer-entry-api
      family: entry-abuse
      route_hint: chat
    annotations:
      summary: consumer-entry ingress_auth_failures is active
      description: 'consumer-entry-api reports ingress auth failures above threshold.

        Treat this as a likely entry token / caller-config / abuse investigation.

        '
      first_action: curl -s http://127.0.0.1:8090/health | jq '.metrics, .ingress_protected'
      runbook: docs/operator-runbook-v1.md
  - alert: CexMatrixEntryHealthEndpointUnreachable
    expr: cex_operator_signal_source_fetch_ok{source="matrix_entry"} == 0
    for: 5m
    labels:
      severity: warning
      service: matrix-entry-adapter
      family: product-edge
      route_hint: chat
    annotations:
      summary: matrix-entry /health is unreachable
      description: 'The unified wrapper could not fetch matrix-entry-adapter /health.

        Check the adapter process and its local ingress before blaming gateway/execution.

        '
      first_action: curl -s http://127.0.0.1:8091/health | jq
      runbook: docs/operator-runbook-v1.md
  - alert: CexMatrixEntryHealthStatusNotOk
    expr: cex_operator_signal_active{service="matrix_entry",name="health_status_not_ok"}
      == 1
    for: 10m
    labels:
      severity: warning
      service: matrix-entry-adapter
      family: product-edge
      route_hint: chat
    annotations:
      summary: matrix-entry health status is not ok
      description: 'matrix-entry-adapter /health is reachable but reports status !=
        ok.

        Inspect its health payload before assuming Matrix-side duplicate or abuse
        noise.

        '
      first_action: curl -s http://127.0.0.1:8091/health | jq
      runbook: docs/operator-runbook-v1.md
  - alert: CexMatrixEntryRateLimitedRequests
    expr: cex_operator_signal_active{service="matrix_entry",name="rate_limited_requests"}
      == 1
    for: 10m
    labels:
      severity: warning
      service: matrix-entry-adapter
      family: entry-abuse
      route_hint: chat
    annotations:
      summary: matrix-entry rate_limited_requests is active
      description: 'matrix-entry-adapter reports rate-limited requests above threshold.

        Inspect recent event volume and rate-limit windows before changing thresholds.

        '
      first_action: curl -s http://127.0.0.1:8091/health | jq '.metrics, .rate_limit_window_secs,
        .rate_limit_max_requests'
      runbook: docs/operator-runbook-v1.md
  - alert: CexMatrixEntryIngressAuthFailures
    expr: cex_operator_signal_active{service="matrix_entry",name="ingress_auth_failures"}
      == 1
    for: 10m
    labels:
      severity: warning
      service: matrix-entry-adapter
      family: entry-abuse
      route_hint: chat
    annotations:
      summary: matrix-entry ingress_auth_failures is active
      description: 'matrix-entry-adapter reports ingress auth failures above threshold.

        Investigate token drift or unauthorized callers before widening access.

        '
      first_action: curl -s http://127.0.0.1:8091/health | jq '.metrics, .ingress_protected,
        .consumer_entry_protected'
      runbook: docs/operator-runbook-v1.md
  - alert: CexMatrixEntryDuplicateEvents
    expr: cex_operator_signal_active{service="matrix_entry",name="duplicate_events"}
      == 1
    for: 10m
    labels:
      severity: warning
      service: matrix-entry-adapter
      family: entry-abuse
      route_hint: chat
    annotations:
      summary: matrix-entry duplicate_events is active
      description: 'matrix-entry-adapter reports duplicate Matrix events above threshold.

        This can indicate sync-loop drift, replay windows that are too small, or upstream
        resend churn.

        '
      first_action: curl -s http://127.0.0.1:8091/health | jq '.metrics, .recent_event_window_secs,
        .recent_event_cache_size'
      runbook: docs/operator-runbook-v1.md
- name: cex-monitoring-deploy-operator-signals-from-wrapper
  rules:
  - alert: CexMonitoringDeployPostActionStatus
    expr: cex_operator_signal_active{service="monitoring_deploy",name="post_action_status"}
      == 1
    for: 10m
    labels:
      severity: warning
      service: monitoring-deploy
      family: monitoring-deploy
      route_hint: chat
    annotations:
      summary: monitoring deploy post-action verdict requires attention
      description: 'The latest monitoring deploy metadata reports an unhealthy post-deploy
        verdict.

        This usually means reload/verify failed or never completed cleanly.

        '
      first_action: ./scripts/read-monitoring-deploy-status.sh --compact
      runbook: docs/operator-runbook-v1.md
  - alert: CexMonitoringDeployMetadataUnreadable
    expr: cex_operator_signal_active{service="monitoring_deploy",name="metadata_unreadable"}
      == 1
    for: 5m
    labels:
      severity: warning
      service: monitoring-deploy
      family: monitoring-deploy
      route_hint: chat
    annotations:
      summary: monitoring deploy metadata is unreadable
      description: 'check-operator-signals.sh could not read or parse monitoring-deploy-metadata.yml.

        The deploy verdict source is currently unavailable, so inspect the metadata
        file and reader helper.

        '
      first_action: ./scripts/read-monitoring-deploy-status.sh --compact || true
      runbook: docs/operator-runbook-v1.md
