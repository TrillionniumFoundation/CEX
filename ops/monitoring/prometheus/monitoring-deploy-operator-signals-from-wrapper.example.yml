# Example Prometheus alert rules built from the unified JSON output of:
#   ./scripts/check-operator-signals.sh --compact
# converted through:
#   ./scripts/render-operator-signals-prometheus.sh
#
# This file focuses on wrapper-derived monitoring deploy signals sourced from
# monitoring-deploy-metadata.yml through check-operator-signals.sh.

groups:
  - name: cex-monitoring-deploy-operator-signals-from-wrapper
    rules:
      - alert: CexMonitoringDeployPostActionStatus
        expr: cex_operator_signal_active{service="monitoring_deploy",name="post_action_status"} == 1
        for: 10m
        labels:
          severity: warning
          service: monitoring-deploy
          family: monitoring-deploy
          route_hint: chat
        annotations:
          summary: monitoring deploy post-action verdict requires attention
          description: |
            The latest monitoring deploy metadata reports an unhealthy post-deploy verdict.
            This usually means reload/verify failed or never completed cleanly.
          first_action: "./scripts/read-monitoring-deploy-status.sh --compact"
          runbook: docs/operator-runbook-v1.md

      - alert: CexMonitoringDeployMetadataUnreadable
        expr: cex_operator_signal_active{service="monitoring_deploy",name="metadata_unreadable"} == 1
        for: 5m
        labels:
          severity: warning
          service: monitoring-deploy
          family: monitoring-deploy
          route_hint: chat
        annotations:
          summary: monitoring deploy metadata is unreadable
          description: |
            check-operator-signals.sh could not read or parse monitoring-deploy-metadata.yml.
            The deploy verdict source is currently unavailable, so inspect the metadata file and reader helper.
          first_action: "./scripts/read-monitoring-deploy-status.sh --compact || true"
          runbook: docs/operator-runbook-v1.md
