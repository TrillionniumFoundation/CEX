# Machine-readable inventory for the current minimal repo-local CEX monitoring bundle.

version: 1
bundle: cex-minimal-wrapper-monitoring
prometheus:
  combinedBundle: ops/monitoring/prometheus/minimal-wrapper-monitoring-bundle.example.yml
  files:
  - path: ops/monitoring/prometheus/consumer-entry-identity-governance-alerts.example.yml
    source: service-metrics
    services:
    - consumer-entry-api
    family: entry-identity
  - path: ops/monitoring/prometheus/core-runtime-operator-signals-from-wrapper.example.yml
    source: wrapper-bridge
    bridge: scripts/render-operator-signals-prometheus.sh
    services:
    - gateway-service
    - execution-service
    family: core-runtime
  - path: ops/monitoring/prometheus/product-edge-operator-signals-from-wrapper.example.yml
    source: wrapper-bridge
    bridge: scripts/render-operator-signals-prometheus.sh
    services:
    - consumer-entry-api
    - matrix-entry-adapter
    family: product-edge
  - path: ops/monitoring/prometheus/monitoring-deploy-operator-signals-from-wrapper.example.yml
    source: wrapper-bridge
    bridge: scripts/render-operator-signals-prometheus.sh
    services:
    - monitoring-deploy
    family: monitoring-deploy
alertmanager:
  combinedBundle: ops/monitoring/alertmanager/minimal-wrapper-monitoring-bundle.example.yml
  files:
  - path: ops/monitoring/alertmanager/consumer-entry-identity-governance-routing.example.yml
    family: entry-identity
  - path: ops/monitoring/alertmanager/core-runtime-operator-signals-from-wrapper-routing.example.yml
    family: core-runtime
  - path: ops/monitoring/alertmanager/product-edge-operator-signals-from-wrapper-routing.example.yml
    family: product-edge
  - path: ops/monitoring/alertmanager/monitoring-deploy-operator-signals-from-wrapper-routing.example.yml
    family: monitoring-deploy
managementScripts:
- scripts/assemble-monitoring-bundles.sh
- scripts/export-monitoring-bundles.sh
- scripts/install-monitoring-bundles.sh
- scripts/overlay-monitoring-bundles.sh
- scripts/deploy-monitoring-bundles.sh
- scripts/reload-monitoring-targets.sh
- scripts/verify-monitoring-targets.sh
- scripts/read-monitoring-deploy-status.sh
- scripts/read-operator-signal-cron-catalog.sh
- scripts/render-operator-signal-policy-bundle.sh
- scripts/register-openclaw-operator-signal-cron.sh
- scripts/install-operator-signal-cron.sh
- install-operator-signal-cron.sh
bridgeScripts:
- scripts/check-operator-signals.sh
- scripts/run-operator-signal-check.sh
- scripts/render-operator-signals-prometheus.sh
notes:
- consumer-entry identity governance currently has both direct metrics rules and wrapper-derived
  endpoint/abuse rules
- gateway-service and execution-service now both have native /metrics gauges while
  the minimal bundle keeps wrapper-derived alerts during migration
- matrix-entry-adapter currently participates through wrapper-derived product-edge
  signals
- monitoring deploy post-action verdicts can now surface through wrapper-derived
  monitoring-deploy signals when monitoring-deploy-metadata.yml is present
