services:
  hepta:
    image: ${HEPTA_IMAGE:?immutable HEPTA_IMAGE digest is required}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:${HEPTA_HOST_PORT:-7011}:7011"
    environment:
      HEPTA_BIND_ADDR: 0.0.0.0:7011
      HEPTA_DATABASE_URL: ${HEPTA_DATABASE_URL:?required}
      HEPTA_FINALITY_DATABASE_URL: ${HEPTA_FINALITY_DATABASE_URL:?isolated finality-writer URL required}
      HEPTA_OPERATOR_TOKEN: ${HEPTA_OPERATOR_TOKEN:?required}
      HEPTA_NAKAMA_TOKEN: ${HEPTA_NAKAMA_TOKEN:?required}
      HEPTA_NAKAMA_AUTHORIZATION_ISSUER_KEY_ID: ${HEPTA_NAKAMA_AUTHORIZATION_ISSUER_KEY_ID:?trusted issuer key id required}
      HEPTA_NAKAMA_AUTHORIZATION_ED25519_SEED_BASE64: ${HEPTA_NAKAMA_AUTHORIZATION_ED25519_SEED_BASE64:?secret-manager 32-byte seed required}
      HEPTA_NAKAMA_CONTROL_ISSUER_KEY_ID: ${HEPTA_NAKAMA_CONTROL_ISSUER_KEY_ID:?dedicated control issuer key id required}
      HEPTA_NAKAMA_CONTROL_ED25519_SEED_BASE64: ${HEPTA_NAKAMA_CONTROL_ED25519_SEED_BASE64:?dedicated secret-manager 32-byte control seed required}
      HEPTA_NAKAMA_BASE_URL: ${HEPTA_NAKAMA_BASE_URL:?Nakama internal base URL required}
      HEPTA_NAKAMA_RUNTIME_HTTP_KEY: ${HEPTA_NAKAMA_RUNTIME_HTTP_KEY:?Nakama runtime HTTP key required}
      HEPTA_CONSUMER_EDGE_ISSUER: ${HEPTA_CONSUMER_EDGE_ISSUER:?Consumer Edge issuer required}
      HEPTA_CONSUMER_EDGE_AUDIENCE: ${HEPTA_CONSUMER_EDGE_AUDIENCE:?Consumer Edge audience required}
      HEPTA_CONSUMER_EDGE_ISSUER_KEY_ID: ${HEPTA_CONSUMER_EDGE_ISSUER_KEY_ID:?Consumer Edge key id required}
      HEPTA_CONSUMER_EDGE_ED25519_PUBLIC_KEY_BASE64: ${HEPTA_CONSUMER_EDGE_ED25519_PUBLIC_KEY_BASE64:?Consumer Edge public key required}
      HEPTA_CONSUMER_EDGE_ED25519_PUBLIC_KEYS_JSON: ${HEPTA_CONSUMER_EDGE_ED25519_PUBLIC_KEYS_JSON:-}
      TRNM_NAKAMA_AUTHORITY_KEY_ID: ${TRNM_NAKAMA_AUTHORITY_KEY_ID:?Nakama completion authority key id required}
      TRNM_NAKAMA_AUTHORITY_PUBLIC_KEY_BASE64: ${TRNM_NAKAMA_AUTHORITY_PUBLIC_KEY_BASE64:?Nakama completion authority public key required}
      TRNM_NAKAMA_AUTHORITY_PUBLIC_KEYS_JSON: ${TRNM_NAKAMA_AUTHORITY_PUBLIC_KEYS_JSON:-}
      HEPTA_TRNM_TOKEN: ${HEPTA_TRNM_TOKEN:?required}
      HEPTA_FINALITY_MODE: ${HEPTA_FINALITY_MODE:-pending_only}
      HEPTA_TRNM_VALIDATOR_SETS_JSON: ${HEPTA_TRNM_VALIDATOR_SETS_JSON:?legacy validator-set JSON required; use [] when disabled}
      HEPTA_TRNM_COMETBFT_TRUST_ANCHOR_HASHES_JSON: ${HEPTA_TRNM_COMETBFT_TRUST_ANCHOR_HASHES_JSON:?Receipt V2 pinned trust-anchor hashes required}
      HEPTA_TRNM_RECEIPT_V2_MAX_BODY_BYTES: ${HEPTA_TRNM_RECEIPT_V2_MAX_BODY_BYTES:-32768}
      HEPTA_TRNM_RECEIPT_V2_MAX_IN_FLIGHT: ${HEPTA_TRNM_RECEIPT_V2_MAX_IN_FLIGHT:-1}
      RUST_LOG: hepta_research_league=info
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "/usr/local/bin/hepta-research-league", "--probe-ready"]
      interval: 10s
      timeout: 3s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
