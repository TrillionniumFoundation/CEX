          properties:
            object_type: { type: string, minLength: 1 }
            object_id: { type: string, minLength: 1 }
            external_key: { $ref: "#/components/schemas/Sha256Commitment" }
            version: { type: integer, minimum: 1 }
        inclusion_proof:
