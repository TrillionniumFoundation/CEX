openapi: 3.1.0
info:
  title: Hepta Paper Raid API
  version: 4.4.0-alpha.2
  description: >-
    Versioned Team + Paper collaboration control-plane API for 3-5 human players using
    independently operated external Agents to create one signed, reproducible
    PaperBundle. This API does not widen the legacy /v1/hepta contracts.
servers:
  - url: http://127.0.0.1:7011
security:
  - consumerUserAssertion: []
paths:
  /ready:
    get:
      security: []
      operationId: getHeptaReadiness
      description: >-
        Returns 200 only when PostgreSQL answers SELECT 1 and all Consumer
        Edge, distinct authorization/control/completion keys, the signed
        Nakama control origin/runtime key, and configured finality trust
        anchors are internally valid. It also reports the frozen 24-hour
        scientific-finality policy and exposes the Paper-V2 command lane as
        awaiting_chain_verifier_upgrade until the reviewed Chain verifier is
        vendored; that capability disclosure does not make otherwise healthy
        legacy/Receipt-V2 service dependencies unready. Returns 503 with
        ready=false otherwise.
      responses:
        "200": {description: Durable dependencies and trust configuration ready}
        "503": {description: Database unavailable or trust configuration invalid}
  /v2/hepta/manifest:
    get:
      security: []
      operationId: getPaperRaidManifest
      responses:
        "200": {description: Paper Raid capability and finality mode}
  /v2/hepta/openapi.yaml:
    get:
      security: []
      operationId: getPaperRaidOpenApi
      responses:
        "200": {description: This OpenAPI document}
  /v2/hepta/challenges:
    get:
      operationId: listPublicPaperRaidChallenges
      description: Lists non-draft research challenges for an asserted player.
      responses:
        "200":
          description: Public challenge cards with explicit authoritative or legacy-unranked rules
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PublicChallenge"}
  /v2/hepta/challenges/{challenge_id}:
    parameters:
      - {$ref: "#/components/parameters/ChallengeId"}
    get:
      operationId: getPublicPaperRaidChallenge
      responses:
        "200":
          description: Public challenge detail
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicChallenge"}
        "404": {description: Challenge is absent or still draft}
  /v2/hepta/matchmaking/tickets:
    get:
      operationId: listMatchmakingTickets
      description: >-
        Lists only the asserted player's tickets. Queued tickets have a
        server-derived 30-minute deadline and an honest queue hint: ETA is
        zero only when the ticket belongs to the globally selected next team
        and null otherwise. The read holds each challenge matcher lock and
        drains all currently matchable queued triplets, including tickets
        released from a legacy proposal by migration 0046.
      responses:
        "200":
          description: Player-scoped matchmaking tickets
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/MatchmakingTicket"}
    post:
      operationId: createMatchmakingTicket
      description: >-
        Enqueues the asserted player. The alpha matcher requires exactly three
        players while Team and protocol aggregates remain 3-5 capable. Queue
        admission, matching, rematching, and queue hints include only active
        humans who currently own exactly one active external Agent binding;
        queued tickets and proposals stop occupying party capacity immediately
        when that eligibility is lost.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMatchmakingTicketRequest"}
      responses:
        "201":
          description: Ticket created and optional deterministic team proposal returned
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MatchmakingTicketResponse"}
        "409":
          description: >-
            Player already has one live ticket, is not active with exactly one
            active Agent binding, the private party already has three live
            tickets, or the joining member would make its exact availability
            partition or distinct Captain/Evidence/Experiment roles infeasible.
  /v2/hepta/matchmaking/tickets/{ticket_id}:
    parameters:
      - {$ref: "#/components/parameters/TicketId"}
    get:
      operationId: getMatchmakingTicket
      description: >-
        Returns a ticket only to its asserted player and drains all currently
        matchable queued triplets in that challenge under the matcher lock.
      responses:
        "200":
          description: Matchmaking ticket
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MatchmakingTicket"}
        "404": {description: Ticket not found in player scope}
  /v2/hepta/matchmaking/tickets/{ticket_id}/cancel:
    parameters:
      - {$ref: "#/components/parameters/TicketId"}
    post:
      operationId: cancelMatchmakingTicket
      description: >-
        Cancels the asserted player's queued ticket, or atomically withdraws
        that player from an unmaterialized proposed/accepted team and rematches
        eligible peers inside their unchanged public/private partition, using
        optimistic versioning. A private-party member can use this path before
        rejoining with a shared availability window or compatible role set.
        Consumed, cancelled, and expired tickets are immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CancelMatchmakingTicketRequest"}
      responses:
        "200":
          description: Ticket cancelled; an unmaterialized proposal is atomically withdrawn when applicable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MatchmakingTicket"}
        "403": {description: Ticket belongs to another player}
        "404": {description: Ticket does not exist}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /v2/hepta/team-proposals:
    get:
      operationId: listTeamProposals
      description: Lists proposed/accepted teams containing the asserted player.
      responses:
        "200": {description: Player-scoped team proposals}
  /v2/hepta/team-proposals/{proposal_id}:
    parameters:
      - {$ref: "#/components/parameters/ProposalId"}
    get:
      operationId: getTeamProposal
      responses:
        "200": {description: Team proposal and immutable decisions}
  /v2/hepta/team-proposals/{proposal_id}/decisions:
    parameters:
      - {$ref: "#/components/parameters/ProposalId"}
    post:
      operationId: createTeamProposalDecision
      description: >-
        Records one accept/decline for the asserted member. Unanimous acceptance
        is required; decline requeues all eligible tickets deterministically.
        The deciding human must remain active with exactly one active Agent binding.
        Before writing any decision, Hepta revalidates the exact V2 solver,
        ordered source preferences, role assignments and source epochs; an
        invalid active proposal is atomically expired and its eligible tickets
        are requeued/rematched instead of accepting the decision.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateTeamProposalDecisionRequest"}
      responses:
        "201": {description: Decision recorded with updated/replacement proposal}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /v2/hepta/team-proposals/{proposal_id}/materialize:
    parameters:
      - {$ref: "#/components/parameters/ProposalId"}
    post:
      operationId: materializeTeamProposal
      description: >-
        Idempotently derives the authoritative three-person Research Team from
        a unanimously accepted proposal, its exact matched tickets, and each
        active member's single active Agent binding. The browser cannot supply
        roster, role, Compact, or Agent authority fields.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MaterializeTeamProposalRequest"}
      responses:
        "201": {description: Research Team materialized}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /v2/hepta/raid-state:
    get:
      operationId: getPlayerRaidState
      description: >-
        Returns only the asserted player's authoritative Team/Paper progress,
        including the current active Raid used by browser Continue navigation.
        An authorized read lazily materializes any elapsed immutable grace
        deadline before projection. Failed, expired, and abandoned Papers remain
        in raids history but can never be selected as current_raid.
      responses:
        "200":
          description: Player-scoped active and historical Raid summaries
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlayerRaidState"}
  /v2/hepta/players:
    post:
      operationId: createHumanPlayer
      description: >-
        Registers a human player. subject_id and nakama_user_id come only from
        the signed Consumer Edge assertion, never from the JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateHumanPlayerRequest"}
      responses:
        "201":
          description: Human player created, or the original response for an exact applied replay
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HumanPlayer"}
  /v2/hepta/players/me:
    get:
      operationId: getSelfHumanPlayer
      description: Returns only the player bound to the signed Consumer assertion.
      responses:
        "200":
          description: Assertion-scoped human player
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HumanPlayer"}
  /v2/hepta/players/{player_id}/signing-key/rotate:
    parameters:
      - {$ref: "#/components/parameters/PlayerId"}
    post:
      operationId: rotateHumanSigningKey
      description: >-
        Dual-signed old-to-new key rotation. Current forming-team acceptances
        are superseded and must be signed again using the new key.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RotateHumanSigningKeyRequest"}
      responses:
        "200": {description: Key rotated and stale acceptances superseded}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /v2/hepta/players/{player_id}/signing-key/revoke:
    parameters:
      - {$ref: "#/components/parameters/PlayerId"}
    post:
      operationId: revokeHumanSigningKey
      description: >-
        Signed compromise revocation. Forming-team acceptances are superseded;
        already signed authorship evidence is retained and later finalization
        enters integrity_hold.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RevokeHumanSigningKeyRequest"}
      responses:
        "200": {description: Key revoked and immutable history retained}
  /v2/hepta/agent-bindings:
    get:
      operationId: listSelfAgentBindings
      description: Returns only Agent bindings owned by the asserted player.
      responses:
        "200":
          description: Assertion-scoped Agent bindings ordered by created_at then binding_id
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AgentBinding"}
    post:
      operationId: createAgentBinding
      description: >-
        V2 binds an external Agent only after its Ed25519 key signs the exact
        agent_id, key, asserted subject, player, nonce and validity interval.
        V3 additionally signs the canonical hash of a bounded capability and
        resource disclosure. That disclosure is explicitly
        self_declared_unverified and grants no authority, matching priority,
        score, ranking, reward, economic eligibility, or scientific weight.
        Legacy v1 self-claimed owner_id is never trusted by Paper Raid. The
        Consumer assertion operation is create_agent_binding_v2 or
        create_agent_binding_v3, matching the submitted proof version.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateAgentBindingRequest"}
      responses:
        "201":
          description: Agent binding created, or the original response for an exact applied replay
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentBinding"}
  /v2/hepta/agent-bindings/{binding_id}/rotate-key:
    parameters:
      - name: binding_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: rotateAgentBindingKey
      description: >-
        Atomically rotates the authoritative v2 Agent key after the old and new
        keys sign the same binding/player/subject/version-scoped frame.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RotateAgentBindingKeyRequest"}
      responses:
        "200":
          description: Agent binding key rotated, or original exact-replay response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentBinding"}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /v2/hepta/teams:
    post:
      operationId: createResearchTeam
      description: >-
        Atomically creates an ordered 3-5 member Paper Raid roster. Every new
        roster must contain exactly one captain, evidence, and experiment seat;
        fourth and fifth seats, if present, are support. Noncanonical legacy
        rosters remain readable but cannot use the author mutation path.
        Direct creation requires a caller-generated UUIDv4 team_id;
        deterministic UUIDv5 and existing proposal IDs are reserved for
        matchmaking materialization.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateResearchTeamRequest"}
      responses:
        "201": {description: Forming team created}
        "400": {description: Invalid size, slots, identities, bindings, or canonical role contract}
  /v2/hepta/teams/{team_id}:
    parameters:
      - {$ref: "#/components/parameters/TeamId"}
    get:
      operationId: getResearchTeam
      description: Requires a signed assertion from a current team member.
      responses:
        "200": {description: Research team}
  /v2/hepta/teams/{team_id}/member-acceptances:
    parameters:
      - {$ref: "#/components/parameters/TeamId"}
    get:
      operationId: listResearchTeamMemberAcceptances
      description: Requires a signed assertion for a current proposed team member.
      responses:
        "200": {description: Immutable signed member acceptance records}
    post:
      operationId: acceptResearchTeamMembership
      description: >-
        A proposed human member signs the exact challenge, roster version,
        participant slot, Agent binding, role and collaboration compact hash.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AcceptResearchTeamMembershipRequest"}
      responses:
        "201": {description: Signed team membership acceptance recorded}
        "409": {description: Stale roster, duplicate acceptance, or changed compact}
  /v2/hepta/teams/{team_id}/lock:
    parameters:
      - {$ref: "#/components/parameters/TeamId"}
    post:
      operationId: lockResearchTeam
      description: Requires one valid signed acceptance from every 3-5 member.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExpectedVersionCommand"}
      responses:
        "200": {description: Team roster locked}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /v2/hepta/papers:
    post:
      operationId: createPaperProject
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreatePaperProjectRequest"}
      responses:
        "201":
          description: Paper project created with an immutable exact ruleset/deadline snapshot
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperProject"}
  /v2/hepta/papers/{paper_id}:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    get:
      operationId: getPaperProject
      description: >-
        Requires a signed assertion from a current team member. At or after an
        authoritative grace boundary, this read lazily persists canonical
        automatic expiry before returning the Paper. Zero-request periods do
        not run a background timer.
      responses:
        "200":
          description: Paper project
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperProject"}
  /v2/hepta/papers/{paper_id}/outcome:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: transitionPaperChallengeOutcome
      description: >-
        Captain may record failed or abandoned before the grace boundary. At
        or after a snapshotted grace deadline, Hepta first persists canonical
        automatic expiry; a manual expired reason cannot win the race.
        terminal_at is the immutable grace boundary, while updated_at and the
        terminal event timestamp record later lazy materialization. Terminal
        outcomes are immutable and block further gameplay mutation without
        changing scientific-finality facts.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TransitionPaperOutcomeRequestV1"}
      responses:
        "200":
          description: Terminal challenge outcome recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperProject"}
        "409": {description: Version, terminality, or expiry precondition failed}
  /v2/hepta/papers/{paper_id}/transition:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: transitionPaperProject
      description: >-
        With a canonical Captain/Evidence/Experiment roster, only the Captain
        may advance phase gates. Pre-canonical rosters retain legacy behavior.
      responses:
        "200": {description: Paper phase advanced or returned to drafting}
  /v2/hepta/papers/{paper_id}/work-items:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createPaperWorkItem
      description: >-
        Captain may assign any teammate. Every member may explicitly create a
        self-assigned item as the bounded collaboration override.
      responses:
        "201": {description: Work item created}
  /v2/hepta/work-items/{work_item_id}/transition:
    parameters:
      - name: work_item_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: transitionPaperWorkItem
      description: Captain may transition any item; its assignee may transition their own.
      responses:
        "200": {description: Work item transitioned}
  /v2/hepta/papers/{paper_id}/revisions:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createPaperRevision
      description: >-
        Creates a revision only from the current parent. All four submitted
        hashes must resolve to one verified same-paper artifact root and the
        unique paper_source, bibliography and claim_evidence_graph objects.
        The same transaction rejects in-flight section work, captures and
        roots the canonical section materialization descriptor, and rebases
        every section head to the new whole-Paper revision.
      responses:
        "201": {description: Paper revision created}
  /v2/hepta/papers/{paper_id}/artifact-manifests:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createArtifactManifest
      description: >-
        Adapts an exact paper-raid.artifact-bundle.v1 object from the pinned
        Integration revision, independently recomputes its canonical JSON plus
        newline root, and binds every object to an immutable CAS or Git URI.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateArtifactManifestRequest"}
      responses:
        "201": {description: Verified same-paper artifact manifest}
        "400": {description: Non-canonical bundle, path, digest, role, or URI}
        "409": {description: Source/root/paper binding conflict}
  /v2/hepta/papers/{paper_id}/evidence-cards:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createEvidenceCard
      description: >-
        Stores human-signed source URI/hash/locator/license evidence. The
        Evidence role owns this duty on canonical rosters.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateEvidenceCardRequest"}
      responses:
        "201": {description: Verified evidence card}
        "403": {description: Identity, current-key, or signature verification failed}
  /v2/hepta/papers/{paper_id}/citations:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createCitationRecord
      description: >-
        Stores a human-signed DOI/URL citation bound to an evidence card. The
        Evidence role owns this duty on canonical rosters.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateCitationRecordRequest"}
      responses:
        "201": {description: Verified citation record}
  /v2/hepta/papers/{paper_id}/experiment-plans:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createExperimentPlan
      description: The Experiment role owns preregistration on canonical rosters.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateExperimentPlanRequest"}
      responses:
        "201": {description: Experiment plan bound to verified artifact manifests}
  /v2/hepta/papers/{paper_id}/run-records:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createRunRecord
      description: >-
        Persists successful, failed, and cancelled runs; failed runs cannot be
        hidden. The Experiment role owns run recording on canonical rosters.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateRunRecordRequest"}
      responses:
        "201": {description: Immutable run record}
  /v2/hepta/papers/{paper_id}/role-resources/actions:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createRoleResourceAction
      description: >-
        Applies an idempotent, replayable, non-economic Evidence assessment or
        Captain checkpoint. Checkpoints never gate scientific state and add no
        new Captain liveness dependency. Experiment run spend and
        retained-failure focus refund occur atomically with RunRecord creation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateRoleResourceActionRequestV1"}
      responses:
        "201":
          description: Role resource action and updated deterministic ledger
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RoleResourceActionResponseV1"}
  /v2/hepta/papers/{paper_id}/figure-lineage:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createFigureLineage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateFigureLineageRequest"}
      responses:
        "201": {description: Figure-to-run lineage recorded}
  /v2/hepta/papers/{paper_id}/claims:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createClaimRecord
      description: >-
        Main/numeric/figure claims require evidence, run, or figure lineage.
        The Evidence role owns claim-to-evidence binding on canonical rosters.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateClaimRecordRequest"}
      responses:
        "201": {description: Claim-evidence edge recorded}
  /v2/hepta/papers/{paper_id}/section-leases:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: acquireSectionLease
      description: Acquires one bounded lease with a monotonically increasing fencing token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AcquireSectionLeaseRequest"}
      responses:
        "201": {description: Section lease acquired}
        "409": {description: Live lease or stale fencing token}
  /v2/hepta/papers/{paper_id}/agent-proposals:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      security: []
      operationId: createAgentProposal
      description: >-
        Accepts only an external Agent's V2 Ed25519-signed proposal. The V2
        frame binds the exact section lease UUID, fencing token, expected work
        version, artifact-manifest UUID and authoritative manifest hash.
        Hepta revalidates the current work, roster, section head and sole live
        lease under one authority lock/transaction before persisting. Authority
        comes exclusively from the active Paper Raid AgentBinding and signed
        body, not a Consumer assertion or legacy v1 Agent registry. Agent ID,
        key ID, canonical public key, and public-key hash must all match. The
        normalized row stores the authoritative manifest hash separately and a
        validated null-safe constraint keeps the complete signed identity equal
        to record_json. Service startup fails closed if migration 0044 column,
        constraint, foreign-key, or ordered-index catalog readiness drifts.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateAgentProposalRequest"}
      responses:
        "201": {description: Signed Agent proposal recorded}
        "403": {description: Agent identity, scope, key, or signature failed}
        "409": {description: Lease epoch, work version, section head, or active-work state is stale}
  /v2/hepta/papers/{paper_id}/human-decisions:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createHumanDecision
      description: Records a current-key human accept/rework/reject decision over an Agent proposal.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateHumanDecisionRequest"}
      responses:
        "201": {description: Human decision recorded}
  /v2/hepta/papers/{paper_id}/section-revisions:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createSectionRevision
      description: Materializes an accepted Agent patch under the exact live lease fence.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSectionRevisionRequest"}
      responses:
        "201": {description: Section revision created}
        "409": {description: Stale/cross-paper/cross-section parent or lease fence}
  /v2/hepta/papers/{paper_id}/section-revisions/{section_revision_id}/reviews:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
      - {$ref: "#/components/parameters/SectionRevisionId"}
    post:
      operationId: createSectionReview
      description: Requires a current-key signature from a human other than the patch owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSectionReviewRequest"}
      responses:
        "201": {description: Independent section review recorded}
  /v2/hepta/papers/{paper_id}/section-merges:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createSectionMerge
      description: Signed merge that atomically advances one section head and consumes its lease.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSectionMergeRequest"}
      responses:
        "201": {description: Section merged}
        "409": {description: Review, parent, revision, or fencing precondition failed}
  /v2/hepta/papers/{paper_id}/room:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    get:
      operationId: getPaperRoom
      description: >-
        Returns a player-scoped repeatable-read projection of Team, Paper,
        artifacts, claims, runs, revisions, leases, proposals, reviews and merges.
        This authorized read lazily persists elapsed challenge expiry first;
        zero-request periods do not run a background timer.
      responses:
        "200":
          description: Consistent Paper Room read model
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperRoomReadModelV1"}
  /v2/hepta/papers/{paper_id}/events:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
      - name: after_cursor
        in: query
        required: false
        schema: {type: integer, minimum: 0, default: 0}
    get:
      operationId: listPaperRoomEvents
      description: >-
        Cursor-based catch-up over persisted typed Paper Room events. This
        authorized read lazily persists elapsed challenge expiry before listing
        events; concurrent reads produce one aggregate transition and event.
      responses:
        "200":
          description: Ordered events strictly after after_cursor
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PaperRoomEventV1"}
  /v2/hepta/papers/{paper_id}/revisions/{revision_id}/promote:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
      - name: revision_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: promotePaperReleaseCandidate
      description: >-
        Freezes author_order separately from participant_slot and binds the
        Compact, protocol/amendments, ethics, COI, AI, artifact manifests and
        the revision's server-derived section-materialization root. Hepta locks
        the same-Paper contribution facts, derives the complete accepted-artifact
        and approving-review sets for every frozen author, and rejects a
        contribution_ledger_hash that is not the exact canonical hash for the
        supplied non-nil contribution_ledger_id and authoritative entries. The
        ID is globally and atomically reserved for this Paper in the same
        promotion mutation, so another Paper cannot preempt later ledger creation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PromoteReleaseCandidateRequest"}
      responses:
        "200": {description: Canonical release candidate promoted}
        "409": {description: Revision, roster, or authoritative contribution ledger binding is stale or mismatched}
  /v2/hepta/papers/{paper_id}/author-consents:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createAuthorshipConsent
      description: >-
        Accepts only the asserted player's Ed25519 signature over the common
        release-candidate hash and an immutable human signing-key snapshot.
      responses:
        "201": {description: Authorship consent accepted}
  /v2/hepta/papers/{paper_id}/finalize:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: finalizeJointPaperSubmission
      description: Requires exactly one valid consent from every locked roster member.
      responses:
        "201": {description: Canonical PaperBundle is submission_ready and pending_finality}
        "202": {description: PaperBundle retained in integrity_hold because an authorship key was compromise-revoked}
  /v2/hepta/papers/{paper_id}/submission:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    get:
      operationId: getJointPaperSubmission
      description: Requires a signed assertion from a current team member.
      responses:
        "200": {description: Signed PaperBundle and joint submission}
  /v2/hepta/review-queue:
    get:
      operationId: getPaperReviewQueue
      description: >-
        Lists only submission_ready frozen summaries for an active registered
        non-author. The queue exposes vacant evaluator, reviewer_1, reviewer_2,
        and reproducer round/slot pairs plus the caller's own unexpired leases
        for resume; it never grants Research Team or Paper Room access.
      responses:
        "200":
          description: Eligible frozen review summaries with currently open slots
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ReviewQueueItem"}
        "403": {description: Assertion does not identify an active registered player}
  /v2/hepta/papers/{paper_id}/review-assignments:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: claimPaperReviewAssignment
      description: >-
        Atomically claims one 24-hour independent Review Raid lease. Authors
        are forbidden; one player may hold only one active slot per Paper round
        and every round/slot has one winner under concurrent claims. Creating a
        draft pins its evaluator lease; accepting a reviewer attestation pins
        that reviewer lease. Pinned seats remain authoritative past the original
        assignment deadline only until the immutable 24-hour draft deadline.
        A later claim atomically marks a stale open draft expired, releases only
        its exact pinned panel, and audits the transition before the slot can be
        reclaimed. Finalized drafts and consumed seats never reopen. Other
        expired claims remain audited and their slot can be reclaimed. Open
        Appeals expose a fresh disjoint panel round for a superseding evaluation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClaimReviewAssignmentRequest"}
      responses:
        "201":
          description: Review assignment claimed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReviewAssignment"}
        "403": {description: Player is unregistered, suspended, an author, or assertion mismatched}
        "409": {description: Paper is not submission_ready or actor/slot was already claimed}
  /v2/hepta/papers/{paper_id}/review-bundle:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    get:
      operationId: getPaperReviewBundle
      description: >-
        Returns the exact frozen submission-ready PaperBundle only to a currently
        assigned Review Raid actor without adding that actor to the Research Team.
        Authors of the target Paper are explicitly forbidden even if their account
        has review-capable scopes for other Papers.
        Existing JointPaperSubmission fields remain unchanged at the top level.
        Additive assignment-scoped fields expose the caller's active assignments,
        current draft quorum and finalized evaluation. Thus reviewer_1/reviewer_2
        can discover the draft hashes and a reproducer can discover the frozen
        tolerance/metric facts without an author-room read or out-of-band UUID.
      responses:
        "200":
          description: Frozen joint submission plus assignment-scoped Review Raid projection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperReviewBundleV1"}
        "403": {description: Asserted player is an Author of the target Paper or lacks a current review assignment}
        "404": {description: Submission-ready review bundle does not exist}
  /v2/hepta/papers/{paper_id}/contribution-ledgers:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createContributionLedger
      description: >-
        During author_approval, freezes one canonical CRediT ledger whose
        author roles exactly equal the release candidate. Artifact and review
        references are the complete untruncated authoritative sets, including
        sets larger than 256. One artifact manifest has at most one accepted
        proposal and credited author globally. Points are milestone-capped at
        0/100/150/250 regardless of record count, never enter PaperScore, and
        never determine author order. The ID must be the Paper-owned reservation
        created atomically by release-candidate promotion.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateContributionLedgerRequest"}
      responses:
        "201": {description: Immutable contribution ledger frozen}
        "409": {description: Roster, release hash, phase, or contribution evidence mismatch}
  /v2/hepta/papers/{paper_id}/evaluations:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createPaperEvaluation
      description: >-
        Records an immutable evaluation of one submission-ready PaperBundle.
        The asserted evaluator and exactly two signed reviewers must be
        distinct non-authors with independent COI attestations. Supersession is
        append-only, restricted to an open Appeal, and requires a disjoint panel.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreatePaperEvaluationRequest"}
      responses:
        "201": {description: Signed evaluation, separate PaperScore and RaidScore recorded in pending_finality}
        "403": {description: Panel, identity, key, signature, or COI independence failed}
        "409": {description: Release, ledger, initial evaluation, or supersession precondition failed}
  /v2/hepta/papers/{paper_id}/evaluation-drafts:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createPaperEvaluationDraft
      description: >-
        The actively assigned evaluator freezes the complete evaluation fields,
        evaluator signature, PaperScore inputs and derived evaluation_signing_hash
        for one review round. The immutable draft occupies that round before any
        reviewer signature is accepted and atomically pins the evaluator's
        assignment until finalization or the server-owned 24-hour draft deadline.
        An expired draft remains immutable but no longer reserves the round, so a
        newly claimed evaluator can create a fresh evaluation identity. An open
        Appeal produces the next disjoint replacement round under the same endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreatePaperEvaluationDraftRequest"}
      responses:
        "201":
          description: Immutable evaluator draft created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperEvaluationDraft"}
        "403": {description: Caller lacks the exact active evaluator assignment or signature/key failed}
        "409": {description: Round, Appeal lineage, release, ledger, or draft slot changed}
  /v2/hepta/papers/{paper_id}/evaluation-drafts/{evaluation_id}:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
      - name: evaluation_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getPaperEvaluationDraft
      description: >-
        Returns the immutable draft and current reviewer_1/reviewer_2 quorum only
        to an actively assigned actor in that exact review round.
      responses:
        "200":
          description: Draft, attestations, missing slots and finalize readiness
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EvaluationDraftQuorum"}
        "403": {description: Caller has no active assignment in the draft round}
        "404": {description: Evaluation draft does not exist}
  /v2/hepta/papers/{paper_id}/evaluation-drafts/{evaluation_id}/attestations:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
      - name: evaluation_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: submitPaperEvaluationDraftAttestation
      description: >-
        The assigned reviewer_1 or reviewer_2 submits exactly one immutable
        PAPER_REVIEW_ATTESTATION_V1 signature over the draft's
        evaluation_signing_hash and supplies the exact draft_hash. Concurrent
        duplicates lose by slot and reviewer uniqueness. The accepted write
        atomically pins that reviewer assignment until finalization or the
        immutable draft deadline. Expired drafts reject old attestations.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubmitEvaluationDraftAttestationRequest"}
      responses:
        "201":
          description: Immutable assigned reviewer attestation recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EvaluationDraftAttestation"}
        "403": {description: Assertion, active assignment, key, or signature failed}
        "409": {description: Draft hash, status, slot, reviewer, or attestation identity conflicted}
  /v2/hepta/papers/{paper_id}/evaluation-drafts/{evaluation_id}/finalize:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
      - name: evaluation_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: finalizePaperEvaluationDraft
      description: >-
        Only the evaluator whose assignment was pinned by draft creation may
        atomically finalize. Both pinned reviewer slots, signatures, keys,
        assignments, frozen hashes and Appeal lineage are revalidated before the
        existing immutable PaperEvaluation, PaperScore and fail-closed RaidScore
        are materialized and all three panel assignments are consumed. The
        server rejects finalization at or after the immutable draft deadline.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FinalizePaperEvaluationDraftRequest"}
      responses:
        "201": {description: Existing PaperEvaluation contract finalized and draft marked finalized}
        "403": {description: Caller or any panel assignment/key/signature is no longer valid}
        "409": {description: Quorum incomplete, draft stale/finalized, or Appeal lineage changed}
  /v2/hepta/papers/{paper_id}/evaluations/{evaluation_id}/reproductions:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
      - name: evaluation_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: createPaperReproduction
      description: >-
        Applies the evaluation's frozen versioned absolute, relative,
        statistical and seed tolerances. Reports and corrections are immutable;
        a correction explicitly supersedes only the same reproducer's latest report.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreatePaperReproductionRequest"}
      responses:
        "201": {description: Signed reproduction report recorded}
        "403": {description: Reproducer is an author/panel member or signature failed}
  /v2/hepta/papers/{paper_id}/evaluations/{evaluation_id}/appeals:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
      - name: evaluation_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: createPaperAppeal
      description: Opens one signed immutable Appeal by an asserted human author.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreatePaperAppealRequest"}
      responses:
        "201": {description: Appeal opened; settlement projection becomes challenged/held}
        "403": {description: Appellant assertion, authorship, key, or signature failed}
  /v2/hepta/papers/{paper_id}/appeals/{appeal_id}/resolve:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
      - name: appeal_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: resolvePaperAppeal
      description: >-
        Records a signed immutable resolution by a resolver distinct from the
        authors, appellant and both original/replacement panels. Upheld outcomes
        require the exact same-release superseding evaluation; denied outcomes cannot reference one.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResolvePaperAppealRequest"}
      responses:
        "201": {description: Appeal resolution recorded; prior evaluation remains immutable}
        "403": {description: Resolver independence, assertion, key, or signature failed}
  /v2/hepta/papers/{paper_id}/review-state:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    get:
      operationId: getPaperReviewState
      description: >-
        Consistent review projection for authors, assigned Review Raid actors,
        and signed review participants. A legal team member may read pending
        finality plus empty review collections before a release candidate exists.
        Evaluation settlement is derived as pending_finality, challenged, or resolved;
        signed immutable records are never rewritten. Canonically ordered open
        and expired evaluation-draft records are included so consumers can bind
        pinned/released assignment lineage. Finalized drafts are omitted because
        consumed assignments bind the immutable evaluation; detailed quorum
        controls remain available through assignment-scoped review-bundle and
        evaluation-draft reads.
      responses:
        "200":
          description: Assignment, unresolved draft, contribution, evaluation, reproduction, Appeal, resolution, RaidScore, and exact Consumer-finality bindings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperReviewReadModelV2"}
        "403": {description: Asserted player is not a signed participant}
  /v2/hepta/research-session-authorizations:
    post:
      operationId: issueResearchSessionAuthorizationSet
      description: >-
        Issues one atomic ordered set of 3-5 signed Nakama research-session
        authorizations. subject_user_id is the bound Nakama UUID; the Consumer
        subject remains private to Hepta identity records.
      responses:
        "201": {description: Complete signed roster epoch issued}
  /v2/hepta/research-session-authorizations/{session_id}/replace:
    parameters:
      - {$ref: "#/components/parameters/SessionId"}
    post:
      operationId: replaceResearchSessionAuthorizationSet
      description: >-
        Supersedes the latest complete session epoch. Exactly one declared
        disconnected slot may change Agent key; the human, binding, Agent ID,
        role, team roster, paper, challenge, ruleset and challenge snapshot
        remain fixed. Every authorization ID is fresh.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReplaceResearchSessionAuthorizationSetRequest"}
      responses:
        "201": {description: Fresh complete roster epoch issued}
        "409": {description: Stale epoch or replacement changed a frozen field}
  /v2/hepta/nakama/research-session-controls/create:
    post:
      operationId: createNakamaResearchSessionControl
      description: >-
        Freezes one globally unique, short-lived Ed25519 control command for
        the latest initial authorization epoch, persists its exact canonical
        request bytes transactionally, then calls Nakama only after commit.
        Timeout/5xx retries reuse the original command ID, signature and bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateNakamaResearchSessionControlRequestV2"}
      responses:
        "200": {$ref: "#/components/responses/NakamaControlCommand"}
        "409": {description: Idempotency conflict, stale epoch, or invalid authorization state}
        "502": {description: Command remains durable and pending after strict Nakama transport/response failure}
  /v2/hepta/nakama/research-session-controls/resume:
    post:
      operationId: resumeNakamaResearchSessionControl
      description: >-
        Signs a current-epoch resume that may recreate only Nakama's ephemeral
        runtime. It never mutates the durable research snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResumeNakamaResearchSessionControlRequestV2"}
      responses:
        "200": {$ref: "#/components/responses/NakamaControlCommand"}
        "409": {description: Idempotency conflict or non-current epoch}
        "502": {description: Durable pending command; exact retry is safe}
  /v2/hepta/nakama/research-session-controls/replace-roster:
    post:
      operationId: replaceNakamaResearchSessionRosterControl
      description: >-
        Controls only a previously issued full replacement epoch. The signed
        payload includes all 3-5 new authorizations in participant-slot order.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReplaceNakamaResearchSessionRosterControlRequestV2"}
      responses:
        "200": {$ref: "#/components/responses/NakamaControlCommand"}
        "409": {description: Idempotency conflict, stale epoch, or invalid replacement chain}
        "502": {description: Durable pending command; resume runtime then retry exact bytes}
  /v2/hepta/nakama/research-session-controls/complete:
    post:
      operationId: completeNakamaResearchSessionControl
      description: >-
        Derives terminal facts exclusively from the finalized canonical
        PaperBundle. A response is applied only after local authority
        verification and the synchronous archive callback has been independently
        verified and persisted by Hepta.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompleteNakamaResearchSessionControlRequestV2"}
      responses:
        "200": {$ref: "#/components/responses/NakamaControlCommand"}
        "409": {description: Bundle is not finalized or epoch is not fully consumed}
        "502": {description: Durable pending command; resume/reconnect then retry exact bytes}
  /v2/hepta/nakama/research-session-authorizations/consumed:
    post:
      security:
        - nakamaServiceToken: []
      operationId: consumeResearchSessionAuthorizationSet
      description: >-
        Atomically consumes the complete ordered authorization set. Partial,
        mixed-version, mixed-root and repeated epochs are rejected. The
        response is a Hepta-signed immutable acknowledgement, not the mutable
        authorization set.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConsumeResearchSessionAuthorizationSetRequest"}
      responses:
        "200":
          description: Complete authorization epoch consumed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignedAuthorizationSetConsumptionReceiptV1"}
  /v2/hepta/nakama/research-session-completions:
    post:
      security:
        - nakamaServiceToken: []
      operationId: ingestNakamaResearchSessionCompletion
      description: >-
        Verifies the signed completion with a locally pinned Nakama authority
        key, independently recomputes the complete event/archive/commitment
        roots, binds the terminal event to a consumed authorization epoch and
        finalized PaperBundle, then stores a normalized receipt and outbox event.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NakamaCompletionIngestRequest"}
      responses:
        "201":
          description: Verified immutable Hepta-signed Nakama completion receipt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignedNakamaCompletionReceiptV1"}
        "403": {description: Untrusted authority, signature, archive, or root}
        "409": {description: Unconsumed/wrong epoch, bundle mismatch, or second completion}
  /v2/hepta/operator/trnm/trust-anchors:
    post:
      security:
        - operatorServiceToken: []
      operationId: ingestCanonicalCometBftTrustAnchor
      description: >-
        Accepts only exact canonical CometBFTTrustAnchorV1 JSON bytes after
        operator authentication. Upload does not create trust: anchor_hash_hex
        must already exist in the immutable
        HEPTA_TRNM_COMETBFT_TRUST_ANCHOR_HASHES_JSON allowlist. The raw wire is
        retained byte-for-byte. The upstream 16 MiB wire limit is enforced
        before parsing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exact canonical trnm_cometbft_trust_anchor_v1 wire document.
              additionalProperties: true
      responses:
        "201": {description: Pinned canonical trust anchor admitted}
        "200": {description: Exact byte replay of the admitted anchor}
        "400": {description: Noncanonical or structurally invalid anchor bytes}
        "403": {description: Operator authentication failed or anchor hash is not pre-pinned}
        "409": {description: Anchor hash/content conflict}
        "413": {description: Body exceeds the upstream canonical wire limit}
  /v2/hepta/operator/trnm/time-checkpoints:
    post:
      security:
        - operatorServiceToken: []
      operationId: admitPaperTrnmChainTimeCheckpointV1
      description: >-
        Authenticates a canonical CometBFT light-finality proof against an
        already admitted and actively pinned trust anchor, then persists its
        consensus height, header hash and consensus timestamp as an immutable
        Chain-time checkpoint. The local verification clock is used only for
        light-client trust-period/future-header checks and a persisted rollback
        high-water; it never closes the Paper Appeal window. An exact proof
        replay is stable, while a different checkpoint at the same Chain height
        fails closed. The authenticated body is capped at 2 MiB before JSON
        parsing.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdmitPaperTrnmChainTimeCheckpointV1Request"}
      responses:
        "201":
          description: Authenticated immutable Chain-time checkpoint admitted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperTrnmChainTimeCheckpointV1"}
        "200":
          description: Exact content replay of an existing checkpoint
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperTrnmChainTimeCheckpointV1"}
        "400": {description: Malformed, noncanonical or structurally invalid proof}
        "403": {description: Operator authentication failed or trust anchor is not actively pinned}
        "404": {description: Pinned trust anchor has not been admitted locally}
        "409": {description: Untrusted/non-final proof, local-clock rollback, same-height conflict or replay drift}
        "413": {description: Body exceeds the 2 MiB authenticated checkpoint limit}
  /v2/hepta/papers/{paper_id}/chain-finality-v2/arm:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      security:
        - operatorServiceToken: []
      operationId: armPaperChainFinalityWindowV2
      description: >-
        Derives the exact latest Paper/submission, Research Session,
        MatchEvidence, evaluation, reproduction and Appeal lineage facts and
        binds their source fingerprint to the highest admitted, actively
        pinned Chain-time checkpoint. The start checkpoint must be no more than
        15 minutes behind the local light-client observation. For a no-Appeal
        source, the earliest final Chain time is the start consensus time plus
        that full 15-minute allowance plus 24 hours; a completely resolved
        denied/upheld Appeal uses the start time plus the allowance. The arm is
        immutable but does not seal source facts or claim scientific finality;
        any later source change invalidates preparation and requires a new arm.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ArmPaperTrnmFinalityWindowV2Request"}
      responses:
        "201":
          description: Immutable source fingerprint and Chain-time window arm created without sealing the Paper
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperTrnmFinalityWindowArmV2"}
        "200":
          description: Exact idempotent replay of the window arm
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperTrnmFinalityWindowArmV2"}
        "400": {description: Malformed selectors, checkpoint hash or idempotency token}
        "403": {description: Operator authentication failed or checkpoint anchor is no longer actively pinned}
        "404": {description: Paper source, Research Session evidence or start checkpoint missing}
        "409": {description: Stale/future/non-latest checkpoint, open or ambiguous Appeal lineage, source conflict, local-clock rollback or replay drift}
        "413": {description: Body exceeds the 16 KiB window-arm limit}
  /v2/hepta/papers/{paper_id}/chain-finality-v2/prepare:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      security:
        - operatorServiceToken: []
      operationId: preparePaperChainFinalityV2
      description: >-
        References an immutable window arm and a separately admitted final
        Chain-time checkpoint, re-derives the exact source fingerprint, and
        freezes the complete versioned scientific-finality tuple only when the
        source is unchanged. The final checkpoint must be on the same Chain,
        must have been admitted after the arm at a greater height, and must
        reach the arm's consensus-time deadline. A halted Chain therefore
        remains unsealed rather than falling back to an ambient server clock.
        This preparation is deliberately marked
        awaiting_chain_verifier_upgrade: it is not a signed or queued Chain
        command and cannot receive a Receipt until the canonical Chain
        Paper-V2 verifier is vendored. A successful preparation permanently
        seals the bound Paper/submission, Research Session authority/completion,
        evaluation, reproduction, and Appeal sources against later mutation.
        Exactly zero or one resolved Appeal is representable in the final
        evaluation lineage.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PreparePaperTrnmFinalityV2Request"}
      responses:
        "201":
          description: Immutable local Paper-V2 tuple prepared, without claiming Chain finality
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperTrnmFinalityPreparationV2"}
        "200":
          description: Exact idempotent replay of the preparation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperTrnmFinalityPreparationV2"}
        "400": {description: Malformed identifiers or idempotency token}
        "403": {description: Operator authentication failed}
        "404": {description: Paper source, immutable arm or final checkpoint missing}
        "409": {description: Window open, noncausal/cross-Chain checkpoint, changed or ambiguous source facts, sealed Paper, or replay conflict}
        "413": {description: Body exceeds the 16 KiB preparation limit}
  /v2/hepta/papers/{paper_id}/chain-finality:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    get:
      security:
        - trnmServiceToken: []
      operationId: getPaperChainFinalityProjection
      responses:
        "200":
          description: Orthogonal verified-finality projection; never an economic eligibility grant
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperChainFinalityProjectionV2"}
        "404": {description: No verified Paper finality projection is available; pending versus unavailable is not inferred}
    post:
      security:
        - trnmServiceToken: []
      operationId: ingestCanonicalPaperReceiptV2
      description: >-
        Authenticates and validates the trust-anchor selector before acquiring
        bounded verification capacity or reading any body bytes. It then
        applies HEPTA_TRNM_RECEIPT_V2_MAX_BODY_BYTES (32 KiB by default and
        never above Hepta's 1 MiB deployment ceiling; the upstream generic wire
        type remains 128 MiB) and the exact canonical
        Receipt V2 decoder. The selected stored trust anchor and server clock
        verify CometBFT finality. The verified domain command_id binds
        TrnmCommand.idempotency_key (never its local UUID), and the full signed
        EvaluationCommitmentV1 is rebound to immutable Paper/submission/
        evaluation/reproduction records. Integrity hold, open Appeal, or
        superseded evaluation/reproduction fails closed.
      parameters:
        - name: x-hepta-trnm-trust-anchor-hash
          in: header
          required: true
          schema: {type: string, pattern: "^[0-9a-f]{64}$"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exact canonical trnm_cometbft_apphash_finality_receipt_v2 wire document.
              additionalProperties: true
      responses:
        "201":
          description: pending_finality transitioned to verified_finality atomically
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperChainFinalityProjectionV2"}
        "200": {description: Exact applied receipt replay; no duplicate event/outbox}
        "400": {description: Noncanonical, malformed, or structurally invalid receipt}
        "403": {description: TRNM authentication or trust verification failed}
        "404": {description: Bound queued command or immutable Paper record missing}
        "409": {description: Binding, hold, Appeal, supersession, finality, or replay conflict}
        "413": {description: Body exceeds the configured deployment ingress cap}
        "503": {description: Authenticated Receipt V2 verification capacity is busy; body was not read}
components:
  securitySchemes:
    consumerUserAssertion:
      type: apiKey
      in: header
      name: x-hepta-user-assertion
      description: >-
        Canonical-base64 SignedConsumerUserAssertionV2 binding issuer,
        audience, subject, Nakama UUID, player, method, path, body hash,
        idempotency nonce, iat and exp.
    nakamaServiceToken:
      type: apiKey
      in: header
      name: x-hepta-nakama-token
    operatorServiceToken:
      type: apiKey
      in: header
      name: x-hepta-operator-token
    trnmServiceToken:
      type: apiKey
      in: header
      name: x-hepta-trnm-token
  parameters:
    ChallengeId:
      name: challenge_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    TicketId:
      name: ticket_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SectionRevisionId:
      name: section_revision_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlayerId:
      name: player_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    TeamId:
      name: team_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PaperId:
      name: paper_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
  responses:
    VersionConflict:
      description: expected_version did not match the aggregate version
    NakamaControlCommand:
      description: Durable signed control command and strictly validated Nakama result
      content:
        application/json:
          schema: {$ref: "#/components/schemas/NakamaResearchControlCommandV2"}
  schemas:
    ChallengeRequirementKindV1:
      type: string
      enum:
        - work_items
        - accepted_work_items
        - artifact_manifests
        - evidence_cards
        - citations
        - experiment_plans
        - retained_runs
        - successful_runs
        - retained_failed_runs
        - claims
        - section_revisions
        - approving_section_reviews
        - section_merges
        - paper_revisions
        - all_work_items_terminal
        - paper_revision_covers_section_merges
        - release_candidate
        - all_author_consents
    ChallengeMinimumV1:
      type: object
      additionalProperties: false
      required: [kind, minimum]
      properties:
        kind: {$ref: "#/components/schemas/ChallengeRequirementKindV1"}
        minimum: {type: integer, minimum: 1, maximum: 32}
    ChallengePhaseGateV1:
      type: object
      additionalProperties: false
      required: [transition, requirements]
      properties:
        transition:
          type: string
          enum:
            - preregistering_to_researching
            - researching_to_experimenting
            - experimenting_to_drafting
            - drafting_to_integrity_review
            - integrity_review_to_reproducing
            - reproducing_to_author_approval
        requirements:
          type: array
          maxItems: 18
          items: {$ref: "#/components/schemas/ChallengeMinimumV1"}
    ChallengeGameplayV1:
      type: object
      additionalProperties: false
      required: [difficulty, objective, risk, modifiers, victory_summary]
      properties:
        difficulty: {type: string, enum: [introductory, intermediate, advanced]}
        objective: {type: string, minLength: 1, maxLength: 512}
        risk: {type: string, minLength: 1, maxLength: 512}
        modifiers:
          type: array
          maxItems: 8
          uniqueItems: true
          description: Canonical lowercase kebab-case tokens in ascending lexical order.
          items:
            type: string
            minLength: 1
            maxLength: 48
            pattern: '^[a-z](?:[a-z0-9]|-[a-z0-9])*$'
        victory_summary: {type: string, minLength: 1, maxLength: 512}
        role_resources:
          description: Optional non-economic role pacing budget; omission preserves prior canonical bytes.
          allOf:
            - {$ref: "#/components/schemas/ChallengeRoleResourcesV1"}
    ChallengeRoleResourcesV1:
      type: object
      additionalProperties: false
      required: [captain_focus, evidence_focus, experiment_focus, run_budget, retained_failure_focus_refund]
      properties:
        captain_focus: {type: integer, minimum: 1, maximum: 32}
        evidence_focus: {type: integer, minimum: 1, maximum: 32}
        experiment_focus:
          type: integer
          minimum: 1
          maximum: 32
          description: Must cover the maximum hard successful-run minimum across phase and victory gates.
        run_budget:
          type: integer
          minimum: 1
          maximum: 32
          description: Must cover max(retained runs, successful runs plus retained-failed runs) across all hard gates.
        retained_failure_focus_refund:
          type: integer
          minimum: 1
          maximum: 4
          description: Non-economic focus refund for retained failed runs only; cancelled runs receive none.
    ChallengeRulesetV1:
      type: object
      additionalProperties: false
      required: [schema, template, duration_seconds, grace_seconds, phase_gates, victory_requirements]
      properties:
