openapi: 3.1.0
info:
  title: Hepta Paper Raid API
  version: 4.1.0-alpha.1
  description: >-
    Versioned Team + Paper collaboration control-plane API for 3-5 human players using
    independently operated external Agents to create one signed, reproducible
    PaperBundle. This API does not widen the legacy /v1/hepta contracts.
servers:
  - url: http://127.0.0.1:7011
security:
  - consumerUserAssertion: []
paths:
  /ready:
    get:
      security: []
      operationId: getHeptaReadiness
      description: >-
        Returns 200 only when PostgreSQL answers SELECT 1 and all Consumer
        Edge, distinct authorization/control/completion keys, the signed
        Nakama control origin/runtime key, and configured finality trust
        anchors are internally valid. Returns 503 with ready=false otherwise.
      responses:
        "200": {description: Durable dependencies and trust configuration ready}
        "503": {description: Database unavailable or trust configuration invalid}
  /v2/hepta/manifest:
    get:
      security: []
      operationId: getPaperRaidManifest
      responses:
        "200": {description: Paper Raid capability and finality mode}
  /v2/hepta/openapi.yaml:
    get:
      security: []
      operationId: getPaperRaidOpenApi
      responses:
        "200": {description: This OpenAPI document}
  /v2/hepta/challenges:
    get:
      operationId: listPublicPaperRaidChallenges
      description: Lists non-draft research challenges for an asserted player.
      responses:
        "200": {description: Public challenge cards}
  /v2/hepta/challenges/{challenge_id}:
    parameters:
      - {$ref: "#/components/parameters/ChallengeId"}
    get:
      operationId: getPublicPaperRaidChallenge
      responses:
        "200": {description: Public challenge detail}
        "404": {description: Challenge is absent or still draft}
  /v2/hepta/matchmaking/tickets:
    get:
      operationId: listMatchmakingTickets
      description: Lists only the asserted player's tickets.
      responses:
        "200": {description: Player-scoped matchmaking tickets}
    post:
      operationId: createMatchmakingTicket
      description: >-
        Enqueues the asserted player. The alpha matcher requires exactly three
        players while Team and protocol aggregates remain 3-5 capable.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMatchmakingTicketRequest"}
      responses:
        "201": {description: Ticket created and optional deterministic team proposal returned}
        "409": {description: Player already has one live ticket for this challenge}
  /v2/hepta/matchmaking/tickets/{ticket_id}:
    parameters:
      - {$ref: "#/components/parameters/TicketId"}
    get:
      operationId: getMatchmakingTicket
      description: Returns a ticket only to its asserted player.
      responses:
        "200": {description: Matchmaking ticket}
        "404": {description: Ticket not found in player scope}
  /v2/hepta/team-proposals:
    get:
      operationId: listTeamProposals
      description: Lists proposed/accepted teams containing the asserted player.
      responses:
        "200": {description: Player-scoped team proposals}
  /v2/hepta/team-proposals/{proposal_id}:
    parameters:
      - {$ref: "#/components/parameters/ProposalId"}
    get:
      operationId: getTeamProposal
      responses:
        "200": {description: Team proposal and immutable decisions}
  /v2/hepta/team-proposals/{proposal_id}/decisions:
    parameters:
      - {$ref: "#/components/parameters/ProposalId"}
    post:
      operationId: createTeamProposalDecision
      description: >-
        Records one accept/decline for the asserted member. Unanimous acceptance
        is required; decline requeues all tickets deterministically.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateTeamProposalDecisionRequest"}
      responses:
        "201": {description: Decision recorded with updated/replacement proposal}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /v2/hepta/players:
    post:
      operationId: createHumanPlayer
      description: >-
        Registers a human player. subject_id and nakama_user_id come only from
        the signed Consumer Edge assertion, never from the JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateHumanPlayerRequest"}
      responses:
        "201":
          description: Human player created, or the original response for an exact applied replay
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HumanPlayer"}
  /v2/hepta/players/me:
    get:
      operationId: getSelfHumanPlayer
      description: Returns only the player bound to the signed Consumer assertion.
      responses:
        "200":
          description: Assertion-scoped human player
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HumanPlayer"}
  /v2/hepta/players/{player_id}/signing-key/rotate:
    parameters:
      - {$ref: "#/components/parameters/PlayerId"}
    post:
      operationId: rotateHumanSigningKey
      description: >-
        Dual-signed old-to-new key rotation. Current forming-team acceptances
        are superseded and must be signed again using the new key.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RotateHumanSigningKeyRequest"}
      responses:
        "200": {description: Key rotated and stale acceptances superseded}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /v2/hepta/players/{player_id}/signing-key/revoke:
    parameters:
      - {$ref: "#/components/parameters/PlayerId"}
    post:
      operationId: revokeHumanSigningKey
      description: >-
        Signed compromise revocation. Forming-team acceptances are superseded;
        already signed authorship evidence is retained and later finalization
        enters integrity_hold.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RevokeHumanSigningKeyRequest"}
      responses:
        "200": {description: Key revoked and immutable history retained}
  /v2/hepta/agent-bindings:
    get:
      operationId: listSelfAgentBindings
      description: Returns only Agent bindings owned by the asserted player.
      responses:
        "200":
          description: Assertion-scoped Agent bindings ordered by created_at then binding_id
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AgentBinding"}
    post:
      operationId: createAgentBinding
      description: >-
        Binds an external Agent only after its Ed25519 key signs the exact
        agent_id, key, asserted subject, player, nonce and validity interval.
        Legacy v1 self-claimed owner_id is never trusted by Paper Raid.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateAgentBindingRequest"}
      responses:
        "201":
          description: Agent binding created, or the original response for an exact applied replay
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentBinding"}
  /v2/hepta/agent-bindings/{binding_id}/rotate-key:
    parameters:
      - name: binding_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: rotateAgentBindingKey
      description: >-
        Atomically rotates the authoritative v2 Agent key after the old and new
        keys sign the same binding/player/subject/version-scoped frame.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RotateAgentBindingKeyRequest"}
      responses:
        "200":
          description: Agent binding key rotated, or original exact-replay response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentBinding"}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /v2/hepta/teams:
    post:
      operationId: createResearchTeam
      description: Atomically creates an ordered 3-5 member Paper Raid roster.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateResearchTeamRequest"}
      responses:
        "201": {description: Forming team created}
  /v2/hepta/teams/{team_id}:
    parameters:
      - {$ref: "#/components/parameters/TeamId"}
    get:
      operationId: getResearchTeam
      description: Requires a signed assertion from a current team member.
      responses:
        "200": {description: Research team}
  /v2/hepta/teams/{team_id}/member-acceptances:
    parameters:
      - {$ref: "#/components/parameters/TeamId"}
    get:
      operationId: listResearchTeamMemberAcceptances
      description: Requires a signed assertion for a current proposed team member.
      responses:
        "200": {description: Immutable signed member acceptance records}
    post:
      operationId: acceptResearchTeamMembership
      description: >-
        A proposed human member signs the exact challenge, roster version,
        participant slot, Agent binding, role and collaboration compact hash.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AcceptResearchTeamMembershipRequest"}
      responses:
        "201": {description: Signed team membership acceptance recorded}
        "409": {description: Stale roster, duplicate acceptance, or changed compact}
  /v2/hepta/teams/{team_id}/lock:
    parameters:
      - {$ref: "#/components/parameters/TeamId"}
    post:
      operationId: lockResearchTeam
      description: Requires one valid signed acceptance from every 3-5 member.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExpectedVersionCommand"}
      responses:
        "200": {description: Team roster locked}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /v2/hepta/papers:
    post:
      operationId: createPaperProject
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreatePaperProjectRequest"}
      responses:
        "201": {description: Paper project created}
  /v2/hepta/papers/{paper_id}:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    get:
      operationId: getPaperProject
      description: Requires a signed assertion from a current team member.
      responses:
        "200": {description: Paper project}
  /v2/hepta/papers/{paper_id}/transition:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: transitionPaperProject
      responses:
        "200": {description: Paper phase advanced or returned to drafting}
  /v2/hepta/papers/{paper_id}/work-items:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createPaperWorkItem
      responses:
        "201": {description: Work item created}
  /v2/hepta/work-items/{work_item_id}/transition:
    parameters:
      - name: work_item_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: transitionPaperWorkItem
      responses:
        "200": {description: Work item transitioned}
  /v2/hepta/papers/{paper_id}/revisions:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createPaperRevision
      description: >-
        Creates a revision only from the current parent. All four submitted
        hashes must resolve to one verified same-paper artifact root and the
        unique paper_source, bibliography and claim_evidence_graph objects.
      responses:
        "201": {description: Paper revision created}
  /v2/hepta/papers/{paper_id}/artifact-manifests:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createArtifactManifest
      description: >-
        Adapts an exact paper-raid.artifact-bundle.v1 object from the pinned
        Integration revision, independently recomputes its canonical JSON plus
        newline root, and binds every object to an immutable CAS or Git URI.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateArtifactManifestRequest"}
      responses:
        "201": {description: Verified same-paper artifact manifest}
        "400": {description: Non-canonical bundle, path, digest, role, or URI}
        "409": {description: Source/root/paper binding conflict}
  /v2/hepta/papers/{paper_id}/evidence-cards:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createEvidenceCard
      description: Stores human-signed source URI/hash/locator/license evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateEvidenceCardRequest"}
      responses:
        "201": {description: Verified evidence card}
        "403": {description: Identity, current-key, or signature verification failed}
  /v2/hepta/papers/{paper_id}/citations:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createCitationRecord
      description: Stores a human-signed DOI/URL citation bound to an evidence card.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateCitationRecordRequest"}
      responses:
        "201": {description: Verified citation record}
  /v2/hepta/papers/{paper_id}/experiment-plans:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createExperimentPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateExperimentPlanRequest"}
      responses:
        "201": {description: Experiment plan bound to verified artifact manifests}
  /v2/hepta/papers/{paper_id}/run-records:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createRunRecord
      description: Persists successful, failed, and cancelled runs; failed runs cannot be hidden.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateRunRecordRequest"}
      responses:
        "201": {description: Immutable run record}
  /v2/hepta/papers/{paper_id}/figure-lineage:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createFigureLineage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateFigureLineageRequest"}
      responses:
        "201": {description: Figure-to-run lineage recorded}
  /v2/hepta/papers/{paper_id}/claims:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createClaimRecord
      description: Main/numeric/figure claims require evidence, run, or figure lineage.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateClaimRecordRequest"}
      responses:
        "201": {description: Claim-evidence edge recorded}
  /v2/hepta/papers/{paper_id}/section-leases:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: acquireSectionLease
      description: Acquires one bounded lease with a monotonically increasing fencing token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AcquireSectionLeaseRequest"}
      responses:
        "201": {description: Section lease acquired}
        "409": {description: Live lease or stale fencing token}
  /v2/hepta/papers/{paper_id}/agent-proposals:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      security: []
      operationId: createAgentProposal
      description: >-
        Accepts an external Agent's Ed25519-signed proposal. Authority comes
        from the frozen Agent binding and signed body, not a Consumer assertion.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateAgentProposalRequest"}
      responses:
        "201": {description: Signed Agent proposal recorded}
        "403": {description: Agent identity, scope, key, or signature failed}
  /v2/hepta/papers/{paper_id}/human-decisions:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createHumanDecision
      description: Records a current-key human accept/rework/reject decision over an Agent proposal.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateHumanDecisionRequest"}
      responses:
        "201": {description: Human decision recorded}
  /v2/hepta/papers/{paper_id}/section-revisions:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createSectionRevision
      description: Materializes an accepted Agent patch under the exact live lease fence.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSectionRevisionRequest"}
      responses:
        "201": {description: Section revision created}
        "409": {description: Stale/cross-paper/cross-section parent or lease fence}
  /v2/hepta/papers/{paper_id}/section-revisions/{section_revision_id}/reviews:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
      - {$ref: "#/components/parameters/SectionRevisionId"}
    post:
      operationId: createSectionReview
      description: Requires a current-key signature from a human other than the patch owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSectionReviewRequest"}
      responses:
        "201": {description: Independent section review recorded}
  /v2/hepta/papers/{paper_id}/section-merges:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createSectionMerge
      description: Signed merge that atomically advances one section head and consumes its lease.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSectionMergeRequest"}
      responses:
        "201": {description: Section merged}
        "409": {description: Review, parent, revision, or fencing precondition failed}
  /v2/hepta/papers/{paper_id}/room:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    get:
      operationId: getPaperRoom
      description: >-
        Returns a player-scoped repeatable-read projection of Team, Paper,
        artifacts, claims, runs, revisions, leases, proposals, reviews and merges.
      responses:
        "200": {description: Consistent Paper Room read model}
  /v2/hepta/papers/{paper_id}/events:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
      - name: after_cursor
        in: query
        required: false
        schema: {type: integer, minimum: 0, default: 0}
    get:
      operationId: listPaperRoomEvents
      description: Cursor-based catch-up over persisted typed Paper Room events.
      responses:
        "200": {description: Ordered events strictly after after_cursor}
  /v2/hepta/papers/{paper_id}/revisions/{revision_id}/promote:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
      - name: revision_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: promotePaperReleaseCandidate
      description: >-
        Freezes author_order separately from participant_slot and binds the
        Compact, protocol/amendments, ethics, COI, AI and artifact manifests.
      responses:
        "200": {description: Canonical release candidate promoted}
  /v2/hepta/papers/{paper_id}/author-consents:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createAuthorshipConsent
      description: >-
        Accepts only the asserted player's Ed25519 signature over the common
        release-candidate hash and an immutable human signing-key snapshot.
      responses:
        "201": {description: Authorship consent accepted}
  /v2/hepta/papers/{paper_id}/finalize:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: finalizeJointPaperSubmission
      description: Requires exactly one valid consent from every locked roster member.
      responses:
        "201": {description: Canonical PaperBundle is submission_ready and pending_finality}
        "202": {description: PaperBundle retained in integrity_hold because an authorship key was compromise-revoked}
  /v2/hepta/papers/{paper_id}/submission:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    get:
      operationId: getJointPaperSubmission
      description: Requires a signed assertion from a current team member.
      responses:
        "200": {description: Signed PaperBundle and joint submission}
  /v2/hepta/papers/{paper_id}/contribution-ledgers:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createContributionLedger
      description: >-
        During author_approval, freezes one canonical CRediT ledger whose
        author roles exactly equal the release candidate. Artifact and review
        points are derived only from accepted same-paper signed records and
        never enter PaperScore or determine author order.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateContributionLedgerRequest"}
      responses:
        "201": {description: Immutable contribution ledger frozen}
        "409": {description: Roster, release hash, phase, or contribution evidence mismatch}
  /v2/hepta/papers/{paper_id}/evaluations:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    post:
      operationId: createPaperEvaluation
      description: >-
        Records an immutable evaluation of one submission-ready PaperBundle.
        The asserted evaluator and exactly two signed reviewers must be
        distinct non-authors with independent COI attestations. Supersession is
        append-only, restricted to an open Appeal, and requires a disjoint panel.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreatePaperEvaluationRequest"}
      responses:
        "201": {description: Signed evaluation, separate PaperScore and RaidScore recorded in pending_finality}
        "403": {description: Panel, identity, key, signature, or COI independence failed}
        "409": {description: Release, ledger, initial evaluation, or supersession precondition failed}
  /v2/hepta/papers/{paper_id}/evaluations/{evaluation_id}/reproductions:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
      - name: evaluation_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: createPaperReproduction
      description: >-
        Applies the evaluation's frozen versioned absolute, relative,
        statistical and seed tolerances. Reports and corrections are immutable;
        a correction explicitly supersedes only the same reproducer's latest report.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreatePaperReproductionRequest"}
      responses:
        "201": {description: Signed reproduction report recorded}
        "403": {description: Reproducer is an author/panel member or signature failed}
  /v2/hepta/papers/{paper_id}/evaluations/{evaluation_id}/appeals:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
      - name: evaluation_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: createPaperAppeal
      description: Opens one signed immutable Appeal by an asserted human author.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreatePaperAppealRequest"}
      responses:
        "201": {description: Appeal opened; settlement projection becomes challenged/held}
        "403": {description: Appellant assertion, authorship, key, or signature failed}
  /v2/hepta/papers/{paper_id}/appeals/{appeal_id}/resolve:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
      - name: appeal_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: resolvePaperAppeal
      description: >-
        Records a signed immutable resolution by a resolver distinct from the
        authors, appellant and both original/replacement panels. Upheld outcomes
        require the exact same-release superseding evaluation; denied outcomes cannot reference one.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResolvePaperAppealRequest"}
      responses:
        "201": {description: Appeal resolution recorded; prior evaluation remains immutable}
        "403": {description: Resolver independence, assertion, key, or signature failed}
  /v2/hepta/papers/{paper_id}/review-state:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    get:
      operationId: getPaperReviewState
      description: >-
        Consistent review projection for signed authors and review participants.
        Evaluation settlement is derived as pending_finality, challenged, or resolved;
        signed immutable records are never rewritten.
      responses:
        "200": {description: Contribution, evaluation, reproduction, Appeal, resolution and RaidScore records}
        "403": {description: Asserted player is not a signed participant}
  /v2/hepta/research-session-authorizations:
    post:
      operationId: issueResearchSessionAuthorizationSet
      description: >-
        Issues one atomic ordered set of 3-5 signed Nakama research-session
        authorizations. subject_user_id is the bound Nakama UUID; the Consumer
        subject remains private to Hepta identity records.
      responses:
        "201": {description: Complete signed roster epoch issued}
  /v2/hepta/research-session-authorizations/{session_id}/replace:
    parameters:
      - {$ref: "#/components/parameters/SessionId"}
    post:
      operationId: replaceResearchSessionAuthorizationSet
      description: >-
        Supersedes the latest complete session epoch. Exactly one declared
        disconnected slot may change Agent key; the human, binding, Agent ID,
        role, team roster, paper, challenge, ruleset and challenge snapshot
        remain fixed. Every authorization ID is fresh.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReplaceResearchSessionAuthorizationSetRequest"}
      responses:
        "201": {description: Fresh complete roster epoch issued}
        "409": {description: Stale epoch or replacement changed a frozen field}
  /v2/hepta/nakama/research-session-controls/create:
    post:
      operationId: createNakamaResearchSessionControl
      description: >-
        Freezes one globally unique, short-lived Ed25519 control command for
        the latest initial authorization epoch, persists its exact canonical
        request bytes transactionally, then calls Nakama only after commit.
        Timeout/5xx retries reuse the original command ID, signature and bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateNakamaResearchSessionControlRequestV2"}
      responses:
        "200": {$ref: "#/components/responses/NakamaControlCommand"}
        "409": {description: Idempotency conflict, stale epoch, or invalid authorization state}
        "502": {description: Command remains durable and pending after strict Nakama transport/response failure}
  /v2/hepta/nakama/research-session-controls/resume:
    post:
      operationId: resumeNakamaResearchSessionControl
      description: >-
        Signs a current-epoch resume that may recreate only Nakama's ephemeral
        runtime. It never mutates the durable research snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResumeNakamaResearchSessionControlRequestV2"}
      responses:
        "200": {$ref: "#/components/responses/NakamaControlCommand"}
        "409": {description: Idempotency conflict or non-current epoch}
        "502": {description: Durable pending command; exact retry is safe}
  /v2/hepta/nakama/research-session-controls/replace-roster:
    post:
      operationId: replaceNakamaResearchSessionRosterControl
      description: >-
        Controls only a previously issued full replacement epoch. The signed
        payload includes all 3-5 new authorizations in participant-slot order.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReplaceNakamaResearchSessionRosterControlRequestV2"}
      responses:
        "200": {$ref: "#/components/responses/NakamaControlCommand"}
        "409": {description: Idempotency conflict, stale epoch, or invalid replacement chain}
        "502": {description: Durable pending command; resume runtime then retry exact bytes}
  /v2/hepta/nakama/research-session-controls/complete:
    post:
      operationId: completeNakamaResearchSessionControl
      description: >-
        Derives terminal facts exclusively from the finalized canonical
        PaperBundle. A response is applied only after local authority
        verification and the synchronous archive callback has been independently
        verified and persisted by Hepta.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompleteNakamaResearchSessionControlRequestV2"}
      responses:
        "200": {$ref: "#/components/responses/NakamaControlCommand"}
        "409": {description: Bundle is not finalized or epoch is not fully consumed}
        "502": {description: Durable pending command; resume/reconnect then retry exact bytes}
  /v2/hepta/nakama/research-session-authorizations/consumed:
    post:
      security:
        - nakamaServiceToken: []
      operationId: consumeResearchSessionAuthorizationSet
      description: >-
        Atomically consumes the complete ordered authorization set. Partial,
        mixed-version, mixed-root and repeated epochs are rejected. The
        response is a Hepta-signed immutable acknowledgement, not the mutable
        authorization set.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConsumeResearchSessionAuthorizationSetRequest"}
      responses:
        "200":
          description: Complete authorization epoch consumed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignedAuthorizationSetConsumptionReceiptV1"}
  /v2/hepta/nakama/research-session-completions:
    post:
      security:
        - nakamaServiceToken: []
      operationId: ingestNakamaResearchSessionCompletion
      description: >-
        Verifies the signed completion with a locally pinned Nakama authority
        key, independently recomputes the complete event/archive/commitment
        roots, binds the terminal event to a consumed authorization epoch and
        finalized PaperBundle, then stores a normalized receipt and outbox event.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NakamaCompletionIngestRequest"}
      responses:
        "201":
          description: Verified immutable Hepta-signed Nakama completion receipt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignedNakamaCompletionReceiptV1"}
        "403": {description: Untrusted authority, signature, archive, or root}
        "409": {description: Unconsumed/wrong epoch, bundle mismatch, or second completion}
  /v2/hepta/operator/trnm/trust-anchors:
    post:
      security:
        - operatorServiceToken: []
      operationId: ingestCanonicalCometBftTrustAnchor
      description: >-
        Accepts only exact canonical CometBFTTrustAnchorV1 JSON bytes after
        operator authentication. Upload does not create trust: anchor_hash_hex
        must already exist in the immutable
        HEPTA_TRNM_COMETBFT_TRUST_ANCHOR_HASHES_JSON allowlist. The raw wire is
        retained byte-for-byte. The upstream 16 MiB wire limit is enforced
        before parsing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exact canonical trnm_cometbft_trust_anchor_v1 wire document.
              additionalProperties: true
      responses:
        "201": {description: Pinned canonical trust anchor admitted}
        "200": {description: Exact byte replay of the admitted anchor}
        "400": {description: Noncanonical or structurally invalid anchor bytes}
        "403": {description: Operator authentication failed or anchor hash is not pre-pinned}
        "409": {description: Anchor hash/content conflict}
        "413": {description: Body exceeds the upstream canonical wire limit}
  /v2/hepta/papers/{paper_id}/chain-finality:
    parameters:
      - {$ref: "#/components/parameters/PaperId"}
    get:
      security:
        - trnmServiceToken: []
      operationId: getPaperChainFinalityProjection
      responses:
        "200":
          description: Orthogonal verified-finality projection; never an economic eligibility grant
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperChainFinalityProjectionV1"}
        "404": {description: Paper remains pending_finality}
    post:
      security:
        - trnmServiceToken: []
      operationId: ingestCanonicalPaperReceiptV2
      description: >-
        Authenticates before reading any body bytes, then applies the upstream
        128 MiB stream cap and exact canonical Receipt V2 decoder. The selected
        stored trust anchor and server clock verify CometBFT finality. The
        verified domain command_id binds TrnmCommand.idempotency_key (never its
        local UUID), and the full signed EvaluationCommitmentV1 is rebound to
        immutable Paper/submission/evaluation/reproduction records. Integrity
        hold, open Appeal, or superseded evaluation/reproduction fails closed.
      parameters:
        - name: x-hepta-trnm-trust-anchor-hash
          in: header
          required: true
          schema: {type: string, pattern: "^[0-9a-f]{64}$"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exact canonical trnm_cometbft_apphash_finality_receipt_v2 wire document.
              additionalProperties: true
      responses:
        "201":
          description: pending_finality transitioned to verified_finality atomically
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaperChainFinalityProjectionV1"}
        "200": {description: Exact applied receipt replay; no duplicate event/outbox}
        "400": {description: Noncanonical, malformed, or structurally invalid receipt}
        "403": {description: TRNM authentication or trust verification failed}
        "404": {description: Bound queued command or immutable Paper record missing}
        "409": {description: Binding, hold, Appeal, supersession, finality, or replay conflict}
        "413": {description: Body exceeds the upstream canonical wire limit}
components:
  securitySchemes:
    consumerUserAssertion:
      type: apiKey
      in: header
      name: x-hepta-user-assertion
      description: >-
        Canonical-base64 SignedConsumerUserAssertionV2 binding issuer,
        audience, subject, Nakama UUID, player, method, path, body hash,
        idempotency nonce, iat and exp.
    nakamaServiceToken:
      type: apiKey
      in: header
      name: x-hepta-nakama-token
    operatorServiceToken:
      type: apiKey
      in: header
      name: x-hepta-operator-token
    trnmServiceToken:
      type: apiKey
      in: header
      name: x-hepta-trnm-token
  parameters:
    ChallengeId:
      name: challenge_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    TicketId:
      name: ticket_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SectionRevisionId:
      name: section_revision_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlayerId:
      name: player_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    TeamId:
      name: team_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PaperId:
      name: paper_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
  responses:
    VersionConflict:
      description: expected_version did not match the aggregate version
    NakamaControlCommand:
      description: Durable signed control command and strictly validated Nakama result
      content:
        application/json:
          schema: {$ref: "#/components/schemas/NakamaResearchControlCommandV2"}
  schemas:
    Sha256Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 200
    PaperChainFinalityProjectionV1:
      type: object
      additionalProperties: false
      required: [schema, paper_project_id, submission_id, evaluation_id, local_command_id, command_idempotency_key, command_fingerprint, paper_binding_fingerprint, receipt_hash, trust_anchor_hash, chain_id, comet_tx_hash, transaction_index, execution_height, commitment_height, commitment_header_hash, app_hash, status, ranking_eligible, reward_eligible, score_eligible, economic_eligible, version, verified_at]
      properties:
        schema: {type: string, const: hepta.paper_raid.chain_finality_projection.v1}
        paper_project_id: {type: string, format: uuid}
        submission_id: {type: string, format: uuid}
        evaluation_id: {type: string, format: uuid}
        local_command_id: {type: string, format: uuid}
        command_idempotency_key: {type: string, pattern: "^[0-9a-f]{64}$"}
        command_fingerprint: {$ref: "#/components/schemas/Sha256Digest"}
        paper_binding_fingerprint: {$ref: "#/components/schemas/Sha256Digest"}
        receipt_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
        trust_anchor_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
        chain_id: {type: string, minLength: 1, maxLength: 128}
        comet_tx_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
        transaction_index: {type: integer, minimum: 0}
        execution_height: {type: integer, minimum: 1}
        commitment_height: {type: integer, minimum: 2}
        commitment_header_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
        app_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
        status: {type: string, const: verified_finality}
        ranking_eligible: {type: boolean, const: false}
        reward_eligible: {type: boolean, const: false}
        score_eligible: {type: boolean, const: false}
        economic_eligible: {type: boolean, const: false}
        version: {type: integer, const: 1}
        verified_at: {type: string, format: date-time}
    CreateNakamaResearchSessionControlRequestV2:
      type: object
      additionalProperties: false
      required: [authorization_set_id, idempotency_key]
      properties:
        authorization_set_id: {type: string, format: uuid}
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
    ResumeNakamaResearchSessionControlRequestV2:
      type: object
      additionalProperties: false
      required: [session_id, roster_version, idempotency_key]
      properties:
        session_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        roster_version: {type: integer, minimum: 1, maximum: 9007199254740991}
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
    ReplaceNakamaResearchSessionRosterControlRequestV2:
      type: object
      additionalProperties: false
      required: [authorization_set_id, idempotency_key]
      properties:
        authorization_set_id: {type: string, format: uuid}
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
    CompleteNakamaResearchSessionControlRequestV2:
      type: object
      additionalProperties: false
      required: [session_id, roster_version, idempotency_key]
      properties:
        session_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        roster_version: {type: integer, minimum: 1, maximum: 9007199254740991}
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
    NakamaResearchControlCommandV2:
      type: object
      additionalProperties: false
      required: [schema, command_id, operation, target_rpc, session_id, session_roster_version, authorization_set_id, payload_hash, idempotency_key, request_hash, request_sha256, status, response, response_sha256, response_seal_signature, attempt_count, last_error_code, created_at, updated_at]
      properties:
        schema: {type: string, const: hepta.paper_raid.nakama_research_control_command.v2}
        command_id: {type: string, format: uuid}
        operation: {type: string, enum: [create, resume, replace_roster, complete]}
        target_rpc:
          type: string
          enum: [trnm_research_session_create_v2, trnm_research_session_resume_v2, trnm_research_session_replace_roster_v2, trnm_research_session_complete_v2]
        session_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        session_roster_version: {type: integer, minimum: 1, maximum: 9007199254740991}
        authorization_set_id: {type: string, format: uuid}
        payload_hash: {$ref: "#/components/schemas/Sha256Digest"}
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
        request_hash: {$ref: "#/components/schemas/Sha256Digest"}
        request_sha256: {$ref: "#/components/schemas/Sha256Digest"}
        status: {type: string, enum: [pending, applied]}
        response:
          anyOf: [{type: object}, {type: "null"}]
        response_sha256:
          anyOf: [{$ref: "#/components/schemas/Sha256Digest"}, {type: "null"}]
        response_seal_signature:
          description: >-
            Hepta control-key Ed25519 signature over command_id,
            request_sha256, and response_sha256. Present only after an applied
            response and re-verified before every replay.
          anyOf: [{type: string, minLength: 88, maxLength: 88}, {type: "null"}]
        attempt_count: {type: integer, minimum: 0, maximum: 9007199254740991}
        last_error_code:
          anyOf: [{type: string, minLength: 1}, {type: "null"}]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CreateMatchmakingTicketRequest:
      type: object
      additionalProperties: false
      required: [ticket_id, challenge_id, requested_team_size, roles, availability_hash, idempotency_key]
      properties:
        ticket_id: {type: string, format: uuid}
        challenge_id: {type: string, format: uuid}
        requested_team_size: {type: integer, const: 3}
        roles:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 512}
        availability_hash: {$ref: "#/components/schemas/Sha256Digest"}
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
    CreateTeamProposalDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision_id, expected_proposal_version, decision, idempotency_key]
      properties:
        decision_id: {type: string, format: uuid}
        expected_proposal_version: {type: integer, minimum: 1}
        decision: {type: string, enum: [accept, decline]}
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
    ArtifactReference:
      type: object
      additionalProperties: false
      required: [logical_path, sha256, uri, acl]
      properties:
        logical_path: {type: string, minLength: 1, maxLength: 240}
        sha256: {$ref: "#/components/schemas/Sha256Digest"}
        uri:
          type: string
          description: Exact cas://sha256/... or immutable git+https://...@<40-hex>/<path> URI.
        acl: {type: string, enum: [team, reviewers, public_after_release]}
    NeutralArtifactObjectV1:
      type: object
      additionalProperties: false
      required: [canonical_json, dependencies, logical_path, media_type, role, sha256, size]
      properties:
        canonical_json: {type: boolean}
        dependencies:
          type: array
          uniqueItems: true
          items: {type: string}
        logical_path: {type: string, minLength: 1}
        media_type: {type: string, minLength: 1}
        role: {type: string, minLength: 1}
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Integration neutral bundle uses raw lowercase SHA-256 hex.
        size: {type: integer, minimum: 0}
    NeutralArtifactBundleV1:
      type: object
      additionalProperties: false
      required:
        - artifact_root
        - bundle_id
        - challenge_id
        - created_at
        - hepta_binding_status
        - human_authority_materialized
        - object_count
        - objects
        - required_run_ids
        - schema
      properties:
        artifact_root:
          type: object
          additionalProperties: false
          required: [algorithm, digest_file]
          properties:
            algorithm: {type: string, const: sha256-canonical-json-plus-newline}
            digest_file: {type: string, const: artifact-bundle.sha256}
        bundle_id: {type: string, minLength: 1}
        challenge_id: {type: string, minLength: 1}
        created_at: {type: string, format: date-time}
        hepta_binding_status: {type: string}
        human_authority_materialized: {type: boolean}
        object_count: {type: integer, minimum: 1, maximum: 4096}
        objects:
          type: array
          minItems: 1
          maxItems: 4096
          items: {$ref: "#/components/schemas/NeutralArtifactObjectV1"}
        required_run_ids:
          type: array
          uniqueItems: true
          items: {type: string}
        schema: {type: string, const: paper-raid.artifact-bundle.v1}
    CreateArtifactManifestRequest:
      type: object
      additionalProperties: false
      required: [manifest_id, expected_paper_version, expected_source_manifest_sha256, source_bundle, storage_locations, idempotency_key]
      properties:
        manifest_id: {type: string, format: uuid}
        expected_paper_version: {type: integer, minimum: 1}
        expected_source_manifest_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        source_bundle: {$ref: "#/components/schemas/NeutralArtifactBundleV1"}
        storage_locations:
          type: array
          minItems: 1
          maxItems: 4096
          items: {$ref: "#/components/schemas/ArtifactReference"}
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
    CreateEvidenceCardRequest:
      type: object
      additionalProperties: false
