          items: {type: string, format: uuid}
        run_record_ids:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        figure_lineage_ids:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
    AcquireSectionLeaseRequest:
      type: object
      additionalProperties: false
      required: [lease_id, section_key, holder_binding_id, expected_previous_fencing_token, ttl_seconds, idempotency_key]
      properties:
        lease_id: {type: string, format: uuid}
        section_key: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        holder_binding_id: {type: string, format: uuid}
        expected_previous_fencing_token: {type: integer, minimum: 0}
        ttl_seconds: {type: integer, minimum: 60, maximum: 3600}
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
    CreateAgentProposalRequest:
      type: object
      additionalProperties: false
