          type: string
          enum: [hepta.paper_raid.alpha_matcher.v2]
          description: Present on every V2 active proposal; absent only on terminal legacy history.
        source_preferences:
          type: array
          minItems: 3
          maxItems: 3
          description: Exact ordered preferences frozen into the V2 proposal identity.
          items:
            type: object
            additionalProperties: false
            required: [ticket_id, player_id, roles, availability_hash, private_party]
            properties:
              ticket_id: {type: string, format: uuid}
              player_id: {type: string, format: uuid}
