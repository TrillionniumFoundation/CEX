      properties:
        evidence_card_id: {type: string, format: uuid}
        source_uri: {type: string, format: uri, pattern: '^https://'}
        source_hash: {$ref: "#/components/schemas/Sha256Digest"}
        locator: {type: string, minLength: 1}
        license: {type: string, minLength: 1}
        verification_key_id: {type: string}
        verification_public_key: {type: string, contentEncoding: base64}
        verification_public_key_hash: {$ref: "#/components/schemas/Sha256Digest"}
        signed_at_unix: {type: integer, format: int64, minimum: 0}
        verification_signature: {type: string, contentEncoding: base64}
        idempotency_key: {$ref: "#/components/schemas/IdempotencyKey"}
    CreateCitationRecordRequest:
      type: object
      additionalProperties: false
      required: [citation_id, evidence_card_id, source_hash, locator, license, verification_key_id, verification_public_key, verification_public_key_hash, signed_at_unix, verification_signature, idempotency_key]
      properties:
        citation_id: {type: string, format: uuid}
        evidence_card_id: {type: string, format: uuid}
        doi: {type: [string, "null"]}
        canonical_url: {type: [string, "null"], format: uri}
        source_hash: {$ref: "#/components/schemas/Sha256Digest"}
        locator: {type: string, minLength: 1}
        license: {type: string, minLength: 1}
        verification_key_id: {type: string, minLength: 1}
        verification_public_key: {type: string, contentEncoding: base64}
        verification_public_key_hash: {$ref: "#/components/schemas/Sha256Digest"}
        signed_at_unix: {type: integer, format: int64, minimum: 0}
        verification_signature: {type: string, contentEncoding: base64}
