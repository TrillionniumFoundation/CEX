          items: {$ref: "#/components/schemas/ChallengePhaseGateV1"}
        victory_requirements:
          type: array
          minItems: 3
          maxItems: 18
          items: {$ref: "#/components/schemas/ChallengeMinimumV1"}
        gameplay:
