name: p0-v12-response-loss-boundary

on:
  push:
    branches:
      - fix/p0-v12-final-closure
    paths:
      - '.github/workflows/p0-v12-response-loss-boundary.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/p0-v12-final-closure
          fetch-depth: 0

      - name: Make response loss occur after server commit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/check-trnm-settlement-receipt-lookup-http.sh')
          text = path.read_text(encoding='utf-8')
          old = '''# Send a complete request and deliberately close without reading a response.
          python3 - "$ledger_addr" "$game_authority_token" "$work_dir/response-loss.request.json" <<'PY'
          from pathlib import Path
          import socket
          import sys

          host, port = sys.argv[1].rsplit(":", 1)
          token = sys.argv[2]
          body = Path(sys.argv[3]).read_bytes()
          request = (
              f"POST /v1/trnm/economy/intents HTTP/1.1\\r\\n"
              f"Host: {host}:{port}\\r\\n"
              f"Content-Type: application/json\\r\\n"
              f"x-trnm-game-authority: {token}\\r\\n"
              f"Content-Length: {len(body)}\\r\\n"
              f"Connection: close\\r\\n\\r\\n"
          ).encode() + body
          with socket.create_connection((host, int(port)), timeout=5) as connection:
              connection.sendall(request)
              connection.shutdown(socket.SHUT_WR)
              # Intentionally do not read the response: this is the response-loss boundary.
          PY'''
          new = '''# Send a complete request, wait until the server has produced its response (which
          # occurs only after the durable transaction commits), then discard the response.
          # This models an application that loses the response after the remote side effect,
          # rather than cancelling the request before the server can commit it.
          python3 - "$ledger_addr" "$game_authority_token" "$work_dir/response-loss.request.json" <<'PY'
          from pathlib import Path
          import socket
          import sys

          host, port = sys.argv[1].rsplit(":", 1)
          token = sys.argv[2]
          body = Path(sys.argv[3]).read_bytes()
          request = (
              f"POST /v1/trnm/economy/intents HTTP/1.1\\r\\n"
              f"Host: {host}:{port}\\r\\n"
              f"Content-Type: application/json\\r\\n"
              f"x-trnm-game-authority: {token}\\r\\n"
              f"Content-Length: {len(body)}\\r\\n"
              f"Connection: close\\r\\n\\r\\n"
          ).encode() + body
          with socket.create_connection((host, int(port)), timeout=5) as connection:
              connection.sendall(request)
              connection.shutdown(socket.SHUT_WR)
              connection.settimeout(15)
              if not connection.recv(1):
                  raise SystemExit("ledger-service closed before producing a response")
              # Deliberately discard the status, headers and body. The caller receives no
              # usable business response and must recover through receipt lookup.
          PY'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one response-loss helper, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          bash -n scripts/check-trnm-settlement-receipt-lookup-http.sh
          python3 scripts/check-trnm-settlement-receipt-lookup.py

      - name: Commit deterministic boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CEX P0 closure automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/check-trnm-settlement-receipt-lookup-http.sh
          git diff --cached --check
          git commit -m 'fix(trnm): lose receipt response only after durable commit'
          git push origin HEAD:fix/p0-v12-final-closure
