name: cex-final-governance-readback-v1

on:
  push:
    branches:
      - ops/object-export-fc8643d-20260910

permissions:
  checks: read
  contents: read
  pull-requests: write
  statuses: read

concurrency:
  group: cex-final-governance-readback-v1
  cancel-in-progress: false

jobs:
  governance:
    name: cex-governance/final-exact-head-readback
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TARGET_BRANCH: integration/cex-v12-sequence54-20260908
      BASE_BRANCH: main
      ORIGINAL_HEAD: fc8643d76e7c9ca2691712e39985c7b2ae06ad74
      CHECKER_REPOSITORY: TrillionniumFoundation/Trillionnium-World
      CHECKER_BRANCH: ops/p0-statement-let-fix-58f76a-20260910
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Wait for final repository-local CEX source state
        id: tuple
        shell: bash
        run: |
          set -euo pipefail
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          ready=false
          for _ in $(seq 1 360); do
            head="$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
            test -n "$head"
            rm -rf "$RUNNER_TEMP/probe"
            git init -q "$RUNNER_TEMP/probe"
            git -C "$RUNNER_TEMP/probe" remote add origin "$remote"
            git -C "$RUNNER_TEMP/probe" fetch -q --no-tags origin "$head" "$ORIGINAL_HEAD"
            git -C "$RUNNER_TEMP/probe" checkout -q --detach "$head"
            git -C "$RUNNER_TEMP/probe" merge-base --is-ancestor "$ORIGINAL_HEAD" HEAD
            source="$RUNNER_TEMP/probe/scripts/rust_advisory_packages_v5.py"
            settlement="$RUNNER_TEMP/probe/.github/workflows/trnm-economy-settlement.yml"
            generated="$RUNNER_TEMP/governance-semantics.json"
            if grep -Fq 'external_package = "trnm-game-" + "server"' "$source" \
              && ! grep -Fq 'cargo test -p trnm-game-server --locked' "$source" \
              && grep -Fq 'TRNM_EVIDENCE_BINARY="target/evidence/trnm-economy-service"' "$settlement" \
              && grep -Fq 'mkdir -p -- target/evidence' "$settlement" \
              && ! grep -Fq '$RUNNER_TEMP/trnm-economy-service-evidence' "$settlement" \
              && (cd "$RUNNER_TEMP/probe" && python3 scripts/generate-repository-semantics.py --stdout) > "$generated" \
              && cmp -s "$generated" "$RUNNER_TEMP/probe/docs/repository-contract-semantics-v1.json"; then
              ready=true
              break
            fi
            sleep 20
          done
          test "$ready" = true
          printf 'head=%s\n' "$head" >> "$GITHUB_OUTPUT"
          printf 'CEX_GOVERNANCE_HEAD=%s\n' "$head"

      - name: Freeze and fetch exact governance checker source
        shell: bash
        run: |
          set -euo pipefail
          checker_head="$(git ls-remote \
            "https://github.com/${CHECKER_REPOSITORY}.git" \
            "refs/heads/$CHECKER_BRANCH" | awk '{print $1}')"
          test -n "$checker_head"
          checker="$RUNNER_TEMP/github-pr-governance-readback-v1.py"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/${CHECKER_REPOSITORY}/${checker_head}/scripts/github-pr-governance-readback-v1.py" \
            > "$checker"
          python3 -m py_compile "$checker"
          test -s "$checker"
          printf 'CEX_GOVERNANCE_CHECKER_HEAD=%s\n' "$checker_head"
          printf 'CEX_GOVERNANCE_CHECKER_SHA256=%s\n' \
            "$(sha256sum "$checker" | awk '{print $1}')"

      - name: Require Tomasrgbsf exact-head approval and full protection
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ steps.tuple.outputs.head }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/github-pr-governance-readback-v1.py" \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request 53 \
            --expected-head "$EXPECTED_HEAD" \
            --expected-base "$BASE_BRANCH" \
            --author ProfHepta \
            --eligible-reviewer Tomasrgbsf \
            --required-reviewer Tomasrgbsf \
            --request-missing
          printf 'CEX_FINAL_GOVERNANCE=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'

      - name: Reject head movement after governance readback
        shell: bash
        env:
          EXPECTED_HEAD: ${{ steps.tuple.outputs.head }}
        run: |
          set -euo pipefail
          live="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$live" = "$EXPECTED_HEAD"
          printf 'CEX_GOVERNANCE_FINAL_HEAD_UNCHANGED=true\n'
