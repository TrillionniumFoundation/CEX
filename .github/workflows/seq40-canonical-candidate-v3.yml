name: seq40-canonical-candidate-v3

on:
  push:
    branches:
      - automation/seq40-workflow-trust-windows
    paths:
      - '.github/workflows/seq40-canonical-candidate-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seq40-canonical-candidate-v3
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  construct:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Checkout clean sequence 39 validated base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: automation/seq39-validated
          fetch-depth: 0
          persist-credentials: true

      - name: Apply cross-platform concrete Path self-test fix
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: /tmp/cex-seq40-python-cache
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/check-workflow-trust.py')
          source = path.read_text(encoding='utf-8')
          old_call = re.compile(
              r"mock\.patch\.object\(\s*Path\s*,\s*(['\"])is_symlink\1\s*,"
              r"[^)]*?return_value\s*=\s*True[^)]*?\)",
              flags=re.MULTILINE,
          )
          matches = list(old_call.finditer(source))
          fixed_markers = (
              'type(descriptor_path)',
              'candidate == descriptor_path',
              'type(action_dir)',
              'candidate == action_dir',
          )
          if not matches:
              missing = [marker for marker in fixed_markers if marker not in source]
              if missing:
                  raise SystemExit(
                      f'symlink self-test anchors drifted; missing fixed markers {missing!r}'
                  )
              print('sequence 40 fix already present at validated base')
          else:
              replacements: list[tuple[int, int, str]] = []
              bound: list[str] = []
              for match in matches:
                  context = source[max(0, match.start() - 2000):match.start()]
                  candidates = [
                      (context.rfind(variable), variable)
                      for variable in ('descriptor_path', 'action_dir')
                  ]
                  position, variable = max(candidates)
                  if position < 0:
                      raise SystemExit(
                          f'cannot bind concrete path for symlink mock at byte {match.start()}'
                      )
                  replacement = (
                      f'mock.patch.object(type({variable}), "is_symlink", '
                      f'new=lambda candidate: candidate == {variable})'
                  )
                  replacements.append((match.start(), match.end(), replacement))
                  bound.append(variable)
              if sorted(bound) != ['action_dir', 'descriptor_path']:
                  raise SystemExit(
                      f'expected exactly descriptor_path/action_dir mocks, got {bound!r}'
                  )
              for start, end, replacement in reversed(replacements):
                  source = source[:start] + replacement + source[end:]
              path.write_text(source, encoding='utf-8')

          final = path.read_text(encoding='utf-8')
          missing = [marker for marker in fixed_markers if marker not in final]
          if missing:
              raise SystemExit(f'fixed source missing markers: {missing!r}')
          if old_call.search(final):
              raise SystemExit('abstract Path symlink mock remains after repair')
          PY

          python3 -m py_compile scripts/check-workflow-trust.py scripts/check-workflow-trust-impl.py
          python3 scripts/check-workflow-trust.py
          git diff --check

      - name: Commit the single-file canonical candidate
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          if [[ "$changed" != 'scripts/check-workflow-trust.py' ]]; then
            echo "::error::unexpected sequence 40 diff"
            printf '%s\n' "$changed"
            exit 1
          fi
          git config user.name 'cex-sequence-40'
          git config user.email 'cex-sequence-40@users.noreply.github.com'
          git add -- scripts/check-workflow-trust.py
          git commit -m 'fix(ci): patch concrete Path classes in symlink self-tests'
          git push --force origin HEAD:automation/seq40-candidate

      - name: Export exact candidate SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "sequence40_candidate_sha=$sha"
          echo "sequence40_candidate_tree=$(git rev-parse HEAD^{tree})"

  linux:
    needs: construct
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPYCACHEPREFIX: /tmp/cex-seq40-python-cache
    steps:
      - name: Checkout exact canonical candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.construct.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust stable with format and lint
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Run exact Linux gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/check-workflow-trust.py scripts/check-workflow-trust-impl.py
          python3 scripts/check-workflow-trust.py
          python3 scripts/check-repository-integrity.py
          python3 scripts/check-p0-release-candidate-hygiene.py
          python3 scripts/check-development-docs.py
          cargo fmt --all --check
          git diff --check
          test -z "$(git status --porcelain)"

  windows:
    needs: construct
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      PYTHONPYCACHEPREFIX: D:\a\_temp\cex-seq40-python-cache
    steps:
      - name: Checkout exact canonical candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.construct.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run exact Windows gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/check-workflow-trust.py scripts/check-workflow-trust-impl.py
          python scripts/check-workflow-trust.py
          python scripts/check-repository-integrity.py
          python scripts/check-p0-release-candidate-hygiene.py
          python scripts/check-development-docs.py
          git diff --check
          $status = git status --porcelain
          if ($status) {
            throw "candidate worktree is dirty:`n$status"
          }

  publish:
    needs:
      - construct
      - linux
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact validated candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.construct.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Enforce one-file ancestry and publish validated ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/seq39-validated
          git merge-base --is-ancestor origin/automation/seq39-validated HEAD
          changed=$(git diff --name-only origin/automation/seq39-validated..HEAD)
          if [[ "$changed" != 'scripts/check-workflow-trust.py' ]]; then
            echo "::error::validated sequence 40 diff is not single-file"
            printf '%s\n' "$changed"
            exit 1
          fi
          git push --force origin HEAD:automation/seq40-validated
          echo "sequence40_validated_sha=$(git rev-parse HEAD)"
          echo "sequence40_validated_tree=$(git rev-parse HEAD^{tree})"
          echo 'sequence 40 canonical Linux/Windows validation passed'
