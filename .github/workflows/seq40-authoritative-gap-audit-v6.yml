name: seq40-authoritative-gap-audit-v6

on:
  push:
    branches:
      - automation/seq40-workflow-trust-windows
    paths:
      - '.github/workflows/seq40-authoritative-gap-audit-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seq40-authoritative-gap-audit-v6
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPYCACHEPREFIX: /tmp/cex-seq40-python-cache

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout automation control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for immutable sequence 40 evidence branch
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for _ in $(seq 1 720); do
            if git ls-remote --exit-code origin \
              refs/heads/automation/seq40-evidence-freeze >/tmp/seq40-evidence.ref 2>/dev/null; then
              found=true
              break
            fi
            sleep 10
          done
          if [[ "$found" != true ]]; then
            echo '::error::sequence 40 evidence branch was not published'
            exit 1
          fi
          sha=$(awk '{print $1}' /tmp/seq40-evidence.ref)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact evidence commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.evidence.outputs.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Run authoritative readiness and signoff checks without masking failure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import re
          import subprocess

          commands = (
              ('production_readiness', ['bash', 'scripts/check-production-readiness.sh']),
              ('production_signoff', ['bash', 'scripts/check-production-signoff.sh']),
          )
          selectors = re.compile(
              r'(blocker|gap|pending|not_granted|not granted|failed|failure|error|'
              r'x[1-8]\b|review|governance|evidence|authorization|do not merge)',
              flags=re.IGNORECASE,
          )
          secretish = re.compile(
              r'(?i)(token|secret|password|authorization)(\s*[:=]\s*)(\S+)'
          )

          results = []
          for name, argv in commands:
              completed = subprocess.run(
                  argv,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=False,
                  timeout=1200,
              )
              output = completed.stdout or ''
              encoded = output.encode('utf-8', errors='replace')
              selected = []
              for line in output.splitlines():
                  if not selectors.search(line):
                      continue
                  redacted = secretish.sub(r'\1\2<redacted>', line)
                  selected.append(redacted[:2000])
                  if len(selected) >= 300:
                      break
              results.append(
                  {
                      'name': name,
                      'argv': argv,
                      'exit_code': completed.returncode,
                      'output_sha256': hashlib.sha256(encoded).hexdigest(),
                      'output_byte_length': len(encoded),
                      'selected_blocker_lines': selected,
                  }
              )

          hosted = json.loads(
              Path('docs/release-evidence/sequence40/hosted-gates-v1.json').read_text(
                  encoding='utf-8'
              )
          )
          document = {
              'schema_version': 'cex.sequence40.authoritative-gap-audit.v1',
              'candidate_sha': hosted['candidate_sha'],
              'evidence_commit': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'production_authorization': 'not_granted',
              'checks': results,
              'all_authoritative_checks_passed': all(
                  result['exit_code'] == 0 for result in results
              ),
              'interpretation_rule': (
                  'A nonzero authoritative check remains a gap. '
                  'No selected-line omission, workflow success, or code review grants production authorization.'
              ),
          }
          out = Path('docs/release-evidence/sequence40/remaining-gap-audit-v1.json')
          out.write_text(
              json.dumps(document, indent=2, sort_keys=True, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          out.with_suffix(out.suffix + '.sha256').write_text(
              f'{digest}  {out.name}\n',
              encoding='utf-8',
          )
          PY
          git diff --check

      - name: Publish authoritative gap-audit branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cex-sequence-40-audit'
          git config user.email 'cex-sequence-40-audit@users.noreply.github.com'
          git add -- docs/release-evidence/sequence40/remaining-gap-audit-v1.json \
            docs/release-evidence/sequence40/remaining-gap-audit-v1.json.sha256
          git commit -m 'docs(evidence): freeze sequence 40 authoritative gap audit'
          git push --force origin HEAD:automation/seq40-gap-audit
          echo "sequence40_gap_audit_commit=$(git rev-parse HEAD)"
