name: matrix-trusted-base-gate

on:
  push:
    branches:
      - fix/cex-v12-seq53-close-repository-gaps-20260904
    paths:
      - .github/workflows/matrix-trusted-pr-target.yml
      - scripts/trusted-matrix-pr-target.sh
      - config/trusted-matrix-candidate.json

permissions:
  contents: read

concurrency:
  group: matrix-trusted-base-gate
  cancel-in-progress: true

jobs:
  trusted-isolated-matrix:
    runs-on:
      - self-hosted
      - linux
      - x64
      - rog
    timeout-minutes: 120
    steps:
      - name: Prepare sealed checkout paths
        shell: bash
        env:
          TRUSTED_HOME: ${{ runner.temp }}/cex-trusted-home-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          set +x
          mkdir -p "$TRUSTED_HOME"
          chmod 700 "$TRUSTED_HOME"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          for name in ("trusted", "candidate"):
              path = root / name
              try:
                  path.lstat()
              except FileNotFoundError:
                  continue
              if path.is_symlink() or not path.is_dir():
                  path.unlink()
              else:
                  shutil.rmtree(path)
          PY

      - name: Checkout immutable trusted base revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true
          set-safe-directory: false
          path: trusted

      - name: Validate base-owned candidate allowlist
        id: candidate
        working-directory: trusted
        shell: bash
        run: |
          set -euo pipefail
          set +x
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys
          data = json.loads(Path("config/trusted-matrix-candidate.json").read_text(encoding="utf-8"))
          expected_keys = {
              "schema", "repository", "ref", "sha", "pull_request",
              "production_authorization"
          }
          if set(data) != expected_keys:
              raise SystemExit("candidate allowlist has an unexpected field set")
          if data["schema"] != "cex.trusted-matrix-candidate.v1":
              raise SystemExit("candidate allowlist schema mismatch")
          if data["repository"] != "TrillionniumFoundation/CEX":
              raise SystemExit("candidate repository mismatch")
          if data["ref"] != "fix/cex-v12-audit-remediation-20260905":
              raise SystemExit("candidate branch mismatch")
          if not isinstance(data["sha"], str) or not re.fullmatch(r"[0-9a-f]{40}", data["sha"]):
              raise SystemExit("candidate SHA is invalid")
          if data["pull_request"] != 30:
              raise SystemExit("candidate PR mismatch")
          if data["production_authorization"] != "not_granted":
              raise SystemExit("candidate allowlist may not grant production authority")
          with Path(sys.argv[1]).open("a", encoding="utf-8") as stream:
              stream.write(f"candidate_sha={data['sha']}\n")
              stream.write(f"candidate_ref={data['ref']}\n")
              stream.write(f"pr_number={data['pull_request']}\n")
          PY

      - name: Checkout allowlisted candidate as untrusted data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true
          set-safe-directory: false
          path: candidate

      - name: Execute candidate only inside trusted isolation
        working-directory: trusted
        env:
          HOME: ${{ runner.temp }}/cex-trusted-home-${{ github.run_id }}-${{ github.run_attempt }}
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          TRUSTED_BASE_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          CANDIDATE_REPOSITORY: TrillionniumFoundation/CEX
          CANDIDATE_REF: ${{ steps.candidate.outputs.candidate_ref }}
          BASE_REF: fix/cex-v12-seq53-close-repository-gaps-20260904
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
        run: bash scripts/trusted-matrix-pr-target.sh "$GITHUB_WORKSPACE/candidate"

      - name: Retain base-bound diagnostics including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-trusted-matrix-base-${{ steps.candidate.outputs.pr_number }}-${{ steps.candidate.outputs.candidate_sha }}-attempt-${{ github.run_attempt }}
          path: trusted/run/trusted-matrix-base-gate/
          if-no-files-found: error
          retention-days: 14

# This workflow and the candidate allowlist are owned by the PR base branch.
# Candidate-controlled workflows cannot schedule this ROG job. Candidate bytes
# execute only inside the no-credential/no-Docker-socket container boundary.
# The artifact is supporting diagnostic evidence, never production authority.
