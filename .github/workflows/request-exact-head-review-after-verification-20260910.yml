name: request-exact-head-review-after-verification-20260910

on:
  push:
    branches:
      - verify/cex-current-full-20260910

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: request-exact-head-review-after-verification-20260910
  cancel-in-progress: false

jobs:
  request_review:
    name: cex/request-independent-exact-head-review
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: integration/cex-v12-sequence54-20260908
      VERIFIED_BRANCH: verified/cex-current-full-20260910
      PULL_REQUEST: '53'
    steps:
      - name: Wait for current verified ref without accepting drift
        shell: bash
        run: |
          set -euo pipefail
          remote=https://github.com/${GITHUB_REPOSITORY}.git
          for attempt in $(seq 1 80); do
            target="$(git ls-remote "$remote" refs/heads/${TARGET_BRANCH} | cut -f1)"
            verified="$(git ls-remote "$remote" refs/heads/${VERIFIED_BRANCH} | cut -f1)"
            if [ -n "$target" ] && [ "$verified" = "$target" ]; then
              printf '%s\n' "$target" > "$RUNNER_TEMP/exact-head"
              printf 'CEX_EXACT_VERIFIED_HEAD=%s\n' "$target"
              exit 0
            fi
            sleep 30
          done
          echo 'verified ref did not converge to the current target head' >&2
          exit 1

      - name: Verify PR binding and request eligible reviewers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exact="$(cat "$RUNNER_TEMP/exact-head")"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/pulls/${PULL_REQUEST}" > "$RUNNER_TEMP/pr.json"
          python3 - "$RUNNER_TEMP/pr.json" "$exact" <<'PY'
          import json
          import sys
          pr = json.load(open(sys.argv[1], encoding="utf-8"))
          assert pr["state"] == "open"
          assert pr["draft"] is True
          assert pr["head"]["sha"] == sys.argv[2]
          assert pr["merged"] is False
          print("CEX_PR_EXACT_HEAD_BINDING=PASS")
          PY
          curl --fail --silent --show-error --location \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/pulls/${PULL_REQUEST}/requested_reviewers" \
            --data '{"reviewers":["Tomasrgbsf","Franksudoman"]}' \
            > "$RUNNER_TEMP/reviewers.json"
          python3 - "$RUNNER_TEMP/reviewers.json" "$exact" <<'PY'
          import json
          import sys
          pr = json.load(open(sys.argv[1], encoding="utf-8"))
          requested = {item["login"] for item in pr.get("requested_reviewers", [])}
          assert "Tomasrgbsf" in requested
          assert pr["head"]["sha"] == sys.argv[2]
          print("CEX_INDEPENDENT_REVIEW_REQUESTED=PASS", sorted(requested))
          print("INDEPENDENT_APPROVAL=false")
          print("PRODUCTION_AUTHORIZATION=not_granted")
          PY
