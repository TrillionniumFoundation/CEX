name: world-settlement-source-export

on:
  workflow_dispatch:
  push:
    branches:
      - ci/world-settlement-gap-closure-v1
    paths:
      - '.github/workflows/world-settlement-source-export.yml'

permissions:
  contents: read

jobs:
  export-exact-world-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
      WORLD_COMMIT: ee881a0fec0f40091eaeba67c667ea82ff9d440a
      WORLD_TREE: ed4610ee910b835fb23833de5e12fe2cca16544b
    steps:
      - name: Checkout exact World candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ env.WORLD_REPOSITORY }}
          ref: ${{ env.WORLD_COMMIT }}
          path: world
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact World commit and tree
        working-directory: world
        run: |
          test "$(git rev-parse HEAD)" = "${WORLD_COMMIT}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${WORLD_TREE}"
      - name: Export source and exact contexts
        run: |
          mkdir -p export
          cp world/trillionnium/crates/trnm-game-server/src/lib.rs export/lib.rs
          cp world/trillionnium/crates/trnm-game-server/src/settlement_worker.rs export/settlement_worker.rs
          cp world/trillionnium/crates/trnm-game-server/migrations/0016_online_settlement_outbox_v1.sql export/
          cp world/trillionnium/crates/trnm-game-server/migrations/0017_online_settlement_worker_runtime_v1.sql export/
          grep -n -C 24 'reconcile_economy(&state.cex' export/lib.rs > export/legacy-reconcile-context.txt
          grep -n -C 20 'MIGRATION_V15' export/lib.rs > export/migration-context.txt
          grep -n -C 20 'settle_pending_matches' export/lib.rs > export/settle-call-context.txt
          sha256sum export/* | sort > export/SHA256SUMS
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = {
              'schema': 'trnm_world_settlement_source_export_v1',
              'repository': 'TrillionniumFoundation/Trillionnium-World',
              'commit': 'ee881a0fec0f40091eaeba67c667ea82ff9d440a',
              'tree': 'ed4610ee910b835fb23833de5e12fe2cca16544b',
              'files': sorted(path.name for path in Path('export').iterdir()),
          }
          Path('export/manifest.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
      - name: Upload exact source export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-world-settlement-source-ee881a0fec0f40091eaeba67c667ea82ff9d440a
          path: export/
          if-no-files-found: error
          retention-days: 7
