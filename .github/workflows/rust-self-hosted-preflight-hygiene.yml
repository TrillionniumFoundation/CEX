name: rust-self-hosted-preflight-hygiene

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for running the bounded self-hosted preflight
        required: false
        default: operator-check
        type: string

permissions:
  contents: read

concurrency:
  group: rust-self-hosted-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.98.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  preflight:
    name: rust-self-hosted-preflight-hygiene
    runs-on: [self-hosted, linux, x64, rog]
    timeout-minutes: 30
    steps:
      - name: Enforce trusted manual invocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/heads/fix/* ]]
          test -n "$RUNNER_NAME"

      - name: Clean bounded workspace state
        shell: bash
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          mkdir -p "$RUNNER_TEMP/cex-self-hosted-cargo-home" "$RUNNER_TEMP/cex-self-hosted-target"

      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup override set "$RUST_TOOLCHAIN"
          test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"

      - name: Verify repository and host hygiene
        shell: bash
        env:
          CARGO_HOME: ${{ runner.temp }}/cex-self-hosted-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/cex-self-hosted-target
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          rustc --version --verbose
          cargo --version --verbose
          python3 scripts/check-rust-toolchain-convergence.py
          python3 scripts/check-p0-release-candidate-hygiene.py
          python3 scripts/check-source-governance.py
          cargo metadata --locked --format-version 1 >/dev/null
          cargo fmt --all -- --check
