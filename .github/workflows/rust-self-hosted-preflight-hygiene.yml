name: rust-self-hosted-preflight-hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 1'

permissions:
  contents: read

concurrency:
  group: rust-self-hosted-preflight-hygiene
  cancel-in-progress: false

jobs:
  runner-hygiene:
    runs-on:
      - self-hosted
      - windows
      - x64
      - cex-full-gate
    timeout-minutes: 30
    env:
      ARTIFACT_ROOT: ci-artifacts\self-hosted-preflight-hygiene
      RUST_TOOLCHAIN: '1.98.1'
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Verify exact compiler and Cargo identity
        run: python .\scripts\check-rust-toolchain-convergence.py --verify-installed

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Prepare artifact directory
        run: New-Item -ItemType Directory -Force -Path $env:ARTIFACT_ROOT | Out-Null

      - name: Record hygiene workflow context
        run: |
          @(
            "event_name=${{ github.event_name }}"
            "ref=${{ github.ref }}"
            "sha=${{ github.sha }}"
            "workflow=rust-self-hosted-preflight-hygiene"
            "schedule_utc=15 2 * * 1"
            "rust_toolchain=1.98.1"
          ) | Set-Content -LiteralPath (Join-Path $env:ARTIFACT_ROOT 'hygiene-context.txt') -Encoding UTF8

      - name: Run self-hosted preflight
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\self-hosted-runner-preflight.ps1 -BootstrapEnv *>&1 |
            Tee-Object -FilePath (Join-Path $env:ARTIFACT_ROOT 'preflight-output.txt')
          exit $LASTEXITCODE

      - name: Mark gate as intentionally skipped
        if: ${{ always() }}
        run: |
          Set-Content -LiteralPath (Join-Path $env:ARTIFACT_ROOT 'gate-output.txt') -Value 'gate skipped intentionally; this workflow only runs periodic self-hosted preflight hygiene' -Encoding UTF8

      - name: Collect hygiene artifacts
        if: ${{ always() }}
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\collect-self-hosted-artifacts.ps1 -OutputDir $env:ARTIFACT_ROOT

      - name: Upload hygiene artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-self-hosted-preflight-hygiene-${{ github.run_id }}
          path: ci-artifacts/self-hosted-preflight-hygiene
          if-no-files-found: warn
          retention-days: 21
