name: seq44-exact-sha-convergence

on:
  workflow_run:
    workflows:
      - p0-migration-gate
      - rust-service-gate
      - p0-gateway-exact-reserve-gate
      - p0-execution-settlement-gate
      - p0-provider-reconciliation-gate
      - trnm-economy-ci
      - p0-release-candidate-gate
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: seq44-exact-sha-convergence-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  converge:
    if: github.event.workflow_run.head_branch == 'automation/seq44-residual-gap-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE_BRANCH: automation/seq44-residual-gap-closure
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      REQUIRED_PATHS: >-
        .github/workflows/p0-migration-gate.yml
        .github/workflows/rust-service-gate.yml
        .github/workflows/p0-gateway-exact-reserve-gate.yml
        .github/workflows/p0-execution-settlement-gate.yml
        .github/workflows/p0-provider-reconciliation-gate.yml
        .github/workflows/trnm-economy-ci.yml
        .github/workflows/p0-release-candidate-gate.yml
    steps:
      - name: Require all exact-SHA authoritative successes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ["CANDIDATE_BRANCH"]
          sha = os.environ["CANDIDATE_SHA"]
          required = os.environ["REQUIRED_PATHS"].split()

          def get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "cex-seq44-convergence",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          params = urllib.parse.urlencode(
              {"head_sha": sha, "branch": branch, "per_page": 100, "page": 1}
          )
          payload = get(f"https://api.github.com/repos/{repository}/actions/runs?{params}")
          runs = payload.get("workflow_runs")
          if not isinstance(runs, list):
              raise SystemExit("Actions response lacks workflow_runs")

          def key(run):
              return (
                  str(run.get("created_at") or ""),
                  int(run.get("run_attempt") or 0),
                  int(run.get("id") or 0),
              )

          waiting = []
          failures = []
          selected = {}
          for path in required:
              candidates = [
                  run for run in runs
                  if run.get("path") == path
                  and run.get("head_sha") == sha
                  and run.get("head_branch") == branch
                  and run.get("event") in {"push", "workflow_dispatch"}
              ]
              if not candidates:
                  waiting.append(path + ":missing")
                  continue
              run = max(candidates, key=key)
              status = str(run.get("status") or "unknown")
              conclusion = str(run.get("conclusion") or "unknown")
              selected[path] = {
                  "id": run.get("id"),
                  "attempt": run.get("run_attempt"),
                  "status": status,
                  "conclusion": conclusion,
              }
              if status != "completed":
                  waiting.append(path + ":" + status)
              elif conclusion != "success":
                  failures.append(path + ":" + conclusion)

          print(json.dumps({"sha": sha, "selected": selected, "waiting": waiting, "failures": failures}, indent=2, sort_keys=True))
          if failures:
              raise SystemExit("exact-SHA qualification failed: " + ", ".join(failures))
          if waiting:
              print("qualification not complete; a later workflow_run event will retry")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("ready=false\n")
              raise SystemExit(0)

          encoded = urllib.parse.quote(branch, safe="")
          ref = get(f"https://api.github.com/repos/{repository}/branches/{encoded}")
          branch_sha = ref.get("commit", {}).get("sha")
          if branch_sha != sha:
              raise SystemExit(
                  f"candidate branch moved after qualification: expected={sha} actual={branch_sha}"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("ready=true\n")
          PY
        id: qualification

      - name: Checkout immutable qualified candidate
        if: steps.qualification.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify candidate authority and converge main to the exact SHA
        if: steps.qualification.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("docs/release-evidence/p0-candidate-trigger.json").read_text(encoding="utf-8"))
          if value.get("sequence") != 44:
              raise SystemExit("candidate trigger is not sequence 44")
          if value.get("production_authorization") != "not_granted":
              raise SystemExit("candidate trigger grants production authorization")
          PY
          git fetch --no-tags origin main
          git merge-base --is-ancestor 331fef3a57c68e4f774291c3022c8ff2fba6cff6 HEAD
          observed_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$observed_main" =~ ^[0-9a-f]{40}$ ]]
          git push --force-with-lease="refs/heads/main:${observed_main}" origin HEAD:refs/heads/main
          echo "main converged to exact qualified candidate $CANDIDATE_SHA"
