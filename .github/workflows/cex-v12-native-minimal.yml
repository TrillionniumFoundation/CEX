name: cex-v12-native-minimal

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cex-v12-native-minimal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: '1.98.1'
  EXPECTED_RUST_RELEASE_COMMIT: '48a229ceaefd4985c50990b14116b6d856af0985'
  EXPECTED_PREVIOUS_POLICY_BLOB: '3c68853d4de6891140290e933f8495e82aeddad7'
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'

jobs:
  qualify:
    name: cex-v12/native-minimal-required
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      MERGE_SHA: ${{ github.sha }}
      GH_READ_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch and verify exact CEX head and prospective merge
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_SHA"
          test -n "$BASE_SHA"
          test -n "$MERGE_SHA"
          test -n "$GH_READ_TOKEN"
          auth_payload="$(printf 'x-access-token:%s' "$GH_READ_TOKEN" | base64 -w0)"
          auth="AUTHORIZATION: basic $auth_payload"
          head_dir="$RUNNER_TEMP/cex-head"
          merge_dir="$RUNNER_TEMP/cex-merge"
          rm -rf "$head_dir" "$merge_dir"
          git init "$head_dir"
          git -C "$head_dir" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$head_dir" -c http.extraheader="$auth" fetch --no-tags origin "$SOURCE_SHA"
          git -C "$head_dir" checkout --detach FETCH_HEAD
          git init "$merge_dir"
          git -C "$merge_dir" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if test "$GITHUB_EVENT_NAME" = pull_request; then
            git -C "$merge_dir" -c http.extraheader="$auth" fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/merge"
          else
            git -C "$merge_dir" -c http.extraheader="$auth" fetch --no-tags origin "$MERGE_SHA"
          fi
          unset GH_READ_TOKEN auth auth_payload
          git -C "$merge_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$head_dir" rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C "$merge_dir" rev-parse HEAD)" = "$MERGE_SHA"
          if test "$GITHUB_EVENT_NAME" = pull_request; then
            test "$(git -C "$merge_dir" rev-parse HEAD^1)" = "$BASE_SHA"
            test "$(git -C "$merge_dir" rev-parse HEAD^2)" = "$SOURCE_SHA"
          fi
          test "$(git -C "$head_dir" cat-file -t "$EXPECTED_PREVIOUS_POLICY_BLOB")" = blob
          test "$(git -C "$merge_dir" cat-file -t "$EXPECTED_PREVIOUS_POLICY_BLOB")" = blob
          test -z "$(git -C "$head_dir" status --porcelain=v1 --untracked-files=no)"
          test -z "$(git -C "$merge_dir" status --porcelain=v1 --untracked-files=no)"
          printf 'source=%s\n' "$SOURCE_SHA"
          printf 'source_tree=%s\n' "$(git -C "$head_dir" rev-parse HEAD^{tree})"
          printf 'merge=%s\n' "$MERGE_SHA"
          printf 'merge_tree=%s\n' "$(git -C "$merge_dir" rev-parse HEAD^{tree})"
          printf 'merge_parents=%s\n' "$(git -C "$merge_dir" show -s --format=%P HEAD)"

      - name: Install pinned toolchain and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          unset GH_READ_TOKEN
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang cmake libpq-dev libssl-dev \
            perl pkg-config protobuf-compiler
          rustc --version --verbose | tee "$RUNNER_TEMP/cex-rustc-version.txt"
          grep -Fx "commit-hash: $EXPECTED_RUST_RELEASE_COMMIT" "$RUNNER_TEMP/cex-rustc-version.txt"
          cargo --version --verbose
          rustfmt --version

      - name: Install pinned advisory tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Verify pinned advisory tool identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(cargo-audit --version | awk '{print $2}')" = '0.22.2'
          test "$(cargo-deny --version | awk '{print $2}')" = '0.20.2'

      - name: Qualify exact head source
        id: head
        continue-on-error: true
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cex-target-head
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cex-head"
          python3 scripts/check-sequence54-integration.py
          python3 scripts/check-sequence54-rustsec-admission.py
          python3 scripts/check-rust-toolchain-convergence.py
          if ! python3 scripts/check-rust-advisory-exceptions.py >/tmp/cex-head-advisory.json; then
            cat /tmp/cex-head-advisory.json
            exit 1
          fi
          python3 scripts/check-development-docs.py
          python3 scripts/check-module-documentation.py
          bash services/paper-raid-bff/scripts/check-boundaries.sh
          cargo metadata --locked --format-version 1 >/tmp/cex-head-metadata.json
          test -s /tmp/cex-head-metadata.json
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Qualify actual prospective merge source
        id: merge
        continue-on-error: true
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cex-target-merge
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cex-merge"
          python3 scripts/check-sequence54-integration.py
          python3 scripts/check-sequence54-rustsec-admission.py
          python3 scripts/check-rust-toolchain-convergence.py
          if ! python3 scripts/check-rust-advisory-exceptions.py >/tmp/cex-merge-advisory.json; then
            cat /tmp/cex-merge-advisory.json
            exit 1
          fi
          python3 scripts/check-development-docs.py
          python3 scripts/check-module-documentation.py
          bash services/paper-raid-bff/scripts/check-boundaries.sh
          cargo metadata --locked --format-version 1 >/tmp/cex-merge-metadata.json
          test -s /tmp/cex-merge-metadata.json
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Enforce both exact objects
        if: always()
        shell: bash
        env:
          HEAD_OUTCOME: ${{ steps.head.outcome }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
        run: |
          set -euo pipefail
          printf 'repository=%s\n' "$GITHUB_REPOSITORY"
          printf 'source=%s\n' "$SOURCE_SHA"
          printf 'base=%s\n' "$BASE_SHA"
          printf 'merge=%s\n' "$MERGE_SHA"
          printf 'head_outcome=%s\n' "$HEAD_OUTCOME"
          printf 'merge_outcome=%s\n' "$MERGE_OUTCOME"
          printf 'production_authorization=not_granted\n'
          test "$HEAD_OUTCOME" = success
          test "$MERGE_OUTCOME" = success
          printf 'CEX_V12_NATIVE_MINIMAL=PASS\n'
