name: world-settlement-external-evidence

on:
  workflow_dispatch:
  push:
    branches:
      - ci/world-settlement-capture-boundary-v1
    paths:
      - '.github/workflows/world-settlement-external-evidence.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/world-settlement-external-evidence.yml'

permissions:
  contents: read

concurrency:
  group: world-settlement-external-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_COMMIT: 7861e141ee322b6f765f7c6776a903d14d2ef187
  WORLD_TREE: 2ef9be052234ea13292aece4a7e324e430e1181e
  CEX_OWNER_REPOSITORY: TrillionniumFoundation/CEX
  CEX_OWNER_COMMIT: ea2a257b45df63182e6a58f8265b8edb9154ec89
  CEX_OWNER_TREE: 9dddb54c9e9cd2ab4e87fd170a17547518f53225
  TRNM_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/world_settlement
  TRNM_REQUIRE_SETTLEMENT_DATABASE_TEST: '1'
  TRNM_CEX_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/world_settlement
  TRNM_REQUIRE_CEX_SETTLEMENT_DATABASE_TEST: '1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'

jobs:
  exact-world-cex-contracts:
    name: world-settlement-external/exact-gap-closure
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: world_settlement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_settlement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout evidence definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Checkout exact World candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.WORLD_REPOSITORY }}
          ref: ${{ env.WORLD_COMMIT }}
          path: world
          persist-credentials: false
      - name: Checkout exact CEX owner candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.CEX_OWNER_REPOSITORY }}
          ref: ${{ env.CEX_OWNER_COMMIT }}
          path: cex-owner
          persist-credentials: false
      - name: Verify exact commits and trees
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C world rev-parse HEAD)" = "$WORLD_COMMIT"
          test "$(git -C world rev-parse 'HEAD^{tree}')" = "$WORLD_TREE"
          test "$(git -C cex-owner rev-parse HEAD)" = "$CEX_OWNER_COMMIT"
          test "$(git -C cex-owner rev-parse 'HEAD^{tree}')" = "$CEX_OWNER_TREE"
          git -C world diff --exit-code
          git -C cex-owner diff --exit-code
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose
      - name: Enforce World source and overclaim boundaries
        working-directory: world
        run: |
          python3 -m py_compile \
            scripts/check-trnm-settlement-runtime-status.py \
            scripts/test-trnm-settlement-runtime-status-negative.py \
            scripts/check-world-main-governance.py
          python3 -m json.tool docs/status/settlement-runtime-v1.json > /dev/null
          python3 -m json.tool docs/status/world-main-governance-v1.json > /dev/null
          python3 scripts/check-trnm-settlement-runtime-status.py
          python3 scripts/test-trnm-settlement-runtime-status-negative.py
          python3 scripts/check-world-main-governance.py
          bash -n scripts/check-trnm-settlement-transaction-boundary.sh
          bash -n scripts/check_trnm_settlement_transaction_boundary.sh
          bash scripts/check-trnm-settlement-transaction-boundary.sh
          bash scripts/check_trnm_settlement_transaction_boundary.sh
      - name: Enforce exact World-to-CEX compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          world = Path('world/trillionnium/crates/trnm-game-server/src/cex.rs').read_text(encoding='utf-8')
          cex = Path('cex-owner/services/trnm-economy-service/src/api.rs').read_text(encoding='utf-8')
          contract = Path('cex-owner/services/trnm-economy-service/src/contract.rs').read_text(encoding='utf-8')
          for marker in ('/v1/trnm/economy/receipts/by-intent', 'x-trnm-intent-sha256'):
              if marker not in world or marker not in cex:
                  raise SystemExit(f'cross-repository marker missing: {marker}')
          for marker in ('/v1/trnm/economy/intents', 'intent_hash_conflict', 'wrong_game_authority_audience'):
              if marker not in cex:
                  raise SystemExit(f'CEX owner marker missing: {marker}')
          for marker in ('TERM_EXCHANGE_PROTOCOL_VERSION', 'stable_receipt_id', 'serialized_intent_hash'):
              if marker not in contract:
                  raise SystemExit(f'CEX durable marker missing: {marker}')
          print('World-to-CEX exact source compatibility: PASS')
          PY
      - name: Validate exact CEX owner source
        working-directory: cex-owner
        run: |
          python3 scripts/check-trnm-economy-settlement-contract.py
          python3 scripts/test-trnm-economy-settlement-status-negative.py
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo fmt -p trnm-economy-service -- --check
          cargo test -p trnm-economy-service --all-targets --locked
          cargo clippy -p trnm-economy-service --all-targets --locked -- -D warnings
      - name: Resolve and format exact World workspace
        working-directory: world/trillionnium
        run: |
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo fmt --all -- --check
      - name: Run World settlement unit and ownership contracts
        working-directory: world/trillionnium
        run: |
          cargo test -p trnm-game-server --lib --locked
          cargo test -p trnm-game-server --bin trnm-entitlement-signer --locked
          cargo test -p trnm-game-server --test settlement_game_server_boundary --locked
          cargo test -p trnm-game-server --test settlement_remote_identity_contract --locked
          cargo test -p trnm-game-server --test settlement_worker_contract --locked
          cargo test -p trnm-game-server --test settlement_fault_model --locked
      - name: Run World PostgreSQL settlement contracts
        working-directory: world/trillionnium
        run: |
          cargo test -p trnm-game-server --test settlement_capture_commit_boundary --locked
          cargo test -p trnm-game-server --test settlement_database_contract --locked
          cargo test -p trnm-game-server --test settlement_serialization_database --locked
          cargo test -p trnm-game-server --test settlement_operator_controls_database --locked
      - name: Strict lint for complete World settlement target
        working-directory: world/trillionnium
        run: cargo clippy -p trnm-game-server --all-targets --locked -- -D warnings
      - name: Write exact cross-repository evidence
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          payload = {
              'schema': 'trnm_world_cex_settlement_external_ci_evidence_v2',
              'world': {
                  'repository': os.environ['WORLD_REPOSITORY'],
                  'commit': os.environ['WORLD_COMMIT'],
                  'tree': os.environ['WORLD_TREE'],
              },
              'cex_owner': {
                  'repository': os.environ['CEX_OWNER_REPOSITORY'],
                  'commit': os.environ['CEX_OWNER_COMMIT'],
                  'tree': os.environ['CEX_OWNER_TREE'],
              },
              'evidence_repository': os.environ['GITHUB_REPOSITORY'],
              'workflow': os.environ['GITHUB_WORKFLOW'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'runner_os': os.environ['RUNNER_OS'],
              'postgres_image': 'postgres:16.4-alpine',
              'rust_toolchain': '1.98.0',
              'checks': [
                  'world fail-closed source and status contracts',
                  'world governance source projection',
                  'exact World-to-CEX compatibility',
                  'CEX owner static and negative contracts',
                  'CEX owner PostgreSQL Rust tests and Clippy',
                  'World package-wide rustfmt',
                  'World generated ownership, signer, identity, worker and fault tests',
                  'World capture, lease, serialization and operator PostgreSQL tests',
                  'World all-target Clippy',
              ],
              'native_world_actions_run': False,
              'promotion_effect': 'none',
              'limitations': [
                  'external CI is not a native Trillionnium-World workflow run',
                  'source and PostgreSQL tests are not deployment evidence',
                  'CEX and World pull requests remain unmerged candidates',
                  'main ruleset and independent reviewer evidence remain required',
                  'no trusted settlement, public online, public market, custody, or commercial release credit',
              ],
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['evidence_payload_sha256'] = hashlib.sha256(canonical).hexdigest()
          Path('evidence/world-cex-settlement-external-evidence.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          python3 -m json.tool evidence/world-cex-settlement-external-evidence.json > /dev/null
          sha256sum evidence/world-cex-settlement-external-evidence.json > evidence/SHA256SUMS
      - name: Upload exact cross-repository evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-cex-settlement-${{ env.WORLD_COMMIT }}-${{ env.CEX_OWNER_COMMIT }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
