name: world-settlement-external-evidence

on:
  workflow_dispatch:
    inputs:
      cex_sha:
        description: Exact CEX candidate SHA
        required: true
        type: string
      world_sha:
        description: Exact Trillionnium-World candidate SHA
        required: true
        type: string
      world_tree:
        description: Expected Trillionnium-World tree SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: world-settlement-external-${{ inputs.cex_sha }}-${{ inputs.world_sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_TOOLCHAIN: '1.98.1'
  WORLD_SOURCE_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  CEX_SOURCE_SHA: ${{ inputs.cex_sha }}
  WORLD_SOURCE_SHA: ${{ inputs.world_sha }}
  WORLD_SOURCE_TREE: ${{ inputs.world_tree }}
  POSTGRES_IMAGE_REF: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
  TRNM_WORLD_POSTGRES_CLIENT_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: postgres
  TRNM_WORLD_MAINTENANCE_DB: postgres

jobs:
  world-settlement-external-evidence:
    name: world-settlement-external-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Validate exact input identities
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CEX_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORLD_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORLD_SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact CEX candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CEX_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact World candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.WORLD_SOURCE_REPOSITORY }}
          ref: ${{ env.WORLD_SOURCE_SHA }}
          path: .world-source
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Verify immutable source and environment identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CEX_SOURCE_SHA"
          test "$(git -C .world-source rev-parse HEAD)" = "$WORLD_SOURCE_SHA"
          test "$(git -C .world-source rev-parse 'HEAD^{tree}')" = "$WORLD_SOURCE_TREE"
          test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C .world-source status --porcelain)"
          mkdir -p run/world-settlement-external
          rustc --version --verbose | tee run/world-settlement-external/rustc-version.txt
          cargo --version --verbose | tee run/world-settlement-external/cargo-version.txt
          docker image inspect "$POSTGRES_IMAGE_REF" >/dev/null 2>&1 || docker pull "$POSTGRES_IMAGE_REF" >/dev/null
          docker image inspect "$POSTGRES_IMAGE_REF" > run/world-settlement-external/postgres-image.json
          docker run --rm "$POSTGRES_IMAGE_REF" postgres --version \
            | tee run/world-settlement-external/postgres-version.txt

      - name: Qualify CEX exact settlement and World authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-rust-toolchain-convergence.py
          python3 scripts/check-authoritative-money-isolation.py
          python3 scripts/check-project-boundary.py
          python3 scripts/check-project-boundary-cargo-closure.py
          python3 scripts/check-trnm-economy-settlement-contract.py
          bash scripts/check-world-authority-cutover.sh \
            | tee run/world-settlement-external/cex-world-cutover.log

      - name: Exercise World PostgreSQL state machine and installation protocol
        shell: bash
        env:
          TRNM_WORLD_POSTGRES_EVIDENCE_DIR: ${{ github.workspace }}/run/world-settlement-external/postgres
        run: |
          set -euo pipefail
          bash .world-source/scripts/run-trnm-world-authority-postgres-check.sh \
            | tee run/world-settlement-external/world-postgres.log

      - name: Exercise cross-repository forwarding, outage and rollback
        shell: bash
        env:
          WORLD_AUTHORITY_EVIDENCE_DIR: ${{ github.workspace }}/run/world-settlement-external/http
        run: |
          set -euo pipefail
          bash scripts/check-world-authority-cross-repo-e2e.sh .world-source \
            | tee run/world-settlement-external/cross-repo-e2e.log

      - name: Record immutable external settlement evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/world-settlement-external
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path('run/world-settlement-external')
          def git(cwd, *args):
              return subprocess.run(['git', *args], cwd=cwd, check=True, text=True, stdout=subprocess.PIPE).stdout.strip()
          summary = {
              'schema': 'cex.world-settlement-external-evidence.v3',
              'status': 'execution_attempted',
              'cex_sha': git('.', 'rev-parse', 'HEAD'),
              'cex_tree': git('.', 'rev-parse', 'HEAD^{tree}'),
              'world_sha': git('.world-source', 'rev-parse', 'HEAD'),
              'world_tree': git('.world-source', 'rev-parse', 'HEAD^{tree}'),
              'rust_toolchain': os.environ['RUST_TOOLCHAIN'],
              'postgres_image': os.environ['POSTGRES_IMAGE_REF'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'runtime_data_backfill_reconciliation': 'not_claimed_by_source_gate',
              'deployment_no_dual_writer_proof': 'not_claimed_by_source_gate',
              'production_authorization': 'not_granted',
          }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          files = sorted(p for p in out.rglob('*') if p.is_file() and p.name != 'manifest.json')
          (out / 'manifest.json').write_text(json.dumps({
              'schema': 'cex.world-settlement-external-artifact-manifest.v3',
              'files': [{'path': p.relative_to(out).as_posix(), 'bytes': p.stat().st_size,
                         'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in files],
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload immutable external settlement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-world-settlement-external-${{ inputs.cex_sha }}-${{ inputs.world_sha }}-${{ github.run_attempt }}
          path: run/world-settlement-external/**
          if-no-files-found: error
          retention-days: 90
