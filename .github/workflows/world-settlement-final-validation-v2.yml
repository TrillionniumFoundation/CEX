name: world-settlement-final-validation-v2-superseded

on:
  workflow_dispatch:

permissions: {}

jobs:
  superseded-workflow-not-authoritative:
    name: superseded-workflow-not-authoritative
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report replacement authority
        shell: bash
        run: |
          cat <<'EOF'
          status=superseded
          replacement=.github/workflows/world-settlement-final-convergence-v3.yml
          evidence_transfer=forbidden
          production_authorization=not_granted
          EOF
