name: world-settlement-final-validation-v2

on:
  push:
    branches:
      - ci/world-settlement-final-convergence-v2
    paths:
      - .github/workflows/world-settlement-final-validation-v2.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: world-settlement-final-validation-v2
  cancel-in-progress: false

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_COMMIT: 1d4dee6d5add45a64f5c138f424e3bdab369ecd4
  WORLD_TREE: 955987798812dd631ee30e28bcc20581a8daa45a
  REMEDIATION_RUN_ID: "33245006693"
  REMEDIATION_ARTIFACT: world-settlement-final-convergence-1d4dee6d5add45a64f5c138f424e3bdab369ecd4
  REMEDIATION_ARTIFACT_DIGEST: sha256:41ebbff850697620f569d11462153160ef2e120ff2dee75fe784d01eb11a6758
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: "1"
  TRNM_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/world_settlement
  TRNM_REQUIRE_SETTLEMENT_DATABASE_TEST: "1"
  TRNM_CEX_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/world_settlement
  TRNM_REQUIRE_CEX_SETTLEMENT_DATABASE_TEST: "1"

jobs:
  validate:
    name: world-settlement-final-validation/full-target
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: world_settlement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_settlement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout exact World candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.WORLD_REPOSITORY }}
          ref: ${{ env.WORLD_COMMIT }}
          path: world
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact World identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C world rev-parse HEAD)" = "$WORLD_COMMIT"
          test "$(git -C world rev-parse 'HEAD^{tree}')" = "$WORLD_TREE"
          git -C world diff --exit-code

      - name: Download immutable remediation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf remediation
          gh run download "$REMEDIATION_RUN_ID" \
            --repo TrillionniumFoundation/CEX \
            --name "$REMEDIATION_ARTIFACT" \
            --dir remediation
          (cd remediation && sha256sum --check SHA256SUMS)
          grep -Fx 'candidate_head=1d4dee6d5add45a64f5c138f424e3bdab369ecd4' remediation/identity.txt
          grep -Fx 'candidate_tree=955987798812dd631ee30e28bcc20581a8daa45a' remediation/identity.txt

      - name: Apply only exact proven file bytes
        shell: bash
        run: |
          set -euo pipefail
          cp -a remediation/files/. world/
          cat > expected-files.txt <<'EOF'
          trillionnium/crates/trnm-game-server/build.rs
          trillionnium/crates/trnm-game-server/migrations/0018_online_settlement_operator_controls_v1.sql
          trillionnium/crates/trnm-game-server/src/cex.rs
          trillionnium/crates/trnm-game-server/tests/settlement_database_contract.rs
          trillionnium/crates/trnm-game-server/tests/settlement_operator_controls_database.rs
          EOF
          diff -u expected-files.txt remediation/changed-files.txt
          git -C world diff --name-only > actual-files.txt
          diff -u expected-files.txt actual-files.txt
          git -C world diff --check
          git -C world diff --binary --full-index > applied.patch
          cmp applied.patch remediation/remediation.patch

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Validate static settlement and governance boundaries
        working-directory: world
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-trnm-settlement-runtime-status.py
          python3 scripts/test-trnm-settlement-runtime-status-negative.py
          python3 scripts/check-world-main-governance.py
          bash scripts/check-trnm-settlement-transaction-boundary.sh
          bash scripts/check_trnm_settlement_transaction_boundary.sh

      - name: Validate locked workspace and formatting
        working-directory: world/trillionnium
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo fmt -p trnm-game-server -- --check

      - name: Run complete package and PostgreSQL matrix
        working-directory: world/trillionnium
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p trnm-game-server --all-targets --locked

      - name: Run strict complete-target lint
        working-directory: world/trillionnium
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy -p trnm-game-server --all-targets --locked -- -D warnings

      - name: Prove patch remained exact after validation
        shell: bash
        run: |
          set -euo pipefail
          git -C world diff --check
          git -C world diff --name-only > post-validation-files.txt
          diff -u expected-files.txt post-validation-files.txt
          git -C world diff --binary --full-index > post-validation.patch
          cmp remediation/remediation.patch post-validation.patch

      - name: Assemble validation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-evidence
          cp remediation/SHA256SUMS remediation/identity.txt remediation/changed-files.txt \
            remediation/remediation.patch validation-evidence/
          printf '%s\n' \
            "status=${{ job.status }}" \
            "world_repository=$WORLD_REPOSITORY" \
            "world_commit=$WORLD_COMMIT" \
            "world_tree=$WORLD_TREE" \
            "remediation_run_id=$REMEDIATION_RUN_ID" \
            "remediation_artifact=$REMEDIATION_ARTIFACT" \
            "remediation_artifact_digest=$REMEDIATION_ARTIFACT_DIGEST" \
            "validation_repository=$GITHUB_REPOSITORY" \
            "validation_commit=$GITHUB_SHA" \
            "validation_run_id=$GITHUB_RUN_ID" \
            "validation_run_attempt=$GITHUB_RUN_ATTEMPT" \
            "rust_toolchain=1.98.0" \
            "postgres=16.4-alpine" \
            > validation-evidence/validation-identity.txt
          (
            cd validation-evidence
            find . -type f ! -name VALIDATION_SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > VALIDATION_SHA256SUMS
            sha256sum --check VALIDATION_SHA256SUMS
          )

      - name: Upload exact validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-settlement-final-validation-${{ env.WORLD_COMMIT }}
          path: validation-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
