name: sequence54-round5-adaptive

on:
  workflow_dispatch:
    inputs:
      master_run_id:
        description: Failed round-4 master run to inspect
        required: false
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: sequence54-round5-adaptive
  cancel-in-progress: false

env:
  TARGET_BRANCH: integration/cex-v12-sequence54-20260908
  PULL_REQUEST_NUMBER: '53'
  EVIDENCE_DIR: ${{ runner.temp }}/sequence54-round5

jobs:
  adapt:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout adaptive controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Preserve controller and fetch prior evidence
        env:
          GH_TOKEN: ${{ github.token }}
          MASTER_RUN_ID: ${{ inputs.master_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cp scripts/sequence54_round3_remediate.py "$RUNNER_TEMP/remediate.py"
          if [[ -n "${MASTER_RUN_ID:-}" ]]; then
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${MASTER_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | startswith("sequence54-round4-master-")) | .id' | head -n1)"
            if [[ -n "$artifact_id" ]]; then
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$RUNNER_TEMP/prior.zip"
              mkdir -p "$EVIDENCE_DIR/prior"
              unzip -q "$RUNNER_TEMP/prior.zip" -d "$EVIDENCE_DIR/prior"
            fi
          fi

      - name: Checkout current PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply only deterministic source, generated and formatting repairs
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          printf '%s\n' "$before" > "$EVIDENCE_DIR/before-sha.txt"
          git config user.name 'Sequence 54 Adaptive Bot'
          git config user.email 'sequence54-adaptive@users.noreply.github.com'

          if ! grep -q 'def selector_binding_self_tests' scripts/rust_toolchain_convergence_v4.py; then
            python3 "$RUNNER_TEMP/remediate.py" "$GITHUB_WORKSPACE"
          fi

          set +e
          cargo fmt --all -- --check > "$EVIDENCE_DIR/cargo-fmt-before.log" 2>&1
          fmt_rc=$?
          set -e
          if [[ "$fmt_rc" -ne 0 ]]; then
            cargo fmt --all
          fi

          set +e
          python3 scripts/generate-repository-semantics.py --check > "$EVIDENCE_DIR/semantics-before.log" 2>&1
          semantics_rc=$?
          set -e
          if [[ "$semantics_rc" -ne 0 ]]; then
            python3 scripts/generate-repository-semantics.py
          fi

          git diff --check
          if ! git diff --quiet; then
            git add -A
            git commit -m 'fix(sequence54): apply deterministic adaptive convergence' \
              -m 'Scope: syntax-aware blocker repair, deterministic generated facts and rustfmt only.' \
              -m 'production-authorization: not_granted'
          fi

          candidate="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          printf '%s\n' "$candidate" > "$EVIDENCE_DIR/candidate-sha.txt"
          printf '%s\n' "$tree" > "$EVIDENCE_DIR/candidate-tree.txt"

          checks=(
            'python3 scripts/check-rust-toolchain-convergence.py'
            'python3 scripts/test-consumer-route-contract.py'
            'python3 scripts/check-consumer-projection-boundary.py'
            'python3 scripts/generate-repository-semantics.py --check'
            'python3 scripts/check-development-docs.py'
            'python3 scripts/check-module-documentation.py'
            'python3 scripts/check-sequence54-integration.py'
            'cargo fmt --all -- --check'
            'cargo metadata --locked --format-version 1'
            'cargo check --workspace --all-targets --locked'
          )
          overall=0
          index=0
          for command in "${checks[@]}"; do
            index=$((index + 1))
            log="$EVIDENCE_DIR/check-${index}.log"
            printf 'command=%s\n' "$command" > "$log"
            set +e
            bash -lc "$command" >> "$log" 2>&1
            rc=$?
            set -e
            printf 'exit_code=%s\n' "$rc" >> "$log"
            if [[ "$rc" -ne 0 ]]; then overall=1; fi
          done
          test "$overall" -eq 0

          if [[ "$candidate" != "$before" ]]; then
            git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}"
            test "$(git rev-parse FETCH_HEAD)" = "$before"
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          fi

      - name: Publish precise unresolved diagnostics without weakening gates
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EVIDENCE_DIR" <<'PY'
          from pathlib import Path
          import json, os, subprocess
          root = Path(__import__('sys').argv[1])
          failures = []
          for path in sorted(root.glob('check-*.log')):
              text = path.read_text(encoding='utf-8', errors='replace')
              if 'exit_code=0' not in text.splitlines()[-1:]:
                  failures.append({
                      'log': path.name,
                      'tail': '\n'.join(text.splitlines()[-40:])[-6000:],
                  })
          report = {
              'schema': 'cex.sequence54-round5-adaptive.v1',
              'head_sha': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'outcome': os.environ.get('REPAIR_OUTCOME'),
              'failures': failures,
              'gate_weakening_used': False,
              'production_authorization': 'not_granted',
          }
          (root / 'adaptive-report.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          body = '<!-- sequence54-round5-adaptive -->\n## Sequence 54 adaptive convergence\n\n'
          body += f"Outcome: `{report['outcome']}` on `{report['head_sha']}`.\n\n"
          if failures:
              body += 'Remaining deterministic failures:\n\n'
              for item in failures:
                  body += f"### `{item['log']}`\n```text\n{item['tail']}\n```\n\n"
          else:
              body += 'All adaptive local checks completed successfully. Exact-head hosted qualification and external authority remain separately required.\n'
          body += '\n`production_authorization=not_granted`\n'
          Path(root / 'comment.md').write_text(body)
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments" -f body="$(cat "$EVIDENCE_DIR/comment.md")"

      - name: Enforce adaptive qualification
        if: always()
        env:
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
        run: test "$REPAIR_OUTCOME" = success

      - name: Upload adaptive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sequence54-round5-adaptive-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
