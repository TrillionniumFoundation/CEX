name: sequence54-round4-p0-candidate-controller

on:
  push:
    branches:
      - work/sequence54-round2-staging-20260909
    paths:
      - '.github/workflows/sequence54-round4-p0-candidate-controller.yml'

permissions:
  contents: read
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: sequence54-round4-p0-candidate-controller
  cancel-in-progress: false

env:
  TARGET_BRANCH: integration/cex-v12-sequence54-20260908
  STAGING_BRANCH: work/sequence54-round2-staging-20260909
  PULL_REQUEST_NUMBER: '53'
  EVIDENCE_DIR: ${{ runner.temp }}/sequence54-round4-p0-candidate

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Wait for master exact-head families
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          encoded_branch="${STAGING_BRANCH//\//%2F}"
          master_id=''
          for _ in $(seq 1 80); do
            master_id="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/sequence54-round4-master-closure.yml/runs?branch=${encoded_branch}&per_page=20" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty' 2>/dev/null || true)"
            [[ -n "$master_id" ]] && break
            sleep 15
          done
          [[ -n "$master_id" ]]
          for _ in $(seq 1 960); do
            value="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${master_id}")"
            status="$(jq -r '.status' <<<"$value")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$value")"
            [[ "$status" == completed ]] && break
            sleep 15
          done
          printf 'master_id=%s\nstatus=%s\nconclusion=%s\n' "$master_id" "$status" "$conclusion" \
            > "$EVIDENCE_DIR/master.txt"
          [[ "$status" == completed && "$conclusion" == success ]]

      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: false

      - name: Dispatch or reuse exact-head P0 candidate qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          printf '%s\n' "$head" > "$EVIDENCE_DIR/head-sha.txt"
          printf '%s\n' "$tree" > "$EVIDENCE_DIR/head-tree.txt"
          workflow='p0-release-candidate-gate.yml'
          run_id="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=100" \
            --jq --arg sha "$head" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [[ -z "$run_id" ]]; then
            payload="$(jq -nc --arg ref "$TARGET_BRANCH" '{ref:$ref}')"
            http="$(curl -sS -o "$EVIDENCE_DIR/dispatch-response.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -d "$payload")"
            printf '%s\n' "$http" > "$EVIDENCE_DIR/dispatch-http.txt"
            [[ "$http" =~ ^20[14]$ ]]
            for _ in $(seq 1 80); do
              run_id="$(gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=100" \
                --jq --arg sha "$head" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | reverse | .[0].id // empty')"
              [[ -n "$run_id" ]] && break
              sleep 15
            done
          fi
          [[ -n "$run_id" ]]
          printf '%s\n' "$run_id" > "$EVIDENCE_DIR/run-id.txt"

          for _ in $(seq 1 1120); do
            value="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(jq -r '.status' <<<"$value")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$value")"
            [[ "$status" == completed ]] && break
            current="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/branches/${TARGET_BRANCH//\//%2F}" --jq '.commit.sha')"
            [[ "$current" == "$head" ]]
            sleep 15
          done
          printf 'status=%s\nconclusion=%s\n' "$status" "$conclusion" > "$EVIDENCE_DIR/run-status.txt"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
            > "$EVIDENCE_DIR/jobs.json"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            > "$EVIDENCE_DIR/artifacts.json"

          python3 - "$EVIDENCE_DIR" "$head" "$tree" "$run_id" "$status" "$conclusion" <<'PY'
          from pathlib import Path
          import json, sys
          root = Path(sys.argv[1])
          jobs = json.loads((root / 'jobs.json').read_text()).get('jobs', [])
          artifacts = json.loads((root / 'artifacts.json').read_text()).get('artifacts', [])
          nonempty = bool(jobs) and all(job.get('steps') for job in jobs)
          expected_artifacts = [
              item for item in artifacts
              if item.get('name', '').startswith('cex-p0-evidence-')
              or item.get('name', '').startswith('cex-p0-candidate-manifest-')
          ]
          ok = (
              sys.argv[5] == 'completed'
              and sys.argv[6] == 'success'
              and nonempty
              and len(expected_artifacts) >= 2
          )
          report = {
              'schema': 'cex.sequence54-round4-p0-candidate.v1',
              'head_sha': sys.argv[2],
              'head_tree': sys.argv[3],
              'run_id': int(sys.argv[4]),
              'status': sys.argv[5],
              'conclusion': sys.argv[6],
              'nonempty_jobs': nonempty,
              'candidate_artifacts': [
                  {'id': item.get('id'), 'name': item.get('name'), 'digest': item.get('digest')}
                  for item in expected_artifacts
              ],
              'repository_candidate_qualified': ok,
              'production_authorization': 'not_granted',
          }
          (root / 'p0-candidate.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          body = '\n'.join([
              '<!-- sequence54-round4-p0-candidate -->',
              '## Sequence 54 aggregate P0 candidate qualification',
              '',
              f"- Exact head: `{report['head_sha']}`",
              f"- Exact tree: `{report['head_tree']}`",
              f"- Run: `{report['run_id']}` → `{report['conclusion']}`",
              f"- Non-empty jobs: `{str(report['nonempty_jobs']).lower()}`",
              f"- Candidate evidence/manifest artifacts: `{len(report['candidate_artifacts'])}`",
              f"- Repository candidate qualified: `{str(report['repository_candidate_qualified']).lower()}`",
              '',
              'Repository qualification does not grant deployment, release, cutover or production authority. `production_authorization=not_granted` remains binding.',
          ]) + '\n'
          (root / 'comment.md').write_text(body)
          raise SystemExit(0 if ok else 1)
          PY

      - name: Publish aggregate candidate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ -f "$EVIDENCE_DIR/comment.md" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments" \
              -f body="$(cat "$EVIDENCE_DIR/comment.md")"
          fi

      - name: Upload aggregate candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sequence54-round4-p0-candidate-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
