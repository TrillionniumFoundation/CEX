name: seq39-normalization-repair-v2

on:
  push:
    branches:
      - automation/seq39-exact-apply
    paths:
      - '.github/workflows/seq39-normalization-repair-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seq39-normalization-repair-v2
  cancel-in-progress: false

env:
  DATABASE_URL: postgres://cex:cex_ci_password@127.0.0.1:5432/cex_ci
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cex
          POSTGRES_PASSWORD: cex_ci_password
          POSTGRES_DB: cex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cex -d cex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout exact automation payload
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust stable with format and lint
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Preserve lone CR and execute pinned sequence 39 validation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git hash-object .github/workflows/seq39-manifest-fixture-repair.yml)" == \
             "4dfa71166caf0c537da314fbf7db1a837fbad204" ]] || {
            echo "::error::sequence 39 repair workflow blob drifted"
            exit 1
          }

          python3 - <<'PYWRAP'
          from pathlib import Path

          workflow = Path('.github/workflows/seq39-manifest-fixture-repair.yml').read_text(
              encoding='utf-8'
          ).splitlines()
          marker = '        run: |'
          indices = [index for index, line in enumerate(workflow) if line == marker]
          if len(indices) != 1:
              raise SystemExit(f'expected one repair run block, got {len(indices)}')
          block = workflow[indices[0] + 1:]
          if not block or any(line and not line.startswith('          ') for line in block):
              raise SystemExit('repair run block indentation drifted')
          extracted = '\n'.join(
              line[10:] if line.startswith('          ') else '' for line in block
          ) + '\n'

          old = "normalization_seed = base64.b64decode('').decode('utf-8')"
          new = "normalization_seed = base64.b64decode('').decode('utf-8')"
          if extracted.count(old) != 1:
              raise SystemExit('lone-CR normalization anchor drifted')
          extracted = extracted.replace(old, new, 1)
          Path('/tmp/seq39-normalization-repair-v2.sh').write_text(
              extracted,
              encoding='utf-8',
          )
          PYWRAP

          bash /tmp/seq39-normalization-repair-v2.sh
