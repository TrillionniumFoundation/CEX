name: closure-patch-0082
on:
  push:
    branches: [feature/settlement-all-blockers-closure-v1]
    paths: [.github/workflows/closure-patch-0082.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/settlement-all-blockers-closure-v1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python3 scripts/patch-ledger-http-flow-v2.py
      - run: cargo fmt --all
      - run: git diff --check
      - run: cargo test -p ledger-service --test http_flow
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/ledger-service/tests/http_flow.rs
          git commit -m "test(ledger): move HTTP flow coverage to exact v2"
          git push origin HEAD:feature/settlement-all-blockers-closure-v1
