name: closure-patch-0082
on:
  push:
    branches: [feature/settlement-all-blockers-closure-v1]
    paths: [.github/workflows/closure-patch-0082.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/settlement-all-blockers-closure-v1
          fetch-depth: 0
      - run: python3 scripts/patch-p0-migration-account-fixture.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-p0-migrations-postgres.sh
          git commit -m "fix(ci): use exact Ledger v2 in migration fixture"
          git push origin HEAD:feature/settlement-all-blockers-closure-v1
