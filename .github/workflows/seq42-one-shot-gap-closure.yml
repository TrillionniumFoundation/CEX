name: seq42-one-shot-gap-closure

on:
  push:
    branches:
      - automation/seq42-final-gap-closure

permissions:
  contents: write

concurrency:
  group: seq42-one-shot-gap-closure
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: >-
      github.repository == 'TrillionniumFoundation/CEX' &&
      github.ref == 'refs/heads/automation/seq42-final-gap-closure' &&
      github.event.head_commit.message == 'chore: bootstrap seq42 one-shot closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact closure branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: automation/seq42-final-gap-closure
          fetch-depth: 0
          persist-credentials: true

      - name: Install stable Rust with Clippy
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Apply exact fail-closed patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()

          def replace_exact(relative: str, old: str, new: str) -> None:
              path = root / relative
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{relative}: expected exactly one patch target, observed {count}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              "vendor/trnm-finality-verifier/src/cometbft.rs",
              """        for signature in &mut signed.commit.signatures {\n            *signature = block::CommitSig::BlockIdFlagAbsent;\n        }\n""",
              """        signed\n            .commit\n            .signatures\n            .fill(block::CommitSig::BlockIdFlagAbsent);\n""",
          )

          replace_exact(
              "scripts/p0-release-evidence-core-impl.py",
              """    for name, gate in context[\"hosted_gates\"].items():\n        evidence.append(\n""",
              """    for name in REQUIRED_GATES:\n        gate = context[\"hosted_gates\"][name]\n        evidence.append(\n""",
          )

          workflow = root / ".github/workflows/seq42-one-shot-gap-closure.yml"
          if not workflow.is_file():
              raise SystemExit("one-shot workflow is missing before self-deletion")
          workflow.unlink()
          PY

          python3 -m py_compile scripts/p0-release-evidence-core-impl.py
          python3 scripts/p0-release-evidence-core.py self-test
          cargo fmt --all -- --check
          cargo clippy -p trnm-finality-verifier --all-targets --all-features -- -D warnings
          git diff --check

      - name: Commit verified closure patch and self-delete
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/seq42-one-shot-gap-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && {
            echo "expected closure patch is empty" >&2
            exit 1
          }
          git commit -m "fix: close seq42 manifest order and Rust 1.98 lint gaps"
          git push origin HEAD:automation/seq42-final-gap-closure
