name: seq39-exact-apply

on:
  push:
    branches:
      - automation/seq39-exact-apply
    paths:
      - '.automation/seq39-exact-apply.sh'
      - '.automation/seq39.patch.b64.part*'
      - '.github/workflows/seq39-exact-apply.yml'

permissions:
  contents: write

concurrency:
  group: seq39-exact-apply
  cancel-in-progress: false

env:
  DATABASE_URL: postgres://cex:cex_ci_password@127.0.0.1:5432/cex_ci
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cex
          POSTGRES_PASSWORD: cex_ci_password
          POSTGRES_DB: cex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cex -d cex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout exact automation payload
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust stable with format and lint
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Diagnose exact sequence 39 normalization boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/seq39-exact-apply.sh" <<'PYTRANSFORM'
          from pathlib import Path
          import base64
          import hashlib
          import sys

          source = Path('.automation/seq39-exact-apply.sh').read_text(encoding='utf-8')
          replacements = [
              (
                  'git read-tree --reset -u "$BASE_SHA"',
                  'git reset --hard "$BASE_SHA"',
              ),
              (
                  r"""for relative in sorted(expected):
              blob = subprocess.check_output(['git', 'show', f'{base}:{relative}'])
              normalized = blob.replace(b'\r\n', b'\n')
              if blob == normalized:
                  raise SystemExit(f'expected CRLF-bearing blob is already normalized: {relative}')
              if b'\r' in normalized:
                  raise SystemExit(f'unsupported lone CR remains after normalization: {relative}')
              if Path(relative).read_bytes() != normalized:
                  raise SystemExit(f'checkout changed more than CRLF line endings: {relative}')
          """,
                  r"""for relative in sorted(expected):
              blob = subprocess.check_output(['git', 'show', f'{base}:{relative}'])
              if b'\r\n' not in blob:
                  raise SystemExit(f'expected CRLF-bearing blob is already normalized: {relative}')
          """,
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'automation transformation boundary drifted: {old[:80]!r}')
              source = source.replace(old, new)

          block_b64 = (
              ''
          )
          block = base64.b64decode(block_b64).decode('utf-8')
          if hashlib.sha256(block.encode('utf-8')).hexdigest() != 'e19d1bfde913c4b3a91516060f244cc3ebbd88c9ed66edf76a1c10418643dcdc':
              raise SystemExit('diagnostic block digest mismatch')
          start_marker = 'git add --renormalize -- "${NORMALIZED_PATHS[@]}"\n'
          end_marker = '\nphase "apply hash-bound sequence 39 patch"'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0 or source.find(start_marker, start + 1) >= 0:
              raise SystemExit('normalization splice boundary drifted')
          source = source[:start] + block + source[end:]
          Path(sys.argv[1]).write_text(source, encoding='utf-8')
          PYTRANSFORM
          observed=$(sha256sum "$RUNNER_TEMP/seq39-exact-apply.sh" | awk '{print $1}')
          expected=43f7dacb93f5bebc1c780b92fe5471b12d8c6262a3fb0bcdc68d025b967aee63
          [[ "$observed" == "$expected" ]] || {
            echo "::error::diagnostic script digest mismatch: expected=$expected observed=$observed"
            exit 1
          }
          chmod 700 "$RUNNER_TEMP/seq39-exact-apply.sh"
          bash "$RUNNER_TEMP/seq39-exact-apply.sh"
