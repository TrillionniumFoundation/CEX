name: seq39-exact-apply

on:
  push:
    branches:
      - automation/seq39-exact-apply
    paths:
      - '.automation/seq39-exact-apply.sh'
      - '.automation/seq39.patch.b64.part*'
      - '.github/workflows/seq39-exact-apply.yml'

permissions:
  contents: write

concurrency:
  group: seq39-exact-apply
  cancel-in-progress: false

env:
  DATABASE_URL: postgres://cex:cex_ci_password@127.0.0.1:5432/cex_ci
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cex
          POSTGRES_PASSWORD: cex_ci_password
          POSTGRES_DB: cex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cex -d cex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout exact automation payload
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust stable with format and lint
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Build validate and stage exact sequence 39
        shell: bash
        run: |
          set -euo pipefail
          cp .automation/seq39-exact-apply.sh "$RUNNER_TEMP/seq39-exact-apply.sh"
          chmod 700 "$RUNNER_TEMP/seq39-exact-apply.sh"
          bash "$RUNNER_TEMP/seq39-exact-apply.sh"
