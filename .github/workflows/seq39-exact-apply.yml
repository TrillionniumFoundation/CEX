name: seq39-exact-apply

on:
  push:
    branches:
      - automation/seq39-exact-apply
    paths:
      - '.automation/seq39-exact-apply.sh'
      - '.automation/seq39.patch.b64.part*'
      - '.github/workflows/seq39-exact-apply.yml'

permissions:
  contents: write

concurrency:
  group: seq39-exact-apply
  cancel-in-progress: false

env:
  DATABASE_URL: postgres://cex:cex_ci_password@127.0.0.1:5432/cex_ci
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cex
          POSTGRES_PASSWORD: cex_ci_password
          POSTGRES_DB: cex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cex -d cex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout exact automation payload
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust stable with format and lint
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Diagnose exact sequence 39 normalization boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/seq39-exact-apply.sh" <<'PYTRANSFORM'
          from pathlib import Path
          import sys

          source = Path('.automation/seq39-exact-apply.sh').read_text(encoding='utf-8')
          replacements = [
              (
                  'git read-tree --reset -u "$BASE_SHA"',
                  'git reset --hard "$BASE_SHA"',
              ),
              (
                  r"""for relative in sorted(expected):
              blob = subprocess.check_output(['git', 'show', f'{base}:{relative}'])
              normalized = blob.replace(b'\r\n', b'\n')
              if blob == normalized:
                  raise SystemExit(f'expected CRLF-bearing blob is already normalized: {relative}')
              if b'\r' in normalized:
                  raise SystemExit(f'unsupported lone CR remains after normalization: {relative}')
              if Path(relative).read_bytes() != normalized:
                  raise SystemExit(f'checkout changed more than CRLF line endings: {relative}')
          """,
                  r"""for relative in sorted(expected):
              blob = subprocess.check_output(['git', 'show', f'{base}:{relative}'])
              if b'\r\n' not in blob:
                  raise SystemExit(f'expected CRLF-bearing blob is already normalized: {relative}')
          """,
              ),
              (
                  r"""git add --renormalize -- "${NORMALIZED_PATHS[@]}"
          git diff --quiet || fail "unstaged changes remain after CRLF normalization"
          """,
                  r"""git add --renormalize -- "${NORMALIZED_PATHS[@]}"
          git diff --quiet || fail "unstaged changes remain after CRLF normalization"
          python3 - "${NORMALIZED_PATHS[@]}" <<'PY'
          import subprocess
          import sys

          for relative in sys.argv[1:]:
              staged = subprocess.check_output(['git', 'show', f':{relative}'])
              if b'\r' in staged:
                  raise SystemExit(f'normalized staged blob still contains CR: {relative}')
          PY
          """,
              ),
              (
                  r"""git diff --cached --quiet --ignore-cr-at-eol "$BASE_SHA" -- "${NORMALIZED_PATHS[@]}" \
            || fail "checkout normalization changed content beyond CR-at-EOL"
          """,
                  r"""python3 - "$BASE_SHA" "${NORMALIZED_PATHS[@]}" <<'PYDIAG'
          import hashlib
          import subprocess
          import sys

          base = sys.argv[1]
          paths = sys.argv[2:]
          all_equal = True
          for relative in paths:
              base_blob = subprocess.check_output(['git', 'show', f'{base}:{relative}'])
              staged = subprocess.check_output(['git', 'show', f':{relative}'])
              def stats(data: bytes) -> str:
                  return (
                      f'bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()} '
                      f'crlf={data.count(bytes([13,10]))} cr={data.count(bytes([13]))} '
                      f'lf={data.count(bytes([10]))} bom={data.startswith(bytes([239,187,191]))}'
                  )
              canonical_base = base_blob.replace(bytes([13,10]), bytes([10])).replace(bytes([13]), bytes([10]))
              canonical_staged = staged.replace(bytes([13,10]), bytes([10])).replace(bytes([13]), bytes([10]))
              equal = canonical_base == canonical_staged
              print(f'NORMALIZATION_DIAG path={relative} canonical_equal={equal}')
              print(f'  base   {stats(base_blob)}')
              print(f'  staged {stats(staged)}')
              if not equal:
                  all_equal = False
                  limit = min(len(canonical_base), len(canonical_staged))
                  offset = next((i for i in range(limit) if canonical_base[i] != canonical_staged[i]), limit)
                  line = canonical_base[:offset].count(bytes([10])) + 1
                  start = max(0, offset - 80)
                  end_base = min(len(canonical_base), offset + 160)
                  end_staged = min(len(canonical_staged), offset + 160)
                  print(f'  first_diff_offset={offset} canonical_base_line={line}')
                  print(f'  base_context={canonical_base[start:end_base]!r}')
                  print(f'  staged_context={canonical_staged[start:end_staged]!r}')
          if not all_equal:
              raise SystemExit('checkout normalization contains non-newline byte differences')
          PYDIAG
          """,
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f'automation transformation boundary drifted: {old[:80]!r}')
              source = source.replace(old, new)
          Path(sys.argv[1]).write_text(source, encoding='utf-8')
          PYTRANSFORM
          observed=$(sha256sum "$RUNNER_TEMP/seq39-exact-apply.sh" | awk '{print $1}')
          expected=43f7dacb93f5bebc1c780b92fe5471b12d8c6262a3fb0bcdc68d025b967aee63
          [[ "$observed" == "$expected" ]] || {
            echo "::error::diagnostic script digest mismatch: expected=$expected observed=$observed"
            exit 1
          }
          chmod 700 "$RUNNER_TEMP/seq39-exact-apply.sh"
          bash "$RUNNER_TEMP/seq39-exact-apply.sh"
