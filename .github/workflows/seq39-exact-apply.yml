name: seq39-exact-apply

on:
  push:
    branches:
      - automation/seq39-exact-apply
    paths:
      - '.automation/seq39-exact-apply.sh'
      - '.automation/seq39.patch.b64.part*'
      - '.github/workflows/seq39-exact-apply.yml'

permissions:
  contents: write

concurrency:
  group: seq39-exact-apply
  cancel-in-progress: false

env:
  DATABASE_URL: postgres://cex:cex_ci_password@127.0.0.1:5432/cex_ci
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cex
          POSTGRES_PASSWORD: cex_ci_password
          POSTGRES_DB: cex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cex -d cex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout exact automation payload
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust stable with format and lint
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Build validate and stage exact sequence 39
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/seq39-exact-apply.sh" <<'PY'
          from pathlib import Path
          import sys

          source = Path('.automation/seq39-exact-apply.sh').read_text(encoding='utf-8')
          old = 'git read-tree --reset -u "$BASE_SHA"'
          new = 'git reset --hard "$BASE_SHA"'
          if source.count(old) != 1:
              raise SystemExit('automation reset boundary drifted')
          Path(sys.argv[1]).write_text(source.replace(old, new), encoding='utf-8')
          PY
          observed=$(sha256sum "$RUNNER_TEMP/seq39-exact-apply.sh" | awk '{print $1}')
          expected=3f1059c3d872421f20307a53e9f3ceb04b005ffc9e5682dfa48fe90375b11e3b
          [[ "$observed" == "$expected" ]] || {
            echo "::error::transformed script digest mismatch: expected=$expected observed=$observed"
            exit 1
          }
          chmod 700 "$RUNNER_TEMP/seq39-exact-apply.sh"
          bash "$RUNNER_TEMP/seq39-exact-apply.sh"
