name: Self-hosted desktop availability

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this bounded runner probe is being requested
        required: false
        default: operator-check
        type: string

permissions: {}

concurrency:
  group: self-hosted-desktop-availability-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.98.1'

jobs:
  desktop:
    name: Self-hosted desktop probe
    runs-on: [self-hosted, linux, x64, desktop]
    timeout-minutes: 10
    steps:
      - name: Verify trusted bounded invocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test -n "$RUNNER_NAME"
          printf 'runner=%s\nos=%s\narch=%s\nref=%s\nreason=%s\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_REF" \
            '${{ inputs.reason }}'

      - name: Report installed platform capabilities without using them as release authority
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          command -v rustup >/dev/null 2>&1 && rustup --version || true
          command -v rustc >/dev/null 2>&1 && rustc --version --verbose || true
          command -v cargo >/dev/null 2>&1 && cargo --version --verbose || true
          echo "expected_release_toolchain=$RUST_TOOLCHAIN"
          echo "probe_only=true"
          echo "production_authorization=not_granted"
