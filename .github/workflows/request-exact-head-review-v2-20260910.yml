name: request-exact-head-review-v2-20260910

on:
  push:
    branches:
      - verify/cex-current-full-20260910

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: request-exact-head-review-v2-20260910
  cancel-in-progress: false

jobs:
  request_review:
    name: cex/resolved-threads-and-independent-review-request
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: integration/cex-v12-sequence54-20260908
      VERIFIED_BRANCH: verified/cex-current-full-20260910
      PULL_REQUEST: '53'
    steps:
      - name: Wait for verified current head
        shell: bash
        run: |
          set -euo pipefail
          remote=https://github.com/${GITHUB_REPOSITORY}.git
          for attempt in $(seq 1 80); do
            target="$(git ls-remote "$remote" refs/heads/${TARGET_BRANCH} | cut -f1)"
            verified="$(git ls-remote "$remote" refs/heads/${VERIFIED_BRANCH} | cut -f1)"
            if [ -n "$target" ] && [ "$verified" = "$target" ]; then
              printf '%s\n' "$target" > "$RUNNER_TEMP/exact-head"
              exit 0
            fi
            sleep 30
          done
          exit 1

      - name: Require every review thread resolved and request reviewers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "$GH_TOKEN" "$(cat "$RUNNER_TEMP/exact-head")" <<'PY'
          import json
          import sys
          import urllib.request

          token, exact = sys.argv[1:]
          query = '''
          query($owner:String!, $name:String!, $number:Int!, $cursor:String) {
            repository(owner:$owner, name:$name) {
              pullRequest(number:$number) {
                state
                isDraft
                headRefOid
                reviewThreads(first:100, after:$cursor) {
                  nodes { isResolved }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          }
          '''
          cursor = None
          unresolved = 0
          pages = 0
          while True:
              payload = json.dumps({
                  "query": query,
                  "variables": {
                      "owner": "TrillionniumFoundation",
                      "name": "CEX",
                      "number": 53,
                      "cursor": cursor,
                  },
              }).encode()
              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  value = json.load(response)
              if value.get("errors"):
                  raise SystemExit(value["errors"])
              pr = value["data"]["repository"]["pullRequest"]
              assert pr["state"] == "OPEN" and pr["isDraft"] is True
              assert pr["headRefOid"] == exact
              threads = pr["reviewThreads"]
              unresolved += sum(not node["isResolved"] for node in threads["nodes"])
              pages += 1
              if pages > 100:
                  raise SystemExit("review-thread pagination budget exceeded")
              if not threads["pageInfo"]["hasNextPage"]:
                  break
              cursor = threads["pageInfo"]["endCursor"]
              if not cursor:
                  raise SystemExit("review-thread pagination cursor missing")
          if unresolved:
              raise SystemExit(f"unresolved review threads: {unresolved}")
          print("CEX_REVIEW_THREADS_RESOLVED=PASS")
          PY
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl --fail --silent --show-error --location \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/pulls/${PULL_REQUEST}/requested_reviewers" \
            --data '{"reviewers":["Tomasrgbsf","Franksudoman"]}' \
            > "$RUNNER_TEMP/reviewers.json"
          python3 - "$RUNNER_TEMP/reviewers.json" "$(cat "$RUNNER_TEMP/exact-head")" <<'PY'
          import json
          import sys
          pr = json.load(open(sys.argv[1], encoding="utf-8"))
          assert pr["head"]["sha"] == sys.argv[2]
          requested = {item["login"] for item in pr.get("requested_reviewers", [])}
          assert "Tomasrgbsf" in requested
          print("CEX_INDEPENDENT_REVIEW_REQUESTED=PASS")
          print("INDEPENDENT_APPROVAL=false")
          print("PRODUCTION_AUTHORIZATION=not_granted")
          PY
