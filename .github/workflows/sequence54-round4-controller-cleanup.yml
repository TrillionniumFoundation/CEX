name: sequence54-round4-controller-cleanup

on:
  push:
    branches:
      - work/sequence54-round2-staging-20260909
    paths:
      - '.github/workflows/sequence54-round4-controller-cleanup.yml'

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: sequence54-round4-controller-cleanup
  cancel-in-progress: false

env:
  STAGING_BRANCH: work/sequence54-round2-staging-20260909
  PULL_REQUEST_NUMBER: '53'
  EVIDENCE_DIR: ${{ runner.temp }}/sequence54-round4-controller-cleanup

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 400
    steps:
      - name: Wait for final snapshot and inspect immutable result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          encoded_branch="${STAGING_BRANCH//\//%2F}"
          snapshot_id=''
          for _ in $(seq 1 160); do
            snapshot_id="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/sequence54-round4-final-snapshot.yml/runs?branch=${encoded_branch}&per_page=20" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty' 2>/dev/null || true)"
            [[ -n "$snapshot_id" ]] && break
            sleep 15
          done
          [[ -n "$snapshot_id" ]]
          for _ in $(seq 1 1600); do
            value="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${snapshot_id}")"
            status="$(jq -r '.status' <<<"$value")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$value")"
            [[ "$status" == completed ]] && break
            sleep 15
          done
          [[ "$status" == completed ]]
          printf 'snapshot_id=%s\nstatus=%s\nconclusion=%s\n' "$snapshot_id" "$status" "$conclusion" \
            > "$EVIDENCE_DIR/snapshot.txt"

          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${snapshot_id}/artifacts?per_page=100" \
            > "$EVIDENCE_DIR/artifacts.json"
          artifact_id="$(jq -r '.artifacts[] | select(.name | startswith("sequence54-round4-final-snapshot-")) | .id' \
            "$EVIDENCE_DIR/artifacts.json" | head -n1)"
          [[ -n "$artifact_id" && "$artifact_id" != null ]]
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "$RUNNER_TEMP/final-snapshot.zip"
          mkdir -p "$EVIDENCE_DIR/snapshot"
          unzip -q "$RUNNER_TEMP/final-snapshot.zip" -d "$EVIDENCE_DIR/snapshot"
          snapshot_file="$(find "$EVIDENCE_DIR/snapshot" -name final-gap-snapshot.json -type f | head -n1)"
          [[ -n "$snapshot_file" ]]
          cp "$snapshot_file" "$EVIDENCE_DIR/final-gap-snapshot.json"

      - name: Delete only fully-qualified temporary controller branch
        id: delete
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          internal="$(jq -r '.repository_internal_exact_head_green' "$EVIDENCE_DIR/final-gap-snapshot.json")"
          aggregate="$(jq -r '.aggregate_p0_candidate_green' "$EVIDENCE_DIR/final-gap-snapshot.json")"
          if [[ "$internal" != true || "$aggregate" != true ]]; then
            echo 'temporary controller branch retained because repository qualification is incomplete' \
              > "$EVIDENCE_DIR/cleanup-decision.txt"
            exit 0
          fi

          self_run="$GITHUB_RUN_ID"
          encoded_branch="${STAGING_BRANCH//\//%2F}"
          for _ in $(seq 1 240); do
            active="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${encoded_branch}&per_page=100" \
              --jq --arg self "$self_run" '[.workflow_runs[] | select((.id|tostring) != $self and (.status != "completed"))] | length')"
            [[ "$active" == 0 ]] && break
            sleep 15
          done
          [[ "$active" == 0 ]]
          ref="heads/${STAGING_BRANCH}"
          http="$(curl -sS -o "$EVIDENCE_DIR/delete-response.json" -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/${ref//\//%2F}")"
          printf 'temporary controller branch deletion HTTP %s\n' "$http" > "$EVIDENCE_DIR/cleanup-decision.txt"
          [[ "$http" == 204 ]]

      - name: Publish cleanup decision
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DELETE_OUTCOME: ${{ steps.delete.outcome }}
        shell: bash
        run: |
          decision="$(cat "$EVIDENCE_DIR/cleanup-decision.txt" 2>/dev/null || echo 'cleanup decision unavailable')"
          body="<!-- sequence54-round4-controller-cleanup -->
          ## Sequence 54 temporary-controller cleanup

          - Cleanup step outcome: \`$DELETE_OUTCOME\`
          - Decision: \`$decision\`

          The staging branch is deleted only after repository-internal exact-head and aggregate P0 qualification are both green. External authority gaps do not authorize merge or production."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments" -f body="$body"

      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sequence54-round4-controller-cleanup-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
