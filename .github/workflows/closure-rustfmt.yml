name: closure-repair

on:
  workflow_dispatch:
  push:
    branches:
      - feature/settlement-all-blockers-closure-v1
    paths:
      - '.github/workflows/closure-rustfmt.yml'

permissions:
  contents: write

concurrency:
  group: closure-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lock-format-and-compile:
    if: github.ref == 'refs/heads/feature/settlement-all-blockers-closure-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/settlement-all-blockers-closure-v1
          fetch-depth: 0

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Synchronize dependency lock and formatting
        run: |
          cargo generate-lockfile
          cargo fmt --all

      - name: Commit generated lock and formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock -- '*.rs'
          git commit -m 'build: synchronize exact closure lockfile'
          git push origin HEAD:feature/settlement-all-blockers-closure-v1

      - name: Verify canonical formatting
        run: cargo fmt --all --check

      - name: Compile all workspace targets
        run: cargo check --locked --workspace --all-targets
