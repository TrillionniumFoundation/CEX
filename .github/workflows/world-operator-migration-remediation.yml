name: world-operator-migration-remediation

on:
  workflow_dispatch:
  push:
    branches:
      - ci/world-settlement-capture-boundary-v1
    paths:
      - '.github/workflows/world-operator-migration-remediation.yml'
      - 'evidence/world-settlement-external-lock.json'

permissions:
  contents: read

jobs:
  remediate:
    name: world-operator-migration-remediation/exact-sql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout remediation definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Load exact World identity
        id: lock
        run: |
          set -euo pipefail
          echo "repository=$(jq -er '.world.repository' evidence/world-settlement-external-lock.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -er '.world.commit | select(test("^[0-9a-f]{40}$"))' evidence/world-settlement-external-lock.json)" >> "$GITHUB_OUTPUT"
          echo "tree=$(jq -er '.world.tree | select(test("^[0-9a-f]{40}$"))' evidence/world-settlement-external-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout exact World candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.lock.outputs.repository }}
          ref: ${{ steps.lock.outputs.commit }}
          path: world
          persist-credentials: false

      - name: Verify exact identity and apply one reviewed replacement
        run: |
          set -euo pipefail
          test "$(git -C world rev-parse HEAD)" = '${{ steps.lock.outputs.commit }}'
          test "$(git -C world rev-parse 'HEAD^{tree}')" = '${{ steps.lock.outputs.tree }}'
          python3 - <<'PY'
          from pathlib import Path
          path = Path('world/trillionnium/crates/trnm-game-server/migrations/0018_online_settlement_operator_controls_v1.sql')
          text = path.read_text()
          old = '''    select job_row, capture.state
      into job, capture_state
      from public.trnm_online_settlement_jobs job_row
      join public.trnm_online_settlement_captures capture
        on capture.capture_id = job_row.capture_id
     where job_row.job_id = p_job_id
     for update of job_row, capture;
    if not found then
        raise exception using
            errcode = 'P0002',
            message = 'settlement replay target does not exist';
    end if;
'''
          new = '''    select job_row.*
      into job
      from public.trnm_online_settlement_jobs job_row
      join public.trnm_online_settlement_captures capture
        on capture.capture_id = job_row.capture_id
     where job_row.job_id = p_job_id
     for update of job_row, capture;
    if not found then
        raise exception using
            errcode = 'P0002',
            message = 'settlement replay target does not exist';
    end if;

    select capture.state
      into capture_state
      from public.trnm_online_settlement_captures capture
     where capture.capture_id = job.capture_id;
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one reviewed invalid SELECT shape, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git -C world diff --check
          test "$(git -C world diff --name-only)" = 'trillionnium/crates/trnm-game-server/migrations/0018_online_settlement_operator_controls_v1.sql'
          git -C world diff --unified=20 > remediation.patch
          grep -F 'select job_row.*' remediation.patch
          grep -F 'into capture_state' remediation.patch
          ! grep -F 'select job_row, capture.state' world/trillionnium/crates/trnm-game-server/migrations/0018_online_settlement_operator_controls_v1.sql

      - name: Validate migration syntax with prerequisite DDL
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f world/trillionnium/crates/trnm-game-server/migrations/0001_online_authority_v1.sql
          for migration in \
            0002_online_runtime_v2.sql \
            0003_online_publication_v3.sql \
            0004_online_recovery_v4.sql \
            0005_online_security_v5.sql \
            0006_online_admission_v6.sql \
            0007_online_fleet_v7.sql \
            0008_online_warm_pool_v8.sql \
            0009_online_journal_v9.sql \
            0010_online_reservation_v10.sql \
            0011_online_account_binding_v11.sql \
            0012_online_readiness_v12.sql \
            0013_online_archive_v13.sql \
            0014_online_actor_v14.sql \
            0015_online_realtime_hot_path_v1.sql \
            0016_online_settlement_outbox_v1.sql \
            0017_online_settlement_worker_runtime_v1.sql; do
            path="world/trillionnium/crates/trnm-game-server/migrations/$migration"
            if [[ -f "$path" ]]; then psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$path"; fi
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f world/trillionnium/crates/trnm-game-server/migrations/0018_online_settlement_operator_controls_v1.sql

      - name: Assemble complete remediation artifact
        run: |
          set -euo pipefail
          mkdir -p remediation/trillionnium/crates/trnm-game-server/migrations
          cp world/trillionnium/crates/trnm-game-server/migrations/0018_online_settlement_operator_controls_v1.sql \
            remediation/trillionnium/crates/trnm-game-server/migrations/
          cp remediation.patch remediation/
          sha256sum \
            remediation/trillionnium/crates/trnm-game-server/migrations/0018_online_settlement_operator_controls_v1.sql \
            remediation/remediation.patch \
            > remediation/SHA256SUMS
          sha256sum --check remediation/SHA256SUMS

      - name: Upload exact remediation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-operator-migration-remediation-${{ steps.lock.outputs.commit }}
          path: remediation/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
