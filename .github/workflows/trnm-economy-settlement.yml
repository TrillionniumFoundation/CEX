name: trnm-economy-settlement

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/trnm-economy-settlement.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'migrations/**'
      - 'crates/shared-tracing/**'
      - 'services/trnm-economy-service/migrations/settlement_v1.sql'
      - 'services/trnm-economy-service/**'
      - 'docs/trnm-economy-settlement-receipt-lookup-v1.md'
      - 'docs/status/trnm-economy-settlement-v1.json'
      - 'scripts/check-trnm-economy-settlement-contract.py'
      - 'scripts/test-trnm-economy-settlement-status-negative.py'
      - 'scripts/trnm_build_evidence.py'
      - 'scripts/test-trnm-build-evidence.py'
      - 'docs/release-evidence/p0-candidate-trigger.json'
  push:
    paths:
      - '.github/workflows/trnm-economy-settlement.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'migrations/**'
      - 'crates/shared-tracing/**'
      - 'services/trnm-economy-service/migrations/settlement_v1.sql'
      - 'services/trnm-economy-service/**'
      - 'docs/trnm-economy-settlement-receipt-lookup-v1.md'
      - 'docs/status/trnm-economy-settlement-v1.json'
      - 'scripts/check-trnm-economy-settlement-contract.py'
      - 'scripts/test-trnm-economy-settlement-status-negative.py'
      - 'scripts/trnm_build_evidence.py'
      - 'scripts/test-trnm-build-evidence.py'
      - 'docs/release-evidence/p0-candidate-trigger.json'

permissions:
  contents: read

concurrency:
  group: trnm-economy-settlement-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  static-contracts:
    name: trnm-economy-settlement/static-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact commit and tree
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Parse configuration artifacts
        run: |
          python3 -m py_compile \
            scripts/check-trnm-economy-settlement-contract.py \
            scripts/test-trnm-economy-settlement-status-negative.py
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          json.loads(Path('docs/status/trnm-economy-settlement-v1.json').read_text())
          tomllib.loads(Path('Cargo.toml').read_text())
          tomllib.loads(Path('services/trnm-economy-service/Cargo.toml').read_text())
          PY
      - name: Enforce source and status boundaries
        run: python3 scripts/check-trnm-economy-settlement-contract.py
      - name: Reject promotion overclaims
        run: python3 scripts/test-trnm-economy-settlement-status-negative.py
      - name: Build packet filesystem and source identity regression
        run: python3 scripts/test-trnm-build-evidence.py

  rust-postgresql-contracts:
    needs: static-contracts
    name: trnm-economy-settlement/rust-postgresql-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cex_settlement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cex_settlement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TRNM_CEX_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cex_settlement
      TRNM_REQUIRE_CEX_SETTLEMENT_DATABASE_TEST: '1'
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact commit and tree
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version --verbose
          cargo --version --verbose
      - name: Enforce committed dependency lock
        id: lock
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          git diff --exit-code HEAD -- Cargo.lock
      - name: Format settlement package only
        id: format
        run: cargo fmt -p trnm-economy-service -- --check
      - name: Unit and PostgreSQL owner contract
        id: tests
        run: cargo test -p trnm-economy-service --all-targets --locked
      - name: Strict lint
        id: clippy
        run: cargo clippy -p trnm-economy-service --all-targets --locked -- -D warnings
      - name: Build immutable candidate binary
        id: build
        run: cargo build -p trnm-economy-service --release --locked
      - name: Verify candidate sources remain unchanged
        id: source_unchanged
        run: git diff --exit-code HEAD --
      - name: Assemble exact-head evidence packet
        id: packet
        env:
          TRNM_STATIC_RESULT: ${{ needs.static-contracts.result }}
          TRNM_LOCK_OUTCOME: ${{ steps.lock.outcome }}
          TRNM_FORMAT_OUTCOME: ${{ steps.format.outcome }}
          TRNM_TESTS_OUTCOME: ${{ steps.tests.outcome }}
          TRNM_CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          TRNM_BUILD_OUTCOME: ${{ steps.build.outcome }}
          TRNM_SOURCE_UNCHANGED_OUTCOME: ${{ steps.source_unchanged.outcome }}
          TRNM_RUST_TOOLCHAIN: '1.98.1'
          TRNM_POSTGRES_IMAGE: 'postgres:16.4-alpine'
        run: |
          set -euo pipefail
          packet_dir="$(python3 scripts/trnm_build_evidence.py --root "$PWD" --output-parent "$RUNNER_TEMP")"
          python3 scripts/trnm_build_evidence.py --verify "$packet_dir"
          echo "directory=$packet_dir" >> "$GITHUB_OUTPUT"
      - name: Upload exact-head candidate and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-cex-settlement-${{ env.EXPECTED_HEAD_SHA }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.packet.outputs.directory }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
