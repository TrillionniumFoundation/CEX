name: world-source-remediation-v3

on:
  push:
    branches:
      - ci/world-settlement-capture-boundary-v1
    paths:
      - .github/workflows/world-source-remediation-v3.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-source-remediation-v3
  cancel-in-progress: false

jobs:
  remediate:
    name: world-source-remediation-v3/exact-source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: world_settlement
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d world_settlement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TRNM_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/world_settlement
      TRNM_REQUIRE_SETTLEMENT_DATABASE_TEST: "1"
      TRNM_CEX_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/world_settlement
      TRNM_REQUIRE_CEX_SETTLEMENT_DATABASE_TEST: "1"
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout remediation definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout exact World source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TrillionniumFoundation/Trillionnium-World
          ref: ad0fd6378242992cea4e035efe90174f5f2bc138
          path: world
          persist-credentials: false

      - name: Apply only reviewed deterministic fixes
        run: |
          set -euo pipefail
          test "$(git -C world hash-object trillionnium/crates/trnm-game-server/migrations/0018_online_settlement_operator_controls_v1.sql)" = cc9d7705d68a49ca0e2527359f6b0ace63c963dd
          test "$(git -C world hash-object trillionnium/crates/trnm-game-server/tests/settlement_database_contract.rs)" = 5433c7cf351500ab99801d6c33ebe6cd020dcacd
          test "$(git -C world hash-object trillionnium/crates/trnm-game-server/tests/settlement_operator_controls_database.rs)" = 46bdd04c1ff4d68518a4a96c02ee86310043465f
          test "$(git -C world hash-object trillionnium/crates/trnm-game-server/build.rs)" = 24421c05304804ba64740ae2034b6008f5e6cb97
          python3 - <<'PY'
          from pathlib import Path

          migration = Path("world/trillionnium/crates/trnm-game-server/migrations/0018_online_settlement_operator_controls_v1.sql")
          text = migration.read_text(encoding="utf-8")
          marker = "on conflict (policy_revision) do nothing;\n"
          addition = """on conflict (policy_revision) do nothing;

          select pg_catalog.setval(
              pg_catalog.pg_get_serial_sequence(
                  'public.trnm_online_settlement_operator_policy_revisions',
                  'policy_revision'
              ),
              (
                  select max(policy_revision)
                    from public.trnm_online_settlement_operator_policy_revisions
              ),
              true
          );
          """
          if text.count(marker) != 1:
              raise SystemExit(f"policy seed marker count was {text.count(marker)}, expected 1")
          migration.write_text(text.replace(marker, addition, 1), encoding="utf-8")

          database_test = Path("world/trillionnium/crates/trnm-game-server/tests/settlement_database_contract.rs")
          text = database_test.read_text(encoding="utf-8")
          old = "let (_, changed_payload_job) = insert_capture_and_job("
          new = "let (_, _changed_payload_job) = insert_capture_and_job("
          if text.count(old) != 1:
              raise SystemExit(f"unused binding marker count was {text.count(old)}, expected 1")
          database_test.write_text(text.replace(old, new, 1), encoding="utf-8")

          operator_test = Path("world/trillionnium/crates/trnm-game-server/tests/settlement_operator_controls_database.rs")
          text = operator_test.read_text(encoding="utf-8")
          old = """        \"delete from public.trnm_online_settlement_operator_policy_revisions\",
                  \"truncate public.trnm_online_settlement_operator_policy_revisions\",
              ] {
                  let error = sqlx::query::query(statement)
                      .execute(&pool)
                      .await
                      .unwrap_err();
                  assert_sqlstate(error, \"55000\");
              }
          """
          new = """        \"delete from public.trnm_online_settlement_operator_policy_revisions\",
              ] {
                  let error = sqlx::query::query(statement)
                      .execute(&pool)
                      .await
                      .unwrap_err();
                  assert_sqlstate(error, \"55000\");
              }

              let policy_truncate = sqlx::query::query(
                  \"truncate public.trnm_online_settlement_operator_policy_revisions\",
              )
              .execute(&pool)
              .await
              .unwrap_err();
              let sqlx::Error::Database(database) = policy_truncate else {
                  panic!(\"expected PostgreSQL truncate rejection, got {policy_truncate}\");
              };
              assert!(
                  matches!(database.code().as_deref(), Some(\"55000\" | \"0A000\")),
                  \"expected append-only trigger or FK-first truncate rejection, got {:?}\",
                  database.code()
              );
          """
          if text.count(old) != 1:
              raise SystemExit(f"policy truncate assertion marker count was {text.count(old)}, expected 1")
          text = text.replace(old, new, 1)
          helper = "async fn authorize_replay("
          annotated = "#[allow(clippy::too_many_arguments)]\nasync fn authorize_replay("
          if text.count(helper) != 1:
              raise SystemExit(f"replay helper marker count was {text.count(helper)}, expected 1")
          operator_test.write_text(text.replace(helper, annotated, 1), encoding="utf-8")

          build_script = Path("world/trillionnium/crates/trnm-game-server/build.rs")
          text = build_script.read_text(encoding="utf-8")
          replacements = {
              "use std::{env, fs, path::PathBuf};": "use std::{env, fs, path::{Path, PathBuf}};",
              "fn generate_game_server(out_dir: &PathBuf) {": "fn generate_game_server(out_dir: &Path) {",
              "fn generate_settlement_worker(out_dir: &PathBuf) {": "fn generate_settlement_worker(out_dir: &Path) {",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"build-script marker {old!r} count was {text.count(old)}, expected 1")
              text = text.replace(old, new, 1)
          build_script.write_text(text, encoding="utf-8")
          PY
          git -C world diff --check

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Apply pinned rustfmt
        working-directory: world/trillionnium
        run: cargo fmt --all

      - name: Prove PostgreSQL and strict lint contracts
        working-directory: world/trillionnium
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo test -p trnm-game-server --test settlement_operator_controls_database --locked
          cargo test -p trnm-game-server --test settlement_database_contract --locked
          cargo clippy -p trnm-game-server --all-targets --locked -- -D warnings

      - name: Assemble exact replacement files
        if: always()
        run: |
          set -euo pipefail
          mkdir -p remediation/trillionnium/crates/trnm-game-server/migrations
          mkdir -p remediation/trillionnium/crates/trnm-game-server/tests
          mkdir -p remediation/trillionnium/crates/trnm-game-server/src
          cp world/trillionnium/crates/trnm-game-server/build.rs remediation/trillionnium/crates/trnm-game-server/
          cp world/trillionnium/crates/trnm-game-server/migrations/0018_online_settlement_operator_controls_v1.sql remediation/trillionnium/crates/trnm-game-server/migrations/
          cp world/trillionnium/crates/trnm-game-server/tests/settlement_database_contract.rs remediation/trillionnium/crates/trnm-game-server/tests/
          cp world/trillionnium/crates/trnm-game-server/tests/settlement_operator_controls_database.rs remediation/trillionnium/crates/trnm-game-server/tests/
          cp world/trillionnium/crates/trnm-game-server/src/cex.rs remediation/trillionnium/crates/trnm-game-server/src/
          git -C world diff --binary --full-index > remediation/remediation.patch
          git -C world diff --name-only > remediation/changed-files.txt
          printf '%s\n' \
            'world_commit=ad0fd6378242992cea4e035efe90174f5f2bc138' \
            'world_tree=25d540f93f2a83133f4f6d1b94d3916b1d7498ee' \
            'rust_toolchain=1.98.0' \
            'postgres=16.4-alpine' \
            > remediation/identity.txt
          (
            cd remediation
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload exact replacement files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-source-remediation-v3-ad0fd637
          path: remediation/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
