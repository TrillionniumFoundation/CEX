name: one-shot-consolidate-all-branches

on:
  push:
    branches:
      - automation/consolidate-all-branches-20260829

permissions:
  contents: write
  actions: read

concurrency:
  group: cex-one-shot-branch-consolidation
  cancel-in-progress: false

env:
  AUTOMATION_BRANCH: automation/consolidate-all-branches-20260829
  REPORT_DIR: ${{ runner.temp }}/cex-branch-consolidation

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout controller with complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Merge every branch tip into one history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          git config user.name "CEX Branch Consolidation"
          git config user.email "branch-consolidation@users.noreply.github.com"
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'

          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          printf '%s\n' "$MAIN_SHA" > "$REPORT_DIR/main-before.txt"
          git checkout -B consolidated-main refs/remotes/origin/main

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from pathlib import Path

          report_dir = Path(os.environ["REPORT_DIR"])
          automation = os.environ["AUTOMATION_BRANCH"]

          def git(*args: str, check: bool = True) -> subprocess.CompletedProcess[str]:
              return subprocess.run(
                  ["git", *args], check=check, capture_output=True, text=True
              )

          raw = git(
              "for-each-ref",
              "--format=%(refname:strip=3)|%(objectname)|%(committerdate:unix)",
              "refs/remotes/origin",
          ).stdout.splitlines()
          branches: list[dict[str, object]] = []
          for line in raw:
              if not line:
                  continue
              name, sha, epoch = line.split("|", 2)
              if name in {"HEAD", "main"}:
                  continue
              branches.append(
                  {"branch": name, "sha": sha, "committer_epoch": int(epoch)}
              )

          aliases_by_sha: dict[str, list[dict[str, object]]] = {}
          for branch in branches:
              aliases_by_sha.setdefault(str(branch["sha"]), []).append(branch)

          rank = {
              "feature/hepta-paper-raid-alpha-candidate": 1,
              "feature/settlement-all-blockers-closure-v1": 2,
              automation: 3,
          }
          groups: list[dict[str, object]] = []
          for sha, aliases_raw in aliases_by_sha.items():
              aliases = sorted(str(item["branch"]) for item in aliases_raw)
              representative = max(aliases, key=lambda name: (rank.get(name, 0), name))
              groups.append(
                  {
                      "sha": sha,
                      "aliases": aliases,
                      "representative": representative,
                      "committer_epoch": max(
                          int(item["committer_epoch"]) for item in aliases_raw
                      ),
                      "rank": max(rank.get(name, 0) for name in aliases),
                  }
              )
          groups.sort(
              key=lambda item: (
                  int(item["rank"]),
                  int(item["committer_epoch"]),
                  str(item["representative"]),
              )
          )

          plan = {
              "schema": "cex.branch-consolidation-plan.v1",
              "main_before": git("rev-parse", "refs/remotes/origin/main").stdout.strip(),
              "source_branch_count": len(branches),
              "unique_tip_count": len(groups),
              "branches": sorted(branches, key=lambda item: str(item["branch"])),
              "merge_groups": groups,
              "policy": {
                  "order": "oldest-first; canonical candidates and controller last",
                  "conflict_resolution": "later incoming branch wins conflicted path",
                  "canonical_migration_source": "feature/settlement-all-blockers-closure-v1",
              },
          }
          (report_dir / "plan.json").write_text(
              json.dumps(plan, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

          results: list[dict[str, object]] = []
          for group in groups:
              sha = str(group["sha"])
              representative = str(group["representative"])
              aliases = list(group["aliases"])
              if git("merge-base", "--is-ancestor", sha, "HEAD", check=False).returncode == 0:
                  results.append(
                      {
                          "sha": sha,
                          "representative": representative,
                          "aliases": aliases,
                          "action": "already_included",
                          "conflicts": [],
                      }
                  )
                  continue

              merge = git(
                  "merge",
                  "--no-ff",
                  "--no-edit",
                  "--allow-unrelated-histories",
                  "-X",
                  "theirs",
                  f"refs/remotes/origin/{representative}",
                  check=False,
              )
              conflicts: list[str] = []
              if merge.returncode != 0:
                  raw_paths = subprocess.run(
                      ["git", "diff", "--name-only", "--diff-filter=U", "-z"],
                      check=True,
                      capture_output=True,
                  ).stdout
                  if not raw_paths:
                      raise SystemExit(
                          f"merge failed without index conflicts: {representative}@{sha}: "
                          + merge.stderr.strip()
                      )
                  for raw_path in raw_paths.split(b"\0"):
                      if not raw_path:
                          continue
                      path = raw_path.decode("utf-8", "surrogateescape")
                      conflicts.append(path)
                      if git("cat-file", "-e", f":3:{path}", check=False).returncode == 0:
                          git("checkout", "--theirs", "--", path)
                      else:
                          git("rm", "-f", "--ignore-unmatch", "--", path, check=False)
                  git("add", "-A")
                  unresolved = git(
                      "diff", "--name-only", "--diff-filter=U"
                  ).stdout.strip()
                  if unresolved:
                      raise SystemExit("unresolved conflicts: " + unresolved)
                  git(
                      "commit",
                      "--no-verify",
                      "-m",
                      f"merge: consolidate {representative} into main",
                  )
                  action = "merged_with_conflict_resolution"
              else:
                  action = "merged_cleanly"
              results.append(
                  {
                      "sha": sha,
                      "representative": representative,
                      "aliases": aliases,
                      "action": action,
                      "conflicts": sorted(conflicts),
                  }
              )

          missing = [
              f"{item['branch']}@{item['sha']}"
              for item in branches
              if git(
                  "merge-base", "--is-ancestor", str(item["sha"]), "HEAD", check=False
              ).returncode
              != 0
          ]
          if missing:
              raise SystemExit("source tips missing from final history: " + ", ".join(missing))

          result = {
              "schema": "cex.branch-consolidation-result.v1",
              "main_before": plan["main_before"],
              "merged_head": git("rev-parse", "HEAD").stdout.strip(),
              "all_source_tips_are_ancestors": True,
              "results": results,
          }
          (report_dir / "merge-result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Canonicalize final tree and reconcile Cargo lock
        shell: bash
        run: |
          set -euo pipefail

          git rm -r -f --ignore-unmatch migrations
          git checkout refs/remotes/origin/feature/settlement-all-blockers-closure-v1 -- \
            migrations Cargo.lock

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          cleaned = []
          for raw in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"):
              if not raw:
                  continue
              path = Path(raw.decode("utf-8", "surrogateescape"))
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if data.startswith(b"\xef\xbb\xbf"):
                  path.write_bytes(data[3:])
                  cleaned.append(path.as_posix())
          print("removed UTF-8 BOM from", cleaned)
          PY

          git rm -f --ignore-unmatch .github/workflows/one-shot-consolidate-all-branches.yml
          cargo fmt --all

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          report_dir = Path(os.environ["REPORT_DIR"])
          plan = json.loads((report_dir / "plan.json").read_text(encoding="utf-8"))
          result = json.loads((report_dir / "merge-result.json").read_text(encoding="utf-8"))
          archive = Path("docs/archive")
          archive.mkdir(parents=True, exist_ok=True)
          ledger = {
              "schema": "cex.branch-consolidation-ledger.v1",
              "generated_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "main_before": plan["main_before"],
              "pre_validation_head": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "source_branch_count": plan["source_branch_count"],
              "unique_tip_count": plan["unique_tip_count"],
              "policy": plan["policy"],
              "branches": plan["branches"],
              "results": result["results"],
              "all_source_tips_are_ancestors": True,
              "final_branch_policy": "retain only refs/heads/main",
          }
          (archive / "branch-consolidation-2026-08-29.json").write_text(
              json.dumps(ledger, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          conflicts = sum(len(item["conflicts"]) for item in result["results"])
          merged = sum(item["action"].startswith("merged") for item in result["results"])
          already = sum(item["action"] == "already_included" for item in result["results"])
          (archive / "branch-consolidation-2026-08-29.md").write_text(
              "\n".join(
                  [
                      "# Branch consolidation — 2026-08-29",
                      "",
                      f"- Source branches: **{plan['source_branch_count']}**",
                      f"- Unique branch tips: **{plan['unique_tip_count']}**",
                      f"- Tips merged: **{merged}**",
                      f"- Tips already included: **{already}**",
                      f"- Conflicted paths resolved: **{conflicts}**",
                      f"- Main before: `{plan['main_before']}`",
                      "- Every source tip is retained as an ancestor of the final main history.",
                      "- Final branch policy: only `main` remains.",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY

          # The union of all branches may add workspace members or dependencies.  Allow one
          # controlled reconciliation, commit it, then all authoritative checks run --locked.
          cargo check --workspace --all-targets
          git add -A
          if ! git diff --cached --quiet; then
            git commit --no-verify -m "merge: consolidate all repository branches into main"
          fi
          cargo fmt --all --check
          cargo metadata --locked --format-version 1 --no-deps >/dev/null

      - name: Validate immutable consolidated tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$(cat "$REPORT_DIR/main-before.txt")"..HEAD -- \
            '*.rs' '*.toml' '*.py' '*.sh' '*.ps1' '*.yml' '*.yaml' '*.json'
          python3 scripts/check-p0-release-candidate-hygiene.py
          python3 scripts/check-p0-wiring.py
          python3 scripts/check-trnm-settlement-receipt-lookup.py
          cargo check --workspace --all-targets --locked
          cargo test --workspace --locked

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          report = Path(os.environ["REPORT_DIR"])
          plan = json.loads((report / "plan.json").read_text(encoding="utf-8"))
          final_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          missing = []
          for item in plan["branches"]:
              result = subprocess.run(
                  ["git", "merge-base", "--is-ancestor", item["sha"], final_sha]
              )
              if result.returncode != 0:
                  missing.append(f"{item['branch']}@{item['sha']}")
          if missing:
              raise SystemExit("post-validation ancestor loss: " + ", ".join(missing))
          (report / "validated-head.txt").write_text(final_sha + "\n", encoding="utf-8")
          PY

      - name: Advance main and delete all other branches
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN="$(cat "$REPORT_DIR/main-before.txt")"
          FINAL_SHA="$(cat "$REPORT_DIR/validated-head.txt")"
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$REMOTE_MAIN" == "$EXPECTED_MAIN" ]] || {
            echo "main moved during consolidation: expected=$EXPECTED_MAIN actual=$REMOTE_MAIN" >&2
            exit 1
          }

          git push origin HEAD:refs/heads/main
          printf '%s\n' "$FINAL_SHA" > "$REPORT_DIR/main-after.txt"

          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -vE '^(HEAD|main)$' | sort -u
          )
          : > "$REPORT_DIR/deleted-branches.txt"
          : > "$REPORT_DIR/delete-failures.txt"

          # Delete the controller last so its own running workflow remains addressable.
          for branch in "${branches[@]}"; do
            [[ "$branch" == "$AUTOMATION_BRANCH" ]] && continue
            if git push origin --delete "$branch"; then
              printf '%s\n' "$branch" >> "$REPORT_DIR/deleted-branches.txt"
            else
              printf '%s\n' "$branch" >> "$REPORT_DIR/delete-failures.txt"
            fi
          done
          if printf '%s\n' "${branches[@]}" | grep -Fxq "$AUTOMATION_BRANCH"; then
            if git push origin --delete "$AUTOMATION_BRANCH"; then
              printf '%s\n' "$AUTOMATION_BRANCH" >> "$REPORT_DIR/deleted-branches.txt"
            else
              printf '%s\n' "$AUTOMATION_BRANCH" >> "$REPORT_DIR/delete-failures.txt"
            fi
          fi

          if [[ -s "$REPORT_DIR/delete-failures.txt" ]]; then
            echo "branch deletion failures:" >&2
            cat "$REPORT_DIR/delete-failures.txt" >&2
            exit 1
          fi

          git ls-remote --heads origin | sort > "$REPORT_DIR/final-heads.txt"
          [[ "$(wc -l < "$REPORT_DIR/final-heads.txt")" -eq 1 ]]
          grep -Fxq "$FINAL_SHA	refs/heads/main" "$REPORT_DIR/final-heads.txt"

      - name: Publish final summary
        if: always()
        shell: bash
        run: |
          {
            echo '## CEX all-branch consolidation'
            echo
            [[ -f "$REPORT_DIR/main-before.txt" ]] && echo "- Main before: \`$(cat "$REPORT_DIR/main-before.txt")\`"
            [[ -f "$REPORT_DIR/main-after.txt" ]] && echo "- Main after: \`$(cat "$REPORT_DIR/main-after.txt")\`"
            if [[ -f "$REPORT_DIR/deleted-branches.txt" ]]; then
              echo "- Deleted branches: \`$(sed '/^$/d' "$REPORT_DIR/deleted-branches.txt" | sort -u | wc -l)\`"
            fi
            if [[ -f "$REPORT_DIR/final-heads.txt" ]]; then
              echo '- Final heads:'
              echo '```text'
              cat "$REPORT_DIR/final-heads.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cex-branch-consolidation-${{ github.run_id }}
          path: ${{ runner.temp }}/cex-branch-consolidation
          if-no-files-found: warn
          retention-days: 90
