name: cex-live-closure-diagnostic

on:
  push:
    branches:
      - tmp/cex-world-pin-materialize-20260907

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  capture-live-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Capture repository, PR, workflow and governance state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p run/live-state

          fetch() {
            local name="$1"
            local url="$2"
            local status
            status="$(curl --silent --show-error --location \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --output "run/live-state/${name}.json" \
              --write-out '%{http_code}' \
              "$url" || true)"
            printf '%s\n' "$status" > "run/live-state/${name}.status"
          }

          fetch cex-repository https://api.github.com/repos/TrillionniumFoundation/CEX
          fetch cex-pr-34 https://api.github.com/repos/TrillionniumFoundation/CEX/pulls/34
          cex_head="$(jq -r '.head.sha // empty' run/live-state/cex-pr-34.json)"
          test -n "$cex_head"
          printf '%s\n' "$cex_head" > run/live-state/cex-head.txt
          fetch cex-pr-34-reviews https://api.github.com/repos/TrillionniumFoundation/CEX/pulls/34/reviews?per_page=100
          fetch cex-pr-34-review-comments https://api.github.com/repos/TrillionniumFoundation/CEX/pulls/34/comments?per_page=100
          fetch cex-head-runs "https://api.github.com/repos/TrillionniumFoundation/CEX/actions/runs?head_sha=${cex_head}&per_page=100"
          fetch cex-head-checks "https://api.github.com/repos/TrillionniumFoundation/CEX/commits/${cex_head}/check-runs?per_page=100"
          fetch cex-rulesets https://api.github.com/repos/TrillionniumFoundation/CEX/rulesets
          fetch cex-main https://api.github.com/repos/TrillionniumFoundation/CEX/branches/main
          fetch cex-main-protection https://api.github.com/repos/TrillionniumFoundation/CEX/branches/main/protection
          fetch cex-actions-permissions https://api.github.com/repos/TrillionniumFoundation/CEX/actions/permissions
          fetch cex-workflows https://api.github.com/repos/TrillionniumFoundation/CEX/actions/workflows?per_page=100
          fetch cex-issue-32 https://api.github.com/repos/TrillionniumFoundation/CEX/issues/32
          fetch cex-issue-33 https://api.github.com/repos/TrillionniumFoundation/CEX/issues/33

          fetch world-repository https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World
          fetch world-pr-60 https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/pulls/60
          world_head="$(jq -r '.head.sha // empty' run/live-state/world-pr-60.json)"
          test -n "$world_head"
          printf '%s\n' "$world_head" > run/live-state/world-head.txt
          fetch world-pr-60-reviews https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/pulls/60/reviews?per_page=100
          fetch world-pr-60-review-comments https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/pulls/60/comments?per_page=100
          fetch world-head-runs "https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/actions/runs?head_sha=${world_head}&per_page=100"
          fetch world-head-checks "https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/commits/${world_head}/check-runs?per_page=100"
          fetch world-rulesets https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/rulesets
          fetch world-main https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/branches/main
          fetch world-main-protection https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/branches/main/protection
          fetch world-actions-permissions https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/actions/permissions
          fetch world-workflows https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/actions/workflows?per_page=100
          fetch world-issue-4 https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/issues/4
          fetch world-issue-54 https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/issues/54

          python3 - <<'PY'
          import json
          import pathlib

          root = pathlib.Path('run/live-state')

          def load(name):
              path = root / f'{name}.json'
              try:
                  return json.loads(path.read_text())
              except Exception as error:
                  return {'_parse_error': str(error), '_raw': path.read_text(errors='replace')[:5000]}

          def status(name):
              return (root / f'{name}.status').read_text().strip()

          cex_pr = load('cex-pr-34')
          world_pr = load('world-pr-60')
          cex_runs = load('cex-head-runs')
          world_runs = load('world-head-runs')
          cex_checks = load('cex-head-checks')
          world_checks = load('world-head-checks')

          summary = {
              'schema': 'cex.world.live-closure-diagnostic.v1',
              'cex': {
                  'head_sha': cex_pr.get('head', {}).get('sha'),
                  'base_sha': cex_pr.get('base', {}).get('sha'),
                  'state': cex_pr.get('state'),
                  'draft': cex_pr.get('draft'),
                  'mergeable': cex_pr.get('mergeable'),
                  'mergeable_state': cex_pr.get('mergeable_state'),
                  'requested_reviewers': [item.get('login') for item in cex_pr.get('requested_reviewers', [])],
                  'workflow_runs': [
                      {
                          'id': item.get('id'),
                          'name': item.get('name'),
                          'event': item.get('event'),
                          'status': item.get('status'),
                          'conclusion': item.get('conclusion'),
                          'run_attempt': item.get('run_attempt'),
                      }
                      for item in cex_runs.get('workflow_runs', [])
                  ],
                  'check_runs': [
                      {
                          'id': item.get('id'),
                          'name': item.get('name'),
                          'status': item.get('status'),
                          'conclusion': item.get('conclusion'),
                          'app': item.get('app', {}).get('slug'),
                      }
                      for item in cex_checks.get('check_runs', [])
                  ],
                  'reviews': [
                      {
                          'id': item.get('id'),
                          'user': item.get('user', {}).get('login'),
                          'state': item.get('state'),
                          'commit_id': item.get('commit_id'),
                          'submitted_at': item.get('submitted_at'),
                      }
                      for item in load('cex-pr-34-reviews')
                      if isinstance(item, dict)
                  ],
              },
              'world': {
                  'head_sha': world_pr.get('head', {}).get('sha'),
                  'base_sha': world_pr.get('base', {}).get('sha'),
                  'state': world_pr.get('state'),
                  'draft': world_pr.get('draft'),
                  'mergeable': world_pr.get('mergeable'),
                  'mergeable_state': world_pr.get('mergeable_state'),
                  'requested_reviewers': [item.get('login') for item in world_pr.get('requested_reviewers', [])],
                  'workflow_runs': [
                      {
                          'id': item.get('id'),
                          'name': item.get('name'),
                          'event': item.get('event'),
                          'status': item.get('status'),
                          'conclusion': item.get('conclusion'),
                          'run_attempt': item.get('run_attempt'),
                      }
                      for item in world_runs.get('workflow_runs', [])
                  ],
                  'check_runs': [
                      {
                          'id': item.get('id'),
                          'name': item.get('name'),
                          'status': item.get('status'),
                          'conclusion': item.get('conclusion'),
                          'app': item.get('app', {}).get('slug'),
                      }
                      for item in world_checks.get('check_runs', [])
                  ],
                  'reviews': [
                      {
                          'id': item.get('id'),
                          'user': item.get('user', {}).get('login'),
                          'state': item.get('state'),
                          'commit_id': item.get('commit_id'),
                          'submitted_at': item.get('submitted_at'),
                      }
                      for item in load('world-pr-60-reviews')
                      if isinstance(item, dict)
                  ],
              },
              'http_statuses': {
                  path.stem: path.read_text().strip()
                  for path in sorted(root.glob('*.status'))
              },
          }
          (root / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload live-state snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-world-live-state-${{ github.sha }}
          path: run/live-state/**
          if-no-files-found: error
          retention-days: 1
