name: p0-self-hosted-runner-diagnostics

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Bounded operator-requested allocation diagnostic
        required: false
        default: operator-check
        type: string

# Allocation-only diagnostics. No checkout, source execution, repository token
# permissions or secrets are exposed to persistent runners.
permissions: {}

concurrency:
  group: p0-self-hosted-runner-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-cex-full-gate:
    name: self-hosted-diagnostic/windows-cex-full-gate
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, cex-full-gate]
    timeout-minutes: 5
    steps:
      - name: Verify main-only manual allocation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') { throw 'manual dispatch required' }
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'main ref required' }
          if (-not $env:RUNNER_NAME) { throw 'RUNNER_NAME is empty' }
          if ($env:RUNNER_OS -ne 'Windows') { throw "unexpected runner OS: $env:RUNNER_OS" }
          if ($env:RUNNER_ARCH -ne 'X64') { throw "unexpected runner arch: $env:RUNNER_ARCH" }
          Write-Host "runner=$env:RUNNER_NAME os=$env:RUNNER_OS arch=$env:RUNNER_ARCH reason=${{ inputs.reason }} production_authorization=not_granted"

  linux-rog:
    name: self-hosted-diagnostic/linux-rog
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, rog]
    timeout-minutes: 5
    steps:
      - name: Verify main-only manual allocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_NAME" = rog
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          printf 'runner=%s\nos=%s\narch=%s\nreason=%s\nproduction_authorization=not_granted\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" '${{ inputs.reason }}'

  linux-pocket4:
    name: self-hosted-diagnostic/linux-pocket4
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, pocket4]
    timeout-minutes: 5
    steps:
      - name: Verify main-only manual allocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_NAME" = pocket4
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          printf 'runner=%s\nos=%s\narch=%s\nreason=%s\nproduction_authorization=not_granted\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" '${{ inputs.reason }}'

  macbook-arm64:
    name: self-hosted-diagnostic/macbook-arm64
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, macbook]
    timeout-minutes: 5
    steps:
      - name: Verify main-only manual allocation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_NAME" = macbook-pro
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          printf 'runner=%s\nos=%s\narch=%s\nreason=%s\nproduction_authorization=not_granted\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" '${{ inputs.reason }}'
