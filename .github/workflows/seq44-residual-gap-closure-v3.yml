name: seq44-residual-gap-closure-v3

on:
  push:
    branches:
      - automation/seq44-residual-gap-closure
    paths:
      - 'scripts/seq44_apply_v3.py'
      - '.github/workflows/seq44-residual-gap-closure-v3.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: seq44-residual-gap-closure-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-qualify:
    if: github.event.head_commit.message == 'chore(ci): launch seq44 final residual closure'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '1'
    steps:
      - name: Checkout exact bootstrap branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Install supply-chain tools
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Apply, squash, qualify and publish repository closure tree
        run: python3 scripts/seq44_apply_v3.py
