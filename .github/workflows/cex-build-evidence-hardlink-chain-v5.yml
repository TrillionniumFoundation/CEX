name: cex-build-evidence-hardlink-chain-v5

on:
  push:
    branches:
      - ops/object-export-fc8643d-20260910

permissions:
  contents: write

concurrency:
  group: cex-build-evidence-hardlink-chain-v5
  cancel-in-progress: false

jobs:
  prove_repair:
    name: cex-evidence/repository-local-private-inode-v5
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ORIGINAL_HEAD: fc8643d76e7c9ca2691712e39985c7b2ae06ad74
      TARGET_BRANCH: integration/cex-v12-sequence54-20260908
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      RUST_TEST_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch v4 transformer and a canonical repaired target head
        shell: bash
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/patch-trnm-evidence-staging-v4.py"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/patch-trnm-evidence-staging-v4.py" \
            > "$helper"
          python3 "$helper" --self-test

          remote="https://x-access-token:${GH_WRITE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ready=false
          for _ in $(seq 1 360); do
            current="$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
            test -n "$current"
            rm -rf "$RUNNER_TEMP/cex"
            git init -q "$RUNNER_TEMP/cex"
            git -C "$RUNNER_TEMP/cex" remote add origin "$remote"
            git -C "$RUNNER_TEMP/cex" fetch -q --no-tags origin "$current" "$ORIGINAL_HEAD"
            git -C "$RUNNER_TEMP/cex" checkout -q --detach "$current"
            git -C "$RUNNER_TEMP/cex" merge-base --is-ancestor "$ORIGINAL_HEAD" HEAD

            source="$RUNNER_TEMP/cex/scripts/rust_advisory_packages_v5.py"
            generated="$RUNNER_TEMP/pre-stage-semantics.json"
            if grep -Fq 'external_package = "trnm-game-" + "server"' "$source" \
              && ! grep -Fq 'cargo test -p trnm-game-server --locked' "$source" \
              && (cd "$RUNNER_TEMP/cex" && python3 scripts/generate-repository-semantics.py --stdout) > "$generated" \
              && cmp -s "$generated" "$RUNNER_TEMP/cex/docs/repository-contract-semantics-v1.json"; then
              ready=true
              break
            fi
            sleep 20
          done
          test "$ready" = true
          printf 'CEX_EVIDENCE_V5_INPUT_HEAD=%s\n' "$current"

      - name: Verify prerequisite policy and deterministic helper tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cex"
          python3 scripts/check-sequence54-rustsec-admission.py
          python3 scripts/test-trnm-build-evidence.py

      - name: Build and prove Cargo hardlink to private-inode byte identity
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          work="$RUNNER_TEMP/cex"
          cd "$work"
          cargo build --release --workspace --locked

          binary="$work/target/release/trnm-economy-service"
          proof="$work/target/evidence/trnm-economy-service-proof"
          test -f "$binary"
          ! test -L "$binary"
          original_links="$(stat -c %h "$binary")"
          test "$original_links" -gt 1
          mkdir -p -- "$work/target/evidence"
          rm -f -- "$proof"
          install -m 0755 -- "$binary" "$proof"
          test -f "$proof"
          ! test -L "$proof"
          test "$(stat -c %h "$proof")" = 1
          test "$(stat -c %s "$binary")" = "$(stat -c %s "$proof")"
          test "$(sha256sum "$binary" | awk '{print $1}')" = \
            "$(sha256sum "$proof" | awk '{print $1}')"
          printf 'CARGO_RELEASE_BINARY_LINK_COUNT=%s\n' "$original_links"
          printf 'REPOSITORY_LOCAL_PRIVATE_INODE_PROOF=PASS\n'

      - name: Insert or upgrade the exact collector staging boundary
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cex"
          workflow="$work/.github/workflows/trnm-economy-settlement.yml"
          before="$(git -C "$work" hash-object "$workflow")"
          python3 "$RUNNER_TEMP/patch-trnm-evidence-staging-v4.py" "$workflow"
          after="$(git -C "$work" hash-object "$workflow")"
          git -C "$work" diff --check
          if test "$before" = "$after"; then
            printf 'workflow_changed=false\n' >> "$GITHUB_OUTPUT"
            printf 'CEX_REPOSITORY_LOCAL_STAGING=already_exact\n'
          else
            printf 'workflow_changed=true\n' >> "$GITHUB_OUTPUT"
            test "$(git -C "$work" diff --name-only)" = \
              '.github/workflows/trnm-economy-settlement.yml'
            printf 'CEX_REPOSITORY_LOCAL_STAGING=staged\n'
          fi
          grep -Fq 'TRNM_EVIDENCE_BINARY="target/evidence/trnm-economy-service"' "$workflow"
          test "$(grep -Fc 'mkdir -p -- target/evidence' "$workflow")" -eq 1
          ! grep -Fq '$RUNNER_TEMP/trnm-economy-service-evidence' "$workflow"

      - name: Regenerate exact semantics and re-run repository gates
        id: semantics
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cex"
          generated="$RUNNER_TEMP/post-stage-semantics.json"
          (
            cd "$work"
            python3 scripts/generate-repository-semantics.py --stdout
          ) > "$generated"
          python3 - "$generated" <<'PY'
          import json
          import sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          assert value.get('production_authorization') == 'not_granted'
          assert isinstance(value.get('source_tree_sha256'), str)
          PY
          if cmp -s "$generated" "$work/docs/repository-contract-semantics-v1.json"; then
            printf 'semantic_changed=false\n' >> "$GITHUB_OUTPUT"
          else
            cp "$generated" "$work/docs/repository-contract-semantics-v1.json"
            printf 'semantic_changed=true\n' >> "$GITHUB_OUTPUT"
          fi

          regenerated="$RUNNER_TEMP/post-stage-recheck.json"
          (cd "$work" && python3 scripts/generate-repository-semantics.py --stdout) > "$regenerated"
          cmp "$regenerated" "$work/docs/repository-contract-semantics-v1.json"
          (
            cd "$work"
            python3 scripts/check-sequence54-rustsec-admission.py
            python3 scripts/test-trnm-build-evidence.py
          )
          git -C "$work" diff --check
          changed="$(git -C "$work" diff --name-only | sort)"
          if test -n "$changed"; then
            case "$changed" in
              '.github/workflows/trnm-economy-settlement.yml') ;;
              'docs/repository-contract-semantics-v1.json') ;;
              $'.github/workflows/trnm-economy-settlement.yml\ndocs/repository-contract-semantics-v1.json') ;;
              *) printf 'unexpected changed files:\n%s\n' "$changed" >&2; exit 1 ;;
            esac
          fi

      - name: Ordinary fast-forward the exact live PR branch when needed
        if: steps.patch.outputs.workflow_changed == 'true' || steps.semantics.outputs.semantic_changed == 'true'
        shell: bash
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cex"
          original="$(git -C "$work" rev-parse HEAD)"
          remote="https://x-access-token:${GH_WRITE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          test "$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$original"
          git -C "$work" config user.name 'ProfHepta'
          git -C "$work" config user.email '102159240+ProfHepta@users.noreply.github.com'
          git -C "$work" add \
            .github/workflows/trnm-economy-settlement.yml \
            docs/repository-contract-semantics-v1.json
          git -C "$work" commit -m 'fix(evidence): stage Cargo hardlinks inside repository output'
          new_head="$(git -C "$work" rev-parse HEAD)"
          git -C "$work" push origin "HEAD:refs/heads/$TARGET_BRANCH"
          test "$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$new_head"
          printf 'CEX_EVIDENCE_V5_HEAD=%s\n' "$new_head"
          printf 'FORCE_UPDATE=false\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'

      - name: Verify no repository change was needed
        if: steps.patch.outputs.workflow_changed != 'true' && steps.semantics.outputs.semantic_changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C "$RUNNER_TEMP/cex" diff --name-only)"
          printf 'CEX_EVIDENCE_V5=already_present_and_verified\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'
