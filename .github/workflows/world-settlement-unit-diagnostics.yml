name: world-settlement-unit-diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - ci/world-settlement-capture-boundary-v1
    paths:
      - '.github/workflows/world-settlement-unit-diagnostics.yml'
      - 'evidence/world-settlement-external-lock.json'

permissions:
  contents: read

concurrency:
  group: world-settlement-unit-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: world-settlement-unit-diagnostics/exact-world-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout diagnostic definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Load exact World identity
        id: lock
        run: |
          set -euo pipefail
          jq -e '
            .schema == "trnm_world_cex_settlement_external_lock_v1" and
            (.world.commit | test("^[0-9a-f]{40}$")) and
            (.world.tree | test("^[0-9a-f]{40}$")) and
            .promotion_effect == "none" and
            .trusted_settlement == false and
            .public_online == false and
            .public_player_market == false
          ' evidence/world-settlement-external-lock.json >/dev/null
          echo "repository=$(jq -r '.world.repository' evidence/world-settlement-external-lock.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r '.world.commit' evidence/world-settlement-external-lock.json)" >> "$GITHUB_OUTPUT"
          echo "tree=$(jq -r '.world.tree' evidence/world-settlement-external-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout exact World candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.lock.outputs.repository }}
          ref: ${{ steps.lock.outputs.commit }}
          path: world
          persist-credentials: false

      - name: Verify exact World identity
        run: |
          set -euo pipefail
          test "$(git -C world rev-parse HEAD)" = '${{ steps.lock.outputs.commit }}'
          test "$(git -C world rev-parse 'HEAD^{tree}')" = '${{ steps.lock.outputs.tree }}'
          git -C world diff --exit-code

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Capture every ownership and unit contract separately
        working-directory: world/trillionnium
        shell: bash
        run: |
          set -uo pipefail
          out='../../run/world-unit-diagnostics'
          mkdir -p "$out"
          cargo metadata --locked --no-deps --format-version 1 > "$out/metadata.json" 2> "$out/metadata.stderr"
          metadata_rc=$?
          printf '%s\n' "$metadata_rc" > "$out/metadata.exit-code"
          cargo fmt --all
          fmt_rc=$?
          printf '%s\n' "$fmt_rc" > "$out/rustfmt.exit-code"

          run_case() {
            name="$1"
            shift
            printf '%q ' "$@" > "$out/${name}.command"
            printf '\n' >> "$out/${name}.command"
            "$@" \
              > >(tee "$out/${name}.stdout") \
              2> >(tee "$out/${name}.stderr" >&2)
            rc=$?
            printf '%s\n' "$rc" > "$out/${name}.exit-code"
            printf '%s\t%s\n' "$name" "$rc" >> "$out/results.tsv"
          }

          : > "$out/results.tsv"
          if (( metadata_rc == 0 && fmt_rc == 0 )); then
            run_case lib cargo test -p trnm-game-server --lib --locked
            run_case entitlement-signer cargo test -p trnm-game-server --bin trnm-entitlement-signer --locked
            run_case game-server-boundary cargo test -p trnm-game-server --test settlement_game_server_boundary --locked
            run_case remote-identity cargo test -p trnm-game-server --test settlement_remote_identity_contract --locked
            run_case worker-contract cargo test -p trnm-game-server --test settlement_worker_contract --locked
            run_case fault-model cargo test -p trnm-game-server --test settlement_fault_model --locked
          else
            printf 'preflight\t1\n' >> "$out/results.tsv"
          fi
          awk -F '\t' '$2 != 0 {failed=1} END {print failed ? "failed" : "passed"}' "$out/results.tsv" > "$out/overall-status"
          cat "$out/results.tsv"
          # Diagnostic workflow always uploads its evidence. The machine-readable
          # result, not this job conclusion, identifies the failing command.
          exit 0

      - name: Write diagnostic manifest
        if: always()
        env:
          WORLD_REPOSITORY: ${{ steps.lock.outputs.repository }}
          WORLD_COMMIT: ${{ steps.lock.outputs.commit }}
          WORLD_TREE: ${{ steps.lock.outputs.tree }}
        run: |
          mkdir -p run/world-unit-diagnostics
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('run/world-unit-diagnostics')
          rows = []
          results = root / 'results.tsv'
          if results.is_file():
              for line in results.read_text().splitlines():
                  if not line.strip():
                      continue
                  name, rc = line.split('\t', 1)
                  rows.append({'name': name, 'exit_code': int(rc)})
          files = sorted(path for path in root.rglob('*') if path.is_file())
          payload = {
              'schema': 'trnm_world_settlement_unit_diagnostics_v2',
              'repository': os.environ['WORLD_REPOSITORY'],
              'commit': os.environ['WORLD_COMMIT'],
              'tree': os.environ['WORLD_TREE'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'diagnostic_only': True,
              'promotion_effect': 'none',
              'results': rows,
              'all_passed': bool(rows) and all(row['exit_code'] == 0 for row in rows),
              'sha256': {
                  str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in files
              },
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['payload_sha256'] = hashlib.sha256(canonical).hexdigest()
          (root / 'manifest.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          (
            cd run/world-unit-diagnostics
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload exact diagnostic output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-unit-diagnostics-v2-${{ steps.lock.outputs.commit }}
          path: run/world-unit-diagnostics/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
