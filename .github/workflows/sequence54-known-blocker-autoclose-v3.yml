name: sequence54-known-blocker-autoclose-v3

on:
  push:
    branches:
      - work/sequence54-round2-staging-20260909
    paths:
      - '.github/workflows/sequence54-known-blocker-autoclose-v3.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: sequence54-known-blocker-autoclose-v3
  cancel-in-progress: false

env:
  TARGET_BRANCH: integration/cex-v12-sequence54-20260908
  RUST_TOOLCHAIN: '1.98.1'
  RUST_RELEASE_COMMIT: '48a229ceaefd4985c50990b14116b6d856af0985'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never

jobs:
  repair-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Capture immutable starting identity
        id: start
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          start_sha="$(git rev-parse HEAD)"
          start_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$start_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$start_tree" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$start_sha" >> "$GITHUB_OUTPUT"
          echo "tree=$start_tree" >> "$GITHUB_OUTPUT"
          printf 'start_sha=%s\nstart_tree=%s\n' "$start_sha" "$start_tree"

      - name: Apply fail-closed source repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          changed: list[str] = []

          def write_if_changed(path: Path, text: str) -> None:
              old = path.read_text(encoding="utf-8")
              if old != text:
                  path.write_text(text, encoding="utf-8")
                  changed.append(path.as_posix())

          # 1. A depth-one checkout contains the merge commit but not its parents.
          workflow = Path('.github/workflows/p0-rust-toolchain-convergence.yml')
          text = workflow.read_text(encoding='utf-8')
          merge_checkout = re.compile(
              r'(?ms)(^\s+- name: Checkout GitHub prospective merge object\n'
              r'.*?^\s+path: \.candidate-identity/merge\n'
              r'^\s+fetch-depth: )1(\s*$)'
          )
          text2, count = merge_checkout.subn(r'\g<1>2\2', text, count=1)
          if count == 0:
              already = re.search(
                  r'(?ms)^\s+- name: Checkout GitHub prospective merge object\n'
                  r'.*?^\s+path: \.candidate-identity/merge\n'
                  r'^\s+fetch-depth: 2\s*$',
                  text,
              )
              if not already:
                  raise SystemExit('cannot locate prospective-merge checkout depth')
          write_if_changed(workflow, text2)

          # 2. Bind toolchain policy to parsed selector identities, never comments.
          checker = Path('scripts/rust_toolchain_convergence_v4.py')
          text = checker.read_text(encoding='utf-8')
          helper_marker = 'VERSION_IDENTITY_SELECTOR_KINDS = frozenset('
          if helper_marker not in text:
              anchor = '''@dataclass(frozen=True)\nclass Selector:\n    kind: str\n    identity: str | None\n    line: str\n\n\ndef require(condition: bool, message: str) -> None:\n'''
              replacement = '''@dataclass(frozen=True)\nclass Selector:\n    kind: str\n    identity: str | None\n    line: str\n\n\nVERSION_IDENTITY_SELECTOR_KINDS = frozenset({\n    "rustup_toolchain",\n    "rustup_default",\n    "cargo_plus",\n    "toolchain_assignment",\n    "json_toolchain_assignment",\n    "yaml_toolchain",\n    "toml_toolchain",\n    "rust_version_environment",\n})\nCONTAINER_IDENTITY_SELECTOR_KINDS = frozenset({\n    "container_base",\n    "container_heredoc",\n})\n\n\ndef selector_binds_expected(selector: Selector, expected: str) -> bool:\n    identity = (selector.identity or "").strip()\n    if selector.kind in VERSION_IDENTITY_SELECTOR_KINDS:\n        return identity == expected\n    if selector.kind in CONTAINER_IDENTITY_SELECTOR_KINDS:\n        return re.search(\n            rf"(?i)(?<![A-Za-z0-9_.-])rust:{re.escape(expected)}(?:[-@\\s]|$)",\n            identity,\n        ) is not None\n    return False\n\n\ndef active_source_contains(text: str, needle: str) -> bool:\n    """Return true only when a marker occurs outside a source comment."""\n    for raw_line in text.splitlines():\n        stripped = raw_line.lstrip()\n        if not stripped or stripped.startswith(("#", "//", "/*", "*", "<!--")):\n            continue\n        code = raw_line\n        for marker in (" #", "\\t#", " //"):\n            offset = code.find(marker)\n            if offset >= 0:\n                code = code[:offset]\n        if needle in code:\n            return True\n    return False\n\n\ndef require(condition: bool, message: str) -> None:\n'''
              if text.count(anchor) != 1:
                  raise SystemExit('toolchain Selector anchor drifted')
              text = text.replace(anchor, replacement, 1)

          vulnerable = '''    if selectors and expected not in text:\n        problems.append(f"Rust-selecting carrier does not bind {expected}: {path}")\n'''
          hardened = '''    version_selectors = [\n        selector\n        for selector in selectors\n        if selector.kind in VERSION_IDENTITY_SELECTOR_KINDS\n        or selector.kind in CONTAINER_IDENTITY_SELECTOR_KINDS\n    ]\n    for selector in version_selectors:\n        if not selector_binds_expected(selector, expected):\n            problems.append(\n                f"unapproved fixed Rust identity {selector.identity!r}: {path}"\n            )\n    if selectors and not any(\n        selector_binds_expected(selector, expected)\n        for selector in version_selectors\n    ):\n        problems.append(f"Rust-selecting carrier does not bind {expected}: {path}")\n'''
          if vulnerable in text:
              text = text.replace(vulnerable, hardened, 1)
          elif 'unapproved fixed Rust identity' not in text:
              raise SystemExit('toolchain selector-binding predicate drifted')

          vulnerable_required = '''    if required_binding:\n        if expected not in text:\n            problems.append(f"required toolchain binding omits Rust {expected}: {path}")\n        if path not in {"rust-toolchain", "rust-toolchain.toml"} and release_commit not in text:\n            problems.append(\n                f"required toolchain binding omits release commit {release_commit}: {path}"\n            )\n    if observer_present(path, classification, text) and release_commit not in text:\n'''
          hardened_required = '''    release_commit_bound = active_source_contains(text, release_commit)\n    if required_binding:\n        if not any(\n            selector_binds_expected(selector, expected)\n            for selector in version_selectors\n        ):\n            problems.append(f"required toolchain binding omits Rust {expected}: {path}")\n        if (\n            path not in {"rust-toolchain", "rust-toolchain.toml"}\n            and not release_commit_bound\n        ):\n            problems.append(\n                f"required toolchain binding omits release commit {release_commit}: {path}"\n            )\n    if observer_present(path, classification, text) and not release_commit_bound:\n'''
          if vulnerable_required in text:
              text = text.replace(vulnerable_required, hardened_required, 1)
          elif 'release_commit_bound = active_source_contains' not in text:
              raise SystemExit('toolchain release-binding predicate drifted')

          hostile_anchor = '    unregistered_path = "services/example/toolchain.carrier"\n'
          hostile_marker = 'wrong_fixed_version_with_expected_comment'
          if hostile_marker not in text:
              hostile_tests = '''    label = "wrong_fixed_version_with_expected_comment"\n    problems, selectors = analyse_text(\n        "scripts/wrong-fixed.sh",\n        f"# expected Rust {expected}\\nexport RUSTUP_TOOLCHAIN=1.97.0\\n",\n        classification="content_discovered",\n        expected=expected,\n        release_commit=release_commit,\n        obsolete=obsolete,\n        floating_channels=floating,\n        policy_definition=False,\n        required_binding=False,\n    )\n    require(bool(selectors), f"hostile fixture had no selector: {label}")\n    assert_rejected(label, problems)\n    executed.append(label)\n\n    label = "conflicting_fixed_selectors"\n    problems, selectors = analyse_text(\n        "scripts/conflicting-fixed.sh",\n        f"export RUSTUP_TOOLCHAIN={expected}\\ncargo +1.97.0 test\\n",\n        classification="content_discovered",\n        expected=expected,\n        release_commit=release_commit,\n        obsolete=obsolete,\n        floating_channels=floating,\n        policy_definition=False,\n        required_binding=False,\n    )\n    require(len(selectors) >= 2, f"hostile fixture lost a selector: {label}")\n    assert_rejected(label, problems)\n    executed.append(label)\n\n    label = "required_binding_release_comment_only"\n    problems, selectors = analyse_text(\n        "scripts/comment-only-release.sh",\n        f"export RUSTUP_TOOLCHAIN={expected}\\n# release commit {release_commit}\\n",\n        classification="content_discovered",\n        expected=expected,\n        release_commit=release_commit,\n        obsolete=obsolete,\n        floating_channels=floating,\n        policy_definition=False,\n        required_binding=True,\n    )\n    require(bool(selectors), f"hostile fixture had no selector: {label}")\n    assert_rejected(label, problems)\n    executed.append(label)\n\n'''
              if text.count(hostile_anchor) != 1:
                  raise SystemExit('toolchain hostile fixture anchor drifted')
              text = text.replace(hostile_anchor, hostile_tests + hostile_anchor, 1)

          positive_marker = 'active_expected_selector_and_release_binding'
          return_anchor = '    return executed, accepted\n'
          if positive_marker not in text:
              positive = '''    label = "active_expected_selector_and_release_binding"\n    problems, selectors = analyse_text(\n        "scripts/active-binding.sh",\n        (\n            f"export RUSTUP_TOOLCHAIN={expected}\\n"\n            f"export RUST_RELEASE_COMMIT={release_commit}\\n"\n            "rustc --version --verbose\\n"\n        ),\n        classification="content_discovered",\n        expected=expected,\n        release_commit=release_commit,\n        obsolete=obsolete,\n        floating_channels=floating,\n        policy_definition=False,\n        required_binding=True,\n    )\n    require(bool(selectors), f"positive fixture had no selector: {label}")\n    require(not problems, f"positive fixture was rejected: {label}: {problems}")\n    accepted.append(label)\n\n'''
              if text.count(return_anchor) != 1:
                  raise SystemExit('toolchain positive fixture anchor drifted')
              text = text.replace(return_anchor, positive + return_anchor, 1)
          write_if_changed(checker, text)

          policy_path = Path('docs/security/rust-toolchain-surfaces-v1.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          fixtures = policy.get('hostile_fixtures')
          if not isinstance(fixtures, list):
              raise SystemExit('toolchain policy hostile_fixtures drifted')
          for label in (
              'wrong_fixed_version_with_expected_comment',
              'conflicting_fixed_selectors',
              'required_binding_release_comment_only',
          ):
              if label not in fixtures:
                  fixtures.append(label)
          policy_text = json.dumps(policy, ensure_ascii=False, indent=2) + '\n'
          write_if_changed(policy_path, policy_text)

          # 3. Inspect SQL and internal HTTP endpoints only in executable literals.
          projection = Path('scripts/check-consumer-projection-boundary.py')
          text = projection.read_text(encoding='utf-8')
          old_import = 'from rust_route_contract import RouteSyntaxError, extract_routes\n'
          new_import = (\n              'from rust_route_contract import ('\n              'RouteSyntaxError, decode_string, extract_routes, tokenize)\n'\n          )
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif 'decode_string, extract_routes, tokenize' not in text:
              raise SystemExit('projection checker import drifted')

          helper_anchor = '''FORBIDDEN_INTERNAL_ENDPOINTS = [\n    re.compile(r'/(?:v[0-9]+/)?(?:ledger|audit|executions?|providers?)(?:/|\\")', re.IGNORECASE),\n    re.compile(r'/(?:v[0-9]+/)?(?:chain[-_]?finality|finality)(?:/|\\")', re.IGNORECASE),\n]\n\n\ndef projection_files() -> list[Path]:\n'''
          if 'def source_string_literals(' not in text:
              helper_replacement = '''FORBIDDEN_INTERNAL_ENDPOINTS = [\n    re.compile(r'/(?:v[0-9]+/)?(?:ledger|audit|executions?|providers?)(?:/|\\")', re.IGNORECASE),\n    re.compile(r'/(?:v[0-9]+/)?(?:chain[-_]?finality|finality)(?:/|\\")', re.IGNORECASE),\n]\nSQL_LITERAL_PREFIX_RE = re.compile(\n    r"(?is)^\\s*(?:(?:--[^\\n]*\\n|/\\*.*?\\*/)*\\s*)"\n    r"(?:with|select|insert|update|delete|truncate|create|alter|drop)\\b"\n)\nSQL_CALL_CONTEXT_RE = re.compile(\n    r"(?is)(?:sqlx::)?(?:query(?:_as|_scalar)?!?|execute|prepare)\\s*\\(\\s*$"\n)\nNETWORK_CALL_CONTEXT_RE = re.compile(\n    r"(?is)(?:"\n    r"\\.\\s*(?:get|post|put|patch|delete|request)\\s*\\(\\s*$|"\n    r"(?:Request|Uri|Url)::(?:get|post|put|patch|delete|parse)\\s*\\(\\s*$|"\n    r"\\b(?:url|uri|endpoint|base_url)\\s*[:=][^;\\n]{0,160}$|"\n    r"\\bformat!\\s*\\([^)]{0,160}$"\n    r")"\n)\n\n\ndef source_string_literals(text: str) -> list[tuple[str, int]]:\n    literals: list[tuple[str, int]] = []\n    for token in tokenize(text):\n        if token.kind in {"string", "raw_string"}:\n            literals.append((decode_string(token), token.offset))\n    return literals\n\n\ndef is_sql_literal(text: str, offset: int, value: str) -> bool:\n    context = text[max(0, offset - 256):offset]\n    return (\n        SQL_LITERAL_PREFIX_RE.search(value) is not None\n        or SQL_CALL_CONTEXT_RE.search(context) is not None\n    )\n\n\ndef is_network_endpoint_literal(text: str, offset: int) -> bool:\n    context = text[max(0, offset - 256):offset]\n    return NETWORK_CALL_CONTEXT_RE.search(context) is not None\n\n\ndef projection_files() -> list[Path]:\n'''
              if text.count(helper_anchor) != 1:
                  raise SystemExit('projection helper anchor drifted')
              text = text.replace(helper_anchor, helper_replacement, 1)

          old_scan = '''    for match in DDL_RE.finditer(text):\n        problems.append(\n            f"{relative}:{source_line(text, match.start())}: runtime DDL is forbidden in projection code"\n        )\n\n    for match in MUTATION_RE.finditer(text):\n        table = match.group(1).lower()\n        if table.startswith(FORBIDDEN_AUTHORITY_PREFIXES):\n            problems.append(\n                f"{relative}:{source_line(text, match.start())}: direct mutation of authoritative table {table!r}"\n            )\n        elif not table.startswith(ALLOWED_MUTATION_PREFIXES):\n            problems.append(\n                f"{relative}:{source_line(text, match.start())}: mutation target {table!r} lacks an approved projection namespace"\n            )\n\n    try:\n        declarations = extract_routes(text)\n    except RouteSyntaxError as error:\n        raise AssertionError(f"projection route parsing failed in {relative}: {error}") from error\n'''
          new_scan = '''    try:\n        literals = source_string_literals(text)\n        declarations = extract_routes(text)\n    except RouteSyntaxError as error:\n        raise AssertionError(f"projection route parsing failed in {relative}: {error}") from error\n\n    for value, offset in literals:\n        if not is_sql_literal(text, offset, value):\n            continue\n        for match in DDL_RE.finditer(value):\n            problems.append(\n                f"{relative}:{source_line(text, offset)}: runtime DDL is forbidden in projection code"\n            )\n        for match in MUTATION_RE.finditer(value):\n            table = match.group(1).lower()\n            if table.startswith(FORBIDDEN_AUTHORITY_PREFIXES):\n                problems.append(\n                    f"{relative}:{source_line(text, offset)}: direct mutation of authoritative table {table!r}"\n                )\n            elif not table.startswith(ALLOWED_MUTATION_PREFIXES):\n                problems.append(\n                    f"{relative}:{source_line(text, offset)}: mutation target {table!r} lacks an approved projection namespace"\n                )\n'''
          if old_scan in text:
              text = text.replace(old_scan, new_scan, 1)
          elif 'for value, offset in literals:' not in text:
              raise SystemExit('projection SQL scan drifted')

          old_endpoint_scan = '''    for expression in FORBIDDEN_INTERNAL_ENDPOINTS:\n        for match in expression.finditer(text):\n            problems.append(\n                f"{relative}:{source_line(text, match.start())}: projection code calls an internal authoritative endpoint directly"\n            )\n'''
          new_endpoint_scan = '''    for value, offset in literals:\n        if not is_network_endpoint_literal(text, offset):\n            continue\n        for expression in FORBIDDEN_INTERNAL_ENDPOINTS:\n            if expression.search(value):\n                problems.append(\n                    f"{relative}:{source_line(text, offset)}: projection code calls an internal authoritative endpoint directly"\n                )\n'''
          if old_endpoint_scan in text:
              text = text.replace(old_endpoint_scan, new_endpoint_scan, 1)
          elif 'is_network_endpoint_literal(text, offset)' not in text:
              raise SystemExit('projection endpoint scan drifted')
          write_if_changed(projection, text)

          projection_test = Path('scripts/test-consumer-route-contract.py')
          text = projection_test.read_text(encoding='utf-8')
          test_marker = 'test_non_sql_prose_does_not_trigger_mutation_guard'
          test_anchor = '''    def test_invalid_rust_does_not_silently_skip(self):\n'''
          if test_marker not in text:
              tests = '''    def test_non_sql_prose_does_not_trigger_mutation_guard(self):\n        self.assertEqual(\n            self.check('let note = "update set that should remain prose";'),\n            [],\n        )\n\n    def test_narrative_internal_path_does_not_trigger_network_guard(self):\n        self.assertEqual(\n            self.check('let note = "never call /v1/ledger/settle directly";'),\n            [],\n        )\n\n    def test_direct_internal_endpoint_call_is_rejected(self):\n        self.assertTrue(\n            self.check('client.post("/v1/ledger/settle").send().await;')\n        )\n\n    def test_projection_sql_namespace_remains_allowed(self):\n        self.assertEqual(\n            self.check('sqlx::query("update league_matches set status = 1");'),\n            [],\n        )\n\n'''
              if text.count(test_anchor) != 1:
                  raise SystemExit('projection test anchor drifted')
              text = text.replace(test_anchor, tests + test_anchor, 1)
          write_if_changed(projection_test, text)

          module_doc = Path('docs/modules/consumer-entry-api.md')
          text = module_doc.read_text(encoding='utf-8')
          marker = 'must not silently expand the edge into a second authoritative monolith'
          if marker not in text:
              text = text.rstrip() + (\n                  '\n\nWorld/League projections must not silently expand the edge into a second authoritative monolith.\n'\n              )
          write_if_changed(module_doc, text)

          report = {\n              'schema': 'cex.sequence54-known-blocker-autoclose.v3',\n              'changed_files': sorted(changed),\n              'production_authorization': 'not_granted',\n          }\n          Path('/tmp/sequence54-known-blocker-autoclose.json').write_text(\n              json.dumps(report, indent=2, sort_keys=True) + '\n',\n              encoding='utf-8',\n          )\n          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Python and source-contract qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/rust_toolchain_convergence_v4.py \
            scripts/check-consumer-projection-boundary.py \
            scripts/test-consumer-route-contract.py
          python3 scripts/check-rust-toolchain-convergence.py
          python3 scripts/test-consumer-route-contract.py
          python3 scripts/test-semantic-source-integration.py
          python3 scripts/generate-repository-semantics.py --check
          python3 scripts/check-consumer-projection-boundary.py
          python3 scripts/check-sequence54-integration.py
          python3 scripts/check-sequence54-rustsec-admission.py
          python3 scripts/check-development-docs.py
          python3 scripts/check-module-documentation.py
          git diff --check

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Rust identity and locked-workspace qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"
          rustc --version --verbose | tee /tmp/rustc-version.txt
          grep -Fx "commit-hash: $RUST_RELEASE_COMMIT" /tmp/rustc-version.txt
          cargo metadata --locked --format-version 1 >/tmp/cargo-metadata.json
          test -s /tmp/cargo-metadata.json
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo test --locked -p consumer-entry-api --all-targets --no-fail-fast
          git diff --check

      - name: Commit and fast-forward target branch
        id: publish
        shell: bash
        env:
          START_SHA: ${{ steps.start.outputs.sha }}
        run: |
          set -euo pipefail
          if test -z "$(git status --porcelain)"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No source change was required; all target checks passed.'
            exit 0
          fi
          git add \
            .github/workflows/p0-rust-toolchain-convergence.yml \
            scripts/rust_toolchain_convergence_v4.py \
            docs/security/rust-toolchain-surfaces-v1.json \
            scripts/check-consumer-projection-boundary.py \
            scripts/test-consumer-route-contract.py \
            docs/modules/consumer-entry-api.md
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'sequence54-autoclose[bot]'
          git config user.email 'sequence54-autoclose[bot]@users.noreply.github.com'
          git commit -m 'fix(sequence54): close toolchain and projection admission blockers' \
            -m 'Bind Rust policy to parsed selector identities, retain merge parents during exact-object qualification, and eliminate prose-only projection false positives without weakening real SQL or endpoint guards.' \
            -m 'production-authorization: not_granted'
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$START_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish summary
        if: always()
        shell: bash
        env:
          START_SHA: ${{ steps.start.outputs.sha }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.published_sha }}
          CHANGED: ${{ steps.publish.outputs.changed }}
        run: |
          {
            echo '## Sequence 54 known-blocker autoclose v3'
            echo
            echo "- Start SHA: \`$START_SHA\`"
            echo "- Published SHA: \`${PUBLISHED_SHA:-unchanged}\`"
            echo "- Changed: \`${CHANGED:-unknown}\`"
            echo '- Repairs: prospective-merge parent visibility; syntax-bound Rust identity; executable-literal projection checks'
            echo '- Validation: source checkers, semantic regressions, exact Rust identity, locked workspace check, Consumer Entry tests'
            echo '- Production authorization: `not_granted`'
            echo '- Merge authorization: `not_granted`'
          } >> "$GITHUB_STEP_SUMMARY"
