name: cex-advisory-v2-validation

on:
  push:
    branches:
      - tmp/cex-advisory-v2-20260907

permissions:
  contents: read

concurrency:
  group: cex-advisory-v2-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact validation candidate with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Install pinned supply-chain tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Validate complete exception and manifest closure
        run: python3 scripts/check-rust-advisory-exceptions.py
      - name: Validate cargo-audit policy
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2026-0214
          --ignore RUSTSEC-2024-0436
      - name: Validate Cargo advisory, license and source policy
        run: cargo deny check advisories licenses sources
      - name: Validate Cargo bans with manifest-owned wildcard control
        run: cargo deny check --allow wildcard bans
