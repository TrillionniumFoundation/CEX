name: sequence54-codeql-diagnostics

on:
  push:
    branches:
      - work/sequence54-round2-staging-20260909
    paths:
      - '.github/workflows/sequence54-codeql-diagnostics.yml'

permissions:
  contents: read
  checks: read
  security-events: read

concurrency:
  group: sequence54-codeql-diagnostics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: 9c3ad1f6ab1bf4414682eec2668710c59dcc9a73
      TARGET_REF: refs/heads/integration/cex-v12-sequence54-20260908
    steps:
      - name: Collect immutable CodeQL diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sequence54-codeql"
          mkdir -p "$root/annotations"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          curl -fsSL "${auth[@]}" \
            "$api/commits/$TARGET_SHA/check-runs?per_page=100" \
            -o "$root/check-runs.json"

          jq -r '.check_runs[] | select(.name | startswith("CodeQL")) | .id' \
            "$root/check-runs.json" > "$root/codeql-check-ids.txt"
          while IFS= read -r check_id; do
            test -n "$check_id" || continue
            curl -sSL "${auth[@]}" \
              "$api/check-runs/$check_id/annotations?per_page=100" \
              -o "$root/annotations/$check_id.json"
          done < "$root/codeql-check-ids.txt"

          alerts_url="$api/code-scanning/alerts?state=open&ref=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["TARGET_REF"], safe=""))')&per_page=100"
          http_code="$(curl -sS "${auth[@]}" -o "$root/code-scanning-alerts.json" -w '%{http_code}' "$alerts_url")"
          printf '%s\n' "$http_code" > "$root/code-scanning-alerts.http-status"

          python3 - "$root" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          summary = {
              'schema': 'cex.sequence54-codeql-diagnostics.v1',
              'target_sha': '9c3ad1f6ab1bf4414682eec2668710c59dcc9a73',
              'target_ref': 'refs/heads/integration/cex-v12-sequence54-20260908',
              'production_authorization': 'not_granted',
              'files': [],
          }
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'summary.json':
                  raw = path.read_bytes()
                  summary['files'].append({
                      'path': path.relative_to(root).as_posix(),
                      'bytes': len(raw),
                      'sha256': hashlib.sha256(raw).hexdigest(),
                  })
          (root / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload CodeQL diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sequence54-codeql-diagnostics-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/sequence54-codeql
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
