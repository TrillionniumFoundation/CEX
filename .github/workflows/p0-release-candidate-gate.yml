name: p0-release-candidate-gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: p0-release-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_TEST_THREADS: '1'
  RUST_TOOLCHAIN: '1.98.1'
  HEPTA_TEST_DATABASE_URL: postgres://cex:cex_ci_password@127.0.0.1:5432/cex_ci
  HEPTA_REQUIRE_POSTGRES_TESTS: '1'
  DATABASE_URL: postgres://cex:cex_ci_password@127.0.0.1:5432/cex_ci
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: cex
  PGPASSWORD: cex_ci_password
  PGDATABASE: cex_ci

jobs:
  repository-candidate-qualification:
    name: repository-candidate-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: cex
          POSTGRES_PASSWORD: cex_ci_password
          POSTGRES_DB: cex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cex -d cex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact candidate with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Record source and toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"
          mkdir -p run/repository-candidate
          git rev-parse HEAD | tee run/repository-candidate/head-sha.txt
          git rev-parse 'HEAD^{tree}' | tee run/repository-candidate/head-tree.txt
          rustc --version --verbose | tee run/repository-candidate/rustc-version.txt
          cargo --version --verbose | tee run/repository-candidate/cargo-version.txt
          rustup show active-toolchain | tee run/repository-candidate/active-toolchain.txt

      - name: Validate repository authority and blocker posture
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-rust-toolchain-convergence.py \
            | tee run/repository-candidate/rust-toolchain-policy.json
          python3 scripts/check-module-documentation.py \
            | tee run/repository-candidate/module-documentation.json
          python3 scripts/check-capability-production-posture.py \
            | tee run/repository-candidate/capability-posture.json
          python3 scripts/check-authoritative-money-isolation.py \
            | tee run/repository-candidate/money-isolation.json
          python3 scripts/check-project-boundary.py \
            | tee run/repository-candidate/project-boundary.json
          python3 scripts/check-project-boundary-cargo-closure.py \
            | tee run/repository-candidate/project-boundary-cargo.json
          python3 scripts/check-source-governance.py \
            | tee run/repository-candidate/source-governance.json
          python3 scripts/check-development-docs.py \
            | tee run/repository-candidate/development-docs.json
          python3 scripts/check-hepta-lint-ownership.py \
            | tee run/repository-candidate/hepta-lint-ownership.json
          python3 scripts/check-p0-release-candidate-hygiene.py \
            | tee run/repository-candidate/candidate-hygiene.json
          python3 scripts/check-p0-wiring.py \
            | tee run/repository-candidate/p0-wiring.json
          python3 scripts/check-trnm-economy-settlement-contract.py \
            | tee run/repository-candidate/trnm-economy-contract.json
          python3 scripts/check-release-baseline-manifest.py \
            docs/templates/cex-release-baseline-manifest-v1.json --allow-template \
            | tee run/repository-candidate/release-template.json
          python3 scripts/check-repository-integrity.py \
            --output run/repository-candidate/repository-integrity.json

      - name: Strict complete workspace qualification
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 \
            > run/repository-candidate/cargo-metadata.json
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked \
            2>&1 | tee run/repository-candidate/cargo-test.txt
          cargo clippy --workspace --all-targets --locked -- -D warnings \
            2>&1 | tee run/repository-candidate/cargo-clippy.txt
          cargo build --workspace --release --locked \
            2>&1 | tee run/repository-candidate/cargo-build-release.txt

      - name: Strict Hepta PostgreSQL recovery qualification
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-hepta-postgres-integration.sh --mode recovery-only \
            | tee run/repository-candidate/hepta-postgres-recovery.txt

      - name: Record exact immutable candidate evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/repository-candidate
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path('run/repository-candidate')
          def git(*args):
              return subprocess.run(['git', *args], check=True, text=True, stdout=subprocess.PIPE).stdout.strip()
          summary = {
              'schema': 'cex.repository-closed-candidate-evidence.v2',
              'status': 'source_execution_attempted',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'head_sha': git('rev-parse', 'HEAD'),
              'head_tree': git('rev-parse', 'HEAD^{tree}'),
              'workflow_blob': git('rev-parse', 'HEAD:.github/workflows/p0-release-candidate-gate.yml'),
              'cargo_lock_blob': git('rev-parse', 'HEAD:Cargo.lock'),
              'rust_toolchain_blob': git('rev-parse', 'HEAD:rust-toolchain.toml'),
              'rust_toolchain': os.environ['RUST_TOOLCHAIN'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'repository_qualification_only': True,
              'external_gates_self_certified': False,
              'production_authorization': 'not_granted',
          }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          files = sorted(p for p in out.rglob('*') if p.is_file() and p.name != 'manifest.json')
          (out / 'manifest.json').write_text(json.dumps({
              'schema': 'cex.repository-candidate-artifact-manifest.v2',
              'files': [{'path': p.relative_to(out).as_posix(), 'bytes': p.stat().st_size,
                         'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in files],
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload immutable candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-repository-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: run/repository-candidate/**
          if-no-files-found: error
          retention-days: 90
