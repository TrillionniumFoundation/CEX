name: repository-semantics-repair-20260911

on:
  push:
    branches:
      - tooling/source-export-world-map-20260911

permissions:
  contents: write

jobs:
  regenerate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: 692a783037f178e100e1bcdf6a1d75ba5bcafc4e
      BASE_TREE: 05cfa60270378a36252caca7ce312cf2f57320b9
      TARGET_BRANCH: fix/repository-semantics-world-map-20260911
      TARGET_PATH: docs/repository-contract-semantics-v1.json
    steps:
      - name: Checkout tooling branch with bounded push credential
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Bind detached exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$BASE_TREE"

      - name: Regenerate semantic contract from exact source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-repository-semantics.py --write
          python3 scripts/generate-repository-semantics.py --check
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "$TARGET_PATH"

      - name: Execute semantic hostile regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-rust-route-contract.py
          python3 scripts/test-semantic-source-integration.py
          python3 scripts/test-consumer-route-contract.py
          python3 scripts/check-consumer-projection-boundary.py

      - name: Publish one generated fast-forward commit
        shell: bash
        run: |
          set -euo pipefail
          remote_target="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_target" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git diff --name-only)" = "$TARGET_PATH"
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -- "$TARGET_PATH"
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "$TARGET_PATH"
          git commit -m "chore(semantics): regenerate World map projection contract"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
