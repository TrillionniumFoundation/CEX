name: trnm-economy-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'docker-compose.yml'
      - 'services/ledger-service/**'
      - 'services/consumer-entry-api/**'
      - 'vendor/trnm-economy-protocol/**'
      - 'migrations/0027*'
      - 'migrations/0028*'
      - 'migrations/0029*'
      - 'migrations/0030*'
      - 'deploy/systemd/cex-trnm-*'
      - 'scripts/check-trnm-*'
      - 'scripts/postgres-archive-wal.sh'
      - 'docs/release-evidence/p0-candidate-trigger.json'
      - '.github/workflows/trnm-economy-ci.yml'
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'docker-compose.yml'
      - 'services/ledger-service/**'
      - 'services/consumer-entry-api/**'
      - 'vendor/trnm-economy-protocol/**'
      - 'migrations/0027*'
      - 'migrations/0028*'
      - 'migrations/0029*'
      - 'migrations/0030*'
      - 'deploy/systemd/cex-trnm-*'
      - 'scripts/check-trnm-*'
      - 'scripts/postgres-archive-wal.sh'
      - 'docs/release-evidence/p0-candidate-trigger.json'
      - '.github/workflows/trnm-economy-ci.yml'

permissions:
  contents: read

concurrency:
  group: trnm-economy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_TEST_THREADS: '1'

jobs:
  economy-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: PostgreSQL WAL archive contract
        run: |
          docker compose config >/dev/null
          scripts/check-trnm-postgres-archive-command.sh
          scripts/check-trnm-postgres-base-backup-contract.sh
          scripts/check-trnm-economy-resource-budgets.sh

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Release TRNM economy services
        run: cargo build --release --locked -p ledger-service -p consumer-entry-api

      - name: Supply-chain gates
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Cargo advisory audit
        run: cargo audit --deny warnings

      - name: Cargo dependency policy
        run: cargo deny check advisories bans licenses sources

      - name: Upload release binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cex-trnm-economy-${{ github.sha }}
          path: |
            target/release/ledger-service
            target/release/consumer-entry-api
            Cargo.lock
          if-no-files-found: error
