name: trnm-economy-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.cargo/**'
      - '.github/CODEOWNERS'
      - 'docker-compose.yml'
      - 'services/ledger-service/**'
      - 'services/consumer-entry-api/**'
      - 'services/execution-service/**'
      - 'services/gateway-service/**'
      - 'services/hepta-research-league/**'
      - 'services/audit-service/**'
      - 'vendor/trnm-economy-protocol/**'
      - 'vendor/trnm-finality-verifier/**'
      - 'migrations/0027*'
      - 'migrations/0028*'
      - 'migrations/0029*'
      - 'migrations/0030*'
      - 'deploy/systemd/**'
      - 'ops/systemd/**'
      - 'scripts/install-*.sh'
      - 'scripts/package-*.sh'
      - 'scripts/check-trnm-*'
      - 'scripts/check-rust-advisory-exceptions.py'
      - 'docs/security/rust-advisory-exceptions-v1.json'
      - 'scripts/postgres-archive-wal.sh'
      - 'docs/release-evidence/p0-candidate-trigger.json'
      - '.github/workflows/trnm-economy-ci.yml'
  push:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.cargo/**'
      - '.github/CODEOWNERS'
      - 'docker-compose.yml'
      - 'services/ledger-service/**'
      - 'services/consumer-entry-api/**'
      - 'services/execution-service/**'
      - 'services/gateway-service/**'
      - 'services/hepta-research-league/**'
      - 'services/audit-service/**'
      - 'vendor/trnm-economy-protocol/**'
      - 'vendor/trnm-finality-verifier/**'
      - 'migrations/0027*'
      - 'migrations/0028*'
      - 'migrations/0029*'
      - 'migrations/0030*'
      - 'deploy/systemd/**'
      - 'ops/systemd/**'
      - 'scripts/install-*.sh'
      - 'scripts/package-*.sh'
      - 'scripts/check-trnm-*'
      - 'scripts/check-rust-advisory-exceptions.py'
      - 'docs/security/rust-advisory-exceptions-v1.json'
      - 'scripts/postgres-archive-wal.sh'
      - 'docs/release-evidence/p0-candidate-trigger.json'
      - '.github/workflows/trnm-economy-ci.yml'

permissions:
  contents: read

concurrency:
  group: trnm-economy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_TEST_THREADS: '1'
  RUST_TOOLCHAIN: '1.98.1'
  CARGO_AUDIT_VERSION: '0.22.2'
  CARGO_DENY_VERSION: '0.20.2'

jobs:
  economy-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact source with policy history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PostgreSQL WAL archive contract
        run: |
          docker compose config >/dev/null
          scripts/check-trnm-postgres-archive-command.sh
          scripts/check-trnm-postgres-base-backup-contract.sh
          scripts/check-trnm-economy-resource-budgets.sh

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Verify Rust toolchain
        run: test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Release TRNM economy services
        run: cargo build --release --locked -p ledger-service -p consumer-entry-api

      - name: Install pinned supply-chain tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Validate complete advisory, release and dependency closure
        run: |
          set -euo pipefail
          mkdir -p run/supply-chain
          python3 scripts/check-rust-advisory-exceptions.py \
            | tee run/supply-chain/advisory-exception-evidence.json

      - name: Cargo advisory audit
        run: |
          set -euo pipefail
          cargo audit --deny warnings \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0214 \
            --ignore RUSTSEC-2024-0436 \
            2>&1 | tee run/supply-chain/cargo-audit.txt
          cargo audit --json \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0214 \
            --ignore RUSTSEC-2024-0436 \
            > run/supply-chain/cargo-audit.json

      - name: Cargo advisory, license and source policy
        run: |
          set -euo pipefail
          cargo deny check advisories licenses sources \
            2>&1 | tee run/supply-chain/cargo-deny-policy.txt

      - name: Cargo bans with manifest-owned wildcard control
        run: |
          set -euo pipefail
          cargo deny check --allow wildcard bans \
            2>&1 | tee run/supply-chain/cargo-deny-bans.txt

      - name: Upload release binaries and supply-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-trnm-economy-${{ github.sha }}
          path: |
            target/release/ledger-service
            target/release/consumer-entry-api
            Cargo.lock
            deny.toml
            .github/CODEOWNERS
            docs/security/rust-advisory-exceptions-v1.json
            run/supply-chain/**
          if-no-files-found: error
          retention-days: 90
