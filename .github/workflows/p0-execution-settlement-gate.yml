name: p0-execution-settlement-gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'migrations/0067_add_execution_ledger_settlement_schema.sql'
      - 'migrations/0068_add_execution_ledger_settlement_guards.sql'
      - 'migrations/0069_add_execution_ledger_settlement_enqueue.sql'
      - 'migrations/0070_add_execution_ledger_settlement_claim.sql'
      - 'migrations/0071_add_execution_ledger_settlement_finish.sql'
      - 'migrations/0072_add_execution_ledger_settlement_operator.sql'
      - 'services/execution-service/**'
      - 'scripts/check-execution-settlement-commands.py'
      - 'scripts/check-execution-settlement-commands-postgres.sh'
      - 'docs/execution-ledger-settlement-commands-v1.md'
      - 'docs/CEX-DEVELOPMENT-PLAN-2026-08-28-v12.md'
      - 'docs/templates/cex-release-baseline-manifest-v1.json'
      - 'config/execution-settlement-worker.env.example'
      - 'ops/systemd/cex-execution-settlement-worker.service'
      - '.github/workflows/p0-execution-settlement-gate.yml'
  pull_request:
    paths:
      - 'migrations/0067_add_execution_ledger_settlement_schema.sql'
      - 'migrations/0068_add_execution_ledger_settlement_guards.sql'
      - 'migrations/0069_add_execution_ledger_settlement_enqueue.sql'
      - 'migrations/0070_add_execution_ledger_settlement_claim.sql'
      - 'migrations/0071_add_execution_ledger_settlement_finish.sql'
      - 'migrations/0072_add_execution_ledger_settlement_operator.sql'
      - 'services/execution-service/**'
      - 'scripts/check-execution-settlement-commands.py'
      - 'scripts/check-execution-settlement-commands-postgres.sh'
      - 'docs/execution-ledger-settlement-commands-v1.md'
      - 'docs/CEX-DEVELOPMENT-PLAN-2026-08-28-v12.md'
      - 'docs/templates/cex-release-baseline-manifest-v1.json'
      - 'config/execution-settlement-worker.env.example'
      - 'ops/systemd/cex-execution-settlement-worker.service'
      - '.github/workflows/p0-execution-settlement-gate.yml'

permissions:
  contents: read

env:
  DATABASE_URL: postgres://cex:cex_ci_password@127.0.0.1:5432/cex_ci

jobs:
  execution-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cex
          POSTGRES_PASSWORD: cex_ci_password
          POSTGRES_DB: cex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cex -d cex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Static P0-N5 architecture gate
        run: python3 scripts/check-execution-settlement-commands.py

      - name: Migration and release-manifest governance
        run: |
          python3 scripts/check-p0-migrations.py
          python3 scripts/check-release-baseline-manifest.py \
            docs/templates/cex-release-baseline-manifest-v1.json --allow-template

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Execution package tests
        run: cargo test --locked -p execution-service --all-targets --no-fail-fast

      - name: Workspace all-target compile
        run: cargo check --locked --workspace --all-targets

      - name: Fresh migration lifecycle
        run: bash scripts/check-p0-migrations-postgres.sh

      - name: Invocation contract lifecycle
        run: bash scripts/check-invocation-ledger-contract-postgres.sh

      - name: Invocation terminal mutual exclusion
        run: bash scripts/check-invocation-ledger-terminal-postgres.sh

      - name: Durable settlement command lifecycle
        run: bash scripts/check-execution-settlement-commands-postgres.sh
