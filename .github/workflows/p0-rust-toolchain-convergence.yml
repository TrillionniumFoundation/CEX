name: p0-rust-toolchain-convergence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '**/Dockerfile*'
      - '**/rust-toolchain*'
      - 'scripts/check-rust-toolchain-convergence.py'
      - 'docs/release-evidence/**'
      - 'docs/security/**'
  push:
    branches:
      - main
      - 'fix/cex-v12-final-closure-*'
    paths:
      - '.github/workflows/**'
      - '**/Dockerfile*'
      - '**/rust-toolchain*'
      - 'scripts/check-rust-toolchain-convergence.py'
      - 'docs/release-evidence/**'
      - 'docs/security/**'

permissions:
  contents: read

concurrency:
  group: p0-rust-toolchain-convergence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.98.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  exact-toolchain-convergence:
    name: rust-toolchain-convergence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Record and verify compiler identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/rust-toolchain-convergence
          rustc --version --verbose | tee run/rust-toolchain-convergence/rustc-version.txt
          cargo --version --verbose | tee run/rust-toolchain-convergence/cargo-version.txt
          test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"
          test "$(cargo --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"
      - name: Reject mixed active toolchains
        run: python3 scripts/check-rust-toolchain-convergence.py | tee run/rust-toolchain-convergence/check.json
      - name: Verify locked workspace resolves
        run: cargo metadata --locked --format-version 1 > run/rust-toolchain-convergence/cargo-metadata.json
      - name: Upload exact identity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-rust-toolchain-convergence-${{ github.sha }}-${{ github.run_attempt }}
          path: run/rust-toolchain-convergence/**
          if-no-files-found: error
          retention-days: 90
