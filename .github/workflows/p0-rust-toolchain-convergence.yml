name: p0-rust-toolchain-convergence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/Dockerfile*'
      - '**/Containerfile*'
      - '**/rust-toolchain*'
      - '**/.tool-versions'
      - '**/mise.toml'
      - '**/*.nix'
      - '**/*.bzl'
      - '**/BUILD*'
      - '**/WORKSPACE*'
      - '**/Makefile'
      - '**/GNUmakefile'
      - '**/Justfile'
      - '**/*.mk'
      - '.devcontainer/**'
      - 'scripts/**'
      - 'docs/release-evidence/**'
      - 'docs/security/**'
      - 'PROJECT_BOUNDARY.json'
      - 'Cargo.toml'
  push:
    branches:
      - main
      - 'fix/cex-v12-final-closure-*'
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/Dockerfile*'
      - '**/Containerfile*'
      - '**/rust-toolchain*'
      - '**/.tool-versions'
      - '**/mise.toml'
      - '**/*.nix'
      - '**/*.bzl'
      - '**/BUILD*'
      - '**/WORKSPACE*'
      - '**/Makefile'
      - '**/GNUmakefile'
      - '**/Justfile'
      - '**/*.mk'
      - '.devcontainer/**'
      - 'scripts/**'
      - 'docs/release-evidence/**'
      - 'docs/security/**'
      - 'PROJECT_BOUNDARY.json'
      - 'Cargo.toml'

permissions:
  contents: read

concurrency:
  group: p0-rust-toolchain-convergence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.98.1'
  RUST_RELEASE_COMMIT: '48a229ceaefd4985c50990b14116b6d856af0985'
  SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  SOURCE_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  PROSPECTIVE_MERGE_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
  PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  exact-toolchain-convergence:
    name: rust-toolchain-convergence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require same-repository immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$SOURCE_REPOSITORY_ID" = "$GITHUB_REPOSITORY_ID"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            test "$PULL_REQUEST_NUMBER" -gt 0
            [[ "$PROSPECTIVE_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$SOURCE_SHA" != "$PROSPECTIVE_MERGE_SHA"
          fi

      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact base object
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.BASE_SHA }}
          path: .candidate-identity/base
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout GitHub prospective merge object
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.PROSPECTIVE_MERGE_SHA }}
          path: .candidate-identity/merge
          fetch-depth: 1
          persist-credentials: false

      - name: Bind source, base and prospective merge identities
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/rust-toolchain-convergence
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          import os
          import pathlib
          import re
          import subprocess

          SHA40 = re.compile(r'^[0-9a-f]{40}$')
          root = pathlib.Path.cwd()

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def git(cwd, *arguments):
              result = subprocess.run(
                  ['git', '-C', str(cwd), *arguments],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              require(
                  result.returncode == 0,
                  f"git {' '.join(arguments)} failed in {cwd}: "
                  f"{result.stderr.strip() or result.stdout.strip()}",
              )
              return result.stdout.strip()

          source_sha = os.environ['SOURCE_SHA']
          base_sha = os.environ['BASE_SHA']
          merge_sha = os.environ.get('PROSPECTIVE_MERGE_SHA', '')
          event_name = os.environ['GITHUB_EVENT_NAME']
          require(SHA40.fullmatch(source_sha), 'source SHA is not canonical')
          require(SHA40.fullmatch(base_sha), 'base SHA is not canonical')
          require(git(root, 'rev-parse', 'HEAD') == source_sha, 'source checkout identity mismatch')
          source_tree = git(root, 'rev-parse', 'HEAD^{tree}')
          require(SHA40.fullmatch(source_tree), 'source tree is not canonical')

          base_tree = None
          merge_tree = None
          merge_parents = None
          if event_name == 'pull_request':
              require(SHA40.fullmatch(merge_sha), 'prospective merge SHA is not canonical')
              base_dir = root / '.candidate-identity/base'
              merge_dir = root / '.candidate-identity/merge'
              require(git(base_dir, 'rev-parse', 'HEAD') == base_sha, 'base checkout identity mismatch')
              require(git(merge_dir, 'rev-parse', 'HEAD') == merge_sha, 'merge checkout identity mismatch')
              base_tree = git(base_dir, 'rev-parse', 'HEAD^{tree}')
              merge_tree = git(merge_dir, 'rev-parse', 'HEAD^{tree}')
              require(SHA40.fullmatch(base_tree), 'base tree is not canonical')
              require(SHA40.fullmatch(merge_tree), 'merge tree is not canonical')
              merge_parents = git(merge_dir, 'show', '-s', '--format=%P', 'HEAD').split()
              require(
                  merge_parents == [base_sha, source_sha],
                  f'prospective merge parent order mismatch: {merge_parents!r}',
              )
          else:
              merge_sha = ''

          value = {
              'schema': 'cex.rust-toolchain-candidate-identity.v2',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'repository_id': os.environ['SOURCE_REPOSITORY_ID'],
              'event_name': event_name,
              'pull_request_number': int(os.environ['PULL_REQUEST_NUMBER']),
              'source_repository': os.environ['SOURCE_REPOSITORY'],
              'source_repository_id': os.environ['SOURCE_REPOSITORY_ID'],
              'source_sha': source_sha,
              'source_tree': source_tree,
              'base_sha': base_sha,
              'base_tree': base_tree,
              'prospective_merge_sha': merge_sha or None,
              'prospective_merge_tree': merge_tree,
              'prospective_merge_parents': merge_parents,
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'production_authorization': 'not_granted',
          }
          pathlib.Path('run/rust-toolchain-convergence/candidate-identity.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(f'source_tree={source_tree}')
          print(f'base_tree={base_tree or ""}')
          print(f'merge_tree={merge_tree or ""}')
          PYTHON

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Record and verify executed toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain | tee run/rust-toolchain-convergence/rustup-active-toolchain.txt
          rustc --version --verbose | tee run/rust-toolchain-convergence/rustc-version.txt
          cargo --version --verbose | tee run/rust-toolchain-convergence/cargo-version.txt
          test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"
          grep -Eq '^1\.98\.1-' run/rust-toolchain-convergence/rustup-active-toolchain.txt
          grep -Fx "commit-hash: $RUST_RELEASE_COMMIT" run/rust-toolchain-convergence/rustc-version.txt

      - name: Reject mixed or unregistered active toolchain carriers
        run: python3 scripts/check-rust-toolchain-convergence.py | tee run/rust-toolchain-convergence/check.json

      - name: Verify locked workspace resolves
        run: cargo metadata --locked --format-version 1 > run/rust-toolchain-convergence/cargo-metadata.json

      - name: Reverify immutable source after qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = '${{ steps.identity.outputs.source_tree }}'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload exact source and merge identity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-rust-toolchain-convergence-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: run/rust-toolchain-convergence/**
          if-no-files-found: error
          retention-days: 90
