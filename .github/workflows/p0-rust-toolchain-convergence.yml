name: p0-rust-toolchain-convergence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/Dockerfile*'
      - '**/Containerfile*'
      - '**/rust-toolchain*'
      - '**/.tool-versions'
      - '**/mise.toml'
      - '**/*.nix'
      - '**/*.bzl'
      - '**/BUILD*'
      - '**/WORKSPACE*'
      - '**/Makefile'
      - '**/GNUmakefile'
      - '**/Justfile'
      - '**/*.mk'
      - '.devcontainer/**'
      - 'scripts/**'
      - 'docs/release-evidence/**'
      - 'docs/security/**'
      - 'PROJECT_BOUNDARY.json'
      - 'Cargo.toml'
  push:
    branches:
      - main
      - 'fix/cex-v12-final-closure-*'
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/Dockerfile*'
      - '**/Containerfile*'
      - '**/rust-toolchain*'
      - '**/.tool-versions'
      - '**/mise.toml'
      - '**/*.nix'
      - '**/*.bzl'
      - '**/BUILD*'
      - '**/WORKSPACE*'
      - '**/Makefile'
      - '**/GNUmakefile'
      - '**/Justfile'
      - '**/*.mk'
      - '.devcontainer/**'
      - 'scripts/**'
      - 'docs/release-evidence/**'
      - 'docs/security/**'
      - 'PROJECT_BOUNDARY.json'
      - 'Cargo.toml'

permissions:
  contents: read

concurrency:
  group: p0-rust-toolchain-convergence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.98.1'
  RUST_RELEASE_COMMIT: '48a229ceaefd4985c50990b14116b6d856af0985'
  SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  SOURCE_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id || github.repository_id }}
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  PROSPECTIVE_MERGE_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
  PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  exact-toolchain-convergence:
    name: rust-toolchain-convergence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require same-repository immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$SOURCE_REPOSITORY_ID" = "$GITHUB_REPOSITORY_ID"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            test "$PULL_REQUEST_NUMBER" -gt 0
            [[ "$PROSPECTIVE_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$SOURCE_SHA" != "$PROSPECTIVE_MERGE_SHA"
          fi

      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact base object
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.BASE_SHA }}
          path: .candidate-identity/base
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout GitHub prospective merge object
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.PROSPECTIVE_MERGE_SHA }}
          path: .candidate-identity/merge
          fetch-depth: 1
          persist-credentials: false

      - name: Bind source, base and prospective merge identities
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/rust-toolchain-convergence
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          base_tree=''
          merge_tree=''
          merge_parents=''
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            test "$(git -C .candidate-identity/base rev-parse HEAD)" = "$BASE_SHA"
            test "$(git -C .candidate-identity/merge rev-parse HEAD)" = "$PROSPECTIVE_MERGE_SHA"
            base_tree="$(git -C .candidate-identity/base rev-parse 'HEAD^{tree}')"
            merge_tree="$(git -C .candidate-identity/merge rev-parse 'HEAD^{tree}')"
            merge_parents="$(git -C .candidate-identity/merge show -s --format=%P HEAD)"
            read -r first_parent second_parent extra_parent <<<"$merge_parents"
            test -z "${extra_parent:-}"
            test "$first_parent" = "$BASE_SHA"
            test "$second_parent" = "$SOURCE_SHA"
          fi
          {
            echo "source_tree=$source_tree"
            echo "base_tree=$base_tree"
            echo "merge_tree=$merge_tree"
          } >> "$GITHUB_OUTPUT"
          SOURCE_TREE="$source_tree" BASE_TREE="$base_tree" MERGE_TREE="$merge_tree" MERGE_PARENTS="$merge_parents" \
            python3 - <<'PY'
          import json, os, pathlib
          value = {
              'schema': 'cex.rust-toolchain-candidate-identity.v2',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'repository_id': os.environ['GITHUB_REPOSITORY_ID'],
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'pull_request_number': int(os.environ['PULL_REQUEST_NUMBER']),
              'source_repository': os.environ['SOURCE_REPOSITORY'],
              'source_repository_id': os.environ['SOURCE_REPOSITORY_ID'],
              'source_sha': os.environ['SOURCE_SHA'],
              'source_tree': os.environ['SOURCE_TREE'],
              'base_sha': os.environ['BASE_SHA'],
              'base_tree': os.environ['BASE_TREE'] or None,
              'prospective_merge_sha': os.environ['PROSPECTIVE_MERGE_SHA'] or None,
              'prospective_merge_tree': os.environ['MERGE_TREE'] or None,
              'prospective_merge_parents': os.environ['MERGE_PARENTS'].split() or None,
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'production_authorization': 'not_granted',
          }
          pathlib.Path('run/rust-toolchain-convergence/candidate-identity.json').write_text(
              json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Record and verify executed toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain | tee run/rust-toolchain-convergence/rustup-active-toolchain.txt
          rustc --version --verbose | tee run/rust-toolchain-convergence/rustc-version.txt
          cargo --version --verbose | tee run/rust-toolchain-convergence/cargo-version.txt
          test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"
          grep -Eq '^1\.98\.1-' run/rust-toolchain-convergence/rustup-active-toolchain.txt
          grep -Fx "commit-hash: $RUST_RELEASE_COMMIT" run/rust-toolchain-convergence/rustc-version.txt

      - name: Reject mixed or unregistered active toolchain carriers
        run: python3 scripts/check-rust-toolchain-convergence.py | tee run/rust-toolchain-convergence/check.json

      - name: Verify locked workspace resolves
        run: cargo metadata --locked --format-version 1 > run/rust-toolchain-convergence/cargo-metadata.json

      - name: Reverify immutable source after qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = '${{ steps.identity.outputs.source_tree }}'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload exact source and merge identity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-rust-toolchain-convergence-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: run/rust-toolchain-convergence/**
          if-no-files-found: error
          retention-days: 90
