name: sequence54-round4-controller-cleanup-v3

on:
  push:
    branches:
      - work/sequence54-round2-staging-20260909
    paths:
      - '.github/workflows/sequence54-round4-controller-cleanup-v3.yml'

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: sequence54-round4-controller-cleanup-v3
  cancel-in-progress: false

env:
  STAGING_BRANCH: work/sequence54-round2-staging-20260909
  PULL_REQUEST_NUMBER: '53'
  EVIDENCE_DIR: ${{ runner.temp }}/sequence54-round4-controller-cleanup-v3

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 520
    steps:
      - name: Wait for final snapshot v3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          encoded_branch="${STAGING_BRANCH//\//%2F}"
          run_id=''
          for _ in $(seq 1 220); do
            run_id="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/sequence54-round4-final-snapshot-v3.yml/runs?branch=${encoded_branch}&per_page=20" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty' 2>/dev/null || true)"
            [[ -n "$run_id" ]] && break
            sleep 15
          done
          [[ -n "$run_id" ]]
          for _ in $(seq 1 2100); do
            value="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(jq -r '.status' <<<"$value")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$value")"
            [[ "$status" == completed ]] && break
            sleep 15
          done
          [[ "$status" == completed ]]
          printf 'run_id=%s\nstatus=%s\nconclusion=%s\n' "$run_id" "$status" "$conclusion" > "$EVIDENCE_DIR/final-snapshot-run.txt"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > "$EVIDENCE_DIR/artifacts.json"
          artifact_id="$(jq -r '.artifacts[] | select(.name | startswith("sequence54-round4-final-snapshot-v3-")) | .id' "$EVIDENCE_DIR/artifacts.json" | head -n1)"
          [[ -n "$artifact_id" && "$artifact_id" != null ]]
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$RUNNER_TEMP/snapshot-v3.zip"
          mkdir -p "$EVIDENCE_DIR/snapshot"
          unzip -q "$RUNNER_TEMP/snapshot-v3.zip" -d "$EVIDENCE_DIR/snapshot"
          file="$(find "$EVIDENCE_DIR/snapshot" -name final-gap-snapshot-v3.json -type f | head -n1)"
          [[ -n "$file" ]]
          cp "$file" "$EVIDENCE_DIR/final-gap-snapshot-v3.json"

      - name: Retire staging only after all repository-owned qualification is green
        id: cleanup
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          internal="$(jq -r '.repository_internal_exact_head_green' "$EVIDENCE_DIR/final-gap-snapshot-v3.json")"
          p0="$(jq -r '.aggregate_p0_candidate_green' "$EVIDENCE_DIR/final-gap-snapshot-v3.json")"
          if [[ "$internal" != true || "$p0" != true ]]; then
            printf 'retained: repository internal=%s aggregate_p0=%s\n' "$internal" "$p0" > "$EVIDENCE_DIR/decision.txt"
            exit 0
          fi

          self="$GITHUB_RUN_ID"
          encoded_branch="${STAGING_BRANCH//\//%2F}"
          for _ in $(seq 1 320); do
            active="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${encoded_branch}&per_page=100" \
              --jq --arg self "$self" '[.workflow_runs[] | select((.id|tostring) != $self and .status != "completed")] | length')"
            [[ "$active" == 0 ]] && break
            sleep 15
          done
          [[ "$active" == 0 ]]
          ref="heads/${STAGING_BRANCH}"
          http="$(curl -sS -o "$EVIDENCE_DIR/delete-response.json" -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/${ref//\//%2F}")"
          printf 'deleted HTTP=%s\n' "$http" > "$EVIDENCE_DIR/decision.txt"
          [[ "$http" == 204 ]]

      - name: Publish cleanup decision
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          decision="$(cat "$EVIDENCE_DIR/decision.txt" 2>/dev/null || echo unavailable)"
          body="<!-- sequence54-round4-controller-cleanup-v3 -->
          ## Sequence 54 temporary-controller cleanup v3

          - Outcome: \`$CLEANUP_OUTCOME\`
          - Decision: \`$decision\`

          The temporary staging branch is retained whenever a repository-owned exact-head or aggregate P0 blocker remains. External approvals and production authority are never inferred from cleanup."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments" -f body="$body"

      - name: Upload cleanup v3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sequence54-round4-controller-cleanup-v3-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
