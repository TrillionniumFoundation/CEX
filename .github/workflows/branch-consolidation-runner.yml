name: branch-consolidation-runner

on:
  push:
    branches:
      - automation/consolidate-all-branches-20260829

permissions:
  contents: write
  actions: read

concurrency:
  group: cex-one-shot-branch-consolidation-runner
  cancel-in-progress: false

env:
  AUTOMATION_BRANCH: automation/consolidate-all-branches-20260829
  REPORT_DIR: /tmp/cex-branch-consolidation

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Extract audited consolidation phases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/one-shot-consolidate-all-branches.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          targets = {
              'Merge every branch tip into one history': 'merge.sh',
              'Canonicalize final tree and reconcile Cargo lock': 'canonicalize.sh',
              'Validate immutable consolidated tree': 'validate.sh',
              'Advance main and delete all other branches': 'publish.sh',
          }
          for step_name, output_name in targets.items():
              marker = f'      - name: {step_name}'
              try:
                  start = lines.index(marker)
              except ValueError as error:
                  raise SystemExit(f'missing audited step: {step_name}') from error
              run_index = next(
                  index for index in range(start + 1, len(lines))
                  if lines[index] == '        run: |'
              )
              end = len(lines)
              for index in range(run_index + 1, len(lines)):
                  if lines[index].startswith('      - name: '):
                      end = index
                      break
              body = []
              for line in lines[run_index + 1:end]:
                  if line.startswith('          '):
                      body.append(line[10:])
                  elif line.strip():
                      raise SystemExit(f'unexpected indentation in {step_name}: {line!r}')
                  else:
                      body.append('')
              path = Path('/tmp') / output_name
              path.write_text('\n'.join(body) + '\n', encoding='utf-8')
              path.chmod(0o700)
          PY

      - name: Execute fail-closed consolidation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$REPORT_DIR"
          mkdir -p "$REPORT_DIR"
          bash /tmp/merge.sh

          # The isolated TRNM economy service owns this schema. Retarget every
          # merged source/test include away from the repository-wide migration chain.
          if [[ -d services/trnm-economy-service ]]; then
            grep -RIlZ 'migrations/0010_trnm_economy_settlement_v1.sql' \
              services/trnm-economy-service \
              | xargs -0r sed -i \
                  's#../../../migrations/0010_trnm_economy_settlement_v1.sql#../migrations/settlement_v1.sql#g'
          fi

          git rm -f --ignore-unmatch .github/workflows/branch-consolidation-runner.yml
          bash /tmp/canonicalize.sh
          bash /tmp/validate.sh
          bash /tmp/publish.sh

      - name: Publish final summary
        if: always()
        shell: bash
        run: |
          {
            echo '## CEX all-branch consolidation'
            echo
            [[ -f "$REPORT_DIR/main-before.txt" ]] && echo "- Main before: \`$(cat "$REPORT_DIR/main-before.txt")\`"
            [[ -f "$REPORT_DIR/main-after.txt" ]] && echo "- Main after: \`$(cat "$REPORT_DIR/main-after.txt")\`"
            if [[ -f "$REPORT_DIR/deleted-branches.txt" ]]; then
              echo "- Deleted branches: \`$(sed '/^$/d' "$REPORT_DIR/deleted-branches.txt" | sort -u | wc -l)\`"
            fi
            if [[ -f "$REPORT_DIR/final-heads.txt" ]]; then
              echo '- Final heads:'
              echo '```text'
              cat "$REPORT_DIR/final-heads.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cex-branch-consolidation-${{ github.run_id }}
          path: /tmp/cex-branch-consolidation
          if-no-files-found: warn
          retention-days: 90
