name: cex-toolchain-carrier-repair-20260910

on:
  push:
    branches:
      - integration/cex-v12-sequence54-20260908
    paths:
      - '.github/workflows/cex-toolchain-carrier-repair-20260910.yml'

permissions:
  contents: write

concurrency:
  group: cex-toolchain-carrier-repair-20260910
  cancel-in-progress: false

env:
  EXPECTED_PARENT_SHA: 2f73e9f9d4c665e1cfe9986de65457f5584be175
  TARGET_BRANCH: integration/cex-v12-sequence54-20260908
  EXPECTED_RUST_TOOLCHAIN: '1.98.1'
  EXPECTED_RUST_RELEASE_COMMIT: 48a229ceaefd4985c50990b14116b6d856af0985

jobs:
  repair:
    name: cex/toolchain-carrier-atomic-repair
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify immutable repair boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TrillionniumFoundation/CEX
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Apply ten exact carrier repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          expected_version = "1.98.1"
          obsolete_version = "1.98." + "0"
          release_commit = "48a229ceaefd4985c50990b14116b6d856af0985"

          def replace_once(path: str, old: str, new: str) -> None:
              target = root / path
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          action = "dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c"
          for path in (
              ".github/workflows/p0-gateway-exact-reserve-gate.yml",
              ".github/workflows/p0-release-candidate-gate.yml",
              ".github/workflows/rust-full-gate-self-hosted.yml",
              ".github/workflows/rust-self-hosted-preflight-hygiene.yml",
          ):
              replace_once(
                  path,
                  f"      - name: Install Rust stable\n        uses: {action} # stable\n",
                  f"      - name: Install Rust {expected_version}\n        uses: {action} # pinned action\n        with:\n          toolchain: {expected_version}\n",
              )

          for path in (
              "scripts/check-execution-settlement-commands.py",
              "scripts/check-gateway-exact-reserve.py",
          ):
              replace_once(
                  path,
                  f'    "{action}",\n    "Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6",',
                  f'    "{action}",\n    "toolchain: {expected_version}",\n    "Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6",',
              )

          isolated = "scripts/run-isolated-matrix-tests.sh"
          replace_once(isolated, f"FROM rust:{obsolete_version}-bookworm", f"FROM rust:{expected_version}-bookworm")
          replace_once(
              isolated,
              f"# This published image is only a bootstrap. Do not compile candidate code with\n# its original {obsolete_version} compiler (upstream vtable miscompilation).\n",
              f"# Keep the container compiler on the repository's exact {expected_version} policy.\n",
          )
          replace_once(
              isolated,
              f"    && rustup default {expected_version} \\\n    && rustup toolchain uninstall {obsolete_version}\n",
              f"    && rustup default {expected_version}\n",
          )

          trusted = "scripts/trusted-matrix-pr-target.sh"
          replace_once(trusted, f"FROM rust:{obsolete_version}-bookworm", f"FROM rust:{expected_version}-bookworm")
          replace_once(
              trusted,
              f"    && rustup default {expected_version} \\\n    && rustup toolchain uninstall {obsolete_version}\n",
              f"    && rustup default {expected_version}\n",
          )

          native = ".github/workflows/cex-v12-native-minimal.yml"
          replace_once(
              native,
              f"  RUSTUP_TOOLCHAIN: '{expected_version}'\n",
              f"  RUSTUP_TOOLCHAIN: '{expected_version}'\n  EXPECTED_RUST_RELEASE_COMMIT: '{release_commit}'\n",
          )
          replace_once(
              native,
              "          rustc --version --verbose\n          cargo --version --verbose\n",
              "          rustc --version --verbose | tee \"$RUNNER_TEMP/cex-rustc-version.txt\"\n          grep -Fx \"commit-hash: $EXPECTED_RUST_RELEASE_COMMIT\" \"$RUNNER_TEMP/cex-rustc-version.txt\"\n          cargo --version --verbose\n",
          )

          settlement = ".github/workflows/trnm-economy-settlement.yml"
          replace_once(
              settlement,
              "  RUST_TEST_THREADS: '1'\n",
              f"  RUST_TEST_THREADS: '1'\n  EXPECTED_RUST_RELEASE_COMMIT: '{release_commit}'\n",
          )
          replace_once(
              settlement,
              "          rustc --version --verbose\n          cargo --version --verbose\n",
              "          rustc --version --verbose | tee \"$RUNNER_TEMP/trnm-rustc-version.txt\"\n          grep -Fx \"commit-hash: $EXPECTED_RUST_RELEASE_COMMIT\" \"$RUNNER_TEMP/trnm-rustc-version.txt\"\n          cargo --version --verbose\n",
          )
          PY
          git diff --check

      - name: Remove helper and create unpushed candidate commit
        shell: bash
        run: |
          set -euo pipefail
          helper=.github/workflows/cex-toolchain-carrier-repair-20260910.yml
          git rm "$helper"
          python3 - <<'PY'
          import subprocess

          expected = sorted([
              ".github/workflows/cex-toolchain-carrier-repair-20260910.yml",
              ".github/workflows/cex-v12-native-minimal.yml",
              ".github/workflows/p0-gateway-exact-reserve-gate.yml",
              ".github/workflows/p0-release-candidate-gate.yml",
              ".github/workflows/rust-full-gate-self-hosted.yml",
              ".github/workflows/rust-self-hosted-preflight-hygiene.yml",
              ".github/workflows/trnm-economy-settlement.yml",
              "scripts/check-execution-settlement-commands.py",
              "scripts/check-gateway-exact-reserve.py",
              "scripts/run-isolated-matrix-tests.sh",
              "scripts/trusted-matrix-pr-target.sh",
          ])
          actual = sorted(subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD", "--"], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(f"repair path set drift: actual={actual!r} expected={expected!r}")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "fix(ci): converge every active Rust carrier on 1.98.1" \
            -m "Bind four workflow selectors and two static checker contracts to Rust 1.98.1, remove obsolete bootstrap identities from the isolated Matrix harnesses, and verify rustc's exact release commit in both verbose-observer workflows. Delete the temporary repair workflow in the same auditable commit. No production authorization is granted."
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"

      - name: Validate exact committed candidate tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/cex-toolchain-carrier-repair-20260910.yml
          python3 scripts/check-rust-toolchain-convergence.py
          python3 scripts/check-sequence54-integration.py
          python3 scripts/check-sequence54-rustsec-admission.py
          python3 scripts/check-execution-settlement-commands.py
          python3 scripts/check-gateway-exact-reserve.py
          git diff --check HEAD^
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Push only as a fast-forward from the trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'CEX_TOOLCHAIN_CARRIER_REPAIR=PASS\n'
          printf 'production_authorization=not_granted\n'
