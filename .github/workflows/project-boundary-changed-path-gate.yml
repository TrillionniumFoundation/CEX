name: project-boundary-changed-path-gate

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit SHA for changed-path validation
        required: true
        type: string
  pull_request:
    paths:
      - 'PROJECT_BOUNDARY.json'
      - 'services/consumer-entry-api/**'
      - 'services/matrix-entry-adapter/**'
      - 'docs/compatibility/world-surface-freeze-v1.json'
      - 'scripts/check-project-boundary.py'
      - 'scripts/check-project-boundary-changed-paths.py'
      - '.github/workflows/project-boundary-gate.yml'
      - '.github/workflows/project-boundary-changed-path-gate.yml'
  push:
    branches:
      - main
      - 'fix/hepta-p0-blocker-closure-*'
    paths:
      - 'PROJECT_BOUNDARY.json'
      - 'services/consumer-entry-api/**'
      - 'services/matrix-entry-adapter/**'
      - 'docs/compatibility/world-surface-freeze-v1.json'
      - 'scripts/check-project-boundary.py'
      - 'scripts/check-project-boundary-changed-paths.py'
      - '.github/workflows/project-boundary-gate.yml'
      - '.github/workflows/project-boundary-changed-path-gate.yml'

permissions:
  contents: read

concurrency:
  group: project-boundary-changed-path-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.event.before }}
  CHECKOUT_ACTION_SHA: 11d5960a326750d5838078e36cf38b85af677262
  UPLOAD_ARTIFACT_ACTION_SHA: ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  actual-changed-path-semantics:
    name: project-boundary/actual-changed-path-semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source head and base history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact source changed-path set
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          mkdir -p run/project-boundary-changed-path
          PROJECT_BOUNDARY_BASE_SHA="$BASE_SHA" \
            python3 scripts/check-project-boundary-changed-paths.py \
            | tee run/project-boundary-changed-path/source-head.json

      - name: Resolve and validate prospective merge changed-path set
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          merge_output="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_HEAD_SHA")"
          merge_tree="$(printf '%s\n' "$merge_output" | head -n1)"
          [[ "$merge_tree" =~ ^[0-9a-f]{40}$ ]]
          export GIT_AUTHOR_NAME='CEX changed-path qualification'
          export GIT_AUTHOR_EMAIL='qualification@cex.invalid'
          export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          merge_commit="$(
            printf 'Synthetic prospective merge for changed-path qualification only\n' \
              | git commit-tree "$merge_tree" -p "$BASE_SHA" -p "$SOURCE_HEAD_SHA"
          )"
          worktree="$RUNNER_TEMP/cex-project-boundary-changed-path-merge"
          git worktree add --detach "$worktree" "$merge_commit"
          trap 'git worktree remove --force "$worktree"' EXIT
          test "$(git -C "$worktree" rev-parse HEAD^{tree})" = "$merge_tree"
          (
            cd "$worktree"
            PROJECT_BOUNDARY_BASE_SHA="$BASE_SHA" \
              python3 scripts/check-project-boundary-changed-paths.py
          ) | tee run/project-boundary-changed-path/prospective-merge.json
          printf '%s\n' "$merge_tree" > run/project-boundary-changed-path/prospective-merge-tree.txt

      - name: Record exact changed-path evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/project-boundary-changed-path
          git diff --name-status --find-renames "$BASE_SHA" "$SOURCE_HEAD_SHA" -- \
            > run/project-boundary-changed-path/name-status.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          out = pathlib.Path('run/project-boundary-changed-path')

          def sha256(path: pathlib.Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def git(*args: str) -> str:
              return subprocess.run(
                  ['git', *args], check=True, text=True, stdout=subprocess.PIPE
              ).stdout.strip()

          outcomes = {}
          for name in ('source-head.json', 'prospective-merge.json'):
              path = out / name
              if path.is_file():
                  outcomes[name] = json.loads(path.read_text()).get('status')
          summary = {
              'schema': 'cex.project-boundary.changed-path-evidence.v1',
              'status': 'actual_changed_path_semantics_green'
                  if outcomes and all(value == 'ok' for value in outcomes.values())
                  else 'actual_changed_path_semantics_failed',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'source_head_tree': git('rev-parse', 'HEAD^{tree}'),
              'base_sha': os.environ['BASE_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
              'workflow_blob_sha': git(
                  'rev-parse', 'HEAD:.github/workflows/project-boundary-changed-path-gate.yml'
              ),
              'checker_blob_sha': git(
                  'rev-parse', 'HEAD:scripts/check-project-boundary-changed-paths.py'
              ),
              'policy_blob_sha': git('rev-parse', 'HEAD:PROJECT_BOUNDARY.json'),
              'manifest_blob_sha': git(
                  'rev-parse', 'HEAD:docs/compatibility/world-surface-freeze-v1.json'
              ),
              'actions': {
                  'actions/checkout': os.environ['CHECKOUT_ACTION_SHA'],
                  'actions/upload-artifact': os.environ['UPLOAD_ARTIFACT_ACTION_SHA'],
              },
              'outcomes': outcomes,
              'production_authorization': 'not_granted',
          }
          (out / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          files = sorted(path for path in out.iterdir() if path.is_file() and path.name != 'manifest.json')
          manifest = {
              'schema': 'cex.project-boundary.changed-path-artifact-manifest.v1',
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'files': [
                  {'path': path.name, 'bytes': path.stat().st_size, 'sha256': sha256(path)}
                  for path in files
              ],
          }
          (out / 'manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Upload exact changed-path evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-project-boundary-changed-path-${{ env.SOURCE_HEAD_SHA }}
          path: run/project-boundary-changed-path/**
          if-no-files-found: error
          retention-days: 90
