name: project-boundary-changed-path-gate

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit SHA for changed-path validation
        required: true
        type: string
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: project-boundary-changed-path-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || github.event.before || '' }}
  RUST_TOOLCHAIN: '1.98.1'

jobs:
  actual-changed-path-semantics:
    name: project-boundary/actual-changed-path-and-cargo-semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head and history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1

      - name: Resolve exact base identity
        id: base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"
          base="$EVENT_BASE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base}^{commit}"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Validate actual base-to-head changed paths
        shell: bash
        env:
          PROJECT_BOUNDARY_BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p run/project-boundary-changed-path
          python3 scripts/check-rust-toolchain-convergence.py \
            | tee run/project-boundary-changed-path/toolchain.json
          python3 scripts/check-project-boundary-changed-paths.py \
            | tee run/project-boundary-changed-path/source-head.json
          git diff --name-status --find-renames \
            "$PROJECT_BOUNDARY_BASE_SHA" "$SOURCE_HEAD_SHA" -- \
            > run/project-boundary-changed-path/name-status.txt

      - name: Validate prospective merge changed-path semantics
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          merge_output="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_HEAD_SHA")"
          merge_tree="$(printf '%s\n' "$merge_output" | head -n1)"
          [[ "$merge_tree" =~ ^[0-9a-f]{40}$ ]]
          export GIT_AUTHOR_NAME='CEX changed-path qualification'
          export GIT_AUTHOR_EMAIL='qualification@cex.invalid'
          export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          merge_commit="$(printf 'Synthetic prospective merge for changed-path qualification only\n' \
            | git commit-tree "$merge_tree" -p "$BASE_SHA" -p "$SOURCE_HEAD_SHA")"
          worktree="$RUNNER_TEMP/cex-project-boundary-changed-path-merge"
          git worktree add --detach "$worktree" "$merge_commit"
          trap 'git worktree remove --force "$worktree"' EXIT
          test "$(git -C "$worktree" rev-parse 'HEAD^{tree}')" = "$merge_tree"
          (
            cd "$worktree"
            PROJECT_BOUNDARY_BASE_SHA="$BASE_SHA" \
              python3 scripts/check-project-boundary-changed-paths.py
          ) | tee run/project-boundary-changed-path/prospective-merge.json
          printf '%s\n' "$merge_tree" \
            > run/project-boundary-changed-path/prospective-merge-tree.txt

      - name: Record immutable changed-path evidence
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p run/project-boundary-changed-path
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path('run/project-boundary-changed-path')
          def git(*args):
              return subprocess.run(['git', *args], check=True, text=True, stdout=subprocess.PIPE).stdout.strip()
          summary = {
              'schema': 'cex.project-boundary.changed-path-evidence.v3',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'source_head_tree': git('rev-parse', 'HEAD^{tree}'),
              'base_sha': os.environ['BASE_SHA'],
              'workflow_blob': git('rev-parse', 'HEAD:.github/workflows/project-boundary-changed-path-gate.yml'),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'production_authorization': 'not_granted',
          }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          files = sorted(p for p in out.rglob('*') if p.is_file() and p.name != 'manifest.json')
          (out / 'manifest.json').write_text(json.dumps({
              'schema': 'cex.project-boundary.changed-path-artifact-manifest.v3',
              'files': [{'path': p.relative_to(out).as_posix(), 'bytes': p.stat().st_size,
                         'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in files],
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload exact changed-path evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-project-boundary-changed-path-${{ env.SOURCE_HEAD_SHA }}-${{ github.run_attempt }}
          path: run/project-boundary-changed-path/**
          if-no-files-found: error
          retention-days: 90
