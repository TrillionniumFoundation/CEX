name: p0-world-authority-cutover-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/consumer-entry-api/src/main.rs'
      - 'services/consumer-entry-api/src/bin/world-authority-adapter.rs'
      - 'services/consumer-entry-api/src/trillionnium_world_adapters.rs'
      - 'config/world-authority-adapter.env.example'
      - 'docs/world-authority-cutover-v1.md'
      - 'docs/traceability/world-authority-cutover-v1.json'
      - 'scripts/run-world-authority-adapter.sh'
      - 'scripts/check-world-authority-cutover.sh'
      - 'scripts/check-world-authority-cross-repo-e2e.sh'
      - '.github/workflows/p0-world-authority-cutover-gate.yml'
  push:
    branches:
      - main
      - 'fix/hepta-p0-blocker-closure-*'
    paths:
      - 'services/consumer-entry-api/src/main.rs'
      - 'services/consumer-entry-api/src/bin/world-authority-adapter.rs'
      - 'services/consumer-entry-api/src/trillionnium_world_adapters.rs'
      - 'config/world-authority-adapter.env.example'
      - 'docs/world-authority-cutover-v1.md'
      - 'docs/traceability/world-authority-cutover-v1.json'
      - 'scripts/run-world-authority-adapter.sh'
      - 'scripts/check-world-authority-cutover.sh'
      - 'scripts/check-world-authority-cross-repo-e2e.sh'
      - '.github/workflows/p0-world-authority-cutover-gate.yml'

permissions:
  contents: read

concurrency:
  group: p0-world-authority-cutover-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  RUST_TOOLCHAIN: '1.98.1'
  CEX_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  WORLD_SOURCE_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_SOURCE_SHA: aa0f0effd9088efdea2134cce9442167968de19e
  CHECKOUT_ACTION_SHA: 11d5960a326750d5838078e36cf38b85af677262
  RUST_TOOLCHAIN_ACTION_SHA: 6bed0761d98439e5a578e2877258200ad565ba87
  UPLOAD_ARTIFACT_ACTION_SHA: ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  exact-sha-cross-repository-qualification:
    name: p0-world-authority-cutover/exact-sha-cross-repository-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact CEX candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CEX_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact World candidate with provenance history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.WORLD_SOURCE_REPOSITORY }}
          ref: ${{ env.WORLD_SOURCE_SHA }}
          path: .world-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identities and evidence pin
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CEX_SOURCE_SHA"
          test "$(git -C .world-source rev-parse HEAD)" = "$WORLD_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C .world-source status --porcelain)"
          echo "cex_tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "world_tree=$(git -C .world-source rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          evidence = json.loads(
              pathlib.Path('docs/traceability/world-authority-cutover-v1.json').read_text()
          )
          pinned = evidence['world_source']['head_sha']
          actual = os.environ['WORLD_SOURCE_SHA']
          if pinned != actual:
              raise SystemExit(f'World evidence pin drift: evidence={pinned} workflow={actual}')
          if re.fullmatch(r'[0-9a-f]{40}', actual) is None:
              raise SystemExit('World source is not an exact commit SHA')
          if evidence['production_authorization'] != 'not_granted':
              raise SystemExit('source gate cannot grant production authorization')
          provenance = json.loads(
              pathlib.Path(
                  '.world-source/docs/contracts/trillionnium-world-authority-provenance-v1.json'
              ).read_text()
          )
          if provenance['source_commit'] != 'd44d8930c917b55da7b23eb19e9645feb8f4ee59':
              raise SystemExit('World historical provenance commit drift')
          if provenance['restored_tree_count'] != 7 or provenance['restored_file_count'] != 15:
              raise SystemExit('World restored source inventory drift')
          PY

      - name: Install immutable Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Verify toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"
          mkdir -p run/world-authority-cutover
          rustc --version --verbose > run/world-authority-cutover/rustc-version.txt
          cargo --version --verbose > run/world-authority-cutover/cargo-version.txt

      - name: Qualify exact World source and durable contract closure
        id: world
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/world-authority-target
        run: bash .world-source/scripts/check-trnm-world-authority-cutover.sh

      - name: Qualify CEX remote adapter and production write fence
        id: cex
        shell: bash
        run: bash scripts/check-world-authority-cutover.sh

      - name: Exercise cross-repository HTTP, restart, outage and rollback
        id: cross_repo
        shell: bash
        env:
          WORLD_AUTHORITY_EVIDENCE_DIR: ${{ github.workspace }}/run/world-authority-cutover
        run: |
          set -euo pipefail
          mkdir -p run/world-authority-cutover
          bash scripts/check-world-authority-cross-repo-e2e.sh .world-source \
            | tee run/world-authority-cutover/cross-repo-smoke.log

      - name: Record truth-bound exact-SHA evidence
        if: always()
        shell: bash
        env:
          CEX_TREE: ${{ steps.identity.outputs.cex_tree }}
          WORLD_TREE: ${{ steps.identity.outputs.world_tree }}
          WORLD_OUTCOME: ${{ steps.world.outcome }}
          CEX_OUTCOME: ${{ steps.cex.outcome }}
          CROSS_REPO_OUTCOME: ${{ steps.cross_repo.outcome }}
        run: |
          set -euo pipefail
          mkdir -p run/world-authority-cutover
          git -C .world-source ls-tree -r "$WORLD_SOURCE_SHA" -- \
            trillionnium/crates/world-authority \
            deploy/postgres/trnm-world-authority-cutover-v1.sql \
            deploy/postgres/trnm-world-authority-cutover-v1-hardening.sql \
            > run/world-authority-cutover/world-authority-tree.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          out = pathlib.Path('run/world-authority-cutover')

          def sha256(path: pathlib.Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def git(cwd: str, *args: str) -> str:
              return subprocess.run(
                  ['git', *args], cwd=cwd, check=True, text=True, stdout=subprocess.PIPE
              ).stdout.strip()

          outcomes = {
              'world_source_qualification': os.environ.get('WORLD_OUTCOME', 'skipped'),
              'cex_adapter_qualification': os.environ.get('CEX_OUTCOME', 'skipped'),
              'cross_repository_e2e': os.environ.get('CROSS_REPO_OUTCOME', 'skipped'),
          }
          green = all(value == 'success' for value in outcomes.values())
          receipt = {
              'schema': 'cex.world.authority.exact-sha-gate.v3',
              'status': 'cross_repository_source_qualification_green' if green else 'failed_or_incomplete',
              'cex_repository': os.environ['GITHUB_REPOSITORY'],
              'cex_head_sha': os.environ['CEX_SOURCE_SHA'],
              'cex_head_tree': os.environ.get('CEX_TREE'),
              'world_repository': os.environ['WORLD_SOURCE_REPOSITORY'],
              'world_head_sha': os.environ['WORLD_SOURCE_SHA'],
              'world_head_tree': os.environ.get('WORLD_TREE'),
              'world_authority_workspace_tree': git(
                  '.world-source', 'rev-parse',
                  f"{os.environ['WORLD_SOURCE_SHA']}:trillionnium/crates/world-authority"
              ),
              'world_base_migration_blob': git(
                  '.world-source', 'rev-parse',
                  f"{os.environ['WORLD_SOURCE_SHA']}:deploy/postgres/trnm-world-authority-cutover-v1.sql"
              ),
              'world_hardening_migration_blob': git(
                  '.world-source', 'rev-parse',
                  f"{os.environ['WORLD_SOURCE_SHA']}:deploy/postgres/trnm-world-authority-cutover-v1-hardening.sql"
              ),
              'outcomes': outcomes,
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'rust_toolchain': os.environ['RUST_TOOLCHAIN'],
              'local_fallback_allowed': False,
              'production_authorization': 'not_granted',
          }
          (out / 'exact-sha-gate-summary.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n'
          )
          files = sorted(path for path in out.iterdir() if path.is_file() and path.name != 'artifact-manifest.json')
          manifest = {
              'schema': 'cex.world.authority.artifact-manifest.v3',
              'cex_head_sha': os.environ['CEX_SOURCE_SHA'],
              'world_head_sha': os.environ['WORLD_SOURCE_SHA'],
              'files': [
                  {'path': path.name, 'bytes': path.stat().st_size, 'sha256': sha256(path)}
                  for path in files
              ],
          }
          (out / 'artifact-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Upload immutable source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-world-authority-cutover-${{ env.CEX_SOURCE_SHA }}-${{ env.WORLD_SOURCE_SHA }}
          path: run/world-authority-cutover/**
          if-no-files-found: error
          retention-days: 90
