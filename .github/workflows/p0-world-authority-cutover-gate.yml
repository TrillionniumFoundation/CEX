name: p0-world-authority-cutover-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/consumer-entry-api/**'
      - 'config/world-authority-adapter.env.example'
      - 'docs/world-authority-cutover-v1.md'
      - 'docs/traceability/world-authority-cutover-v1.json'
      - 'docs/release-evidence/world-repin-sequence17.json'
      - 'scripts/run-world-authority-adapter.sh'
      - 'scripts/check-world-authority-cutover.sh'
      - 'scripts/check-world-authority-cross-repo-e2e.sh'
      - '.github/workflows/p0-world-authority-cutover-gate.yml'
  push:
    branches:
      - main
      - 'fix/hepta-p0-blocker-closure-*'
    paths:
      - 'services/consumer-entry-api/**'
      - 'config/world-authority-adapter.env.example'
      - 'docs/world-authority-cutover-v1.md'
      - 'docs/traceability/world-authority-cutover-v1.json'
      - 'docs/release-evidence/world-repin-sequence17.json'
      - 'scripts/run-world-authority-adapter.sh'
      - 'scripts/check-world-authority-cutover.sh'
      - 'scripts/check-world-authority-cross-repo-e2e.sh'
      - '.github/workflows/p0-world-authority-cutover-gate.yml'

permissions:
  contents: read

concurrency:
  group: p0-world-authority-cutover-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  RUST_TOOLCHAIN: '1.98.1'
  CEX_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  WORLD_SOURCE_REPOSITORY: TrillionniumFoundation/Trillionnium-World

jobs:
  exact-sha-cross-repository-qualification:
    name: p0-world-authority-cutover/exact-sha-cross-repository-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact CEX candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CEX_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve one authoritative World identity
        id: world_identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re
          trace = json.loads(pathlib.Path('docs/traceability/world-authority-cutover-v1.json').read_text())
          repin = json.loads(pathlib.Path('docs/release-evidence/world-repin-sequence17.json').read_text())
          sha = trace['world_source']['head_sha']
          tree = trace['world_source']['head_tree']
          if repin['world_source_sha'] != sha or repin['world_source_tree'] != tree:
              raise SystemExit('World traceability/repin identity drift')
          if re.fullmatch(r'[0-9a-f]{40}', sha) is None or re.fullmatch(r'[0-9a-f]{40}', tree) is None:
              raise SystemExit('World identity is not an exact Git object')
          if trace['production_authorization'] != 'not_granted' or repin['production_authorization'] != 'not_granted':
              raise SystemExit('source evidence cannot grant production authorization')
          print(f'world_sha={sha}')
          print(f'world_tree={tree}')
          PY

      - name: Checkout exact World candidate with provenance history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.WORLD_SOURCE_REPOSITORY }}
          ref: ${{ steps.world_identity.outputs.world_sha }}
          path: .world-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identities
        shell: bash
        env:
          WORLD_SOURCE_SHA: ${{ steps.world_identity.outputs.world_sha }}
          WORLD_SOURCE_TREE: ${{ steps.world_identity.outputs.world_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CEX_SOURCE_SHA"
          test "$(git -C .world-source rev-parse HEAD)" = "$WORLD_SOURCE_SHA"
          test "$(git -C .world-source rev-parse HEAD^{tree})" = "$WORLD_SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C .world-source status --porcelain)"
          test -s .world-source/deploy/postgres/trnm-world-authority-catalog-fingerprint-v1.sql
          test -s .world-source/scripts/apply-trnm-world-authority-cutover-v1-legacy.sh

      - name: Install immutable Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Verify toolchain identity
        shell: bash
        run: test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"

      - name: Qualify exact World source and durable contract closure
        id: world
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/world-authority-target
        run: bash .world-source/scripts/check-trnm-world-authority-cutover.sh

      - name: Qualify CEX remote adapter and production write fence
        id: cex
        shell: bash
        run: bash scripts/check-world-authority-cutover.sh

      - name: Exercise cross-repository HTTP, restart, outage and rollback
        id: cross_repo
        shell: bash
        env:
          WORLD_AUTHORITY_EVIDENCE_DIR: ${{ github.workspace }}/run/world-authority-cutover
        run: |
          set -euo pipefail
          mkdir -p run/world-authority-cutover
          bash scripts/check-world-authority-cross-repo-e2e.sh .world-source \
            | tee run/world-authority-cutover/cross-repo-smoke.log

      - name: Record truth-bound exact-object evidence
        if: always()
        shell: bash
        env:
          WORLD_SOURCE_SHA: ${{ steps.world_identity.outputs.world_sha }}
          WORLD_SOURCE_TREE: ${{ steps.world_identity.outputs.world_tree }}
          WORLD_OUTCOME: ${{ steps.world.outcome }}
          CEX_OUTCOME: ${{ steps.cex.outcome }}
          CROSS_REPO_OUTCOME: ${{ steps.cross_repo.outcome }}
        run: |
          set -euo pipefail
          mkdir -p run/world-authority-cutover
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path('run/world-authority-cutover')
          def git(cwd, *args):
              return subprocess.run(['git', *args], cwd=cwd, check=True, text=True, stdout=subprocess.PIPE).stdout.strip()
          outcomes = {
              'world_source_qualification': os.environ.get('WORLD_OUTCOME', 'skipped'),
              'cex_adapter_qualification': os.environ.get('CEX_OUTCOME', 'skipped'),
              'cross_repository_e2e': os.environ.get('CROSS_REPO_OUTCOME', 'skipped'),
          }
          receipt = {
              'schema': 'cex.world.authority.exact-object-gate.v5',
              'status': 'cross_repository_source_qualification_green' if all(v == 'success' for v in outcomes.values()) else 'failed_or_incomplete',
              'cex_head_sha': os.environ['CEX_SOURCE_SHA'],
              'cex_head_tree': git('.', 'rev-parse', 'HEAD^{tree}'),
              'world_repository': os.environ['WORLD_SOURCE_REPOSITORY'],
              'world_head_sha': os.environ['WORLD_SOURCE_SHA'],
              'world_head_tree': os.environ['WORLD_SOURCE_TREE'],
              'world_catalog_fingerprint_blob': git('.world-source', 'rev-parse', 'HEAD:deploy/postgres/trnm-world-authority-catalog-fingerprint-v1.sql'),
              'world_supported_installer_blob': git('.world-source', 'rev-parse', 'HEAD:scripts/apply-trnm-world-authority-cutover-v1.sh'),
              'world_legacy_installer_blob': git('.world-source', 'rev-parse', 'HEAD:scripts/apply-trnm-world-authority-cutover-v1-legacy.sh'),
              'outcomes': outcomes,
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'production_authorization': 'not_granted',
          }
          (out / 'exact-object-gate-summary.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          files = sorted(p for p in out.rglob('*') if p.is_file() and p.name != 'artifact-manifest.json')
          (out / 'artifact-manifest.json').write_text(json.dumps({
              'schema': 'cex.world.authority.artifact-manifest.v5',
              'files': [{'path': p.relative_to(out).as_posix(), 'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in files],
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload immutable source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-world-authority-cutover-${{ env.CEX_SOURCE_SHA }}-${{ steps.world_identity.outputs.world_sha }}
          path: run/world-authority-cutover/**
          if-no-files-found: error
          retention-days: 90
