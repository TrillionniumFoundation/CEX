name: p0-gateway-exact-reserve-gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'migrations/**'
      - 'migrations/0073_add_gateway_exact_reserve_commands.sql'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'services/gateway-service/**'
      - 'crates/shared-config/src/runtime_guard.rs'
      - 'scripts/check-gateway-exact-reserve.py'
      - 'scripts/check-ledger-caller-cutover.py'
      - 'scripts/check-gateway-exact-reserve-postgres.sh'
      - 'scripts/check-p0-release-candidate-hygiene.py'
      - 'docs/gateway-exact-reserve-v1.md'
      - 'docs/ledger-caller-cutover-v1.md'
      - 'docs/configuration-v1.md'
      - 'docs/CEX-DEVELOPMENT-PLAN-2026-08-28-v12.md'
      - 'docs/templates/cex-release-baseline-manifest-v1.json'
      - 'docs/release-evidence/p0-candidate-trigger.json'
      - 'config/gateway-exact-reserve.env.example'
      - '.env.example'
      - '.env.production.example'
      - 'ops/systemd/cex-gateway-exact-reserve-api.service'
      - 'ops/systemd/cex-gateway-exact-reserve-worker.service'
      - '.github/workflows/p0-gateway-exact-reserve-gate.yml'

permissions:
  contents: read

concurrency:
  group: p0-gateway-exact-reserve-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://cex:cex_ci_password@127.0.0.1:5432/cex_ci

jobs:
  gateway-exact-reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cex
          POSTGRES_PASSWORD: cex_ci_password
          POSTGRES_DB: cex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cex -d cex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Candidate tree hygiene
        run: python3 scripts/check-p0-release-candidate-hygiene.py

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Static P0-N6 architecture gate
        run: python3 scripts/check-gateway-exact-reserve.py

      - name: Canonical Invocation caller cutover guard
        run: python3 scripts/check-ledger-caller-cutover.py

      - name: Migration and release-manifest governance
        run: |
          python3 scripts/check-p0-migrations.py
          python3 scripts/check-release-baseline-manifest.py \
            docs/templates/cex-release-baseline-manifest-v1.json --allow-template

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Gateway package tests
        run: cargo test --locked -p gateway-service --all-targets --no-fail-fast

      - name: Workspace all-target compile
        run: cargo check --locked --workspace --all-targets

      - name: Gateway Clippy warnings denied
        run: cargo clippy --locked -p gateway-service --all-targets -- -D warnings

      - name: Fresh migration lifecycle
        run: bash scripts/check-p0-migrations-postgres.sh

      - name: Invocation exact contract lifecycle
        run: bash scripts/check-invocation-ledger-contract-postgres.sh

      - name: Gateway exact reserve command lifecycle
        run: bash scripts/check-gateway-exact-reserve-postgres.sh
