name: sequence54-convergence-master

on:
  workflow_dispatch:
  push:
    branches:
      - work/sequence54-round2-staging-20260909
    paths:
      - '.github/workflows/sequence54-convergence-master.yml'

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: sequence54-convergence-master
  cancel-in-progress: false

env:
  TARGET_BRANCH: integration/cex-v12-sequence54-20260908
  PULL_REQUEST_NUMBER: '53'
  EVIDENCE_DIR: ${{ runner.temp }}/sequence54-convergence-master

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout controller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Preserve controller programs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cp scripts/sequence54_round3_remediate.py "$RUNNER_TEMP/remediate.py"
          cp scripts/sequence54_parallel_gate_orchestrator.py "$RUNNER_TEMP/orchestrator.py"
          python3 -m py_compile "$RUNNER_TEMP/remediate.py" "$RUNNER_TEMP/orchestrator.py"

      - name: Checkout current PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Deterministic source convergence and local qualification
        id: source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sequence 54 Convergence Bot'
          git config user.email 'sequence54-convergence@users.noreply.github.com'
          converged=false
          for attempt in 1 2 3; do
            git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}"
            git reset --hard FETCH_HEAD
            git clean -fdx
            before="$(git rev-parse HEAD)"
            printf 'attempt=%s before=%s\n' "$attempt" "$before" >> "$EVIDENCE_DIR/source-attempts.txt"

            if ! grep -q 'def selector_binding_self_tests' scripts/rust_toolchain_convergence_v4.py; then
              python3 "$RUNNER_TEMP/remediate.py" "$GITHUB_WORKSPACE"
            fi

            set +e
            cargo fmt --all -- --check > "$EVIDENCE_DIR/fmt-${attempt}-before.log" 2>&1
            fmt_rc=$?
            set -e
            if [[ "$fmt_rc" -ne 0 ]]; then
              cargo fmt --all
            fi

            set +e
            python3 scripts/generate-repository-semantics.py --check > "$EVIDENCE_DIR/semantics-${attempt}-before.log" 2>&1
            semantic_rc=$?
            set -e
            if [[ "$semantic_rc" -ne 0 ]]; then
              python3 scripts/generate-repository-semantics.py
            fi

            python3 -m py_compile \
              scripts/rust_toolchain_convergence_v4.py \
              scripts/check-consumer-projection-boundary.py \
              scripts/test-consumer-route-contract.py
            git diff --check
            if ! git diff --quiet; then
              git add -A
              git commit -m 'fix(sequence54): converge deterministic repository blockers' \
                -m 'Scope: selector identity, prospective merge ancestry, lexical projection guard, deterministic generated facts and rustfmt.' \
                -m 'production-authorization: not_granted'
            fi

            candidate="$(git rev-parse HEAD)"
            tree="$(git rev-parse HEAD^{tree})"
            checks=(
              'python3 scripts/check-rust-toolchain-convergence.py'
              'python3 scripts/test-consumer-route-contract.py'
              'python3 scripts/check-consumer-projection-boundary.py'
              'python3 scripts/generate-repository-semantics.py --check'
              'python3 scripts/check-development-docs.py'
              'python3 scripts/check-module-documentation.py'
              'python3 scripts/check-sequence54-integration.py'
              'cargo fmt --all -- --check'
              'cargo metadata --locked --format-version 1'
              'cargo check --workspace --all-targets --locked'
            )
            overall=0
            index=0
            for command in "${checks[@]}"; do
              index=$((index + 1))
              log="$EVIDENCE_DIR/local-${attempt}-${index}.log"
              printf 'command=%s\n' "$command" > "$log"
              set +e
              bash -lc "$command" >> "$log" 2>&1
              rc=$?
              set -e
              printf 'exit_code=%s\n' "$rc" >> "$log"
              if [[ "$rc" -ne 0 ]]; then overall=1; fi
            done
            test "$overall" -eq 0

            if [[ "$candidate" == "$before" ]]; then
              converged=true
              break
            fi
            git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}"
            if [[ "$(git rev-parse FETCH_HEAD)" == "$before" ]]; then
              git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
              converged=true
              break
            fi
          done
          [[ "$converged" == true ]]
          printf '%s\n' "$(git rev-parse HEAD)" > "$EVIDENCE_DIR/head-sha.txt"
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > "$EVIDENCE_DIR/head-tree.txt"

      - name: Parallel exact-run qualification
        id: gates
        if: steps.source.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head="$(cat "$EVIDENCE_DIR/head-sha.txt")"
          tree="$(cat "$EVIDENCE_DIR/head-tree.txt")"
          python3 "$RUNNER_TEMP/orchestrator.py" \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$TARGET_BRANCH" \
            --sha "$head" \
            --tree "$tree" \
            --output "$EVIDENCE_DIR/exact-head-gates.json" \
            --timeout-seconds 19800

      - name: Aggregate P0 candidate qualification
        id: p0
        if: steps.source.outcome == 'success' && steps.gates.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head="$(cat "$EVIDENCE_DIR/head-sha.txt")"
          tree="$(cat "$EVIDENCE_DIR/head-tree.txt")"
          workflow='p0-release-candidate-gate.yml'
          baseline="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=100")"
          success="$(jq -r --arg sha "$head" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | reverse | .[0].id // empty' <<<"$baseline")"
          if [[ -n "$success" ]]; then
            run_id="$success"
            action='reuse_exact_success'
          else
            active="$(jq -r --arg sha "$head" '[.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested"))] | sort_by(.created_at) | reverse | .[0].id // empty' <<<"$baseline")"
            if [[ -n "$active" ]]; then
              run_id="$active"
              action='adopt_exact_active'
            else
              baseline_ids="$(jq -r --arg sha "$head" '.workflow_runs[] | select(.head_sha == $sha) | .id' <<<"$baseline")"
              payload="$(jq -nc --arg ref "$TARGET_BRANCH" '{ref:$ref}')"
              http="$(curl -sS -o "$EVIDENCE_DIR/p0-dispatch-response.json" -w '%{http_code}' \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                -H 'Content-Type: application/json' \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
                -d "$payload")"
              [[ "$http" =~ ^20[14]$ ]]
              run_id=''
              for _ in $(seq 1 120); do
                current="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=100")"
                while read -r candidate; do
                  [[ -n "$candidate" ]] || continue
                  if ! grep -Fxq "$candidate" <<<"$baseline_ids"; then
                    run_id="$candidate"
                    break
                  fi
                done < <(jq -r --arg sha "$head" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | reverse | .[].id' <<<"$current")
                [[ -n "$run_id" ]] && break
                sleep 10
              done
              [[ -n "$run_id" ]]
              action='dispatch_new_exact_run'
            fi
          fi
          printf 'run_id=%s\naction=%s\n' "$run_id" "$action" > "$EVIDENCE_DIR/p0-run.txt"
          for _ in $(seq 1 1600); do
            value="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(jq -r '.status' <<<"$value")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$value")"
            [[ "$status" == completed ]] && break
            current_head="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/branches/${TARGET_BRANCH//\//%2F}" --jq '.commit.sha')"
            [[ "$current_head" == "$head" ]]
            sleep 15
          done
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > "$EVIDENCE_DIR/p0-jobs.json"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > "$EVIDENCE_DIR/p0-artifacts.json"
          python3 - "$EVIDENCE_DIR" "$head" "$tree" "$run_id" "$status" "$conclusion" "$action" <<'PY'
          from pathlib import Path
          import json, sys
          root=Path(sys.argv[1])
          jobs=json.loads((root/'p0-jobs.json').read_text()).get('jobs',[])
          executed=[j for j in jobs if j.get('conclusion')!='skipped']
          nonempty=bool(executed) and all(j.get('steps') for j in executed)
          artifacts=json.loads((root/'p0-artifacts.json').read_text()).get('artifacts',[])
          bound=[a for a in artifacts if a.get('name','').startswith('cex-p0-evidence-') or a.get('name','').startswith('cex-p0-candidate-manifest-')]
          ok=sys.argv[5]=='completed' and sys.argv[6]=='success' and nonempty and len(bound)>=2
          value={'schema':'cex.sequence54-convergence-p0.v1','head_sha':sys.argv[2],'head_tree':sys.argv[3],'run_id':int(sys.argv[4]),'status':sys.argv[5],'conclusion':sys.argv[6],'action':sys.argv[7],'nonempty_executed_jobs':nonempty,'artifacts':[{'id':a.get('id'),'name':a.get('name'),'digest':a.get('digest')} for a in bound],'repository_candidate_qualified':ok,'production_authorization':'not_granted'}
          (root/'p0-candidate.json').write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          raise SystemExit(0 if ok else 1)
          PY

      - name: Live final admission readback and review request
        id: final
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          GATE_OUTCOME: ${{ steps.gates.outcome }}
          P0_OUTCOME: ${{ steps.p0.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EVIDENCE_DIR" <<'PY'
          from __future__ import annotations
          import json, os, subprocess, sys
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          root=Path(sys.argv[1]); repository=os.environ['GITHUB_REPOSITORY']; pr_number=int(os.environ['PULL_REQUEST_NUMBER']); token=os.environ['GH_TOKEN']; api=os.environ.get('GITHUB_API_URL','https://api.github.com'); graphql_url=os.environ.get('GITHUB_GRAPHQL_URL','https://api.github.com/graphql')
          def call(path,method='GET',payload=None,allow_error=False):
              data=None if payload is None else json.dumps(payload).encode(); req=Request(api+path,method=method,data=data,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'sequence54-convergence-master','Content-Type':'application/json'})
              try:
                  with urlopen(req,timeout=30) as r: body=r.read(); return {'status':r.status,'value':json.loads(body) if body else None}
              except HTTPError as e:
                  body=e.read().decode('utf-8','replace')
                  if allow_error:return {'status':e.code,'error':body[:4000]}
                  raise
          pr=call(f'/repos/{repository}/pulls/{pr_number}')['value']; head=pr['head']['sha']; author=pr['user']['login']; tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          source_green=os.environ.get('SOURCE_OUTCOME')=='success'; gates_green=os.environ.get('GATE_OUTCOME')=='success'; p0_green=os.environ.get('P0_OUTCOME')=='success'
          reviews=call(f'/repos/{repository}/pulls/{pr_number}/reviews?per_page=100')['value']; latest={}
          for review in reviews:
              login=(review.get('user') or {}).get('login')
              if login and (login not in latest or (review.get('submitted_at') or '') >= (latest[login].get('submitted_at') or '')): latest[login]=review
          approvals=sorted(login for login,review in latest.items() if login!=author and review.get('state')=='APPROVED' and review.get('commit_id')==head and (review.get('user') or {}).get('type')!='Bot')
          request_result=None
          if source_green and gates_green and p0_green and len(approvals)<2:
              request_result=call(f'/repos/{repository}/pulls/{pr_number}/requested_reviewers',method='POST',payload={'reviewers':['Franksudoman','Tomasrgbsf']},allow_error=True)
          rulesets=call(f'/repos/{repository}/rulesets?includes_parents=true&per_page=100',allow_error=True); protection=call(f'/repos/{repository}/branches/main/protection',allow_error=True)
          active=[]
          if rulesets.get('status')==200 and isinstance(rulesets.get('value'),list): active=[r for r in rulesets['value'] if r.get('enforcement')=='active']
          report={'schema':'cex.sequence54-convergence-final-readback.v1','observed_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),'repository':repository,'pull_request':pr_number,'head_sha':head,'head_tree':tree,'base_sha':pr['base']['sha'],'prospective_merge_sha':pr.get('merge_commit_sha'),'draft':pr.get('draft'),'source_green':source_green,'exact_head_gates_green':gates_green,'aggregate_p0_green':p0_green,'eligible_current_head_approvals':approvals,'review_request':request_result,'active_ruleset_count':len(active),'rulesets_readback':rulesets,'branch_protection_readback':protection,'cross_repository_acceptance_closed':False,'production_evidence_closed':False,'all_gaps_closed':False,'merge_authorized':False,'production_authorization':'not_granted','force_push_used':False,'administrator_bypass_used':False,'synthetic_status_used':False,'self_approval_used':False}
          (root/'final-readback.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          failed=[]
          gate_path=root/'exact-head-gates.json'
          if gate_path.exists(): failed=json.loads(gate_path.read_text()).get('failed',[])
          body='\n'.join(['<!-- sequence54-convergence-master -->','## Sequence 54 convergence master','',f'- Exact head/tree: `{head}` / `{tree}`',f'- Deterministic source qualification: `{str(source_green).lower()}`',f'- Parallel exact-head gate families: `{str(gates_green).lower()}`',f'- Failed gate families: `{", ".join(failed) or "none"}`',f'- Aggregate P0 candidate: `{str(p0_green).lower()}`',f'- Active Rulesets observed: `{len(active)}`',f'- Eligible approvals on this exact head: `{len(approvals)}` ({", ".join(approvals) or "none"})','- Cross-repository acceptance and production authority remain separately receipt-bound.','','```text','all_gaps_closed=false','merge_authorized=false','production_authorization=not_granted','```'])+'\n'
          comments=call(f'/repos/{repository}/issues/{pr_number}/comments?per_page=100')['value']; existing=next((c for c in reversed(comments) if '<!-- sequence54-convergence-master -->' in (c.get('body') or '')),None)
          if existing: call(f'/repos/{repository}/issues/comments/{existing["id"]}',method='PATCH',payload={'body':body})
          else: call(f'/repos/{repository}/issues/{pr_number}/comments',method='POST',payload={'body':body})
          PY

      - name: Enforce repository-owned convergence
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          GATE_OUTCOME: ${{ steps.gates.outcome }}
          P0_OUTCOME: ${{ steps.p0.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_OUTCOME" = success
          test "$GATE_OUTCOME" = success
          test "$P0_OUTCOME" = success

      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sequence54-convergence-master-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
