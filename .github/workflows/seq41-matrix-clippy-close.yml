name: seq41-matrix-clippy-close

on:
  push:
    branches:
      - automation/seq41-matrix-clippy-close
    paths:
      - '.github/workflows/seq41-matrix-clippy-close.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seq41-matrix-clippy-close
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  patch-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact sequence 41 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust stable with format and lint
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Patch, validate, commit and push the exact matrix source
        shell: bash
        run: |
          set -euo pipefail

          target=services/matrix-entry-adapter/src/lib.rs
          [[ "$(git hash-object "$target")" == \
             "69c9ff0ad7b44a93fe1cda9e12a9facc0211606c" ]] || {
            echo "::error::matrix-entry-adapter source blob drifted"
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          path = Path('services/matrix-entry-adapter/src/lib.rs')
          source = path.read_text(encoding='utf-8')

          functions = (
              'enforce_rate_limit',
              'fetch_wallet_projection',
              'fetch_consumer_entry_get',
              'fetch_consumer_entry_post',
              'parse_consumer_entry_json_response',
              'fetch_task_projection',
          )
          for name in functions:
              anchor = f'async fn {name}('
              if source.count(anchor) != 1:
                  raise SystemExit(
                      f'Clippy response-boundary anchor drifted for {name}: '
                      f'{source.count(anchor)} matches'
                  )
              replacement = (
                  '// Preserve the exact Axum rejection response at this internal HTTP boundary.\n'
                  '#[allow(clippy::result_large_err)]\n'
                  + anchor
              )
              if replacement in source:
                  raise SystemExit(f'Clippy response-boundary fix already present for {name}')
              source = source.replace(anchor, replacement, 1)

          needless_borrows = source.count('&format!(')
          if needless_borrows != 23:
              raise SystemExit(
                  'needless format-borrow anchor drifted: '
                  f'expected 23, got {needless_borrows}'
              )
          source = source.replace('&format!(', 'format!(')
          if '&format!(' in source:
              raise SystemExit('needless format borrows remain after replacement')

          path.write_text(source, encoding='utf-8')
          PY

          cargo fmt --all

          mapfile -t changed < <(git diff --name-only)
          [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == "$target" ]] || {
            printf '::error::unexpected files changed during sequence 41 patch\n'
            printf 'changed: %s\n' "${changed[@]}"
            exit 1
          }
          git diff --check

          cargo clippy --locked -p matrix-entry-adapter --all-targets -- -D warnings
          cargo clippy --locked -p trnm-economy-service --all-targets -- -D warnings
          cargo test --locked -p matrix-entry-adapter

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target"
          git commit -m "fix(clippy): close matrix response and format regressions"
          git push origin HEAD:automation/seq41-matrix-clippy-close
