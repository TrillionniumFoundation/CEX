name: sequence54-round3-remediation

on:
  push:
    branches:
      - work/sequence54-round2-staging-20260909
    paths:
      - '.github/workflows/sequence54-round3-remediation.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: sequence54-round3-remediation
  cancel-in-progress: false

env:
  TARGET_BRANCH: integration/cex-v12-sequence54-20260908

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout remediation controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Preserve controller outside checkout
        shell: bash
        run: cp scripts/sequence54_round3_remediate.py "$RUNNER_TEMP/remediate.py"

      - name: Checkout live PR branch without rewriting history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic repository-internal repairs
        shell: bash
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          printf '%s\n' "$before" > "$RUNNER_TEMP/round3-before-sha.txt"
          python3 "$RUNNER_TEMP/remediate.py" "$GITHUB_WORKSPACE"
          python3 -m py_compile \
            scripts/rust_toolchain_convergence_v4.py \
            scripts/check-consumer-projection-boundary.py \
            scripts/test-consumer-route-contract.py
          git diff --check
          git config user.name 'Sequence 54 Remediation Bot'
          git config user.email 'sequence54-remediation@users.noreply.github.com'
          git add \
            .github/workflows/p0-rust-toolchain-convergence.yml \
            scripts/rust_toolchain_convergence_v4.py \
            docs/security/rust-toolchain-surfaces-v1.json \
            scripts/check-consumer-projection-boundary.py \
            scripts/test-consumer-route-contract.py \
            docs/modules/consumer-entry-api.md
          git commit -m 'fix(sequence54): close toolchain and projection gate blockers' \
            -m 'Bind every parsed Rust selector to 1.98.1, reject comment-only release bindings and conflicting fixed selectors, fetch the prospective merge with its parents, and make the Consumer projection guard inspect Rust literals with SQL-aware mutation shapes.' \
            -m 'production-authorization: not_granted'
          git rev-parse HEAD > "$RUNNER_TEMP/round3-candidate-sha.txt"

      - name: Qualify repaired local commit before publication
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/sequence54-round3"
          mkdir -p "$evidence"
          checks=(
            'python3 scripts/check-rust-toolchain-convergence.py'
            'python3 scripts/test-consumer-route-contract.py'
            'python3 scripts/check-consumer-projection-boundary.py'
            'python3 scripts/generate-repository-semantics.py --check'
            'python3 scripts/check-development-docs.py'
            'python3 scripts/check-module-documentation.py'
            'python3 scripts/check-sequence54-integration.py'
          )
          overall=0
          index=0
          for command in "${checks[@]}"; do
            index=$((index + 1))
            log="$evidence/check-${index}.log"
            printf 'command=%s\n' "$command" > "$log"
            set +e
            bash -lc "$command" >> "$log" 2>&1
            rc=$?
            set -e
            printf 'exit_code=%s\n' "$rc" >> "$log"
            if [[ "$rc" -ne 0 ]]; then overall=1; fi
          done
          cp "$RUNNER_TEMP/round3-before-sha.txt" "$evidence/"
          cp "$RUNNER_TEMP/round3-candidate-sha.txt" "$evidence/"
          printf 'overall=%s\nproduction_authorization=not_granted\n' "$overall" > "$evidence/summary.txt"
          exit "$overall"

      - name: Rebind to unchanged remote head and push fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          before="$(cat "$RUNNER_TEMP/round3-before-sha.txt")"
          candidate="$(cat "$RUNNER_TEMP/round3-candidate-sha.txt")"
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}"
          remote="$(git rev-parse FETCH_HEAD)"
          test "$remote" = "$before"
          test "$(git rev-parse HEAD)" = "$candidate"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Upload bounded remediation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sequence54-round3-remediation-${{ github.run_id }}
          path: ${{ runner.temp }}/sequence54-round3
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
