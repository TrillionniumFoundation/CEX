name: sequence54-round3-exact-head-orchestrator

on:
  push:
    branches:
      - work/sequence54-round2-staging-20260909
    paths:
      - '.github/workflows/sequence54-round3-exact-head-orchestrator.yml'

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: sequence54-round3-remediation
  cancel-in-progress: false

env:
  TARGET_BRANCH: integration/cex-v12-sequence54-20260908
  MARKER_PATH: docs/release-evidence/sequence54-round3-source-green.json

jobs:
  orchestrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout controller and preserve repair program
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Preserve repair program
        shell: bash
        run: cp scripts/sequence54_round3_remediate.py "$RUNNER_TEMP/remediate.py"

      - name: Checkout latest live PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Idempotently establish repaired and locally-qualified source
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/sequence54-round3-orchestrator"
          mkdir -p "$evidence"
          remote_before="$(git rev-parse HEAD)"
          printf '%s\n' "$remote_before" > "$evidence/remote-before-sha.txt"

          if ! grep -q 'def selector_binding_self_tests' scripts/rust_toolchain_convergence_v4.py; then
            python3 "$RUNNER_TEMP/remediate.py" "$GITHUB_WORKSPACE"
          fi

          python3 -m py_compile \
            scripts/rust_toolchain_convergence_v4.py \
            scripts/check-consumer-projection-boundary.py \
            scripts/test-consumer-route-contract.py
          git diff --check

          git config user.name 'Sequence 54 Closure Bot'
          git config user.email 'sequence54-closure@users.noreply.github.com'
          if ! git diff --quiet; then
            git add \
              .github/workflows/p0-rust-toolchain-convergence.yml \
              scripts/rust_toolchain_convergence_v4.py \
              docs/security/rust-toolchain-surfaces-v1.json \
              scripts/check-consumer-projection-boundary.py \
              scripts/test-consumer-route-contract.py \
              docs/modules/consumer-entry-api.md
            git commit -m 'fix(sequence54): close toolchain and projection gate blockers' \
              -m 'production-authorization: not_granted'
          fi

          checks=(
            'python3 scripts/check-rust-toolchain-convergence.py'
            'python3 scripts/test-consumer-route-contract.py'
            'python3 scripts/check-consumer-projection-boundary.py'
            'python3 scripts/generate-repository-semantics.py --check'
            'python3 scripts/check-development-docs.py'
            'python3 scripts/check-module-documentation.py'
            'python3 scripts/check-sequence54-integration.py'
          )
          index=0
          for command in "${checks[@]}"; do
            index=$((index + 1))
            log="$evidence/local-check-${index}.log"
            printf 'command=%s\n' "$command" > "$log"
            bash -lc "$command" >> "$log" 2>&1
            printf 'exit_code=0\n' >> "$log"
          done

          qualified_sha="$(git rev-parse HEAD)"
          qualified_tree="$(git rev-parse HEAD^{tree})"
          marker_matches=false
          if [[ -f "$MARKER_PATH" ]]; then
            if python3 - "$MARKER_PATH" "$qualified_sha" "$qualified_tree" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          raise SystemExit(0 if (
              value.get('qualified_parent_sha') == sys.argv[2]
              and value.get('qualified_parent_tree') == sys.argv[3]
          ) else 1)
          PY
            then marker_matches=true; fi
          fi
          if [[ "$marker_matches" != true ]]; then
            python3 - "$MARKER_PATH" "$qualified_sha" "$qualified_tree" <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, sys
          value = {
              'schema': 'cex.sequence54-round3-source-qualification.v1',
              'qualified_parent_sha': sys.argv[2],
              'qualified_parent_tree': sys.argv[3],
              'checks': [
                  'rust-toolchain-selector-identity',
                  'consumer-route-contract-regressions',
                  'consumer-projection-boundary',
                  'repository-semantics-generated-contract',
                  'development-document-authority',
                  'module-documentation',
                  'sequence54-integration-source-admission',
              ],
              'qualified_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'production_authorization': 'not_granted',
          }
          path = Path(sys.argv[1]); path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
            git add "$MARKER_PATH"
            git commit -m 'test(sequence54): bind round-3 source qualification' \
              -m "qualified-parent: $qualified_sha" \
              -m "qualified-tree: $qualified_tree" \
              -m 'production-authorization: not_granted'
          fi

          final_sha="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          printf '%s\n' "$final_sha" > "$evidence/final-sha.txt"
          printf '%s\n' "$final_tree" > "$evidence/final-tree.txt"

          if [[ "$final_sha" != "$remote_before" ]]; then
            git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}"
            test "$(git rev-parse FETCH_HEAD)" = "$remote_before"
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          fi

      - name: Requalify final marker commit
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/sequence54-round3-orchestrator"
          checks=(
            'python3 scripts/check-rust-toolchain-convergence.py'
            'python3 scripts/test-consumer-route-contract.py'
            'python3 scripts/check-consumer-projection-boundary.py'
            'python3 scripts/generate-repository-semantics.py --check'
            'python3 scripts/check-development-docs.py'
            'python3 scripts/check-module-documentation.py'
            'python3 scripts/check-sequence54-integration.py'
          )
          index=0
          for command in "${checks[@]}"; do
            index=$((index + 1))
            log="$evidence/final-check-${index}.log"
            printf 'command=%s\n' "$command" > "$log"
            bash -lc "$command" >> "$log" 2>&1
            printf 'exit_code=0\n' >> "$log"
          done
          test "$(git rev-parse HEAD)" = "$(cat "$evidence/final-sha.txt")"
          test "$(git rev-parse HEAD^{tree})" = "$(cat "$evidence/final-tree.txt")"

      - name: Dispatch and collect exact-head required gate families
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/sequence54-round3-orchestrator" <<'PY'
          from __future__ import annotations
          import json, os, re, sys, time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          evidence = Path(sys.argv[1])
          repository = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['TARGET_BRANCH']
          token = os.environ['GH_TOKEN']
          final_sha = (evidence / 'final-sha.txt').read_text().strip()
          final_tree = (evidence / 'final-tree.txt').read_text().strip()
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com')
          started = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')

          def request(path: str, *, method: str = 'GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = Request(
                  api + path,
                  method=method,
                  data=data,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'sequence54-round3-orchestrator',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urlopen(req, timeout=30) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except HTTPError as error:
                  body = error.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'{method} {path} -> {error.code}: {body[:1000]}') from error

          def current_branch_sha() -> str:
              _status, value = request(
                  f'/repos/{repository}/branches/{quote(branch, safe="")}'
              )
              return value['commit']['sha']

          if current_branch_sha() != final_sha:
              raise SystemExit('target branch moved before exact-head dispatch')

          desired_names = [
              'p0-runner-diagnostics',
              'p0-rust-toolchain-convergence',
              'repository-semantic-contract-gate',
              'consumer-projection-boundary-gate',
              'execution-lifecycle-gate',
              'matrix-review-repair-regression',
              'trnm-economy-ci',
              'trnm-economy-settlement',
              'world-settlement-external-evidence',
              'p0-sequence54-integration',
              'cex-v12-native-minimal',
          ]
          workflow_map = {}
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              match = re.search(r'(?m)^name:\s*["\']?([^"\'\n]+)', text)
              if match:
                  workflow_map.setdefault(match.group(1).strip(), []).append(path.as_posix())

          missing = [name for name in desired_names if len(workflow_map.get(name, [])) != 1]
          if missing:
              raise SystemExit(f'required workflow names missing or ambiguous: {missing!r}')

          selected = {name: workflow_map[name][0] for name in desired_names}
          unsupported = [
              name for name, path in selected.items()
              if 'workflow_dispatch:' not in Path(path).read_text(encoding='utf-8')
          ]
          if unsupported:
              raise SystemExit(f'required workflows lack workflow_dispatch: {unsupported!r}')

          dispatches = []
          for name, path in selected.items():
              encoded = quote(path, safe='')
              _status, runs = request(
                  f'/repos/{repository}/actions/workflows/{encoded}/runs?per_page=100'
              )
              exact_success = next(
                  (
                      run for run in runs.get('workflow_runs', [])
                      if run.get('head_sha') == final_sha
                      and run.get('status') == 'completed'
                      and run.get('conclusion') == 'success'
                  ),
                  None,
              )
              if exact_success:
                  dispatches.append({
                      'name': name,
                      'path': path,
                      'action': 'reused_exact_success',
                      'run_id': exact_success['id'],
                  })
                  continue
              request(
                  f'/repos/{repository}/actions/workflows/{encoded}/dispatches',
                  method='POST',
                  payload={'ref': branch},
              )
              dispatches.append({'name': name, 'path': path, 'action': 'dispatched'})

          (evidence / 'dispatches.json').write_text(
              json.dumps(dispatches, indent=2, sort_keys=True) + '\n'
          )

          deadline = time.time() + 7200
          final = {}
          while time.time() < deadline:
              if current_branch_sha() != final_sha:
                  raise SystemExit('target branch moved during exact-head qualification')
              pending = []
              for name, path in selected.items():
                  encoded = quote(path, safe='')
                  _status, runs = request(
                      f'/repos/{repository}/actions/workflows/{encoded}/runs?per_page=100'
                  )
                  exact = [
                      run for run in runs.get('workflow_runs', [])
                      if run.get('head_sha') == final_sha
                  ]
                  exact.sort(key=lambda run: run.get('created_at', ''), reverse=True)
                  if not exact or exact[0].get('status') != 'completed':
                      pending.append(name)
                      continue
                  final[name] = exact[0]
              if not pending and len(final) == len(selected):
                  break
              time.sleep(15)
          else:
              raise SystemExit('timed out waiting for exact-head workflow family completion')

          details = {}
          failed = []
          for name, run in final.items():
              run_id = run['id']
              _status, jobs = request(
                  f'/repos/{repository}/actions/runs/{run_id}/jobs?per_page=100'
              )
              job_values = []
              for job in jobs.get('jobs', []):
                  job_values.append({
                      'id': job.get('id'),
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'runner_name': job.get('runner_name'),
                      'steps': [
                          {
                              'name': step.get('name'),
                              'status': step.get('status'),
                              'conclusion': step.get('conclusion'),
                          }
                          for step in (job.get('steps') or [])
                      ],
                  })
              details[name] = {
                  'workflow_path': selected[name],
                  'run_id': run_id,
                  'event': run.get('event'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'head_sha': run.get('head_sha'),
                  'run_attempt': run.get('run_attempt'),
                  'jobs': job_values,
              }
              if run.get('conclusion') != 'success':
                  failed.append(name)

          report = {
              'schema': 'cex.sequence54-round3-exact-head-gates.v1',
              'repository': repository,
              'branch': branch,
              'head_sha': final_sha,
              'tree_sha': final_tree,
              'started_at': started,
              'completed_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'workflows': details,
              'failed': sorted(failed),
              'all_required_gate_families_green': not failed,
              'production_authorization': 'not_granted',
          }
          (evidence / 'exact-head-gates.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          if failed:
              raise SystemExit(f'exact-head required workflow failures: {sorted(failed)!r}')
          PY

      - name: Dispatch aggregate P0 candidate gate after exact-head families
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/p0-release-candidate-gate.yml'
          if [[ -f "$workflow" ]] && grep -q 'workflow_dispatch:' "$workflow"; then
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/p0-release-candidate-gate.yml/dispatches" \
              -f ref="$TARGET_BRANCH"
          fi

      - name: Upload exact-head orchestration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sequence54-round3-orchestrator-${{ github.run_id }}
          path: ${{ runner.temp }}/sequence54-round3-orchestrator
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
