name: automation-p0-n2-source-export

on:
  push:
    branches:
      - automation/p0-n2-source-export
    paths:
      - '.github/workflows/automation-p0-n2-source-export.yml'

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build source archive
        run: tar --exclude=.git --exclude=target -czf /tmp/cex-p0n2-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cex-p0n2-source
          path: /tmp/cex-p0n2-source.tar.gz
          if-no-files-found: error
          retention-days: 1
