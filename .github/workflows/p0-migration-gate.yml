name: p0-migration-gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'migrations/**'
      - 'services/ledger-service/src/lib.rs'
      - 'services/ledger-service/src/receipt_lookup.rs'
      - 'scripts/check-p0-migrations.py'
      - 'scripts/check-p0-migrations-postgres.sh'
      - 'scripts/check-audit-source-baseline-postgres.sh'
      - 'scripts/check-ledger-operation-identity-postgres.sh'
      - 'scripts/check-invocation-ledger-contract-static.py'
      - 'scripts/check-invocation-ledger-contract-postgres.sh'
      - 'scripts/check-invocation-ledger-terminal-postgres.sh'
      - 'scripts/check-trnm-settlement-receipt-lookup.py'
      - 'scripts/check-trnm-settlement-receipt-lookup-http.sh'
      - 'scripts/backfill-audit-source-baselines.sh'
      - 'docs/templates/cex-release-baseline-manifest-v1.json'
      - 'docs/audit-source-baseline-backfill-v1.md'
      - 'docs/ledger-operation-identity-v1.md'
      - 'docs/invocation-ledger-contract-v1.md'
      - 'docs/protocol/trnm-settlement-receipt-recovery-v1.md'
      - 'docs/release-evidence/p0-candidate-trigger.json'
      - '.github/workflows/p0-migration-gate.yml'
      - '.github/workflows/p0-release-candidate-gate.yml'
  pull_request:
    paths:
      - 'migrations/**'
      - 'services/ledger-service/src/lib.rs'
      - 'services/ledger-service/src/receipt_lookup.rs'
      - 'scripts/check-p0-migrations.py'
      - 'scripts/check-p0-migrations-postgres.sh'
      - 'scripts/check-audit-source-baseline-postgres.sh'
      - 'scripts/check-ledger-operation-identity-postgres.sh'
      - 'scripts/check-invocation-ledger-contract-static.py'
      - 'scripts/check-invocation-ledger-contract-postgres.sh'
      - 'scripts/check-invocation-ledger-terminal-postgres.sh'
      - 'scripts/check-trnm-settlement-receipt-lookup.py'
      - 'scripts/check-trnm-settlement-receipt-lookup-http.sh'
      - 'scripts/backfill-audit-source-baselines.sh'
      - 'docs/templates/cex-release-baseline-manifest-v1.json'
      - 'docs/audit-source-baseline-backfill-v1.md'
      - 'docs/ledger-operation-identity-v1.md'
      - 'docs/invocation-ledger-contract-v1.md'
      - 'docs/protocol/trnm-settlement-receipt-recovery-v1.md'
      - 'docs/release-evidence/p0-candidate-trigger.json'
      - '.github/workflows/p0-migration-gate.yml'
      - '.github/workflows/p0-release-candidate-gate.yml'

permissions:
  contents: read

env:
  DATABASE_URL: postgres://cex:cex_ci_password@127.0.0.1:5432/cex_ci

jobs:
  fresh-postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cex
          POSTGRES_PASSWORD: cex_ci_password
          POSTGRES_DB: cex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cex -d cex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Candidate tree hygiene
        run: python3 scripts/check-p0-release-candidate-hygiene.py

      - name: Static migration contract
        run: python3 scripts/check-p0-migrations.py

      - name: Invocation Ledger contract static wiring
        run: python3 scripts/check-invocation-ledger-contract-static.py

      - name: TRNM receipt recovery static wiring
        run: python3 scripts/check-trnm-settlement-receipt-lookup.py

      - name: Fresh apply and P0 database assertions
        run: bash scripts/check-p0-migrations-postgres.sh

      - name: Existing-row Audit baseline lifecycle
        run: bash scripts/check-audit-source-baseline-postgres.sh

      - name: Ledger operation identity and exact replay
        run: bash scripts/check-ledger-operation-identity-postgres.sh

      - name: Invocation Ledger contract lifecycle
        run: bash scripts/check-invocation-ledger-contract-postgres.sh

      - name: Invocation Ledger terminal exclusivity
        run: bash scripts/check-invocation-ledger-terminal-postgres.sh
