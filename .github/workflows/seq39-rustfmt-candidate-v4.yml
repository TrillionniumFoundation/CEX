name: seq39-rustfmt-candidate-v4

on:
  push:
    branches:
      - automation/seq39-exact-apply
    paths:
      - '.github/workflows/seq39-rustfmt-candidate-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seq39-rustfmt-candidate-v4
  cancel-in-progress: false

env:
  DATABASE_URL: postgres://cex:cex_ci_password@127.0.0.1:5432/cex_ci
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPYCACHEPREFIX: /tmp/cex-seq39-python-cache

jobs:
  construct-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cex
          POSTGRES_PASSWORD: cex_ci_password
          POSTGRES_DB: cex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cex -d cex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout exact automation payload
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust stable with format and lint
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Execute exact sequence 39 candidate construction
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git hash-object .github/workflows/seq39-manifest-fixture-repair.yml)" == \
             "8cfd99b63f96ae2432958a33f35f32a58f3e5b0b" ]] || {
            echo "::error::sequence 39 manifest/rustfmt workflow blob drifted"
            exit 1
          }

          python3 - <<'PYWRAP'
          from pathlib import Path

          workflow = Path('.github/workflows/seq39-manifest-fixture-repair.yml').read_text(
              encoding='utf-8'
          ).splitlines()
          marker = '        run: |'
          indices = [index for index, line in enumerate(workflow) if line == marker]
          if len(indices) != 1:
              raise SystemExit(f'expected one candidate run block, got {len(indices)}')
          block = workflow[indices[0] + 1:]
          if not block or any(line and not line.startswith('          ') for line in block):
              raise SystemExit('candidate run block indentation drifted')
          extracted = '\n'.join(
              line[10:] if line.startswith('          ') else '' for line in block
          ) + '\n'

          old = "f'candidate path is already present: {entry.strip()}'"
          new = "f'candidate path is already present: {{entry.strip()}}'"
          if extracted.count(old) != 1:
              raise SystemExit('nested candidate-path assertion anchor drifted')
          extracted = extracted.replace(old, new, 1)

          start_marker = 'path_entries = (\n'
          end_marker = 'if source.count(path_anchor) != 1:\n'
          if extracted.count(start_marker) != 1 or extracted.count(end_marker) != 1:
              raise SystemExit('candidate path block boundary drifted')
          start = extracted.index(start_marker)
          end = extracted.index(end_marker, start)
          path_block = '''path_entries = (
              "    'crates/shared-config/src/runtime_guard.rs',\\n",
              "    'scripts/check-invocation-ledger-contract-static.py',\\n",
              "    'services/gateway-service/src/bin/gateway-exact-reserve-worker.rs',\\n",
              "    'services/identity-service/src/main.rs',\\n",
              "    'services/ledger-service/src/main.rs',\\n",
          )
          '''
          extracted = extracted[:start] + path_block + extracted[end:]

          Path('/tmp/seq39-rustfmt-candidate-v4.sh').write_text(
              extracted,
              encoding='utf-8',
          )
          PYWRAP

          bash /tmp/seq39-rustfmt-candidate-v4.sh
