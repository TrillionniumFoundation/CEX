name: cex-pr-native-admission-v1

on:
  push:
    branches:
      - integration/cex-v12-sequence54-20260908
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PRODUCTION_AUTHORIZATION: not_granted

concurrency:
  group: cex-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  truth:
    name: truth
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact event source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record immutable event identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          printf 'CEX_EVENT=%s\n' "$GITHUB_EVENT_NAME"
          printf 'CEX_EVENT_SHA=%s\n' "$GITHUB_SHA"
          printf 'CEX_EVENT_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          printf 'PRODUCTION_AUTHORIZATION=%s\n' "$PRODUCTION_AUTHORIZATION"

      - name: Execute semantic and boundary truth gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          generated="$RUNNER_TEMP/repository-contract-semantics-v1.json"
          python3 scripts/generate-repository-semantics.py --stdout > "$generated"
          cmp "$generated" docs/repository-contract-semantics-v1.json
          python3 scripts/check-consumer-projection-boundary.py
          python3 scripts/test-consumer-projection-boundary.py
          python3 scripts/test-consumer-route-contract.py
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

  rustsec:
    name: rustsec
    needs: truth
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact event source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Rust and advisory tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
          test "$(rustc --version | awk '{print $2}')" = '1.98.1'
          test "$(cargo-audit --version | awk '{print $2}')" = '0.22.2'
          test "$(cargo-deny --version | awk '{print $2}')" = '0.20.2'

      - name: Execute fail-closed RustSec admission
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-sequence54-rustsec-admission.py
          python3 scripts/check-rust-advisory-exceptions.py
          printf 'CEX_RUSTSEC_ADMISSION=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=%s\n' "$PRODUCTION_AUTHORIZATION"

  source:
    name: source
    needs:
      - truth
      - rustsec
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact event source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          test "$(rustc --version | awk '{print $2}')" = '1.98.1'

      - name: Execute complete workspace source qualification
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --release --workspace --locked
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          printf 'CEX_SOURCE_QUALIFICATION=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=%s\n' "$PRODUCTION_AUTHORIZATION"

  postgres:
    name: postgres
    needs: truth
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cex_native_admission
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cex_native_admission"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cex_native_admission
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cex_native_admission
      PGPASSWORD: postgres
    steps:
      - name: Checkout exact event source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Rust toolchain and verify PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          test "$(rustc --version | awk '{print $2}')" = '1.98.1'
          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d cex_native_admission
          psql --version

      - name: Execute PostgreSQL-aware complete workspace tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-targets --locked -- --test-threads=1
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          printf 'CEX_POSTGRES_QUALIFICATION=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=%s\n' "$PRODUCTION_AUTHORIZATION"

  evidence:
    name: evidence
    needs:
      - truth
      - source
      - postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact event source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Rust toolchain and build release candidate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          test "$(rustc --version | awk '{print $2}')" = '1.98.1'
          cargo build --release --workspace --locked

      - name: Execute evidence contract and private-inode preconditions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-trnm-build-evidence.py
          binary=target/release/trnm-economy-service
          test -f "$binary"
          ! test -L "$binary"
          links="$(stat -c %h "$binary")"
          test "$links" -ge 1
          if grep -Fq 'TRNM_EVIDENCE_BINARY="target/evidence/trnm-economy-service"' \
            .github/workflows/trnm-economy-settlement.yml; then
            grep -Fq 'mkdir -p -- target/evidence' \
              .github/workflows/trnm-economy-settlement.yml
            ! grep -Fq '$RUNNER_TEMP/trnm-economy-service-evidence' \
              .github/workflows/trnm-economy-settlement.yml
          else
            printf 'repository-local evidence staging is not yet committed\n' >&2
            exit 1
          fi
          printf 'CEX_RELEASE_BINARY_LINK_COUNT=%s\n' "$links"
          printf 'CEX_EVIDENCE_CONTRACT=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=%s\n' "$PRODUCTION_AUTHORIZATION"
