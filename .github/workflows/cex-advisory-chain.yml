name: cex-release-surface-diagnostic

on:
  push:
    branches:
      - tmp/cex-advisory-chain-20260907

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Sequence 15 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 452de1c8bf0b0bd58a1d932a8222aa1c46d8096d
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Inventory checked-in release surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/release-surface
          grep -RInE 'cargo[[:space:]]+build([^#\n])*--release|target/release/|ExecStart=.*target/release|ExecStart=.*/(ledger-service|consumer-entry-api|execution-service|gateway-service|audit-service|identity-service|capability-service|trnm-economy-service)' \
            .github/workflows scripts deploy packaging 2>/dev/null \
            > run/release-surface/text-markers.txt || true
          cargo metadata --format-version 1 --no-deps --locked > run/release-surface/metadata.json
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          out = pathlib.Path('run/release-surface')
          root = pathlib.Path('.')
          metadata = json.loads((out / 'metadata.json').read_text())
          by_name = {p['name']: p for p in metadata['packages']}
          markers = (out / 'text-markers.txt').read_text().splitlines()
          package_hits = {}
          for line in markers:
              for name in by_name:
                  if re.search(rf'(?<![A-Za-z0-9_-]){re.escape(name)}(?![A-Za-z0-9_-])', line):
                      package_hits.setdefault(name, []).append(line)
          deployable_binary_packages = sorted(
              p['name'] for p in metadata['packages']
              if p['id'] in set(metadata['workspace_members'])
              and any('bin' in t.get('kind', []) for t in p.get('targets', []))
          )
          result = {
              'schema': 'cex.release-surface-diagnostic.v1',
              'source_sha': '452de1c8bf0b0bd58a1d932a8222aa1c46d8096d',
              'workspace_binary_packages': deployable_binary_packages,
              'packages_named_by_release_install_runtime_markers': {
                  k: v for k, v in sorted(package_hits.items())
              },
              'marker_count': len(markers),
          }
          (out / 'summary.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          files = sorted(p for p in out.iterdir() if p.is_file() and p.name != 'manifest.json')
          (out / 'manifest.json').write_text(json.dumps({
              'schema': 'cex.release-surface-diagnostic-manifest.v1',
              'files': [
                  {'path': p.name, 'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
                  for p in files
              ],
          }, indent=2, sort_keys=True) + '\n')
          PY
      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-release-surface-452de1c8bf0b0bd58a1d932a8222aa1c46d8096d
          path: run/release-surface/**
          if-no-files-found: error
          retention-days: 1
