name: cex-advisory-chain-diagnostic

on:
  push:
    branches:
      - tmp/cex-advisory-chain-20260907

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c31181f7f2dec83a31ac4636191bd2656a6c5bf
          persist-credentials: false
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Trace advisory dependency chains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/advisory-chain
          rustc --version --verbose > run/advisory-chain/rustc-version.txt
          cargo --version --verbose > run/advisory-chain/cargo-version.txt
          cargo tree --locked -i rsa@0.9.10 -e all > run/advisory-chain/rsa-all.txt
          cargo tree --locked -i rsa@0.9.10 -e normal > run/advisory-chain/rsa-normal.txt || true
          cargo tree --locked -i gumdrop@0.8.1 -e all > run/advisory-chain/gumdrop-all.txt
          cargo tree --locked -i gumdrop@0.8.1 -e normal > run/advisory-chain/gumdrop-normal.txt || true
          cargo tree --locked -i paste@1.0.15 -e all > run/advisory-chain/paste-all.txt
          cargo tree --locked -i paste@1.0.15 -e normal > run/advisory-chain/paste-normal.txt || true
          for package in ledger-service consumer-entry-api execution-service gateway-service; do
            cargo tree --locked -p "$package" -e normal > "run/advisory-chain/${package}-normal.txt"
          done
          python3 - <<'PY'
          import hashlib, json, pathlib
          out = pathlib.Path('run/advisory-chain')
          summary = {}
          for name in ('rsa', 'gumdrop', 'paste'):
              all_text = (out / f'{name}-all.txt').read_text()
              normal_text = (out / f'{name}-normal.txt').read_text()
              summary[name] = {
                  'all_edges': all_text.splitlines(),
                  'normal_edges': normal_text.splitlines(),
                  'reachable_from_release_packages': {
                      package: name in (out / f'{package}-normal.txt').read_text()
                      for package in ('ledger-service', 'consumer-entry-api', 'execution-service', 'gateway-service')
                  },
              }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          files = sorted(p for p in out.iterdir() if p.is_file() and p.name != 'manifest.json')
          manifest = {
              'schema': 'cex.advisory-chain-diagnostic.v1',
              'source_sha': '8c31181f7f2dec83a31ac4636191bd2656a6c5bf',
              'files': [
                  {'path': p.name, 'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
                  for p in files
              ],
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
      - name: Upload diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-advisory-chain-8c31181f7f2dec83a31ac4636191bd2656a6c5bf
          path: run/advisory-chain/**
          if-no-files-found: error
          retention-days: 1
