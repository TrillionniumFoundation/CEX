name: world-authority-external-evidence

on:
  workflow_dispatch:
  push:
    branches:
      - ci/world-settlement-capture-boundary-v1
    paths:
      - '.github/workflows/world-authority-external-evidence.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/world-authority-external-evidence.yml'

permissions:
  contents: read

concurrency:
  group: world-authority-external-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_REPOSITORY: TrillionniumFoundation/TrillionniumGame
  GAME_COMMIT: 1f000ea8be17afdbfe31426cc6a7584a3be1120c
  GAME_TREE: 431af12baadca94a49f68e83fef13bbbbcfa5345

jobs:
  game-gofmt-remediation:
    name: world-authority-external/game-gofmt-remediation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout evidence definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Checkout exact Game candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.GAME_REPOSITORY }}
          ref: ${{ env.GAME_COMMIT }}
          path: game
          persist-credentials: false
      - name: Verify exact Game source identity
        run: |
          set -euo pipefail
          test "$(git -C game rev-parse HEAD)" = "$GAME_COMMIT"
          test "$(git -C game rev-parse 'HEAD^{tree}')" = "$GAME_TREE"
          git -C game diff --exit-code
      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: game/runtime/go.mod
          cache: false
      - name: Apply deterministic gofmt
        working-directory: game/runtime
        run: |
          set -euo pipefail
          gofmt -w \
            cmd/trnm-response-drop-proxy/main.go \
            internal/core/world_command.go \
            internal/worldcommand/types.go \
            internal/worldtransition/contract_test.go \
            internal/worldtransition/observation.go \
            internal/worldtransition/types.go \
            world_command_config.go \
            world_command_rpc.go
          test -z "$(gofmt -l .)"
      - name: Run formatted source tests
        working-directory: game/runtime
        run: |
          set -euo pipefail
          go test ./... -count=1
          go test -race ./internal/worldcommand ./internal/worldtransition -count=1
          go vet ./...
      - name: Assemble exact remediation artifact
        run: |
          set -euo pipefail
          mkdir -p remediation/runtime/cmd/trnm-response-drop-proxy
          mkdir -p remediation/runtime/internal/core
          mkdir -p remediation/runtime/internal/worldcommand
          mkdir -p remediation/runtime/internal/worldtransition
          cp game/runtime/cmd/trnm-response-drop-proxy/main.go remediation/runtime/cmd/trnm-response-drop-proxy/main.go
          cp game/runtime/internal/core/world_command.go remediation/runtime/internal/core/world_command.go
          cp game/runtime/internal/worldcommand/types.go remediation/runtime/internal/worldcommand/types.go
          cp game/runtime/internal/worldtransition/contract_test.go remediation/runtime/internal/worldtransition/contract_test.go
          cp game/runtime/internal/worldtransition/observation.go remediation/runtime/internal/worldtransition/observation.go
          cp game/runtime/internal/worldtransition/types.go remediation/runtime/internal/worldtransition/types.go
          cp game/runtime/world_command_config.go remediation/runtime/world_command_config.go
          cp game/runtime/world_command_rpc.go remediation/runtime/world_command_rpc.go
          git -C game diff --binary -- runtime > remediation/game-gofmt.patch
          test -s remediation/game-gofmt.patch
          find remediation -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > remediation/SHA256SUMS
      - name: Upload exact formatted sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: game-gofmt-${{ env.GAME_COMMIT }}
          path: remediation/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
