name: world-authority-external-evidence

on:
  workflow_dispatch:
    inputs:
      cex_sha:
        description: Exact CEX candidate SHA
        required: true
        type: string
      world_sha:
        description: Exact Trillionnium-World candidate SHA
        required: true
        type: string
      world_tree:
        description: Expected Trillionnium-World tree SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: world-authority-external-${{ inputs.cex_sha }}-${{ inputs.world_sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_TOOLCHAIN: '1.98.1'
  WORLD_SOURCE_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  CEX_SOURCE_SHA: ${{ inputs.cex_sha }}
  WORLD_SOURCE_SHA: ${{ inputs.world_sha }}
  WORLD_SOURCE_TREE: ${{ inputs.world_tree }}

jobs:
  world-authority-external-evidence:
    name: world-authority-external-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Validate exact input identities
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CEX_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORLD_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORLD_SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact CEX candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CEX_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact World candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.WORLD_SOURCE_REPOSITORY }}
          ref: ${{ env.WORLD_SOURCE_SHA }}
          path: .world-source
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Verify immutable source tuple
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CEX_SOURCE_SHA"
          test "$(git -C .world-source rev-parse HEAD)" = "$WORLD_SOURCE_SHA"
          test "$(git -C .world-source rev-parse 'HEAD^{tree}')" = "$WORLD_SOURCE_TREE"
          test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C .world-source status --porcelain)"
          mkdir -p run/world-authority-external
          rustc --version --verbose | tee run/world-authority-external/rustc-version.txt
          cargo --version --verbose | tee run/world-authority-external/cargo-version.txt

      - name: Qualify World and CEX source boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-rust-toolchain-convergence.py
          python3 scripts/check-project-boundary.py
          python3 scripts/check-project-boundary-cargo-closure.py
          bash .world-source/scripts/check-trnm-world-authority-cutover.sh \
            | tee run/world-authority-external/world-source.log
          bash scripts/check-world-authority-cutover.sh \
            | tee run/world-authority-external/cex-adapter.log

      - name: Exercise exact cross-repository HTTP path
        shell: bash
        env:
          WORLD_AUTHORITY_EVIDENCE_DIR: ${{ github.workspace }}/run/world-authority-external
        run: |
          set -euo pipefail
          bash scripts/check-world-authority-cross-repo-e2e.sh .world-source \
            | tee run/world-authority-external/cross-repo-e2e.log

      - name: Record immutable evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/world-authority-external
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path('run/world-authority-external')
          def git(cwd, *args):
              return subprocess.run(['git', *args], cwd=cwd, check=True, text=True, stdout=subprocess.PIPE).stdout.strip()
          summary = {
              'schema': 'cex.world-authority-external-evidence.v2',
              'status': 'execution_attempted',
              'cex_sha': git('.', 'rev-parse', 'HEAD'),
              'cex_tree': git('.', 'rev-parse', 'HEAD^{tree}'),
              'world_sha': git('.world-source', 'rev-parse', 'HEAD'),
              'world_tree': git('.world-source', 'rev-parse', 'HEAD^{tree}'),
              'rust_toolchain': os.environ['RUST_TOOLCHAIN'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'production_authorization': 'not_granted',
          }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          files = sorted(p for p in out.rglob('*') if p.is_file() and p.name != 'manifest.json')
          (out / 'manifest.json').write_text(json.dumps({
              'schema': 'cex.world-authority-external-artifact-manifest.v2',
              'files': [{'path': p.relative_to(out).as_posix(), 'bytes': p.stat().st_size,
                         'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in files],
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload immutable external evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-world-authority-external-${{ inputs.cex_sha }}-${{ inputs.world_sha }}-${{ github.run_attempt }}
          path: run/world-authority-external/**
          if-no-files-found: error
          retention-days: 90
