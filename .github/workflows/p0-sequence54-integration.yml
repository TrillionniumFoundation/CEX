name: p0-sequence54-integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - integration/cex-v12-sequence54-20260908
      - main

permissions:
  contents: read

concurrency:
  group: p0-sequence54-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  RUST_TOOLCHAIN: '1.98.1'
  RUST_RELEASE_COMMIT: 48a229ceaefd4985c50990b14116b6d856af0985
  CARGO_AUDIT_VERSION: '0.22.2'
  CARGO_DENY_VERSION: '0.20.2'
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  sequence54-integration-closure:
    name: sequence54-integration-closure
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact Sequence 54 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p run/sequence54 run/supply-chain
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          printf '%s\n' "$SOURCE_TREE" | tee run/sequence54/source-tree.txt
          printf '%s\n' "$SOURCE_SHA" | tee run/sequence54/source-sha.txt

      - name: Install immutable Rust 1.98.1 toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Verify Rust release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"
          rustc --version --verbose | tee run/sequence54/rustc-version.txt
          cargo --version --verbose | tee run/sequence54/cargo-version.txt
          grep -Fx "commit-hash: $RUST_RELEASE_COMMIT" run/sequence54/rustc-version.txt

      - name: Install pinned supply-chain tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Validate Sequence 54 non-regression contract
        run: python3 scripts/check-sequence54-integration.py

      - name: Validate Sequence 54 RustSec admission wiring
        run: python3 scripts/check-sequence54-rustsec-admission.py

      - name: Validate recursive active-surface toolchain convergence
        run: python3 scripts/check-rust-toolchain-convergence.py

      - name: Validate bounded Rust advisory and all-feature release-surface closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-rust-advisory-exceptions.py \
            | tee run/supply-chain/advisory-exception-evidence.json

      - name: Execute pinned Cargo advisory audit
        shell: bash
        run: |
          set -euo pipefail
          cargo audit --deny warnings \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0214 \
            --ignore RUSTSEC-2024-0436 \
            2>&1 | tee run/supply-chain/cargo-audit.txt
          cargo audit --json \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0214 \
            --ignore RUSTSEC-2024-0436 \
            > run/supply-chain/cargo-audit.json

      - name: Execute pinned Cargo dependency policy
        shell: bash
        run: |
          set -euo pipefail
          cargo deny check advisories licenses sources \
            2>&1 | tee run/supply-chain/cargo-deny-policy.txt
          cargo deny check --allow wildcard bans \
            2>&1 | tee run/supply-chain/cargo-deny-bans.txt

      - name: Validate active v12 documentation and module contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-development-docs.py
          python3 scripts/check-module-documentation.py

      - name: Validate Paper Raid retained boundaries
        run: bash services/paper-raid-bff/scripts/check-boundaries.sh

      - name: Validate locked workspace resolution
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > run/sequence54/cargo-metadata.json
          test -s run/sequence54/cargo-metadata.json

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Test all workspace targets
        run: cargo test --workspace --all-targets --locked

      - name: Strict Clippy on all workspace targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Recheck immutable source after execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          printf 'production_authorization=not_granted\n'

      - name: Upload Sequence 54 integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-sequence54-integration-${{ env.SOURCE_SHA }}
          path: |
            run/sequence54/**
            run/supply-chain/**
            Cargo.lock
            deny.toml
            .github/CODEOWNERS
            docs/security/rust-advisory-exceptions-v1.json
            docs/security/rust-release-surfaces-v1.json
            docs/security/rust-feature-closure-v1.json
            scripts/check-sequence54-rustsec-admission.py
            scripts/check-rust-advisory-exceptions.py
            scripts/rust_advisory_common_v5.py
            scripts/rust_advisory_packages_v5.py
            scripts/rust_advisory_gate_v5.py
            scripts/rust_advisory_feature_closure_v6.py
            scripts/rust_advisory_policy_v6.py
          if-no-files-found: error
          retention-days: 90
