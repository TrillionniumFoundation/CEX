name: Self-hosted ROG Pocket4 and Mac availability

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this bounded runner probe is being requested
        required: false
        default: operator-check
        type: string

# Connectivity probe only. No checkout, no repository token permissions, and
# no automatic push/pull-request trigger.
permissions: {}

jobs:
  rog:
    name: ROG runner probe
    runs-on: [self-hosted, linux, x64, rog]
    timeout-minutes: 10
    steps:
      - name: Verify trusted main invocation on ROG
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_NAME" = rog
          printf 'runner=%s\nos=%s\narch=%s\nref=%s\nreason=%s\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_REF" \
            '${{ inputs.reason }}'
      - name: Read-only browser snapshot
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          for bin in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$bin" >/dev/null 2>&1; then "$bin" --version || true; break; fi
          done

  pocket4:
    name: Pocket4 runner probe
    runs-on: [self-hosted, linux, x64, pocket4]
    timeout-minutes: 10
    steps:
      - name: Verify trusted main invocation on Pocket4
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_NAME" = pocket4
          printf 'runner=%s\nos=%s\narch=%s\nref=%s\nreason=%s\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_REF" \
            '${{ inputs.reason }}'
      - name: Read-only capability snapshot
        shell: bash
        run: |
          set -euo pipefail
          uname -a

  macbook:
    name: MacBook Pro runner probe
    runs-on: [self-hosted, macOS, ARM64, macbook]
    timeout-minutes: 10
    steps:
      - name: Verify trusted main invocation on MacBook Pro
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_NAME" = macbook-pro
          printf 'runner=%s\nos=%s\narch=%s\nref=%s\nreason=%s\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_REF" \
            '${{ inputs.reason }}'
      - name: Read-only platform snapshot
        shell: bash
        run: |
          set -euo pipefail
          sw_vers || true
          uname -a
