name: cex-pr-labeled-recheck-v1

on:
  pull_request:
    branches:
      - main
    types:
      - labeled

permissions:
  contents: read

concurrency:
  group: cex-labeled-recheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PRODUCTION_AUTHORIZATION: not_granted

jobs:
  truth:
    if: github.event.label.name == 'exact-tuple-recheck'
    name: truth
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR merge source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Execute semantic and projection truth gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          generated="$RUNNER_TEMP/repository-contract-semantics-v1.json"
          python3 scripts/generate-repository-semantics.py --stdout > "$generated"
          cmp "$generated" docs/repository-contract-semantics-v1.json
          python3 scripts/check-consumer-projection-boundary.py
          python3 scripts/test-consumer-projection-boundary.py
          python3 scripts/test-consumer-route-contract.py
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          printf 'CEX_RECHECK_EVENT_SHA=%s\n' "$GITHUB_SHA"
          printf 'CEX_RECHECK_HEAD_SHA=%s\n' '${{ github.event.pull_request.head.sha }}'
          printf 'PRODUCTION_AUTHORIZATION=%s\n' "$PRODUCTION_AUTHORIZATION"

  rustsec:
    if: github.event.label.name == 'exact-tuple-recheck'
    name: rustsec
    needs: truth
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact PR merge source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact advisory tools and execute admission
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
          test "$(rustc --version | awk '{print $2}')" = '1.98.1'
          test "$(cargo-audit --version | awk '{print $2}')" = '0.22.2'
          test "$(cargo-deny --version | awk '{print $2}')" = '0.20.2'
          python3 scripts/check-sequence54-rustsec-admission.py
          python3 scripts/check-rust-advisory-exceptions.py
          printf 'CEX_LABELED_RUSTSEC_RECHECK=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=%s\n' "$PRODUCTION_AUTHORIZATION"

  source:
    if: github.event.label.name == 'exact-tuple-recheck'
    name: source
    needs:
      - truth
      - rustsec
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact PR merge source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Execute complete workspace source qualification
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          test "$(rustc --version | awk '{print $2}')" = '1.98.1'
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --release --workspace --locked
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          printf 'CEX_LABELED_SOURCE_RECHECK=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=%s\n' "$PRODUCTION_AUTHORIZATION"

  postgres:
    if: github.event.label.name == 'exact-tuple-recheck'
    name: postgres
    needs: truth
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cex_labeled_recheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cex_labeled_recheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cex_labeled_recheck
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cex_labeled_recheck
      PGPASSWORD: postgres
    steps:
      - name: Checkout exact PR merge source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Execute PostgreSQL-aware complete tests
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          test "$(rustc --version | awk '{print $2}')" = '1.98.1'
          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d cex_labeled_recheck
          cargo test --workspace --all-targets --locked -- --test-threads=1
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          printf 'CEX_LABELED_POSTGRES_RECHECK=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=%s\n' "$PRODUCTION_AUTHORIZATION"

  evidence:
    if: github.event.label.name == 'exact-tuple-recheck'
    name: evidence
    needs:
      - truth
      - source
      - postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact PR merge source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify evidence contract and repository-local staging
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          cargo build --release --workspace --locked
          python3 scripts/test-trnm-build-evidence.py
          workflow=.github/workflows/trnm-economy-settlement.yml
          grep -Fq 'TRNM_EVIDENCE_BINARY="target/evidence/trnm-economy-service"' "$workflow"
          grep -Fq 'mkdir -p -- target/evidence' "$workflow"
          ! grep -Fq '$RUNNER_TEMP/trnm-economy-service-evidence' "$workflow"
          binary=target/release/trnm-economy-service
          test -f "$binary"
          ! test -L "$binary"
          links="$(stat -c %h "$binary")"
          test "$links" -ge 1
          printf 'CEX_LABELED_RELEASE_BINARY_LINK_COUNT=%s\n' "$links"
          printf 'CEX_LABELED_EVIDENCE_RECHECK=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=%s\n' "$PRODUCTION_AUTHORIZATION"
