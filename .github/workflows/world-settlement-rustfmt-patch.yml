name: world-settlement-rustfmt-patch

on:
  workflow_dispatch:
  push:
    branches:
      - ci/world-settlement-capture-boundary-v1
    paths:
      - '.github/workflows/world-settlement-rustfmt-patch.yml'
      - 'evidence/world-settlement-rustfmt-lock.json'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  exact-rustfmt-patch:
    name: world-settlement-rustfmt/exact-patch
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout formatter definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Load exact World identity
        id: lock
        run: |
          jq -e '
            .schema == "trnm_world_settlement_rustfmt_lock_v1" and
            (.repository | type == "string") and
            (.commit | test("^[0-9a-f]{40}$")) and
            (.tree | test("^[0-9a-f]{40}$"))
          ' evidence/world-settlement-rustfmt-lock.json >/dev/null
          echo "repository=$(jq -r .repository evidence/world-settlement-rustfmt-lock.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit evidence/world-settlement-rustfmt-lock.json)" >> "$GITHUB_OUTPUT"
          echo "tree=$(jq -r .tree evidence/world-settlement-rustfmt-lock.json)" >> "$GITHUB_OUTPUT"
      - name: Checkout exact World source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ steps.lock.outputs.repository }}
          ref: ${{ steps.lock.outputs.commit }}
          path: world
          persist-credentials: false
      - name: Verify exact World commit and tree
        run: |
          test "$(git -C world rev-parse HEAD)" = "${{ steps.lock.outputs.commit }}"
          test "$(git -C world rev-parse 'HEAD^{tree}')" = "${{ steps.lock.outputs.tree }}"
          git -C world diff --exit-code
      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          rustfmt --version
      - name: Materialize generated sources and apply rustfmt
        working-directory: world/trillionnium
        run: |
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
          cargo fmt --all
      - name: Assemble exact remediation packet
        run: |
          set -euo pipefail
          mkdir -p run/world-rustfmt/formatted-files run/world-rustfmt/generated
          git -C world diff --binary --full-index > run/world-rustfmt/world-rustfmt.patch
          git -C world diff --name-only --diff-filter=ACMRT > run/world-rustfmt/changed-files.txt
          test -s run/world-rustfmt/changed-files.txt
          while IFS= read -r path; do
            mkdir -p "run/world-rustfmt/formatted-files/$(dirname "$path")"
            cp "world/$path" "run/world-rustfmt/formatted-files/$path"
          done < run/world-rustfmt/changed-files.txt
          generated=$(find world/trillionnium/target -path '*/out/trnm_game_server_lib_generated.rs' -type f -print -quit)
          worker_generated=$(find world/trillionnium/target -path '*/out/trnm_settlement_worker_generated.rs' -type f -print -quit)
          test -n "$generated"
          test -n "$worker_generated"
          cp "$generated" run/world-rustfmt/generated/trnm_game_server_lib_generated.rs
          cp "$worker_generated" run/world-rustfmt/generated/trnm_settlement_worker_generated.rs
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('run/world-rustfmt')
          files = sorted(path for path in root.rglob('*') if path.is_file())
          payload = {
              'schema': 'trnm_world_settlement_rustfmt_remediation_v1',
              'repository': '${{ steps.lock.outputs.repository }}',
              'commit': '${{ steps.lock.outputs.commit }}',
              'tree': '${{ steps.lock.outputs.tree }}',
              'rustfmt': '1.8.0-stable (Rust 1.98.0 toolchain)',
              'changed_files': (root / 'changed-files.txt').read_text().splitlines(),
              'sha256': {
                  str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in files
              },
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['payload_sha256'] = hashlib.sha256(canonical).hexdigest()
          (root / 'manifest.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          (
            cd run/world-rustfmt
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Upload exact rustfmt remediation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-settlement-rustfmt-${{ steps.lock.outputs.commit }}
          path: run/world-rustfmt/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
