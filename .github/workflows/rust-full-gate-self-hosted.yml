name: rust-full-gate-self-hosted

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Which self-hosted gate mode to run
        required: true
        default: full
        type: choice
        options:
          - full
          - service-local-only
          - preflight-only
      bootstrap_env:
        description: Bootstrap .env from .env.example when missing during preflight
        required: true
        default: true
        type: boolean
      upload_artifacts:
        description: Upload the diagnostic artifact bundle at the end of the run
        required: true
        default: true
        type: boolean
      note:
        description: Optional operator note for this run
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rust-full-gate-self-hosted-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}
  RUST_TOOLCHAIN: '1.98.1'
  RUST_RELEASE_COMMIT: '48a229ceaefd4985c50990b14116b6d856af0985'

jobs:
  full-local-gate:
    runs-on:
      - self-hosted
      - windows
      - x64
      - cex-full-gate
    timeout-minutes: 120
    env:
      ARTIFACT_ROOT: ci-artifacts\self-hosted-full-gate
      GATE_MODE: ${{ inputs.mode }}
      BOOTSTRAP_ENV: ${{ inputs.bootstrap_env }}
      UPLOAD_ARTIFACTS: ${{ inputs.upload_artifacts }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable source and toolchain carrier closure
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'self-hosted checkout SHA drift' }
          python scripts/check-rust-toolchain-convergence.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Verify executed Rust identity
        run: |
          $ErrorActionPreference = 'Stop'
          $short = rustc --version
          if (($short -split ' ')[1] -ne $env:RUST_TOOLCHAIN) { throw "unexpected rustc identity: $short" }
          $verbose = rustc --version --verbose
          $verbose | Set-Content -LiteralPath rustc-version-self-hosted.txt -Encoding UTF8
          if ($verbose -notmatch [regex]::Escape("commit-hash: $env:RUST_RELEASE_COMMIT")) {
            throw 'rustc release commit drift'
          }
          cargo --version --verbose | Set-Content -LiteralPath cargo-version-self-hosted.txt -Encoding UTF8

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Prepare artifact directory
        run: |
          New-Item -ItemType Directory -Force -Path $env:ARTIFACT_ROOT | Out-Null
          Move-Item -Force rustc-version-self-hosted.txt (Join-Path $env:ARTIFACT_ROOT 'rustc-version.txt')
          Move-Item -Force cargo-version-self-hosted.txt (Join-Path $env:ARTIFACT_ROOT 'cargo-version.txt')
          @(
            "source_sha=$env:SOURCE_SHA"
            "source_tree=$(git rev-parse 'HEAD^{tree}')"
            "rust_toolchain=$env:RUST_TOOLCHAIN"
            "rust_release_commit=$env:RUST_RELEASE_COMMIT"
          ) | Set-Content -LiteralPath (Join-Path $env:ARTIFACT_ROOT 'source-identity.txt') -Encoding UTF8

      - name: Record workflow inputs
        run: |
          @(
            "mode=${{ inputs.mode }}"
            "bootstrap_env=${{ inputs.bootstrap_env }}"
            "upload_artifacts=${{ inputs.upload_artifacts }}"
            "note=${{ inputs.note }}"
          ) | Set-Content -LiteralPath (Join-Path $env:ARTIFACT_ROOT 'dispatch-inputs.txt') -Encoding UTF8

      - name: Show operator note
        if: ${{ inputs.note != '' }}
        run: |
          $notePath = Join-Path $env:ARTIFACT_ROOT 'operator-note.txt'
          Write-Host "operator-note=${{ inputs.note }}"
          Set-Content -LiteralPath $notePath -Value "${{ inputs.note }}" -Encoding UTF8

      - name: Bootstrap and validate self-hosted runner
        run: |
          $preflightArgs = @()
          if ($env:BOOTSTRAP_ENV -eq 'true') {
            $preflightArgs += '-BootstrapEnv'
          }
          & .\scripts\self-hosted-runner-preflight.ps1 @preflightArgs *>&1 |
            Tee-Object -FilePath (Join-Path $env:ARTIFACT_ROOT 'preflight-output.txt')
          exit $LASTEXITCODE

      - name: Run selected gate mode
        if: ${{ inputs.mode != 'preflight-only' }}
        run: |
          $gateArgs = @()
          switch ($env:GATE_MODE) {
            'full' { }
            'service-local-only' { $gateArgs += '-ServiceLocalOnly' }
            default { throw "unsupported GATE_MODE=$env:GATE_MODE" }
          }
          & .\gate-local.ps1 @gateArgs *>&1 |
            Tee-Object -FilePath (Join-Path $env:ARTIFACT_ROOT 'gate-output.txt')
          exit $LASTEXITCODE

      - name: Mark gate as skipped in preflight-only mode
        if: ${{ inputs.mode == 'preflight-only' }}
        run: |
          Set-Content -LiteralPath (Join-Path $env:ARTIFACT_ROOT 'gate-output.txt') -Value 'gate skipped because mode=preflight-only' -Encoding UTF8

      - name: Reverify immutable source
        if: ${{ always() }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'self-hosted source moved during gate' }
          if (git status --porcelain --untracked-files=no) { throw 'tracked source changed during gate' }

      - name: Collect self-hosted gate artifacts
        if: ${{ always() }}
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\collect-self-hosted-artifacts.ps1 -OutputDir $env:ARTIFACT_ROOT

      - name: Upload self-hosted gate artifacts
        if: ${{ always() && inputs.upload_artifacts }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-full-gate-self-hosted-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: ci-artifacts/self-hosted-full-gate
          if-no-files-found: error
          retention-days: 14
