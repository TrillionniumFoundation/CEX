name: cex-advisory-policy-validation

on:
  push:
    branches:
      - tmp/cex-advisory-chain-20260907

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Validate bounded policy
        run: python3 scripts/check-rust-advisory-exceptions.py
      - name: Exercise cargo-audit policy
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2026-0214
          --ignore RUSTSEC-2024-0436
      - name: Exercise cargo-deny advisory, license and source policy
        run: cargo deny check advisories licenses sources
      - name: Exercise cargo-deny bans with manifest-owned wildcard control
        run: cargo deny check --allow wildcard bans
