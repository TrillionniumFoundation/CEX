name: rust-service-gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'gate-local.ps1'
      - 'scripts/**'
      - 'services/**'
      - 'crates/**'
      - 'migrations/**'
      - 'config/**'
      - 'architecture/**'
      - 'docs/**'
      - 'ops/**'
      - '.env.example'
      - '.env.production.example'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'gate-local.ps1'
      - 'scripts/**'
      - 'services/**'
      - 'crates/**'
      - 'migrations/**'
      - 'config/**'
      - 'architecture/**'
      - 'docs/**'
      - 'ops/**'
      - '.env.example'
      - '.env.production.example'
      - '.github/workflows/**'

jobs:
  service-local-gate-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Run service-local gate (Windows)
        run: ./gate-local.ps1 -ServiceLocalOnly

  service-local-gate-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Run service-local gate (Linux)
        run: bash ./scripts/gate-local-linux.sh --service-local-only --skip-db-bootstrap
