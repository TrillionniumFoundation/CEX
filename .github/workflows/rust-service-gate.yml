name: rust-service-gate

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - services/**
      - apps/**
      - rust-toolchain.toml
      - .github/workflows/rust-service-gate.yml
      - .github/workflows/rust-full-gate-self-hosted.yml
      - scripts/**
      - docs/module-catalog-v1.json
      - docs/repository-semantic-policy-v1.json
      - docs/repository-contract-semantics-v1.json
      - docs/modules/**
      - docs/development-doc-authority-v1.json
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - services/**
      - apps/**
      - rust-toolchain.toml
      - .github/workflows/rust-service-gate.yml
      - .github/workflows/rust-full-gate-self-hosted.yml
      - scripts/**
      - docs/module-catalog-v1.json
      - docs/repository-semantic-policy-v1.json
      - docs/repository-contract-semantics-v1.json
      - docs/modules/**
      - docs/development-doc-authority-v1.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-service-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Repository identity and hygiene
        run: |
          python3 scripts/check-repository-integrity.py
          python3 scripts/check-p0-release-candidate-hygiene.py
      - name: Workflow trust contract
        run: python3 scripts/check-workflow-trust.py
      - name: Complete module documentation contract
        run: python3 scripts/check-module-documentation.py
      - name: Generated repository semantic contract and Consumer authority boundary
        run: |
          python3 scripts/test-rust-route-contract.py
          python3 scripts/test-semantic-source-integration.py
          python3 scripts/generate-repository-semantics.py --check
          python3 scripts/check-consumer-projection-boundary.py
      - name: Matrix result reconciliation source and runner contract
        run: |
          python3 scripts/check-matrix-result-reconciliation.py
          python3 scripts/test-matrix-operator-postgres-runner.py

  service-tests-linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Rust toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          rustfmt --version
          clippy-driver --version
      - name: Cargo workspace authority
        run: |
          python3 scripts/test-cargo-workspace-authority.py
          python3 scripts/check-cargo-workspace-authority.py
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Shared config tests
        run: cargo test --locked -p shared-config --all-targets
      - name: Capability service tests
        run: cargo test --locked -p capability-service --all-targets
      - name: Execution service tests
        run: cargo test --locked -p execution-service --all-targets
      - name: Identity service tests
        run: cargo test --locked -p identity-service --all-targets
      - name: Ledger service tests
        run: cargo test --locked -p ledger-service --all-targets
      - name: Audit service tests
        run: cargo test --locked -p audit-service --all-targets
      - name: Gateway service tests
        run: cargo test --locked -p gateway-service --all-targets
      - name: Consumer entry service tests
        run: cargo test --locked -p consumer-entry-api --all-targets
      - name: TRNM economy service tests
        run: cargo test --locked -p trnm-economy-service --all-targets
      - name: Matrix adapter and transport tests
        run: cargo test --locked -p matrix-entry-adapter -p matrix-bot-poller -p matrix-bot-relay --all-targets
      - name: Hepta research league package tests
        env:
          HEPTA_REQUIRE_POSTGRES_TESTS: '0'
        run: cargo test --locked -p hepta-research-league --all-targets
      - name: Paper Raid BFF package tests
        run: cargo test --locked -p paper-raid-bff --all-targets
      - name: Full workspace all targets
        run: cargo test --locked --workspace --all-targets
      - name: Strict Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: No source mutation
        run: git diff --exit-code

  service-tests-windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Rust toolchain identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustc --version
          cargo --version
          rustfmt --version
          clippy-driver --version
      - name: Cargo workspace authority
        shell: pwsh
        run: |
          python scripts/test-cargo-workspace-authority.py
          python scripts/check-cargo-workspace-authority.py
      - name: Shared config tests
        run: cargo test --locked -p shared-config --all-targets
      - name: Capability service tests
        run: cargo test --locked -p capability-service --all-targets
      - name: Execution service tests
        run: cargo test --locked -p execution-service --all-targets
      - name: Identity service tests
        run: cargo test --locked -p identity-service --all-targets
      - name: Ledger service tests
        run: cargo test --locked -p ledger-service --all-targets
      - name: Audit service tests
        run: cargo test --locked -p audit-service --all-targets
      - name: Gateway service tests
        run: cargo test --locked -p gateway-service --all-targets
      - name: Consumer entry service tests
        run: cargo test --locked -p consumer-entry-api --all-targets
      - name: TRNM economy service tests
        run: cargo test --locked -p trnm-economy-service --all-targets
      - name: Matrix adapter and transport tests
        run: cargo test --locked -p matrix-entry-adapter -p matrix-bot-poller -p matrix-bot-relay --all-targets
      - name: Hepta research league package tests
        shell: pwsh
        env:
          HEPTA_REQUIRE_POSTGRES_TESTS: '0'
        run: cargo test --locked -p hepta-research-league --all-targets
      - name: Paper Raid BFF package tests
        run: cargo test --locked -p paper-raid-bff --all-targets
      - name: Full workspace all targets
        run: cargo test --locked --workspace --all-targets
      - name: Strict Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: No source mutation
        shell: pwsh
        run: git diff --exit-code

  hepta-postgres-integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://cex:cex@127.0.0.1:5432/hepta_ci
      HEPTA_REQUIRE_POSTGRES_TESTS: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cex
          POSTGRES_PASSWORD: cex
          POSTGRES_DB: hepta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cex -d hepta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Hepta lint ownership
        run: python3 scripts/check-hepta-lint-ownership.py
      - name: Complete Hepta package with PostgreSQL required
        run: ./scripts/check-hepta-postgres-integration.sh
      - name: Complete Matrix package and current-schema/operator regression
        env:
          MATRIX_TEST_DATABASE_URL: postgres://cex:cex@127.0.0.1:5432/hepta_ci
          MATRIX_TEST_ALLOW_SCHEMA_RESET: '1'
        run: |
          cargo fmt -p matrix-entry-adapter -p matrix-bot-poller -p matrix-bot-relay -- --check
          cargo test --locked -p matrix-entry-adapter -p matrix-bot-poller -p matrix-bot-relay --all-targets
          cargo clippy --locked -p matrix-entry-adapter -p matrix-bot-poller -p matrix-bot-relay --all-targets -- -D warnings
          bash scripts/check-matrix-source-observation-postgres.sh --evidence run/matrix-transport-postgres.json
          bash scripts/check-matrix-operator-postgres.sh --evidence run/matrix-operator-postgres.json
      - name: Retain Matrix PostgreSQL evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: matrix-postgres-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            run/matrix-transport-postgres.json
            run/matrix-operator-postgres.json
          if-no-files-found: error
          retention-days: 14

# Exact-SHA branch protection and the release-candidate workflow remain the
# qualification authorities. This workflow must never authorize production.
