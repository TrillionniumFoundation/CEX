name: rust-service-gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'gate-local.ps1'
      - 'scripts/**'
      - 'services/**'
      - 'crates/**'
      - 'migrations/**'
      - 'config/**'
      - 'architecture/**'
      - 'docs/**'
      - 'docs/release-evidence/p0-candidate-trigger.json'
      - 'ops/**'
      - '.env.example'
      - '.env.production.example'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: rust-service-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  service-local-gate-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Candidate tree hygiene
        run: python scripts/check-p0-release-candidate-hygiene.py

      - name: Verify P0 static wiring
        run: python scripts/check-p0-wiring.py

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify release manifest contract
        run: python scripts/check-release-baseline-manifest.py docs/templates/cex-release-baseline-manifest-v1.json --allow-template

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Compile workspace all targets (Windows)
        run: cargo check --locked --workspace --all-targets

      - name: Run service-local gate (Windows)
        run: ./gate-local.ps1 -ServiceLocalOnly

  service-local-gate-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Candidate tree hygiene
        run: python3 scripts/check-p0-release-candidate-hygiene.py

      - name: Verify P0 static wiring
        run: python3 scripts/check-p0-wiring.py

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify release manifest contract
        run: python3 scripts/check-release-baseline-manifest.py docs/templates/cex-release-baseline-manifest-v1.json --allow-template

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Compile workspace all targets (Linux)
        run: cargo check --locked --workspace --all-targets

      - name: Run service-local gate (Linux)
        run: bash ./scripts/gate-local-linux.sh --service-local-only --skip-db-bootstrap
