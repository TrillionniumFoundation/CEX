name: rust-service-gate

on:
  workflow_dispatch:
  # exact-tree: every branch push
  # shared candidate trigger: docs/release-evidence/p0-candidate-trigger.json
  push:

permissions:
  contents: read

concurrency:
  group: rust-service-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate development-document authority
        run: python3 scripts/check-development-docs.py

      - name: Strict release evidence wiring
        run: |
          python3 scripts/check-strict-release-evidence-wiring.py
          python3 scripts/test-p0-release-evidence-strict.py
          python3 scripts/verify-hosted-snapshot-freshness.py --self-test

      - name: Emit exact-tree integrity record
        run: |
          python3 scripts/check-repository-integrity.py \
            --expected-sha "$GITHUB_SHA" \
            --expected-tree "$(git rev-parse 'HEAD^{tree}')" \
            --output run/repository-integrity.json

      - name: Upload repository-integrity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cex-repository-integrity-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: run/repository-integrity.json
          if-no-files-found: error
          retention-days: 90

  service-local-gate-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Development-document contract
        run: python scripts/check-development-docs.py

      - name: Candidate tree hygiene
        run: python scripts/check-p0-release-candidate-hygiene.py

      - name: Verify P0 static wiring
        run: |
          python scripts/check-p0-wiring.py
          bash scripts/test-runtime-profile-wiring.sh

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify release manifest contract
        run: python scripts/check-release-baseline-manifest.py docs/templates/cex-release-baseline-manifest-v1.json --allow-template

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Compile portable workspace targets (Windows)
        run: |
          cargo check --locked --workspace --all-targets --exclude trnm-finality-verifier
          cargo check --locked -p trnm-finality-verifier --lib

      - name: Run service-local gate (Windows)
        run: ./gate-local.ps1 -ServiceLocalOnly

  service-local-gate-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Development-document contract
        run: python3 scripts/check-development-docs.py

      - name: Candidate tree hygiene
        run: python3 scripts/check-p0-release-candidate-hygiene.py

      - name: Verify P0 static wiring
        run: python3 scripts/check-p0-wiring.py

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify release manifest contract
        run: python3 scripts/check-release-baseline-manifest.py docs/templates/cex-release-baseline-manifest-v1.json --allow-template

      - name: Verify formatting
        run: cargo fmt --all --check

      - name: Compile workspace all targets (Linux)
        run: cargo check --locked --workspace --all-targets

      - name: Run service-local gate (Linux)
        run: bash ./scripts/gate-local-linux.sh --service-local-only --skip-db-bootstrap

  hepta-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEPTA_TEST_DATABASE_URL: postgres://cex:cex_ci_password@127.0.0.1:5432/hepta_ci
      HEPTA_REQUIRE_POSTGRES_TESTS: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cex
          POSTGRES_PASSWORD: cex_ci_password
          POSTGRES_DB: hepta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cex -d hepta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Development-document contract
        run: python3 scripts/check-development-docs.py

      - name: Exact Hepta lint ownership contract
        run: python3 scripts/check-hepta-lint-ownership.py

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Strict Hepta PostgreSQL package gate
        run: |
          bash scripts/check-hepta-postgres-integration.sh \
            --mode full \
            --evidence run/hepta-postgres-integration.json

      - name: Upload Hepta PostgreSQL evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cex-hepta-postgres-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: run/hepta-postgres-integration.json
          if-no-files-found: error
          retention-days: 90
