name: world-full-blocker-convergence-v2

on:
  push:
    branches:
      - tmp/world-single-writer-catalog-closure-20260907

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: world-single-writer-catalog-closure
  cancel-in-progress: false

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WORLD_REPO_TOKEN: ${{ secrets.WORLD_REPO_TOKEN }}
      TRILLIONNIUM_WORLD_REPO_TOKEN: ${{ secrets.TRILLIONNIUM_WORLD_REPO_TOKEN }}
      TRILLIONNIUM_WORLD_TOKEN: ${{ secrets.TRILLIONNIUM_WORLD_TOKEN }}
      CEX_WORLD_TOKEN: ${{ secrets.CEX_WORLD_TOKEN }}
      WORLD_TOKEN: ${{ secrets.WORLD_TOKEN }}
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
      CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
      ORG_GITHUB_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
      ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      PAT: ${{ secrets.PAT }}
    steps:
      - name: Checkout corrected convergence helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Mask configured repository credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            WORLD_REPO_TOKEN TRILLIONNIUM_WORLD_REPO_TOKEN TRILLIONNIUM_WORLD_TOKEN \
            CEX_WORLD_TOKEN WORLD_TOKEN CROSS_REPO_TOKEN CROSS_REPO_PAT \
            ORG_GITHUB_TOKEN ADMIN_GITHUB_TOKEN GH_PAT GITHUB_PAT REPO_TOKEN PAT; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              echo "::add-mask::$value"
            fi
          done

      - name: Close World single-writer catalog bypass
        id: world_code
        continue-on-error: true
        env:
          RESULT_PATH: ${{ github.workspace }}/run/world-code-closure/result.json
        run: python3 .github/diagnostics/patch-world-single-writer-v2.py

      - name: Repair World native Actions scheduling and retrigger
        id: world_scheduler
        if: always()
        continue-on-error: true
        env:
          RESULT_PATH: ${{ github.workspace }}/run/world-actions-repair/result.json
        run: python3 .github/diagnostics/repair-world-actions-scheduling-v2.py

      - name: Repin CEX to repaired exact World head
        id: cex_repin
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESULT_PATH: ${{ github.workspace }}/run/cex-world-repin/result.json
        run: python3 .github/diagnostics/repin-cex-world-head-v2.py

      - name: Record corrected convergence truth
        if: always()
        env:
          WORLD_CODE_OUTCOME: ${{ steps.world_code.outcome }}
          WORLD_SCHEDULER_OUTCOME: ${{ steps.world_scheduler.outcome }}
          CEX_REPIN_OUTCOME: ${{ steps.cex_repin.outcome }}
        run: |
          set -euo pipefail
          mkdir -p run
          python3 - <<'PY'
          import json, os, pathlib
          outcomes = {
              'world_code': os.environ['WORLD_CODE_OUTCOME'],
              'world_scheduler': os.environ['WORLD_SCHEDULER_OUTCOME'],
              'cex_repin': os.environ['CEX_REPIN_OUTCOME'],
          }
          document = {
              'schema': 'cex.world.full-blocker-convergence.v2',
              'outcomes': outcomes,
              'repository_actionable_closed': outcomes['world_code'] == 'success' and outcomes['cex_repin'] == 'success',
              'native_scheduler_closed': outcomes['world_scheduler'] == 'success',
              'all_gaps_closed': all(value == 'success' for value in outcomes.values()),
              'production_authorization': 'not_granted',
          }
          pathlib.Path('run/convergence-summary-v2.json').write_text(
              json.dumps(document, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(document, indent=2, sort_keys=True))
          PY

      - name: Upload corrected convergence receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-full-blocker-convergence-v2-${{ github.sha }}
          path: run/**
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed unless repository and scheduler gates closed
        if: always()
        env:
          WORLD_CODE_OUTCOME: ${{ steps.world_code.outcome }}
          WORLD_SCHEDULER_OUTCOME: ${{ steps.world_scheduler.outcome }}
          CEX_REPIN_OUTCOME: ${{ steps.cex_repin.outcome }}
        run: |
          set -euo pipefail
          test "$WORLD_CODE_OUTCOME" = success
          test "$WORLD_SCHEDULER_OUTCOME" = success
          test "$CEX_REPIN_OUTCOME" = success
