name: cex-p0-source-snapshot

on:
  push:
    branches:
      - feature/settlement-all-blockers-closure-v1
    paths:
      - .github/workflows/cex-p0-source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/settlement-all-blockers-closure-v1
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and package exact source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git rev-parse HEAD > SOURCE_HEAD
          git rev-parse 'HEAD^{tree}' > SOURCE_TREE
          tar \
            --exclude=.git \
            --exclude=target \
            --exclude=.github/workflows/cex-p0-source-snapshot.yml \
            -czf /tmp/cex-p0-source-snapshot.tgz .
          sha256sum /tmp/cex-p0-source-snapshot.tgz > /tmp/SHA256SUMS

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-p0-source-snapshot-${{ github.sha }}
          path: |
            /tmp/cex-p0-source-snapshot.tgz
            /tmp/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
