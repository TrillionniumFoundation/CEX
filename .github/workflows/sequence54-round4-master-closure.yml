name: sequence54-round4-master-closure

on:
  push:
    branches:
      - work/sequence54-round2-staging-20260909
    paths:
      - '.github/workflows/sequence54-round4-master-closure.yml'

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: sequence54-round4-master-closure
  cancel-in-progress: false

env:
  TARGET_BRANCH: integration/cex-v12-sequence54-20260908
  PULL_REQUEST_NUMBER: '53'
  EVIDENCE_DIR: ${{ runner.temp }}/sequence54-round4-master

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout controller source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Preserve deterministic repair program
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cp scripts/sequence54_round3_remediate.py "$RUNNER_TEMP/remediate.py"

      - name: Checkout latest PR head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Establish and qualify repository-internal repairs
        id: local
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          remote_before="$(git rev-parse HEAD)"
          printf '%s\n' "$remote_before" > "$EVIDENCE_DIR/remote-before-sha.txt"

          if ! grep -q 'def selector_binding_self_tests' scripts/rust_toolchain_convergence_v4.py; then
            python3 "$RUNNER_TEMP/remediate.py" "$GITHUB_WORKSPACE"
          fi

          python3 -m py_compile \
            scripts/rust_toolchain_convergence_v4.py \
            scripts/check-consumer-projection-boundary.py \
            scripts/test-consumer-route-contract.py
          git diff --check
          git config user.name 'Sequence 54 Closure Bot'
          git config user.email 'sequence54-closure@users.noreply.github.com'
          if ! git diff --quiet; then
            git add \
              .github/workflows/p0-rust-toolchain-convergence.yml \
              scripts/rust_toolchain_convergence_v4.py \
              docs/security/rust-toolchain-surfaces-v1.json \
              scripts/check-consumer-projection-boundary.py \
              scripts/test-consumer-route-contract.py \
              docs/modules/consumer-entry-api.md
            git commit -m 'fix(sequence54): close toolchain and projection gate blockers' \
              -m 'Bind parsed selector values instead of arbitrary comments, retain hostile fixtures, fetch merge parents, and inspect only lexical SQL/endpoint literals in the projection guard.' \
              -m 'production-authorization: not_granted'
          fi

          candidate="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          printf '%s\n' "$candidate" > "$EVIDENCE_DIR/candidate-sha.txt"
          printf '%s\n' "$tree" > "$EVIDENCE_DIR/candidate-tree.txt"

          checks=(
            'python3 scripts/check-rust-toolchain-convergence.py'
            'python3 scripts/test-consumer-route-contract.py'
            'python3 scripts/check-consumer-projection-boundary.py'
            'python3 scripts/generate-repository-semantics.py --check'
            'python3 scripts/check-development-docs.py'
            'python3 scripts/check-module-documentation.py'
            'python3 scripts/check-sequence54-integration.py'
          )
          overall=0
          index=0
          for command in "${checks[@]}"; do
            index=$((index + 1))
            log="$EVIDENCE_DIR/local-check-${index}.log"
            printf 'command=%s\n' "$command" > "$log"
            set +e
            bash -lc "$command" >> "$log" 2>&1
            rc=$?
            set -e
            printf 'exit_code=%s\n' "$rc" >> "$log"
            if [[ "$rc" -ne 0 ]]; then overall=1; fi
          done
          printf '{"candidate_sha":"%s","candidate_tree":"%s","all_local_checks_green":%s,"production_authorization":"not_granted"}\n' \
            "$candidate" "$tree" "$([[ "$overall" -eq 0 ]] && echo true || echo false)" \
            > "$EVIDENCE_DIR/local-summary.json"
          test "$overall" -eq 0

          if [[ "$candidate" != "$remote_before" ]]; then
            git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}"
            test "$(git rev-parse FETCH_HEAD)" = "$remote_before"
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          fi

      - name: Dispatch and wait for exact-head qualification families
        id: gates
        if: steps.local.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EVIDENCE_DIR" <<'PY'
          from __future__ import annotations
          import json, os, re, sys, time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          evidence = Path(sys.argv[1])
          repository = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['TARGET_BRANCH']
          token = os.environ['GH_TOKEN']
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com')
          head = (evidence / 'candidate-sha.txt').read_text().strip()
          tree = (evidence / 'candidate-tree.txt').read_text().strip()

          def call(path: str, *, method='GET', payload=None, allow_error=False):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(
                  api + path,
                  method=method,
                  data=data,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'sequence54-round4-master',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except HTTPError as error:
                  body = error.read().decode('utf-8', errors='replace')
                  if allow_error:
                      return error.code, {'error': body[:2000]}
                  raise RuntimeError(f'{method} {path}: {error.code}: {body[:1000]}') from error

          def branch_sha() -> str:
              _status, value = call(f'/repos/{repository}/branches/{quote(branch, safe="")}')
              return value['commit']['sha']

          if branch_sha() != head:
              raise SystemExit('target head drift before dispatch')

          desired = [
              'p0-runner-diagnostics',
              'p0-rust-toolchain-convergence',
              'repository-semantic-contract-gate',
              'consumer-projection-boundary-gate',
              'execution-lifecycle-gate',
              'matrix-review-repair-regression',
              'trnm-economy-ci',
              'trnm-economy-settlement',
              'world-settlement-external-evidence',
              'p0-sequence54-integration',
              'cex-v12-native-minimal',
          ]
          by_name = {}
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              match = re.search(r'(?m)^name:\s*["\']?([^"\'\n]+)', text)
              if match:
                  by_name.setdefault(match.group(1).strip(), []).append(path.as_posix())

          resolution = {}
          for name in desired:
              candidates = by_name.get(name, [])
              if len(candidates) != 1:
                  resolution[name] = {'error': 'missing_or_ambiguous', 'paths': candidates}
              else:
                  resolution[name] = {'path': candidates[0]}
          unresolved = [name for name, item in resolution.items() if 'path' not in item]
          if unresolved:
              (evidence / 'workflow-resolution.json').write_text(
                  json.dumps(resolution, indent=2, sort_keys=True) + '\n'
              )
              raise SystemExit(f'workflow resolution failed: {unresolved!r}')

          dispatch = []
          for name, item in resolution.items():
              path = item['path']
              text = Path(path).read_text(encoding='utf-8')
              encoded = quote(path, safe='')
              _status, values = call(
                  f'/repos/{repository}/actions/workflows/{encoded}/runs?per_page=100'
              )
              exact_success = next(
                  (
                      run for run in values.get('workflow_runs', [])
                      if run.get('head_sha') == head
                      and run.get('status') == 'completed'
                      and run.get('conclusion') == 'success'
                  ),
                  None,
              )
              if exact_success:
                  dispatch.append({
                      'name': name, 'path': path,
                      'action': 'reuse_success', 'run_id': exact_success['id'],
                  })
                  continue
              if 'workflow_dispatch:' not in text:
                  dispatch.append({
                      'name': name, 'path': path,
                      'action': 'blocked_no_workflow_dispatch',
                  })
                  continue
              status, result = call(
                  f'/repos/{repository}/actions/workflows/{encoded}/dispatches',
                  method='POST', payload={'ref': branch}, allow_error=True,
              )
              dispatch.append({
                  'name': name, 'path': path,
                  'action': 'dispatched' if status in (201, 204) else 'dispatch_failed',
                  'http_status': status, 'error': result,
              })
          (evidence / 'dispatch.json').write_text(
              json.dumps(dispatch, indent=2, sort_keys=True) + '\n'
          )
          hard_dispatch = [
              item for item in dispatch
              if item['action'] in {'blocked_no_workflow_dispatch', 'dispatch_failed'}
          ]
          if hard_dispatch:
              raise SystemExit(f'required dispatch unavailable: {[item["name"] for item in hard_dispatch]!r}')

          deadline = time.time() + 9000
          final = {}
          while time.time() < deadline:
              if branch_sha() != head:
                  raise SystemExit('target head drift during qualification')
              pending = []
              for name, item in resolution.items():
                  path = item['path']
                  encoded = quote(path, safe='')
                  _status, values = call(
                      f'/repos/{repository}/actions/workflows/{encoded}/runs?per_page=100'
                  )
                  exact = [
                      run for run in values.get('workflow_runs', [])
                      if run.get('head_sha') == head
                  ]
                  exact.sort(key=lambda run: run.get('created_at', ''), reverse=True)
                  if not exact or exact[0].get('status') != 'completed':
                      pending.append(name)
                  else:
                      final[name] = exact[0]
              if not pending and len(final) == len(resolution):
                  break
              time.sleep(15)
          else:
              raise SystemExit('exact-head qualification timed out')

          details = {}
          failed = []
          for name, run in final.items():
              run_id = run['id']
              _status, job_result = call(
                  f'/repos/{repository}/actions/runs/{run_id}/jobs?per_page=100',
                  allow_error=True,
              )
              jobs = []
              for job in (job_result or {}).get('jobs', []):
                  jobs.append({
                      'id': job.get('id'),
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'runner_name': job.get('runner_name'),
                      'steps': [
                          {
                              'name': step.get('name'),
                              'status': step.get('status'),
                              'conclusion': step.get('conclusion'),
                          }
                          for step in (job.get('steps') or [])
                      ],
                  })
              nonempty = bool(jobs) and all(job['steps'] for job in jobs)
              details[name] = {
                  'path': resolution[name]['path'],
                  'run_id': run_id,
                  'run_attempt': run.get('run_attempt'),
                  'event': run.get('event'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'nonempty_jobs': nonempty,
                  'jobs': jobs,
              }
              if run.get('conclusion') != 'success' or not nonempty:
                  failed.append(name)

          report = {
              'schema': 'cex.sequence54-round4-exact-head-gates.v1',
              'repository': repository,
              'branch': branch,
              'head_sha': head,
              'tree_sha': tree,
              'observed_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'workflows': details,
              'failed': sorted(failed),
              'all_required_gate_families_green': not failed,
              'production_authorization': 'not_granted',
          }
          (evidence / 'exact-head-gates.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          if failed:
              raise SystemExit(f'exact-head failures: {sorted(failed)!r}')
          PY

      - name: Live admission readback and independent review request
        id: admission
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_OUTCOME: ${{ steps.local.outcome }}
          GATE_OUTCOME: ${{ steps.gates.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EVIDENCE_DIR" <<'PY'
          from __future__ import annotations
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          evidence = Path(sys.argv[1])
          repository = os.environ['GITHUB_REPOSITORY']
          pr_number = int(os.environ['PULL_REQUEST_NUMBER'])
          token = os.environ['GH_TOKEN']
          api = os.environ.get('GITHUB_API_URL', 'https://api.github.com')

          def call(path, *, method='GET', payload=None, allow_error=False):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(
                  api + path, method=method, data=data,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'sequence54-round4-master',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      body = response.read()
                      return {'status': response.status, 'value': json.loads(body) if body else None}
              except HTTPError as error:
                  body = error.read().decode('utf-8', errors='replace')
                  if allow_error:
                      return {'status': error.code, 'error': body[:2000]}
                  raise

          pr = call(f'/repos/{repository}/pulls/{pr_number}')['value']
          head = pr['head']['sha']
          author = pr['user']['login']
          reviews = call(f'/repos/{repository}/pulls/{pr_number}/reviews?per_page=100')['value']
          latest = {}
          for review in reviews:
              login = (review.get('user') or {}).get('login')
              if not login:
                  continue
              if login not in latest or (review.get('submitted_at') or '') >= (latest[login].get('submitted_at') or ''):
                  latest[login] = review
          approvals = sorted(
              login for login, review in latest.items()
              if login != author
              and review.get('state') == 'APPROVED'
              and review.get('commit_id') == head
              and (review.get('user') or {}).get('type') != 'Bot'
          )

          rulesets = call(
              f'/repos/{repository}/rulesets?includes_parents=true&per_page=100',
              allow_error=True,
          )
          protection = call(
              f'/repos/{repository}/branches/main/protection',
              allow_error=True,
          )
          active_rulesets = []
          if rulesets.get('status') == 200 and isinstance(rulesets.get('value'), list):
              active_rulesets = [
                  item for item in rulesets['value']
                  if item.get('enforcement') == 'active'
              ]
          governance_closed = bool(active_rulesets) and protection.get('status') == 200
          internal_green = (
              os.environ.get('LOCAL_OUTCOME') == 'success'
              and os.environ.get('GATE_OUTCOME') == 'success'
          )
          review_request = None
          if internal_green and len(approvals) < 2:
              review_request = call(
                  f'/repos/{repository}/pulls/{pr_number}/requested_reviewers',
                  method='POST',
                  payload={'reviewers': ['Franksudoman', 'Tomasrgbsf']},
                  allow_error=True,
              )

          report = {
              'schema': 'cex.sequence54-round4-admission.v1',
              'observed_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'repository': repository,
              'pull_request': pr_number,
              'head_sha': head,
              'base_sha': pr['base']['sha'],
              'prospective_merge_sha': pr.get('merge_commit_sha'),
              'draft': pr.get('draft'),
              'local_outcome': os.environ.get('LOCAL_OUTCOME'),
              'gate_outcome': os.environ.get('GATE_OUTCOME'),
              'exact_head_internal_gates_green': internal_green,
              'rulesets': rulesets,
              'branch_protection': protection,
              'live_governance_closed': governance_closed,
              'eligible_current_head_approvals': approvals,
              'review_request': review_request,
              'cross_repository_acceptance_closed': False,
              'production_evidence_closed': False,
              'all_gaps_closed': False,
              'merge_authorized': False,
              'production_authorization': 'not_granted',
          }
          (evidence / 'admission.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )

          failures = []
          gates_file = evidence / 'exact-head-gates.json'
          if gates_file.exists():
              failures = json.loads(gates_file.read_text()).get('failed', [])
          body = '\n'.join([
              '<!-- sequence54-round4-master -->',
              '## Sequence 54 round-4 master closure readback',
              '',
              '```text',
              f'head                 {head}',
              f'base                 {pr["base"]["sha"]}',
              f'prospective merge    {pr.get("merge_commit_sha")}',
              f'draft                {pr.get("draft")}',
              '```',
              '',
              f'- Local source qualification: `{os.environ.get("LOCAL_OUTCOME")}`',
              f'- Exact-head required gate families: `{os.environ.get("GATE_OUTCOME")}`',
              f'- Failed families: `{", ".join(failures) or "none"}`',
              f'- Live protected-main governance: `{"closed" if governance_closed else "open/unproved"}`',
              f'- Eligible approvals on this exact head: `{", ".join(approvals) or "none"}`',
              '- Cross-repository exact-tuple acceptance: `open`',
              '- Production restore/cutover/custody/HA/SLO/accountable go-no-go: `open`',
              '',
              'No review was dismissed, no self-approval or synthetic status was created, and no merge, deployment, release, force push or administrator bypass was performed.',
              '',
              '```text',
              'all_gaps_closed=false',
              'merge_authorized=false',
              'production_authorization=not_granted',
              '```',
          ]) + '\n'
          comments = call(f'/repos/{repository}/issues/{pr_number}/comments?per_page=100')['value']
          existing = next(
              (item for item in reversed(comments) if '<!-- sequence54-round4-master -->' in (item.get('body') or '')),
              None,
          )
          if existing:
              call(
                  f'/repos/{repository}/issues/comments/{existing["id"]}',
                  method='PATCH', payload={'body': body},
              )
          else:
              call(
                  f'/repos/{repository}/issues/{pr_number}/comments',
                  method='POST', payload={'body': body},
              )
          PY

      - name: Enforce repository-internal qualification
        if: always()
        env:
          LOCAL_OUTCOME: ${{ steps.local.outcome }}
          GATE_OUTCOME: ${{ steps.gates.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$LOCAL_OUTCOME" = success
          test "$GATE_OUTCOME" = success

      - name: Upload immutable master evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sequence54-round4-master-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
