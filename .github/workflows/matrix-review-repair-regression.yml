name: matrix-review-repair-regression

on:
  push:
    branches:
      - fix/cex-v12-audit-remediation-20260905
      - integration/cex-v12-sequence54-20260908
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/shared-config/**
      - rust-toolchain.toml
      - scripts/test-build-unblock.py
      - scripts/fixtures/matrix-lock/**
      - services/matrix-entry-adapter/**
      - services/consumer-entry-api/src/main.rs
      - services/consumer-entry-api/src/matrix_result_lookup.rs
      - services/consumer-entry-api/src/matrix_result_response_binding.rs
      - apps/matrix-bot-*/**
      - docs/module-catalog-v1.json
      - docs/repository-contract-semantics-v1.json
      - docs/modules/**
      - docs/traceability/sequence54-matrix-result-reconciliation-v3.json
      - docs/traceability/sequence54-matrix-security-v3-review-packet.json
      - docs/matrix-adapter-validated-construction-v1.md
      - docs/matrix-result-reconciliation-v1.md
      - docs/matrix-result-reconciliation-v2.md
      - docs/matrix-result-reconciliation-v3.md
      - scripts/*matrix*
      - .github/workflows/matrix-review-repair-regression.yml

permissions:
  contents: read

concurrency:
  group: matrix-review-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contracts:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Candidate workflow cannot acquire the trusted host
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/matrix-review-repair-regression.yml')
          text = path.read_text(encoding='utf-8')
          host_runs_on = [
              value.strip()
              for value in re.findall(r'(?m)^\s*runs-on:\s*(.+)$', text)
              if 'self-hosted' in value
          ]
          host_script_calls = re.findall(
              r'(?m)^\s+(?:bash\s+)?scripts/run-isolated-matrix-tests\.sh(?:\s|$)',
              text,
          )
          if host_runs_on or host_script_calls:
              raise SystemExit(
                  'candidate workflow contains an executable host boundary: '
                  f'runs_on={host_runs_on}, script_calls={host_script_calls}'
              )
          PY
      - name: Matrix direct dependency lock preflight
        run: |
          python3 scripts/test-build-unblock.py
          python3 scripts/check-matrix-lock-coherence.py
      - name: Matrix stream-scope source regression
        run: |
          python3 scripts/test-matrix-stream-scope.py
          python3 scripts/check-matrix-stream-scope.py
          python3 scripts/test-matrix-filter-recovery.py
          python3 scripts/check-matrix-filter-recovery.py
          python3 scripts/test-matrix-filter-definition.py
          python3 scripts/check-matrix-filter-definition.py
      - name: Cargo workspace authority fixture regression
        run: python3 scripts/test-cargo-workspace-authority.py
      - name: Source and shell negative regression
        run: python3 scripts/test-matrix-review-repairs.py
      - name: PostgreSQL runner safety and ordering regression
        run: |
          python3 scripts/test-matrix-postgres-runner.py
          python3 scripts/test-matrix-runner-hardening.py
          python3 scripts/test-matrix-runner-lifecycle.py
          python3 scripts/test-matrix-operator-postgres-runner-v4.py
      - name: Matrix shared profile linkage regression
        run: python3 scripts/test-matrix-profile-consolidation.py
      - name: Matrix adapter validated construction boundary
        run: |
          python3 scripts/test-matrix-adapter-api-boundary.py
          python3 scripts/check-matrix-adapter-api-boundary.py
      - name: Durable result reconciliation source contracts
        run: |
          python3 scripts/check-sequence54-matrix-v3-admission.py
          python3 scripts/check-matrix-result-reconciliation.py
          python3 scripts/check-matrix-result-reconciliation-security-v2.py
          python3 scripts/check-matrix-result-reconciliation-security-v3.py
          python3 scripts/check-matrix-result-reconciliation-traceability-v3.py
      - name: Recovery contract mutation regressions
        run: |
          python3 scripts/test-matrix-recovery-contract.py
          python3 scripts/check-matrix-recovery-contract.py
      - name: Validate actual Matrix source wiring
        run: python3 scripts/check-matrix-runtime-wiring.py
      - name: Preserve full module documentation gate
        run: python3 scripts/check-module-documentation.py

  adapter-rust:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Shared Matrix profile implementation and complete package tests
        run: |
          cargo fmt -p shared-config -- --check
          cargo test --locked -p shared-config --all-targets
          cargo clippy --locked -p shared-config --all-targets -- -D warnings
      - name: Formatting
        run: cargo fmt -p matrix-entry-adapter -- --check
      - name: Complete adapter targets
        run: cargo test --locked -p matrix-entry-adapter --all-targets
      - name: Strict adapter lint
        run: cargo clippy --locked -p matrix-entry-adapter --all-targets -- -D warnings
      - name: No source mutation
        run: git diff --exit-code

  consumer-result-rust:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Consumer Entry formatting
        run: cargo fmt -p consumer-entry-api -- --check
      - name: Complete Consumer Entry targets
        run: cargo test --locked -p consumer-entry-api --all-targets
      - name: Strict Consumer Entry lint
        run: cargo clippy --locked -p consumer-entry-api --all-targets -- -D warnings
      - name: No source mutation
        run: git diff --exit-code

  transport-rust:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Transport formatting
        run: cargo fmt -p matrix-bot-poller -p matrix-bot-relay -- --check
      - name: Complete transport tests
        run: cargo test --locked -p matrix-bot-poller -p matrix-bot-relay --all-targets
      - name: Strict transport lint
        run: cargo clippy --locked -p matrix-bot-poller -p matrix-bot-relay --all-targets -- -D warnings
      - name: No source mutation
        run: git diff --exit-code

  matrix-postgres:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MATRIX_TEST_DATABASE_URL: postgres://cex:disposable_ci_only@127.0.0.1:5432/matrix_review_ci
      MATRIX_TEST_ALLOW_SCHEMA_RESET: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cex
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: matrix_review_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cex -d matrix_review_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require PostgreSQL client
        run: command -v psql
      - name: Existing transport durability regressions
        run: bash scripts/check-matrix-source-observation-postgres.sh
      - name: Operator reconciliation migrations and causal-binding regression
        run: python3 scripts/matrix_operator_postgres_regression.py
      - name: No source mutation
        run: git diff --exit-code

# The only ROG lane is the base-owned `matrix-trusted-base-gate` push workflow.
# Its base-owned allowlist binds one immutable candidate SHA and its trusted host
# harness invokes candidate bytes only inside the isolated container boundary.
# Candidate workflows never schedule a self-hosted runner. Supporting regression
# does not replace the five v12 authority workflows, their exact-tree candidate
# manifest, or independent production gates.
