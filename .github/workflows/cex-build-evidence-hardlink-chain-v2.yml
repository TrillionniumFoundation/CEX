name: cex-build-evidence-hardlink-chain-v2

on:
  push:
    branches:
      - ops/object-export-fc8643d-20260910

permissions:
  contents: write

concurrency:
  group: cex-build-evidence-hardlink-chain-v2
  cancel-in-progress: false

jobs:
  prove_repair:
    name: cex-evidence/prove-stage-and-fast-forward-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ORIGINAL_HEAD: fc8643d76e7c9ca2691712e39985c7b2ae06ad74
      TARGET_BRANCH: integration/cex-v12-sequence54-20260908
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      RUST_TEST_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch helper and wait for prerequisite source repair
        shell: bash
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/patch-trnm-evidence-staging-v2.py"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/patch-trnm-evidence-staging-v2.py" \
            > "$helper"
          python3 "$helper" --self-test
          remote="https://x-access-token:${GH_WRITE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ready=false
          for _ in $(seq 1 180); do
            head="$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
            test -n "$head"
            rm -rf "$RUNNER_TEMP/probe"
            git init -q "$RUNNER_TEMP/probe"
            git -C "$RUNNER_TEMP/probe" remote add origin "$remote"
            git -C "$RUNNER_TEMP/probe" fetch -q --no-tags --depth=1 origin "$head"
            git -C "$RUNNER_TEMP/probe" checkout -q --detach FETCH_HEAD
            if grep -Fq 'external_package = "trnm-game-" + "server"' \
              "$RUNNER_TEMP/probe/scripts/rust_advisory_packages_v5.py"; then
              ready=true
              printf 'CEX_EVIDENCE_CHAIN_INPUT_HEAD=%s\n' "$head"
              break
            fi
            sleep 20
          done
          test "$ready" = true
          rm -rf "$RUNNER_TEMP/cex"
          mv "$RUNNER_TEMP/probe" "$RUNNER_TEMP/cex"

      - name: Verify exact descendant and committed semantic output
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cex"
          git -C "$work" fetch -q origin "$ORIGINAL_HEAD"
          git -C "$work" merge-base --is-ancestor "$ORIGINAL_HEAD" HEAD
          ! grep -Fq 'cargo test -p trnm-game-server --locked' \
            "$work/scripts/rust_advisory_packages_v5.py"
          generated="$RUNNER_TEMP/pre-stage-semantics.json"
          (
            cd "$work"
            python3 scripts/generate-repository-semantics.py --stdout
          ) > "$generated"
          cmp "$generated" "$work/docs/repository-contract-semantics-v1.json"
          (
            cd "$work"
            python3 scripts/check-sequence54-rustsec-admission.py
            python3 scripts/test-trnm-build-evidence.py
          )

      - name: Build and prove the actual Cargo hardlink condition
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          work="$RUNNER_TEMP/cex"
          cd "$work"
          cargo build --release --workspace --locked
          binary="$work/target/release/trnm-economy-service"
          staged="$RUNNER_TEMP/trnm-economy-service-evidence-proof"
          test -f "$binary"
          ! test -L "$binary"
          original_links="$(stat -c %h "$binary")"
          test "$original_links" -gt 1
          rm -f -- "$staged"
          install -m 0755 -- "$binary" "$staged"
          test -f "$staged"
          ! test -L "$staged"
          test "$(stat -c %h "$staged")" = 1
          test "$(sha256sum "$binary" | awk '{print $1}')" = \
            "$(sha256sum "$staged" | awk '{print $1}')"
          test "$(stat -c %s "$binary")" = "$(stat -c %s "$staged")"
          printf 'CARGO_RELEASE_BINARY_LINK_COUNT=%s\n' "$original_links"
          printf 'PRIVATE_INODE_PROOF=PASS\n'

      - name: Transform only the collector command and regenerate semantics
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cex"
          helper="$RUNNER_TEMP/patch-trnm-evidence-staging-v2.py"
          workflow="$work/.github/workflows/trnm-economy-settlement.yml"
          python3 "$helper" "$workflow"
          git -C "$work" diff --check
          test "$(git -C "$work" diff --name-only)" = \
            '.github/workflows/trnm-economy-settlement.yml'
          generated="$RUNNER_TEMP/post-stage-semantics.json"
          (
            cd "$work"
            python3 scripts/generate-repository-semantics.py --stdout
          ) > "$generated"
          python3 - "$generated" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          value = json.loads(path.read_text(encoding='utf-8'))
          assert value.get('production_authorization') == 'not_granted'
          assert isinstance(value.get('source_tree_sha256'), str)
          PY
          cp "$generated" "$work/docs/repository-contract-semantics-v1.json"
          regenerated="$RUNNER_TEMP/post-stage-recheck.json"
          (
            cd "$work"
            python3 scripts/generate-repository-semantics.py --stdout
          ) > "$regenerated"
          cmp "$regenerated" "$work/docs/repository-contract-semantics-v1.json"
          (
            cd "$work"
            python3 scripts/check-sequence54-rustsec-admission.py
            python3 scripts/test-trnm-build-evidence.py
          )
          git -C "$work" diff --check
          test "$(git -C "$work" diff --name-only | sort)" = \
            $'.github/workflows/trnm-economy-settlement.yml\ndocs/repository-contract-semantics-v1.json'

      - name: Commit and ordinary-fast-forward the live PR branch
        shell: bash
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cex"
          original="$(git -C "$work" rev-parse HEAD)"
          remote="https://x-access-token:${GH_WRITE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote_before="$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_before" = "$original"
          git -C "$work" config user.name 'ProfHepta'
          git -C "$work" config user.email '102159240+ProfHepta@users.noreply.github.com'
          git -C "$work" add \
            .github/workflows/trnm-economy-settlement.yml \
            docs/repository-contract-semantics-v1.json
          git -C "$work" commit -m 'fix(evidence): stage Cargo hardlinks on a private inode'
          new_head="$(git -C "$work" rev-parse HEAD)"
          git -C "$work" remote set-url origin "$remote"
          git -C "$work" push origin "HEAD:refs/heads/$TARGET_BRANCH"
          remote_after="$(git ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_after" = "$new_head"
          printf 'CEX_EVIDENCE_FIX_HEAD=%s\n' "$new_head"
          printf 'FORCE_UPDATE=false\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'
