name: world-settlement-final-convergence-v3

on:
  workflow_dispatch:
    inputs:
      cex_sha:
        description: Exact immutable CEX candidate SHA
        required: true
        type: string
      pull_request_number:
        description: CEX pull request number carrying the exact SHA
        required: true
        type: number
      world_sha:
        description: Exact immutable World companion SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: world-final-convergence-v3-${{ inputs.cex_sha }}-${{ inputs.world_sha }}
  cancel-in-progress: false

env:
  CEX_SOURCE_SHA: ${{ inputs.cex_sha }}
  CEX_PULL_REQUEST: ${{ inputs.pull_request_number }}
  WORLD_SOURCE_SHA: ${{ inputs.world_sha }}

jobs:
  verify-final-convergence:
    name: world-settlement-final-convergence-v3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate exact identities
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CEX_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORLD_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CEX_PULL_REQUEST" =~ ^[0-9]+$ ]]

      - name: Checkout exact immutable CEX candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CEX_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify required exact-SHA workflow executions, reviews and governance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p run/world-final-convergence-v3
          python3 - <<'PY' | tee run/world-final-convergence-v3/verification.json
          import json, os, re, urllib.error, urllib.parse, urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          sha = os.environ['CEX_SOURCE_SHA']
          pr_number = int(os.environ['CEX_PULL_REQUEST'])
          required_paths = [
              '.github/workflows/p0-migration-gate.yml',
              '.github/workflows/rust-service-gate.yml',
              '.github/workflows/p0-gateway-exact-reserve-gate.yml',
              '.github/workflows/p0-execution-settlement-gate.yml',
              '.github/workflows/p0-provider-reconciliation-gate.yml',
              '.github/workflows/p0-release-candidate-gate.yml',
              '.github/workflows/p0-rust-toolchain-convergence.yml',
              '.github/workflows/trnm-economy-ci.yml',
              '.github/workflows/trnm-economy-settlement.yml',
              '.github/workflows/project-boundary-gate.yml',
              '.github/workflows/project-boundary-changed-path-gate.yml',
              '.github/workflows/p0-world-authority-cutover-gate.yml',
              '.github/workflows/p0-world-authority-postgres-v2-gate.yml',
              '.github/workflows/sequence18-cross-repo-pin-gate.yml',
          ]

          def get(path):
              url = f'https://api.github.com/repos/{repository}{path}'
              request = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'User-Agent': 'cex-final-convergence-v3',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  payload = error.read().decode('utf-8', errors='replace')
                  try:
                      return error.code, json.loads(payload)
                  except json.JSONDecodeError:
                      return error.code, {'message': payload}

          status, runs_payload = get('/actions/runs?' + urllib.parse.urlencode({
              'head_sha': sha, 'per_page': 100,
          }))
          if status != 200 or not isinstance(runs_payload, dict):
              raise SystemExit(f'cannot read workflow runs: HTTP {status}')
          runs = runs_payload.get('workflow_runs')
          if not isinstance(runs, list):
              raise SystemExit('Actions response lacks workflow_runs')

          selected = {}
          failures = []
          for path in required_paths:
              candidates = [
                  run for run in runs
                  if run.get('path') == path
                  and run.get('head_sha') == sha
                  and run.get('event') in {'pull_request', 'push', 'workflow_dispatch'}
              ]
              if not candidates:
                  failures.append(f'{path}:missing')
                  continue
              run = max(candidates, key=lambda value: (
                  str(value.get('created_at') or ''),
                  int(value.get('run_attempt') or 0),
                  int(value.get('id') or 0),
              ))
              run_id = int(run['id'])
              job_status, jobs_payload = get(f'/actions/runs/{run_id}/jobs?per_page=100')
              jobs = jobs_payload.get('jobs') if isinstance(jobs_payload, dict) else None
              non_empty = (
                  job_status == 200
                  and isinstance(jobs, list)
                  and bool(jobs)
                  and all(isinstance(job.get('steps'), list) and bool(job['steps']) for job in jobs)
              )
              selected[path] = {
                  'run_id': run_id,
                  'attempt': run.get('run_attempt'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'jobs_non_empty': non_empty,
              }
              if run.get('status') != 'completed':
                  failures.append(f'{path}:not_completed')
              elif run.get('conclusion') != 'success':
                  failures.append(f'{path}:{run.get("conclusion")}')
              elif not non_empty:
                  failures.append(f'{path}:zero_step_or_missing_jobs')

          pr_status, pull = get(f'/pulls/{pr_number}')
          if pr_status != 200 or not isinstance(pull, dict):
              failures.append(f'pull_request:HTTP_{pr_status}')
          elif pull.get('head', {}).get('sha') != sha:
              failures.append('pull_request:head_sha_drift')
          elif pull.get('state') != 'open':
              failures.append('pull_request:not_open')

          review_status, reviews = get(f'/pulls/{pr_number}/reviews?per_page=100')
          approved_by = {}
          if review_status == 200 and isinstance(reviews, list):
              for review in reviews:
                  login = review.get('user', {}).get('login')
                  commit_id = review.get('commit_id')
                  state = review.get('state')
                  if isinstance(login, str):
                      approved_by[login] = {'state': state, 'commit_id': commit_id}
              exact_approvers = sorted(
                  login for login, value in approved_by.items()
                  if value.get('state') == 'APPROVED' and value.get('commit_id') == sha
              )
          else:
              exact_approvers = []
              failures.append(f'reviews:HTTP_{review_status}')
          if len(exact_approvers) < 2:
              failures.append('reviews:fewer_than_two_exact_head_approvals')
          if 'Tomasrgbsf' not in exact_approvers:
              failures.append('reviews:missing_required_security_approver')

          repo_status, repo = get('')
          default_branch = repo.get('default_branch') if repo_status == 200 and isinstance(repo, dict) else None
          branch_status, branch = get(f'/branches/{urllib.parse.quote(default_branch or "main", safe="")}')
          protected = branch_status == 200 and isinstance(branch, dict) and branch.get('protected') is True
          if not protected:
              failures.append('governance:default_branch_not_protected')

          rulesets_status, rulesets = get('/rulesets?per_page=100')
          active_rulesets = []
          if rulesets_status == 200 and isinstance(rulesets, list):
              active_rulesets = [
                  {'id': item.get('id'), 'name': item.get('name'), 'enforcement': item.get('enforcement')}
                  for item in rulesets if item.get('enforcement') == 'active'
              ]
          if not active_rulesets:
              failures.append('governance:no_active_ruleset')

          result = {
              'schema': 'cex.world-settlement-final-convergence.v3',
              'status': 'qualified' if not failures else 'blocked',
              'cex_sha': sha,
              'world_sha': os.environ['WORLD_SOURCE_SHA'],
              'pull_request': pr_number,
              'required_workflows': selected,
              'exact_head_approvers': exact_approvers,
              'default_branch': default_branch,
              'default_branch_protected': protected,
              'active_rulesets': active_rulesets,
              'failures': failures,
              'production_authorization': 'not_granted',
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          if failures:
              raise SystemExit('final convergence is blocked: ' + ', '.join(failures))
          PY

      - name: Record exact verifier identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/world-final-convergence-v3
          {
            echo "cex_sha=$(git rev-parse HEAD)"
            echo "cex_tree=$(git rev-parse 'HEAD^{tree}')"
            echo "workflow_blob=$(git rev-parse HEAD:.github/workflows/world-settlement-final-convergence-v3.yml)"
            echo "world_sha=$WORLD_SOURCE_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "production_authorization=not_granted"
          } > run/world-final-convergence-v3/identity.txt
          sha256sum run/world-final-convergence-v3/* \
            > run/world-final-convergence-v3/SHA256SUMS

      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-world-final-convergence-v3-${{ inputs.cex_sha }}-${{ github.run_attempt }}
          path: run/world-final-convergence-v3/**
          if-no-files-found: error
          retention-days: 90
