name: p0-v12-receipt-psql-repair

on:
  push:
    branches:
      - fix/p0-v12-final-closure
    paths:
      - '.github/workflows/p0-v12-receipt-psql-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/p0-v12-final-closure
          fetch-depth: 0

      - name: Replace psql -c variable interpolation with stdin
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path('scripts/check-trnm-settlement-receipt-lookup-http.sh')
          text = path.read_text(encoding='utf-8')

          scalar = re.compile(
              r'''(?m)^(?P<indent>[ \t]+)-v intent_id="\$response_loss_intent" \\
          (?P=indent)-c "select count\(\*\) from public\.trnm_economic_receipts where intent_id = :'intent_id';"\)$'''
          )
          text, count = scalar.subn(
              lambda match: (
                  f'''{match.group('indent')}-v intent_id="$response_loss_intent" <<'SQL'\n'''
                  "select count(*) from public.trnm_economic_receipts where intent_id = :'intent_id';\n"
                  "SQL\n)"
              ),
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one scalar psql replacement, found {count}')

          report_open = re.compile(
              r'''(?m)^(?P<indent>[ \t]+)-v concurrent_intent="\$concurrent_intent" \\
          (?P=indent)-c "$'''
          )
          text, count = report_open.subn(
              lambda match: (
                  f'''{match.group('indent')}-v concurrent_intent="$concurrent_intent" <<'SQL' '''
              ).rstrip(),
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one report psql opener replacement, found {count}')

          old_close = ''');")

          ended_at_epoch='''
          new_close = ''');
          SQL
          )

          ended_at_epoch='''
          if text.count(old_close) != 1:
              raise SystemExit(f'expected one report psql closer replacement, found {text.count(old_close)}')
          text = text.replace(old_close, new_close, 1)

          path.write_text(text, encoding='utf-8')
          PY
          bash -n scripts/check-trnm-settlement-receipt-lookup-http.sh
          python3 scripts/check-trnm-settlement-receipt-lookup.py

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CEX P0 closure automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/check-trnm-settlement-receipt-lookup-http.sh
          git diff --cached --check
          git commit -m 'fix(trnm): execute psql variable queries through stdin'
          git push origin HEAD:fix/p0-v12-final-closure
