name: p0-v12-receipt-psql-repair

on:
  push:
    branches:
      - fix/p0-v12-final-closure
    paths:
      - '.github/workflows/p0-v12-receipt-psql-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/p0-v12-final-closure
          fetch-depth: 0

      - name: Replace psql -c variable interpolation with stdin
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/check-trnm-settlement-receipt-lookup-http.sh')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''  committed=$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At \\
            -v intent_id="$response_loss_intent" \\
            -c "select count(*) from public.trnm_economic_receipts where intent_id = :'intent_id';")''',
                  '''  committed=$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At \\
            -v intent_id="$response_loss_intent" <<'SQL'
          select count(*) from public.trnm_economic_receipts where intent_id = :'intent_id';
          SQL
          )''',
              ),
              (
                  '''  -v concurrent_intent="$concurrent_intent" \\
            -c "
          select json_build_object(''',
                  '''  -v concurrent_intent="$concurrent_intent" <<'SQL'
          select json_build_object(''',
              ),
              (
                  '''  )
          );")
          
          ended_at_epoch''',
                  '''  )
          );
          SQL
          )
          
          ended_at_epoch''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement target, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          bash -n scripts/check-trnm-settlement-receipt-lookup-http.sh
          python3 scripts/check-trnm-settlement-receipt-lookup.py

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CEX P0 closure automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/check-trnm-settlement-receipt-lookup-http.sh
          git diff --cached --check
          git commit -m 'fix(trnm): execute psql variable queries through stdin'
          git push origin HEAD:fix/p0-v12-final-closure
