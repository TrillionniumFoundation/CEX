name: seq42-one-shot-integrity-diagnosis

on:
  push:
    branches:
      - automation/seq42-final-gap-closure

permissions:
  contents: write

concurrency:
  group: seq42-one-shot-integrity-diagnosis
  cancel-in-progress: false

jobs:
  diagnose-and-self-delete:
    if: >-
      github.repository == 'TrillionniumFoundation/CEX' &&
      github.ref == 'refs/heads/automation/seq42-final-gap-closure' &&
      github.event.head_commit.message == 'chore: bootstrap seq42 integrity diagnosis'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: automation/seq42-final-gap-closure
          fetch-depth: 0
          persist-credentials: true

      - name: Diagnose tracked mutations by command boundary
        shell: bash
        run: |
          set -uo pipefail

          report_tracked_delta() {
            local label="$1"
            echo "::group::tracked delta after ${label}"
            python3 - "$label" <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          import sys

          label = sys.argv[1]
          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          changed = []
          missing = []
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8", "surrogateescape"))
              if not path.exists() and not path.is_symlink():
                  missing.append(str(path))
                  continue
              if path.is_symlink():
                  data = path.readlink().as_posix().encode()
              else:
                  data = path.read_bytes()
              worktree = hashlib.sha256(data).hexdigest()
              committed = subprocess.check_output(
                  ["git", "show", f"HEAD:{path.as_posix()}"]
              )
              head = hashlib.sha256(committed).hexdigest()
              if worktree != head:
                  changed.append((str(path), head, worktree, len(committed), len(data)))
          print({
              "label": label,
              "changed": changed,
              "missing": missing,
              "porcelain": subprocess.check_output(
                  ["git", "status", "--porcelain=v1"], text=True
              ).splitlines(),
          })
          PY
            git diff --name-status || true
            git diff --numstat || true
            git diff --no-ext-diff --unified=40 -- \
              ':(exclude)Cargo.lock' | sed -n '1,500p' || true
            if ! git diff --quiet -- Cargo.lock; then
              echo 'Cargo.lock changed:'
              git diff --unified=12 -- Cargo.lock | sed -n '1,300p' || true
            fi
            echo "::endgroup::"
          }

          report_tracked_delta checkout

          echo '::group::release core self-test'
          python3 scripts/p0-release-evidence-core.py self-test
          core_rc=$?
          echo "core_self_test_rc=${core_rc}"
          echo '::endgroup::'
          report_tracked_delta release-core-self-test

          echo '::group::development docs check'
          python3 scripts/check-development-docs.py
          docs_rc=$?
          echo "development_docs_rc=${docs_rc}"
          echo '::endgroup::'
          report_tracked_delta development-docs

          echo '::group::candidate hygiene'
          python3 scripts/check-p0-release-candidate-hygiene.py --output /tmp/candidate-hygiene.json
          hygiene_rc=$?
          echo "candidate_hygiene_rc=${hygiene_rc}"
          echo '::endgroup::'
          report_tracked_delta candidate-hygiene

          echo '::group::repository integrity'
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          python3 scripts/check-repository-integrity.py \
            --expected-sha "$GITHUB_SHA" \
            --expected-tree "$candidate_tree" \
            --output /tmp/repository-integrity.json
          integrity_rc=$?
          echo "repository_integrity_rc=${integrity_rc}"
          echo '::endgroup::'
          report_tracked_delta repository-integrity

          printf 'diagnostic_rcs core=%s docs=%s hygiene=%s integrity=%s\n' \
            "$core_rc" "$docs_rc" "$hygiene_rc" "$integrity_rc"

      - name: Restore tree and self-delete diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          rm .github/workflows/seq42-one-shot-integrity-diagnosis.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove seq42 integrity diagnosis"
          git push origin HEAD:automation/seq42-final-gap-closure
