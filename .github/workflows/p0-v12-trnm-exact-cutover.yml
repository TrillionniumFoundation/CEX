name: p0-v12-trnm-exact-cutover

on:
  push:
    branches:
      - fix/p0-v12-final-closure
    paths:
      - '.github/workflows/p0-v12-trnm-exact-cutover.yml'

permissions:
  contents: write

concurrency:
  group: p0-v12-trnm-exact-cutover-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://cex:cex_ci_password@127.0.0.1:5432/cex_ci
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cex
          POSTGRES_PASSWORD: cex_ci_password
          POSTGRES_DB: cex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cex -d cex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/p0-v12-final-closure
          fetch-depth: 0

      - name: Cut TRNM native economy over to exact Ledger authority
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('services/ledger-service/src/repository/native_economy.rs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one target, found {count}')
              text = text.replace(old, new, 1)

          def replace_between(start_marker: str, end_marker: str, new: str, label: str) -> None:
              global text
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker missing')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{label}: end marker missing')
              text = text[:start] + new.rstrip() + '\n' + text[end:]

          def replace_function(name: str, next_name: str, new: str) -> None:
              replace_between(
                  f'async fn {name}(',
                  f'async fn {next_name}(',
                  new,
                  name,
              )

          replace_once(
              '''use crate::state::AccountRecord;

const DEFAULT_SELLER_REVERSIBLE_WINDOW_SECONDS: i64 = 86_400;
const MAX_SELLER_REVERSIBLE_WINDOW_SECONDS: i64 = 30 * 86_400;
''',
              '''const DEFAULT_SELLER_REVERSIBLE_WINDOW_SECONDS: i64 = 86_400;
const MAX_SELLER_REVERSIBLE_WINDOW_SECONDS: i64 = 30 * 86_400;
const EXACT_LEDGER_SOURCE_SERVICE: &str = "ledger-service";
const EXACT_LEDGER_SOURCE_PRINCIPAL: &str = "trnm-game-authority";

#[derive(Debug, Clone)]
struct ExactAccountRecord {
    account_id: Uuid,
    currency_unit: String,
    currency_scale: i16,
    balance_minor: i64,
    reserved_minor: i64,
}

impl ExactAccountRecord {
    fn available_minor(&self) -> Result<i64, LedgerActionError> {
        self.balance_minor.checked_sub(self.reserved_minor).ok_or_else(|| {
            LedgerActionError::Other(
                "TRNM exact account projection overflowed while computing available funds"
                    .to_string(),
            )
        })
    }
}

#[derive(Debug, Clone, Copy)]
struct ExactLedgerEffect {
    entry_id: Uuid,
    operation_id: Uuid,
    amount_minor: i64,
    currency_scale: i16,
}
''',
