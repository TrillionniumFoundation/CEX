name: sequence54-round4-monitor-v2

on:
  push:
    branches:
      - work/sequence54-round2-staging-20260909
    paths:
      - '.github/workflows/sequence54-round4-monitor-v2.yml'

permissions:
  contents: read
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: sequence54-round4-monitor-v2
  cancel-in-progress: false

env:
  STAGING_BRANCH: work/sequence54-round2-staging-20260909
  PULL_REQUEST_NUMBER: '53'
  EVIDENCE_DIR: ${{ runner.temp }}/sequence54-round4-monitor-v2

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    steps:
      - name: Monitor master and dispatch bounded adaptive retry on failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          encoded_branch="${STAGING_BRANCH//\//%2F}"
          master_id=''
          for _ in $(seq 1 80); do
            master_id="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/sequence54-round4-master-closure.yml/runs?branch=${encoded_branch}&per_page=20" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0].id // empty' 2>/dev/null || true)"
            [[ -n "$master_id" ]] && break
            sleep 15
          done
          [[ -n "$master_id" ]]
          printf '%s\n' "$master_id" > "$EVIDENCE_DIR/master-run-id.txt"

          status=''
          conclusion=''
          for _ in $(seq 1 960); do
            value="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${master_id}")"
            status="$(jq -r '.status' <<<"$value")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$value")"
            [[ "$status" == completed ]] && break
            sleep 15
          done
          [[ "$status" == completed ]]
          printf 'status=%s\nconclusion=%s\n' "$status" "$conclusion" > "$EVIDENCE_DIR/master-status.txt"

          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${master_id}/jobs?per_page=100" \
            > "$EVIDENCE_DIR/master-jobs.json"
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${master_id}/artifacts?per_page=100" \
            > "$EVIDENCE_DIR/master-artifacts.json"
          artifact_id="$(jq -r '.artifacts[] | select(.name | startswith("sequence54-round4-master-")) | .id' \
            "$EVIDENCE_DIR/master-artifacts.json" | head -n1)"
          if [[ -n "$artifact_id" && "$artifact_id" != null ]]; then
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > "$RUNNER_TEMP/master.zip"
            mkdir -p "$EVIDENCE_DIR/master-artifact"
            unzip -q "$RUNNER_TEMP/master.zip" -d "$EVIDENCE_DIR/master-artifact"
          fi

          dispatched=false
          dispatch_http='not_attempted'
          if [[ "$conclusion" != success ]]; then
            payload="$(jq -nc --arg ref "$STAGING_BRANCH" --arg run "$master_id" \
              '{ref:$ref,inputs:{master_run_id:$run}}')"
            set +e
            response_code="$(curl -sS -o "$EVIDENCE_DIR/round5-dispatch-response.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/sequence54-round5-adaptive.yml/dispatches" \
              -d "$payload")"
            curl_rc=$?
            set -e
            dispatch_http="$response_code"
            if [[ "$curl_rc" -eq 0 && "$response_code" =~ ^20[14]$ ]]; then dispatched=true; fi
          fi
          printf 'dispatched=%s\nhttp=%s\n' "$dispatched" "$dispatch_http" > "$EVIDENCE_DIR/round5-dispatch.txt"

          python3 - "$EVIDENCE_DIR" "$master_id" "$status" "$conclusion" "$dispatched" <<'PY'
          from pathlib import Path
          import json, sys
          root = Path(sys.argv[1])
          jobs = json.loads((root / 'master-jobs.json').read_text())
          failed = []
          for job in jobs.get('jobs', []):
              if job.get('conclusion') != 'success':
                  failed.append({
                      'name': job.get('name'),
                      'conclusion': job.get('conclusion'),
                      'failed_steps': [
                          step.get('name') for step in (job.get('steps') or [])
                          if step.get('conclusion') == 'failure'
                      ],
                  })
          report = {
              'schema': 'cex.sequence54-round4-monitor.v2',
              'master_run_id': int(sys.argv[2]),
              'status': sys.argv[3],
              'conclusion': sys.argv[4],
              'failed_jobs': failed,
              'round5_dispatched': sys.argv[5] == 'true',
              'production_authorization': 'not_granted',
          }
          (root / 'monitor.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          lines = [
              '<!-- sequence54-round4-monitor-v2 -->',
              '## Sequence 54 round-4 master monitor v2',
              '',
              f"- Master run: `{report['master_run_id']}`",
              f"- Conclusion: `{report['conclusion']}`",
              f"- Adaptive round 5 dispatched: `{str(report['round5_dispatched']).lower()}`",
          ]
          if failed:
              lines += ['', 'Failed jobs/steps:']
              for item in failed:
                  steps = ', '.join(f"`{value}`" for value in item['failed_steps']) or '`none reported`'
                  lines.append(f"- `{item['name']}` → `{item['conclusion']}`; steps: {steps}")
          lines += ['', 'No failed gate is waived. `production_authorization=not_granted` remains binding.']
          (root / 'comment.md').write_text('\n'.join(lines) + '\n')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PULL_REQUEST_NUMBER}/comments" \
            -f body="$(cat "$EVIDENCE_DIR/comment.md")"

      - name: Upload monitor evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sequence54-round4-monitor-v2-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
