name: candidate-format-evidence

on:
  workflow_dispatch:
  push:
    branches:
      - integration/cex-v12-sequence54-20260908

permissions:
  contents: read

concurrency:
  group: candidate-format-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_INCREMENTAL: '0'

jobs:
  rustfmt-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Generate exact rustfmt proposal without repository write authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          cargo fmt --all
          mkdir -p run/rustfmt/tree
          git diff --binary -- '*.rs' > run/rustfmt/cex-rustfmt.patch
          git diff --name-only --diff-filter=ACM -- '*.rs' > run/rustfmt/changed-files.txt
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path
          import shutil
          import subprocess

          root = Path.cwd()
          output = root / "run/rustfmt"
          changed = [
              line.strip()
              for line in (output / "changed-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          entries = []
          for relative in changed:
              source = root / relative
              destination = output / "tree" / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
              data = source.read_bytes()
              entries.append({
                  "path": relative,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })
          manifest = {
              "schema": "cex.rustfmt-evidence.v1",
              "repository": "TrillionniumFoundation/CEX",
              "source_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "source_tree": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^{tree}"], text=True
              ).strip(),
              "rustfmt": subprocess.check_output(
                  ["rustfmt", "--version"], text=True
              ).strip(),
              "changed_files": entries,
              "production_authorization": "not_granted",
          }
          (output / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          tar -czf run/rustfmt/formatted-tree.tar.gz -C run/rustfmt/tree .
          printf 'source=%s\nsource_tree=%s\n' "$GITHUB_SHA" "$source_tree"
          printf 'formatted_file_count=%s\n' "$(wc -l < run/rustfmt/changed-files.txt)"
          printf 'production_authorization=not_granted\n'
      - name: Upload exact rustfmt evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-rustfmt-proposal-${{ github.sha }}
          path: run/rustfmt/**
          if-no-files-found: error
          retention-days: 7
