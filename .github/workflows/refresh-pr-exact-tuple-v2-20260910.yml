name: refresh-pr-exact-tuple-v2-20260910

on:
  push:
    branches:
      - verify/cex-current-full-20260910

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: refresh-pr-exact-tuple-v2-20260910
  cancel-in-progress: false

jobs:
  refresh:
    name: cex/refresh-verified-pr-exact-tuple-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: integration/cex-v12-sequence54-20260908
      VERIFIED_BRANCH: verified/cex-current-full-20260910
      PULL_REQUEST: '53'
    steps:
      - name: Wait for verified ref to equal the current target
        shell: bash
        run: |
          set -euo pipefail
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          for attempt in $(seq 1 90); do
            target="$(git ls-remote "$remote" "refs/heads/${TARGET_BRANCH}" | cut -f1)"
            verified="$(git ls-remote "$remote" "refs/heads/${VERIFIED_BRANCH}" | cut -f1)"
            if [ -n "$target" ] && [ "$verified" = "$target" ]; then
              printf '%s\n' "$target" > "$RUNNER_TEMP/head"
              printf 'CEX_VERIFIED_HEAD=%s\n' "$target"
              exit 0
            fi
            sleep 20
          done
          echo 'verified CEX ref did not converge to the current target head' >&2
          exit 1

      - name: Freeze exact base, head, tree, and GitHub merge tuple
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/pulls/${PULL_REQUEST}" > "$RUNNER_TEMP/pr.json"
          python3 - "$RUNNER_TEMP/pr.json" "$(cat "$RUNNER_TEMP/head")" "$RUNNER_TEMP/base" <<'PY'
          import json
          import pathlib
          import sys

          pr = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_head = sys.argv[2]
          assert pr["state"] == "open"
          assert pr["draft"] is True
          assert pr["merged"] is False
          assert pr["head"]["sha"] == expected_head
          assert pr["head"]["ref"] == "integration/cex-v12-sequence54-20260908"
          assert pr["base"]["ref"] == "main"
          pathlib.Path(sys.argv[3]).write_text(pr["base"]["sha"] + "\n", encoding="utf-8")
          print("CEX_PR_STATE_BINDING=PASS")
          PY
          root="$RUNNER_TEMP/tuple"
          git init "$root"
          git -C "$root" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$root" fetch --no-tags origin \
            "+refs/pull/${PULL_REQUEST}/merge:refs/remotes/origin/pr-merge" \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/pr-head"
          base="$(git -C "$root" rev-parse refs/remotes/origin/main)"
          head="$(git -C "$root" rev-parse refs/remotes/origin/pr-head)"
          merge="$(git -C "$root" rev-parse refs/remotes/origin/pr-merge)"
          tree="$(git -C "$root" show -s --format='%T' "$head")"
          merge_tree="$(git -C "$root" show -s --format='%T' "$merge")"
          parents="$(git -C "$root" show -s --format='%P' "$merge")"
          test "$base" = "$(cat "$RUNNER_TEMP/base")"
          test "$head" = "$(cat "$RUNNER_TEMP/head")"
          test "$parents" = "$base $head"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/tree"
          printf '%s\n' "$merge" > "$RUNNER_TEMP/merge"
          printf '%s\n' "$merge_tree" > "$RUNNER_TEMP/merge-tree"
          printf 'CEX_MERGE_TUPLE_BINDING=PASS\n'

      - name: Replace exactly one managed block and read it back
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          python3 - \
            "$RUNNER_TEMP/pr.json" \
            "$RUNNER_TEMP/body.json" \
            "$(cat "$RUNNER_TEMP/base")" \
            "$(cat "$RUNNER_TEMP/head")" \
            "$(cat "$RUNNER_TEMP/tree")" \
            "$(cat "$RUNNER_TEMP/merge")" \
            "$(cat "$RUNNER_TEMP/merge-tree")" <<'PY'
          import json
          import re
          import sys

          source, output, base, head, tree, merge, merge_tree = sys.argv[1:]
          pr = json.load(open(source, encoding="utf-8"))
          body = pr.get("body") or ""
          start = "<!-- managed-exact-tuple:start -->"
          end = "<!-- managed-exact-tuple:end -->"
          lines = [
              start,
              "## Current immutable candidate tuple",
              "",
              "```text",
              "repository             TrillionniumFoundation/CEX",
              "pull request           #53",
              f"direct integration     main @ {base}",
              f"candidate head         {head}",
              f"candidate tree         {tree}",
              f"prospective merge      {merge}",
              f"merge tree             {merge_tree}",
              f"ordered parents        {base} {head}",
              f"verified ref           verified/cex-current-full-20260910 @ {head}",
              "state                  open / Draft / unmerged",
              "production             not_granted",
              "```",
              "",
              "Any base, head, tree, merge-ref, workflow-definition, verified-ref, review, or conversation movement invalidates the corresponding evidence.",
              end,
          ]
          block = "\n".join(lines)
          pattern = re.compile(re.escape(start) + r".*?" + re.escape(end), re.S)
          if pattern.search(body):
              if len(pattern.findall(body)) != 1:
                  raise SystemExit("managed exact-tuple block cardinality is not one")
              body = pattern.sub(block, body, count=1)
          else:
              body = block + "\n\n" + body
          with open(output, "w", encoding="utf-8") as handle:
              json.dump({"body": body}, handle, ensure_ascii=False)
          PY
          curl --fail --silent --show-error --location \
            -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/pulls/${PULL_REQUEST}" \
            --data-binary @"$RUNNER_TEMP/body.json" > "$RUNNER_TEMP/updated.json"
          python3 - "$RUNNER_TEMP/updated.json" "$(cat "$RUNNER_TEMP/head")" <<'PY'
          import json
          import sys

          pr = json.load(open(sys.argv[1], encoding="utf-8"))
          assert pr["state"] == "open"
          assert pr["draft"] is True
          assert pr["merged"] is False
          assert pr["head"]["sha"] == sys.argv[2]
          body = pr.get("body") or ""
          assert body.count("<!-- managed-exact-tuple:start -->") == 1
          assert body.count("<!-- managed-exact-tuple:end -->") == 1
          assert f"candidate head         {sys.argv[2]}" in body
          assert "production             not_granted" in body
          print("CEX_PR_EXACT_TUPLE_REFRESHED=PASS")
          print("PRODUCTION_AUTHORIZATION=not_granted")
          PY
