name: cex-blocker-batch-28c9-20260910

on:
  push:
    branches:
      - ops/cex-blocker-batch-28c9-20260910

permissions:
  contents: write

concurrency:
  group: cex-blocker-batch-28c9-20260910
  cancel-in-progress: true

jobs:
  validate_export:
    name: cex-blockers/validate-and-export
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.14-bookworm
        env:
          POSTGRES_USER: cex
          POSTGRES_PASSWORD: cex_ci_password
          POSTGRES_DB: matrix_batch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cex -d matrix_batch_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CANDIDATE_COMMIT: 28c9d1fe596a762441ddd5795a642d605af2bcd7
      MATRIX_TEST_DATABASE_URL: postgres://cex:cex_ci_password@127.0.0.1:5432/matrix_batch_ci
      MATRIX_TEST_ALLOW_SCHEMA_RESET: '1'
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      RUST_TEST_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch exact candidate and helper revision
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate"
          helper="$RUNNER_TEMP/helper"
          rm -rf "$candidate" "$helper"
          git init "$candidate"
          git -C "$candidate" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$candidate" fetch --no-tags --depth=1 origin "$CANDIDATE_COMMIT"
          git -C "$candidate" checkout --detach FETCH_HEAD
          test "$(git -C "$candidate" rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          git init "$helper"
          git -C "$helper" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$helper" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$helper" checkout --detach FETCH_HEAD
          test "$(git -C "$helper" rev-parse HEAD)" = "$GITHUB_SHA"
          test -s "$helper/scripts/patch-cex-blocker-batch-28c9.py"
          test -s "$helper/scripts/test-matrix-filter-definition.py"
          test -z "$(git -C "$candidate" status --porcelain=v1 --untracked-files=no)"

      - name: Apply exact five-file source batch
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate"
          helper="$RUNNER_TEMP/helper"
          cp "$helper/scripts/test-matrix-filter-definition.py" \
            "$candidate/scripts/test-matrix-filter-definition.py"
          python3 "$helper/scripts/patch-cex-blocker-batch-28c9.py" "$candidate"
          git -C "$candidate" diff --check
          git -C "$candidate" diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/changed.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          scripts/matrix_operator_postgres_regression.py
          scripts/test-build-unblock.py
          scripts/test-matrix-filter-definition.py
          services/consumer-entry-api/src/replay_store_snapshot.rs
          services/matrix-entry-adapter/operator-migrations/0006_adapter_result_embedded_delivery_binding.sql
          EOF
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"

      - name: Run Python source and orchestration regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          python3 -m py_compile \
            scripts/matrix_operator_postgres_regression.py \
            scripts/test-build-unblock.py \
            scripts/test-matrix-filter-definition.py
          python3 scripts/test-matrix-filter-definition.py
          python3 scripts/test-build-unblock.py
          python3 scripts/test-matrix-postgres-runner.py

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          rustc --version
          cargo --version

      - name: Format and qualify Consumer Entry
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          cargo fmt -p consumer-entry-api
          git diff --check
          cargo test --locked -p consumer-entry-api --all-targets
          cargo clippy --locked -p consumer-entry-api --all-targets -- -D warnings

      - name: Execute Matrix transport and operator PostgreSQL regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          bash scripts/check-matrix-source-observation-postgres.sh
          bash scripts/check-matrix-operator-postgres.sh

      - name: Regenerate exact semantic snapshot
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate"
          output="$RUNNER_TEMP/repository-contract-semantics-v1.json"
          (
            cd "$candidate"
            python3 scripts/generate-repository-semantics.py --stdout
          ) > "$output"
          python3 - "$output" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              value = json.load(handle)
          assert value["production_authorization"] == "not_granted"
          assert value["source_tree_sha256"].startswith("sha256:")
          print("CEX_BLOCKER_BATCH_SEMANTIC_SNAPSHOT=PASS")
          print("CEX_BLOCKER_BATCH_SOURCE_TREE_SHA256=" + value["source_tree_sha256"])
          PY
          git -C "$candidate" diff --check

      - name: Upload immutable exact batch blobs
        shell: bash
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - \
            "$RUNNER_TEMP/candidate/scripts/matrix_operator_postgres_regression.py" \
            "$RUNNER_TEMP/candidate/scripts/test-build-unblock.py" \
            "$RUNNER_TEMP/candidate/scripts/test-matrix-filter-definition.py" \
            "$RUNNER_TEMP/candidate/services/consumer-entry-api/src/replay_store_snapshot.rs" \
            "$RUNNER_TEMP/candidate/services/matrix-entry-adapter/operator-migrations/0006_adapter_result_embedded_delivery_binding.sql" \
            "$RUNNER_TEMP/repository-contract-semantics-v1.json" <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import urllib.request

          labels = (
              "CEX_OPERATOR_RUNNER",
              "CEX_BUILD_UNBLOCK_TEST",
              "CEX_MATRIX_FILTER_TEST",
              "CEX_REPLAY_SNAPSHOT",
              "CEX_MATRIX_EMBEDDED_BINDING_MIGRATION",
              "CEX_SEMANTIC_SNAPSHOT",
          )
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_OBJECT_TOKEN"]
          for label, raw_path in zip(labels, sys.argv[1:]):
              path = Path(raw_path)
              expected = subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs",
                  data=json.dumps({
                      "content": base64.b64encode(path.read_bytes()).decode("ascii"),
                      "encoding": "base64",
                  }, separators=(",", ":")).encode("utf-8"),
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  observed = json.load(response).get("sha")
              assert observed == expected, (label, expected, observed)
              print(f"{label}_BLOB_SHA={observed}")
          print("CEX_BLOCKER_BATCH_IMMUTABLE_EXPORT=PASS")
          print("REFS_MOVED=false")
          print("PRODUCTION_AUTHORIZATION=not_granted")
          PY
