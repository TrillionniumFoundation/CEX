name: cex-world-repin-sequence18b

on:
  push:
    branches:
      - tmp/cex-world-repin-sequence18b-20260907

permissions:
  contents: write
  pull-requests: write

jobs:
  repin-and-self-delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: fix/hepta-p0-blocker-closure-20260906
      TEMP_BRANCH: tmp/cex-world-repin-sequence18b-20260907
      WORLD_BRANCH: feat/p0-world-authority-cutover-20260906
      OLD_WORLD_SHA: cff9f3fd3539420c676f3d1397c166b1c1e24ffb
      OLD_WORLD_TREE: 69494614eace2116afb88aca8bad816f760bb22f
    steps:
      - name: Checkout current CEX target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve World and replace every superseded exact object
        id: repin
        shell: bash
        run: |
          set -euo pipefail
          world_ref="$(curl --fail --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/git/ref/heads/feat%2Fp0-world-authority-cutover-20260906')"
          world_sha="$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$world_ref")"
          world_commit="$(curl --fail --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/git/commits/$world_sha")"
          world_tree="$(jq -er '.tree.sha | select(test("^[0-9a-f]{40}$"))' <<<"$world_commit")"
          test "$world_sha" != "$OLD_WORLD_SHA"

          python3 - "$OLD_WORLD_SHA" "$world_sha" "$OLD_WORLD_TREE" "$world_tree" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          old_sha, new_sha, old_tree, new_tree = sys.argv[1:]
          tracked = subprocess.run(
              ['git', 'ls-files', '-z'], check=True, stdout=subprocess.PIPE
          ).stdout.split(b'\0')
          changed = []
          for raw in tracked:
              if not raw:
                  continue
              path = pathlib.Path(raw.decode())
              data = path.read_bytes()
              if b'\0' in data:
                  continue
              updated = data.replace(old_sha.encode(), new_sha.encode())
              updated = updated.replace(old_tree.encode(), new_tree.encode())
              if updated != data:
                  path.write_bytes(updated)
                  changed.append(path.as_posix())

          trigger_path = pathlib.Path('docs/release-evidence/p0-candidate-trigger.json')
          trigger = json.loads(trigger_path.read_text())
          trigger['sequence'] = max(int(trigger.get('sequence', 0)), 18)
          trigger['production_authorization'] = 'not_granted'
          trigger_path.write_text(json.dumps(trigger, indent=2, sort_keys=True) + '\n')

          report = {
              'schema': 'cex.world-exact-repin.v2',
              'status': 'repinned_unqualified_pending_hosted_gates',
              'world_branch': 'feat/p0-world-authority-cutover-20260906',
              'previous_world_sha': old_sha,
              'previous_world_tree': old_tree,
              'world_source_sha': new_sha,
              'world_source_tree': new_tree,
              'changed_paths': sorted(changed),
              'production_authorization': 'not_granted',
          }
          evidence_dir = pathlib.Path('docs/release-evidence')
          evidence_dir.mkdir(parents=True, exist_ok=True)
          for name in ('world-repin-sequence17.json', 'world-repin-sequence18.json'):
              (evidence_dir / name).write_text(
                  json.dumps(report, indent=2, sort_keys=True) + '\n'
              )
          PY

          git diff --check
          python3 -m json.tool docs/release-evidence/p0-candidate-trigger.json >/dev/null
          python3 -m json.tool docs/release-evidence/world-repin-sequence17.json >/dev/null
          python3 -m json.tool docs/release-evidence/world-repin-sequence18.json >/dev/null
          if git grep -n "$OLD_WORLD_SHA" -- .; then
            echo 'superseded World SHA remains in CEX target' >&2
            exit 1
          fi
          if git grep -n "$OLD_WORLD_TREE" -- .; then
            echo 'superseded World tree remains in CEX target' >&2
            exit 1
          fi
          git grep -n "$world_sha" -- . >/tmp/world-sha-bindings.txt
          git grep -n "$world_tree" -- . >/tmp/world-tree-bindings.txt
          test -s /tmp/world-sha-bindings.txt
          test -s /tmp/world-tree-bindings.txt

          if git diff --quiet; then
            echo 'target already exactly repinned; only evidence refresh may be absent' >&2
          else
            git config user.name 'Trillionnium exact-repin automation'
            git config user.email 'exact-repin@trillionnium.invalid'
            git add -A
            git commit -m 'chore(world): bind final sequence-2 authority object'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          echo "world_sha=$world_sha" >> "$GITHUB_OUTPUT"
          echo "world_tree=$world_tree" >> "$GITHUB_OUTPUT"

      - name: Refresh exact-object PR summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORLD_SHA: ${{ steps.repin.outputs.world_sha }}
          WORLD_TREE: ${{ steps.repin.outputs.world_tree }}
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          cex_sha="$(git rev-parse "origin/$TARGET_BRANCH")"
          cex_tree="$(git rev-parse "origin/$TARGET_BRANCH^{tree}")"
          base_sha="$(git rev-parse origin/main)"
          body="$(cat <<EOF
          ## Scope

          Repository-actionable CEX v12 P0 closure candidate. Draft and unmerged; \`production_authorization=not_granted\`.

          ## Exact identities

          - CEX source head: \`$cex_sha\`
          - CEX source tree: \`$cex_tree\`
          - CEX base: \`main@$base_sha\`
          - World PR #60 source head: \`$WORLD_SHA\`
          - World source tree: \`$WORLD_TREE\`
          - qualification sequence: \`18\`

          ## Repository closure

          The candidate binds complete module documentation, Capability and exact-money boundaries, recursive Rust/Cargo source governance, PostgreSQL recovery, normal-plus-build RustSec reachability, derived release surfaces, bounded risk ownership, and the World sequence-2 singleton-index catalog contract with hostile non-unique and wrong-key same-name/same-predicate cases.

          ## Admission truth

          No prior-head result receives credit. All applicable exact-source and prospective-merge contexts must be non-empty terminal success on this unchanged tuple. Fresh eligible reviews, CEX live main protection, World-native scheduling, production data reconciliation, IAM/secrets, bounded no-dual-writer evidence, embedded-authority retirement, production outage/rollback and final human authorization remain independent fail-closed gates.

          No status fabrication, review dismissal, administrator bypass, deployment, cutover or production authorization.
          EOF
          )"
          jq -n --arg body "$body" '{body:$body}' >/tmp/pr-patch.json
          curl --fail --silent --show-error --location \
            --request PATCH \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/TrillionniumFoundation/CEX/pulls/34 \
            --data-binary @/tmp/pr-patch.json >/tmp/pr.json
          test "$(jq -r '.head.sha' /tmp/pr.json)" = "$cex_sha"

      - name: Request fresh reviewers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/TrillionniumFoundation/CEX/pulls/34/requested_reviewers \
            --data '{"reviewers":["Franksudoman","Tomasrgbsf"]}' >/tmp/reviewers.json

      - name: Delete this temporary branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error --location \
            --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/TrillionniumFoundation/CEX/git/refs/heads/tmp%2Fcex-world-repin-sequence18b-20260907" \
            --output /tmp/delete.json \
            --write-out '%{http_code}\n'
