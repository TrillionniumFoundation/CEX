name: object-export-fc8643d-20260910

on:
  push:
    branches:
      - ops/object-export-fc8643d-20260910

permissions:
  contents: write

concurrency:
  group: object-export-fc8643d-20260910
  cancel-in-progress: false

jobs:
  export_objects:
    name: object-export/exact-immutable-blobs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_COMMIT: fc8643d76e7c9ca2691712e39985c7b2ae06ad74
      HELPER_REPOSITORY: TrillionniumFoundation/TrillionniumGame
      HELPER_COMMIT: 93b85cf1ca2ef0a8b99fd263750417c19b1c65e9
      HELPER_BLOB: f430ad3ccb0c1caa7c004812300062038eb8c54b
      EXPECTED_SOURCE_SHA256: 70f728bd07b8150eb17d9e8ea8e76db686c445a602ec795e812c081e00fa65a3
      EXPECTED_SEMANTIC_SHA256: 28b76a266071e26a81ad6ce41ef5e5f1651bb7d531180e78ae292a6e3921a31b
      EXPECTED_SOURCE_TREE_SHA256: sha256:2d166161e773b455609b3c1915f0f5e2cd15d18c1bff3accd9d1e9b1bef919a7
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch exact candidate and pinned patch helper
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate"
          helper="$RUNNER_TEMP/patch-cex-release-fixtures.py"
          rm -rf "$candidate" "$helper"
          git init "$candidate"
          git -C "$candidate" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$candidate" fetch --no-tags --depth=1 origin "$CANDIDATE_COMMIT"
          git -C "$candidate" checkout --detach FETCH_HEAD
          test "$(git -C "$candidate" rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/${HELPER_REPOSITORY}/${HELPER_COMMIT}/scripts/patch-cex-release-fixtures.py" \
            > "$helper"
          test "$(git hash-object "$helper")" = "$HELPER_BLOB"
          test -z "$(git -C "$candidate" status --porcelain=v1 --untracked-files=no)"

      - name: Reproduce and verify exact repair objects
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate"
          helper="$RUNNER_TEMP/patch-cex-release-fixtures.py"
          source="$candidate/scripts/rust_advisory_packages_v5.py"
          semantic="$RUNNER_TEMP/repository-contract-semantics-v1.json"
          python3 "$helper" "$source"
          python3 -m py_compile "$source"
          (
            cd "$candidate"
            PYTHONPATH=scripts python3 - <<'PY'
          import rust_advisory_packages_v5 as module
          result = module._external_workflow_self_tests()
          assert result and all(result.values()), result
          print("CEX_EXTERNAL_WORKFLOW_SELF_TESTS=PASS", result)
          PY
          )
          (
            cd "$candidate"
            python3 scripts/generate-repository-semantics.py --stdout
          ) > "$semantic"
          actual_source="$(sha256sum "$source" | awk '{print $1}')"
          actual_semantic="$(sha256sum "$semantic" | awk '{print $1}')"
          printf 'CEX_ACTUAL_SOURCE_SHA256=%s\n' "$actual_source"
          printf 'CEX_ACTUAL_SEMANTIC_SHA256=%s\n' "$actual_semantic"
          python3 - "$semantic" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              value = json.load(handle)
          print("CEX_ACTUAL_SOURCE_TREE_SHA256=" + value["source_tree_sha256"])
          print("CEX_ACTUAL_PRODUCTION_AUTHORIZATION=" + value["production_authorization"])
          PY
          test "$actual_source" = "$EXPECTED_SOURCE_SHA256"
          test "$actual_semantic" = "$EXPECTED_SEMANTIC_SHA256"
          python3 - "$semantic" "$EXPECTED_SOURCE_TREE_SHA256" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              value = json.load(handle)
          assert value["source_tree_sha256"] == sys.argv[2]
          assert value["production_authorization"] == "not_granted"
          print("CEX_GENERATED_SEMANTIC_BINDING=PASS")
          PY
          git -C "$candidate" diff --check

      - name: Upload immutable blobs without moving refs
        shell: bash
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - \
            "$RUNNER_TEMP/candidate/scripts/rust_advisory_packages_v5.py" \
            "$RUNNER_TEMP/repository-contract-semantics-v1.json" <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_OBJECT_TOKEN"]
          labels = ("CEX_PATCHED_SOURCE", "CEX_PATCHED_SEMANTIC")
          for label, raw_path in zip(labels, sys.argv[1:]):
              path = Path(raw_path)
              content = path.read_bytes()
              expected = subprocess.check_output(
                  ["git", "hash-object", str(path)], text=True
              ).strip()
              payload = json.dumps({
                  "content": base64.b64encode(content).decode("ascii"),
                  "encoding": "base64",
              }, separators=(",", ":")).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs",
                  data=payload,
                  method="POST",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              observed = result.get("sha")
              assert observed == expected, (label, expected, observed)
              print(f"{label}_BLOB_SHA={observed}")
          print("CEX_IMMUTABLE_OBJECT_EXPORT=PASS")
          print("REFS_MOVED=false")
          print("PRODUCTION_AUTHORIZATION=not_granted")
          PY
