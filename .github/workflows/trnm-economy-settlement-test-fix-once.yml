name: trnm-economy-settlement-test-fix-once

on:
  push:
    branches:
      - fix/cex-settlement-receipt-lookup-v1
    paths:
      - '.github/workflows/trnm-economy-settlement-test-fix-once.yml'

permissions:
  contents: write

jobs:
  rename-shadowed-builder:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply exact test-only rename
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('services/trnm-economy-service/tests/settlement_contract.rs')
          text = path.read_text(encoding='utf-8')
          if text.count('fn app(') != 1:
              raise SystemExit('expected exactly one test app builder')
          if text.count('= app(') != 2:
              raise SystemExit('expected exactly two builder call sites')
          text = text.replace('fn app(', 'fn build_test_app(')
          text = text.replace('= app(', '= build_test_app(')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'trnm-settlement-fix-bot'
          git config user.email 'trnm-settlement-fix-bot@users.noreply.github.com'
          git add services/trnm-economy-service/tests/settlement_contract.rs
          git commit -m 'test(settlement): avoid shadowing router builder'
          git push origin HEAD:fix/cex-settlement-receipt-lookup-v1
