name: world-authority-lock-refresh

# Deliberately manual-only. Automatic push refresh created bot-authored commits
# whose pull_request checks concluded action_required without allocating jobs.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-authority-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    name: world-authority-lock-refresh/current-pr-heads
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout relay branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/world-settlement-capture-boundary-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve current World fixture and Game authority candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolve_pr() {
            repository="$1"
            number="$2"
            pr_json="$(curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${repository}/pulls/${number}")"
            commit="$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' <<<"$pr_json")"
            branch="$(jq -er '.head.ref | select(length > 0)' <<<"$pr_json")"
            commit_json="$(curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${repository}/commits/${commit}")"
            tree="$(jq -er '.commit.tree.sha | select(test("^[0-9a-f]{40}$"))' <<<"$commit_json")"
            jq -n --arg repository "$repository" --arg branch "$branch" --arg commit "$commit" --arg tree "$tree" \
              '{repository:$repository,branch:$branch,commit:$commit,tree:$tree}'
          }
          world="$(resolve_pr TrillionniumFoundation/Trillionnium-World 22)"
          game="$(resolve_pr TrillionniumFoundation/TrillionniumGame 17)"
          jq -n \
            --argjson world "$world" \
            --argjson game "$game" \
            '{
              schema:"trnm_world_authority_external_lock_v1",
              world:($world + {role:"deterministic_fixture_only"}),
              game_nakama:($game + {role:"target_authority_candidate"}),
              activation:"shadow_only",
              cutover_authorized:false,
              closed_online_promoted:false,
              public_online_enabled:false,
              public_player_market_enabled:false,
              limitations:[
                "exact source CI is not owner merge or deployment evidence",
                "no active-match drain, sole-admission switch, sole-completion-signer switch or credential revocation evidence",
                "no public-online, public-market or commercial-release credit"
              ]
            }' > evidence/world-authority-external-lock.json
          jq -e '
            .schema == "trnm_world_authority_external_lock_v1" and
            .world.repository == "TrillionniumFoundation/Trillionnium-World" and
            .world.role == "deterministic_fixture_only" and
            .game_nakama.repository == "TrillionniumFoundation/TrillionniumGame" and
            .game_nakama.role == "target_authority_candidate" and
            (.world.commit | test("^[0-9a-f]{40}$")) and
            (.world.tree | test("^[0-9a-f]{40}$")) and
            (.game_nakama.commit | test("^[0-9a-f]{40}$")) and
            (.game_nakama.tree | test("^[0-9a-f]{40}$")) and
            .activation == "shadow_only" and
            .cutover_authorized == false and
            .closed_online_promoted == false and
            .public_online_enabled == false and
            .public_player_market_enabled == false
          ' evidence/world-authority-external-lock.json >/dev/null

      - name: Commit only a changed authority lock
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- evidence/world-authority-external-lock.json; then
            echo 'Authority component lock is already current.'
            exit 0
          fi
          test "$(git diff --name-only | tr -d '\r')" = 'evidence/world-authority-external-lock.json'
          git add evidence/world-authority-external-lock.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci(authority): refresh exact World and Game component lock'
          git push origin HEAD:ci/world-settlement-capture-boundary-v1
