name: world-single-writer-catalog-closure

on:
  push:
    branches:
      - tmp/world-single-writer-catalog-closure-20260907

permissions:
  contents: read

concurrency:
  group: world-single-writer-catalog-closure
  cancel-in-progress: false

jobs:
  patch-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WORLD_REPO_TOKEN: ${{ secrets.WORLD_REPO_TOKEN }}
      TRILLIONNIUM_WORLD_REPO_TOKEN: ${{ secrets.TRILLIONNIUM_WORLD_REPO_TOKEN }}
      TRILLIONNIUM_WORLD_TOKEN: ${{ secrets.TRILLIONNIUM_WORLD_TOKEN }}
      CEX_WORLD_TOKEN: ${{ secrets.CEX_WORLD_TOKEN }}
      WORLD_TOKEN: ${{ secrets.WORLD_TOKEN }}
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
      CROSS_REPO_PAT: ${{ secrets.CROSS_REPO_PAT }}
      ORG_GITHUB_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
      ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      PAT: ${{ secrets.PAT }}
      RESULT_PATH: ${{ github.workspace }}/run/world-catalog-closure/result.json
    steps:
      - name: Checkout bounded maintenance helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Mask configured cross-repository credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            WORLD_REPO_TOKEN TRILLIONNIUM_WORLD_REPO_TOKEN TRILLIONNIUM_WORLD_TOKEN \
            CEX_WORLD_TOKEN WORLD_TOKEN CROSS_REPO_TOKEN CROSS_REPO_PAT \
            ORG_GITHUB_TOKEN ADMIN_GITHUB_TOKEN GH_PAT GITHUB_PAT REPO_TOKEN PAT; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then
              echo "::add-mask::$value"
            fi
          done

      - name: Apply and remotely verify atomic World fix
        run: python3 .github/diagnostics/patch-world-single-writer.py

      - name: Upload bounded execution receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-single-writer-catalog-closure-${{ github.sha }}
          path: run/world-catalog-closure/**
          if-no-files-found: warn
          retention-days: 7
