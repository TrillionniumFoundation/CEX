name: project-boundary-gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: project-boundary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  RUST_TOOLCHAIN: '1.98.1'

jobs:
  recursive-source-closure:
    name: project-boundary/recursive-source-and-cargo-closure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head and history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1

      - name: Resolve exact source and prospective merge identities
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          if [[ -n "$BASE_SHA" ]]; then
            git cat-file -e "${BASE_SHA}^{commit}"
            merge_output="$(git merge-tree --write-tree "$BASE_SHA" "$SOURCE_HEAD_SHA")"
            merge_tree="$(printf '%s\n' "$merge_output" | head -n1)"
            [[ "$merge_tree" =~ ^[0-9a-f]{40}$ ]]
            export GIT_AUTHOR_NAME='CEX boundary qualification'
            export GIT_AUTHOR_EMAIL='qualification@cex.invalid'
            export GIT_AUTHOR_DATE='2000-01-01T00:00:00Z'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
            merge_commit="$(printf 'Synthetic prospective merge for boundary qualification only\n' \
              | git commit-tree "$merge_tree" -p "$BASE_SHA" -p "$SOURCE_HEAD_SHA")"
          else
            merge_tree="$source_tree"
            merge_commit="$SOURCE_HEAD_SHA"
          fi
          {
            echo "source_tree=$source_tree"
            echo "merge_tree=$merge_tree"
            echo "merge_commit=$merge_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Validate exact source recursive closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/project-boundary
          python3 scripts/check-rust-toolchain-convergence.py \
            | tee run/project-boundary/source-toolchain.json
          python3 scripts/check-project-boundary.py \
            | tee run/project-boundary/source-boundary.json
          python3 scripts/check-project-boundary-cargo-closure.py \
            | tee run/project-boundary/source-cargo.json

      - name: Validate prospective merge recursive closure
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          MERGE_COMMIT: ${{ steps.identity.outputs.merge_commit }}
          MERGE_TREE: ${{ steps.identity.outputs.merge_tree }}
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/cex-project-boundary-merge"
          git worktree add --detach "$worktree" "$MERGE_COMMIT"
          trap 'git worktree remove --force "$worktree"' EXIT
          test "$(git -C "$worktree" rev-parse 'HEAD^{tree}')" = "$MERGE_TREE"
          (
            cd "$worktree"
            python3 scripts/check-rust-toolchain-convergence.py
            python3 scripts/check-project-boundary.py
            python3 scripts/check-project-boundary-cargo-closure.py
          ) | tee run/project-boundary/prospective-merge.log
          test -z "$(git -C "$worktree" status --porcelain --untracked-files=no)"

      - name: Record immutable boundary evidence
        if: always()
        shell: bash
        env:
          SOURCE_TREE: ${{ steps.identity.outputs.source_tree }}
          MERGE_TREE: ${{ steps.identity.outputs.merge_tree }}
        run: |
          set -euo pipefail
          mkdir -p run/project-boundary
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path('run/project-boundary')
          def git(*args):
              return subprocess.run(['git', *args], check=True, text=True, stdout=subprocess.PIPE).stdout.strip()
          summary = {
              'schema': 'cex.project-boundary.evidence.v3',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'source_head_sha': os.environ['SOURCE_HEAD_SHA'],
              'source_head_tree': os.environ['SOURCE_TREE'],
              'base_sha': os.environ.get('BASE_SHA') or None,
              'prospective_merge_tree': os.environ['MERGE_TREE'],
              'workflow_blob': git('rev-parse', 'HEAD:.github/workflows/project-boundary-gate.yml'),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'production_authorization': 'not_granted',
          }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          files = sorted(p for p in out.rglob('*') if p.is_file() and p.name != 'manifest.json')
          (out / 'manifest.json').write_text(json.dumps({
              'schema': 'cex.project-boundary.artifact-manifest.v3',
              'files': [{'path': p.relative_to(out).as_posix(), 'bytes': p.stat().st_size,
                         'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in files],
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload recursive boundary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-project-boundary-${{ env.SOURCE_HEAD_SHA }}-${{ github.run_attempt }}
          path: run/project-boundary/**
          if-no-files-found: error
          retention-days: 90
