name: p0-supply-chain-gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: p0-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_TOOLCHAIN: '1.98.1'
  CARGO_AUDIT_VERSION: '0.22.2'
  CARGO_DENY_VERSION: '0.20.2'

jobs:
  supply-chain-and-economy-workspace:
    name: supply-chain-and-economy-workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate with policy history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install pinned supply-chain tools
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Verify exact source, compiler and tool identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "$RUST_TOOLCHAIN"
          test "$(cargo-audit --version | awk '{print $2}')" = "$CARGO_AUDIT_VERSION"
          test "$(cargo-deny --version | awk '{print $2}')" = "$CARGO_DENY_VERSION"
          mkdir -p run/p0-supply-chain
          git rev-parse HEAD | tee run/p0-supply-chain/head-sha.txt
          git rev-parse 'HEAD^{tree}' | tee run/p0-supply-chain/head-tree.txt
          rustc --version --verbose | tee run/p0-supply-chain/rustc-version.txt
          cargo --version --verbose | tee run/p0-supply-chain/cargo-version.txt
          cargo-audit --version | tee run/p0-supply-chain/cargo-audit-version.txt
          cargo-deny --version | tee run/p0-supply-chain/cargo-deny-version.txt

      - name: Validate complete release and advisory closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-rust-toolchain-convergence.py \
            | tee run/p0-supply-chain/toolchain-convergence.json
          python3 scripts/check-rust-advisory-exceptions.py \
            | tee run/p0-supply-chain/advisory-exception-evidence.json
          cargo audit --deny warnings \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0214 \
            --ignore RUSTSEC-2024-0436 \
            2>&1 | tee run/p0-supply-chain/cargo-audit.txt
          cargo audit --json \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0214 \
            --ignore RUSTSEC-2024-0436 \
            > run/p0-supply-chain/cargo-audit.json
          cargo deny check advisories licenses sources \
            2>&1 | tee run/p0-supply-chain/cargo-deny-policy.txt
          cargo deny check --allow wildcard bans \
            2>&1 | tee run/p0-supply-chain/cargo-deny-bans.txt

      - name: Qualify exact economy-facing workspace packages
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --all-targets \
            -p ledger-service \
            -p consumer-entry-api \
            -p trnm-economy-service \
            2>&1 | tee run/p0-supply-chain/economy-tests.txt
          cargo clippy --locked --all-targets \
            -p ledger-service \
            -p consumer-entry-api \
            -p trnm-economy-service \
            -- -D warnings \
            2>&1 | tee run/p0-supply-chain/economy-clippy.txt
          cargo build --locked --release \
            -p ledger-service \
            -p consumer-entry-api \
            -p trnm-economy-service \
            2>&1 | tee run/p0-supply-chain/economy-release-build.txt

      - name: Record immutable supply-chain evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/p0-supply-chain
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path('run/p0-supply-chain')
          def git(*args):
              return subprocess.run(['git', *args], check=True, text=True, stdout=subprocess.PIPE).stdout.strip()
          summary = {
              'schema': 'cex.p0-supply-chain-exact-sha.v1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'head_sha': git('rev-parse', 'HEAD'),
              'head_tree': git('rev-parse', 'HEAD^{tree}'),
              'workflow_blob': git('rev-parse', 'HEAD:.github/workflows/p0-supply-chain-gate.yml'),
              'cargo_lock_blob': git('rev-parse', 'HEAD:Cargo.lock'),
              'deny_policy_blob': git('rev-parse', 'HEAD:deny.toml'),
              'rust_toolchain': os.environ['RUST_TOOLCHAIN'],
              'cargo_audit_version': os.environ['CARGO_AUDIT_VERSION'],
              'cargo_deny_version': os.environ['CARGO_DENY_VERSION'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'production_authorization': 'not_granted',
          }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          files = sorted(p for p in out.rglob('*') if p.is_file() and p.name != 'manifest.json')
          (out / 'manifest.json').write_text(json.dumps({
              'schema': 'cex.p0-supply-chain-artifact-manifest.v1',
              'files': [
                  {'path': p.relative_to(out).as_posix(), 'bytes': p.stat().st_size,
                   'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
                  for p in files
              ],
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload immutable supply-chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cex-p0-supply-chain-${{ github.sha }}-${{ github.run_attempt }}
          path: run/p0-supply-chain/**
          if-no-files-found: error
          retention-days: 90
