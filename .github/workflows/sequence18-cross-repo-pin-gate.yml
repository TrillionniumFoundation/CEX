name: sequence18-cross-repo-pin-gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: sequence18-cross-repo-pin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CEX_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  WORLD_SOURCE_REPOSITORY: TrillionniumFoundation/Trillionnium-World

jobs:
  exact-pin:
    name: sequence18-cross-repo-pin
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact CEX source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CEX_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the sole authoritative World pin
        id: world
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/sequence18-cross-repo-pin
          python3 - <<'PY' | tee run/sequence18-cross-repo-pin/pin-policy.json
          import json, pathlib, re
          trace = json.loads(pathlib.Path('docs/traceability/world-authority-cutover-v1.json').read_text())
          repin = json.loads(pathlib.Path('docs/release-evidence/world-repin-sequence17.json').read_text())
          trigger = json.loads(pathlib.Path('docs/release-evidence/p0-candidate-trigger.json').read_text())
          sha = trace['world_source']['head_sha']
          tree = trace['world_source']['head_tree']
          failures = []
          if repin.get('world_source_sha') != sha:
              failures.append('world_source_sha_drift')
          if repin.get('world_source_tree') != tree:
              failures.append('world_source_tree_drift')
          if re.fullmatch(r'[0-9a-f]{40}', sha) is None:
              failures.append('world_sha_not_exact')
          if re.fullmatch(r'[0-9a-f]{40}', tree) is None:
              failures.append('world_tree_not_exact')
          if trigger.get('sequence') != 18:
              failures.append('candidate_sequence_not_18')
          for value in (trace, repin, trigger):
              if value.get('production_authorization') != 'not_granted':
                  failures.append('source_record_self_authorizes_production')
          result = {
              'schema': 'cex.sequence18-cross-repo-pin-policy.v2',
              'status': 'valid' if not failures else 'failed',
              'world_sha': sha,
              'world_tree': tree,
              'sequence': trigger.get('sequence'),
              'failures': failures,
              'production_authorization': 'not_granted',
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          if failures:
              raise SystemExit(','.join(failures))
          with pathlib.Path('/tmp/world-identity.env').open('w') as handle:
              handle.write(f'world_sha={sha}\nworld_tree={tree}\n')
          PY
          cat /tmp/world-identity.env >> "$GITHUB_OUTPUT"

      - name: Checkout exact pinned World source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.WORLD_SOURCE_REPOSITORY }}
          ref: ${{ steps.world.outputs.world_sha }}
          path: .world-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact object identity and repository bindings
        shell: bash
        env:
          WORLD_SOURCE_SHA: ${{ steps.world.outputs.world_sha }}
          WORLD_SOURCE_TREE: ${{ steps.world.outputs.world_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CEX_SOURCE_SHA"
          test "$(git -C .world-source rev-parse HEAD)" = "$WORLD_SOURCE_SHA"
          test "$(git -C .world-source rev-parse 'HEAD^{tree}')" = "$WORLD_SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          test -z "$(git -C .world-source status --porcelain)"
          git grep -n "$WORLD_SOURCE_SHA" -- . \
            > run/sequence18-cross-repo-pin/world-sha-bindings.txt
          git grep -n "$WORLD_SOURCE_TREE" -- . \
            > run/sequence18-cross-repo-pin/world-tree-bindings.txt
          test -s run/sequence18-cross-repo-pin/world-sha-bindings.txt
          test -s run/sequence18-cross-repo-pin/world-tree-bindings.txt

      - name: Record immutable exact-pin evidence
        if: always()
        shell: bash
        env:
          WORLD_SOURCE_SHA: ${{ steps.world.outputs.world_sha }}
          WORLD_SOURCE_TREE: ${{ steps.world.outputs.world_tree }}
        run: |
          set -euo pipefail
          mkdir -p run/sequence18-cross-repo-pin
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path('run/sequence18-cross-repo-pin')
          def git(cwd, *args):
              return subprocess.run(['git', *args], cwd=cwd, check=True, text=True, stdout=subprocess.PIPE).stdout.strip()
          summary = {
              'schema': 'cex.sequence18-cross-repo-pin.v2',
              'status': 'exact_pin_verified' if pathlib.Path('.world-source/.git').exists() else 'failed_or_incomplete',
              'cex_sha': git('.', 'rev-parse', 'HEAD'),
              'cex_tree': git('.', 'rev-parse', 'HEAD^{tree}'),
              'world_repository': os.environ['WORLD_SOURCE_REPOSITORY'],
              'world_sha': os.environ.get('WORLD_SOURCE_SHA') or None,
              'world_tree': os.environ.get('WORLD_SOURCE_TREE') or None,
              'workflow_blob': git('.', 'rev-parse', 'HEAD:.github/workflows/sequence18-cross-repo-pin-gate.yml'),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'production_authorization': 'not_granted',
          }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          files = sorted(p for p in out.rglob('*') if p.is_file() and p.name != 'manifest.json')
          (out / 'manifest.json').write_text(json.dumps({
              'schema': 'cex.sequence18-cross-repo-pin-artifact-manifest.v2',
              'files': [{'path': p.relative_to(out).as_posix(), 'bytes': p.stat().st_size,
                         'sha256': hashlib.sha256(p.read_bytes()).hexdigest()} for p in files],
          }, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload exact-pin evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sequence18-cross-repo-pin-${{ env.CEX_SOURCE_SHA }}-${{ github.run_attempt }}
          path: run/sequence18-cross-repo-pin/**
          if-no-files-found: error
          retention-days: 90
