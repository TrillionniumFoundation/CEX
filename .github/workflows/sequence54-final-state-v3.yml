name: sequence54-final-state-v3

on:
  push:
    branches:
      - work/sequence54-round2-staging-20260909
    paths:
      - '.github/workflows/sequence54-final-state-v3.yml'

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: read

concurrency:
  group: sequence54-final-state-v3
  cancel-in-progress: false

env:
  TARGET_BRANCH: integration/cex-v12-sequence54-20260908
  STAGING_BRANCH: work/sequence54-round2-staging-20260909
  PULL_REQUEST: '53'
  OUTPUT_DIR: run/sequence54-final-state
  STATE_PATH: docs/release-evidence/sequence54-current-live-final-state.json

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Observe complete live closure state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          cat > /tmp/final_state.py <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import subprocess
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          REPO = os.environ['GITHUB_REPOSITORY']
          BRANCH = os.environ['TARGET_BRANCH']
          STAGING = os.environ['STAGING_BRANCH']
          PR_NUMBER = int(os.environ['PULL_REQUEST'])
          OUT = Path(os.environ['OUTPUT_DIR'])
          REQUIRED_WORKFLOWS = [
              'p0-rust-toolchain-convergence.yml',
              'repository-semantic-contract-gate.yml',
              'p0-sequence54-integration.yml',
              'cex-v12-native-minimal.yml',
              'consumer-projection-boundary-gate.yml',
              'execution-lifecycle-gate.yml',
              'matrix-review-repair-regression.yml',
              'trnm-economy-ci.yml',
              'trnm-economy-settlement.yml',
              'world-settlement-external-evidence.yml',
          ]
          CONTROLLER_WORKFLOWS = [
              'sequence54-known-blocker-autoclose-v3.yml',
              'sequence54-known-blocker-fallback-v4.yml',
              'sequence54-post-repair-dispatch-v1.yml',
              'sequence54-repository-qualification-v1.yml',
              'sequence54-review-rerequest-v1.yml',
              'sequence54-governance-observer-v2.yml',
              'sequence54-cross-repo-acceptance-v2.yml',
              'sequence54-production-evidence-ledger-v2.yml',
              'sequence54-live-ledger-v2.yml',
          ]

          def run(args, *, input_text=None):
              return subprocess.run(
                  args,
                  input=input_text,
                  capture_output=True,
                  text=True,
              )

          def gh(path: str):
              result = run(['gh','api',path])
              if result.returncode:
                  raise RuntimeError(result.stderr.strip() or result.stdout.strip())
              return json.loads(result.stdout)

          def gh_optional(path: str):
              result = run(['gh','api',path])
              if result.returncode:
                  return {'ok': False, 'error': result.stderr.strip() or result.stdout.strip()}
              try:
                  value = json.loads(result.stdout)
              except json.JSONDecodeError:
                  value = result.stdout
              return {'ok': True, 'value': value}

          def raw(path: str, ref: str) -> str:
              result = run([
                  'gh','api','-H','Accept: application/vnd.github.raw+json',
                  f'repos/{REPO}/contents/{path}?ref={ref}',
              ])
              return result.stdout if result.returncode == 0 else ''

          def repaired_identity():
              branch = gh(f'repos/{REPO}/branches/{BRANCH}')
              sha = branch['commit']['sha']
              tree = branch['commit']['commit']['tree']['sha']
              repaired = (
                  'unapproved fixed Rust identity' in raw(
                      'scripts/rust_toolchain_convergence_v4.py', sha
                  )
                  and 'source_string_literals' in raw(
                      'scripts/check-consumer-projection-boundary.py', sha
                  )
              )
              return sha, tree, repaired

          deadline = time.monotonic() + 300 * 60
          stable_sha = None
          stable_since = None
          required_runs = {}
          controller_runs = {}
          qualification = None

          while time.monotonic() < deadline:
              sha, tree, repaired = repaired_identity()
              if not repaired:
                  stable_sha = None
                  stable_since = None
                  time.sleep(20)
                  continue
              if sha != stable_sha:
                  stable_sha = sha
                  stable_since = time.monotonic()

              required_runs = {}
              required_terminal = True
              required_present = True
              for workflow in REQUIRED_WORKFLOWS:
                  item = gh_optional(
                      f'repos/{REPO}/actions/workflows/{workflow}/runs'
                      f'?branch={BRANCH}&per_page=40'
                  )
                  if not item['ok']:
                      required_runs[workflow] = {
                          'status': 'missing_or_inaccessible',
                          'error': item['error'],
                      }
                      required_present = False
                      required_terminal = False
                      continue
                  candidates = [
                      value for value in item['value'].get('workflow_runs', [])
                      if value.get('head_sha') == sha
                  ]
                  if not candidates:
                      required_runs[workflow] = {'status': 'not_observed'}
                      required_present = False
                      required_terminal = False
                      continue
                  value = max(candidates, key=lambda candidate: candidate.get('id', 0))
                  required_runs[workflow] = {
                      'run_id': value.get('id'),
                      'status': value.get('status'),
                      'conclusion': value.get('conclusion'),
                      'event': value.get('event'),
                      'attempt': value.get('run_attempt'),
                      'html_url': value.get('html_url'),
                  }
                  if value.get('status') != 'completed':
                      required_terminal = False

              controller_runs = {}
              controllers_terminal = True
              for workflow in CONTROLLER_WORKFLOWS:
                  item = gh_optional(
                      f'repos/{REPO}/actions/workflows/{workflow}/runs'
                      f'?branch={STAGING}&per_page=10'
                  )
                  if not item['ok'] or not item['value'].get('workflow_runs'):
                      controller_runs[workflow] = {
                          'status': 'not_observed',
                          'error': item.get('error'),
                      }
                      controllers_terminal = False
                      continue
                  value = max(
                      item['value']['workflow_runs'],
                      key=lambda candidate: candidate.get('id', 0),
                  )
                  controller_runs[workflow] = {
                      'run_id': value.get('id'),
                      'status': value.get('status'),
                      'conclusion': value.get('conclusion'),
                      'html_url': value.get('html_url'),
                  }
                  if value.get('status') != 'completed':
                      controllers_terminal = False

              qualification = controller_runs.get(
                  'sequence54-repository-qualification-v1.yml'
              )
              if (
                  required_present
                  and required_terminal
                  and controllers_terminal
                  and stable_since is not None
                  and time.monotonic() - stable_since >= 90
              ):
                  break
              time.sleep(30)

          sha, tree, repaired = repaired_identity()
          pr = gh(f'repos/{REPO}/pulls/{PR_NUMBER}')
          base_sha = pr.get('base', {}).get('sha')
          merge_sha = pr.get('merge_commit_sha')

          # Enrich all exact-head required runs with concrete job/step evidence.
          for workflow, item in required_runs.items():
              run_id = item.get('run_id')
              if not run_id:
                  continue
              jobs_result = gh_optional(
                  f'repos/{REPO}/actions/runs/{run_id}/jobs?per_page=100'
              )
              if not jobs_result['ok']:
                  item['jobs_error'] = jobs_result['error']
                  continue
              jobs = []
              for job in jobs_result['value'].get('jobs', []):
                  steps = job.get('steps') or []
                  failed = next(
                      (step for step in steps if step.get('conclusion') == 'failure'),
                      None,
                  )
                  jobs.append({
                      'job_id': job.get('id'),
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'runner_name': job.get('runner_name'),
                      'runner_group_name': job.get('runner_group_name'),
                      'step_count': len(steps),
                      'first_failed_step': failed.get('name') if failed else None,
                  })
              item['jobs'] = jobs
              item['non_empty_execution'] = bool(jobs) and all(
                  job['runner_name'] and job['step_count'] > 0 for job in jobs
              )

          required_green = bool(required_runs) and all(
              item.get('status') == 'completed'
              and item.get('conclusion') == 'success'
              and item.get('non_empty_execution') is True
              for item in required_runs.values()
          )
          qualification_green = bool(
              qualification
              and qualification.get('status') == 'completed'
              and qualification.get('conclusion') == 'success'
          )

          # Current-head review decisions only; older commits receive no credit.
          reviews_result = gh_optional(
              f'repos/{REPO}/pulls/{PR_NUMBER}/reviews?per_page=100'
          )
          review_records = []
          latest_by_actor = {}
          if reviews_result['ok']:
              for review in reviews_result['value']:
                  actor = (review.get('user') or {}).get('login')
                  if not actor:
                      continue
                  latest_by_actor[actor.lower()] = review
              author = ((pr.get('user') or {}).get('login') or '').lower()
              for actor_lower, review in sorted(latest_by_actor.items()):
                  actor = (review.get('user') or {}).get('login')
                  permission_result = gh_optional(
                      f'repos/{REPO}/collaborators/{actor}/permission'
                  )
                  permission = None
                  if permission_result['ok']:
                      permission = permission_result['value'].get('permission')
                  body = str(review.get('body') or '')
                  eligible = bool(
                      actor_lower != author
                      and not actor_lower.endswith('[bot]')
                      and permission in {'write','maintain','admin'}
                      and review.get('state') == 'APPROVED'
                      and review.get('commit_id') == sha
                  )
                  review_records.append({
                      'actor': actor,
                      'state': review.get('state'),
                      'commit_id': review.get('commit_id'),
                      'submitted_at': review.get('submitted_at'),
                      'permission': permission,
                      'eligible_current_head_approval': eligible,
                      'security_review_marker': bool(
                          re.search(r'(?i)security|安全', body)
                      ),
                  })
          eligible = [
              item for item in review_records
              if item['eligible_current_head_approval']
          ]
          approvals_closed = len(eligible) >= 2 and any(
              item['security_review_marker'] for item in eligible
          )

          # Unresolved conversations through GraphQL; inaccessible is fail-closed.
          owner, name = REPO.split('/', 1)
          graphql = run([
              'gh','api','graphql',
              '-f',
              'query=query($owner:String!,$name:String!,$number:Int!){'
              'repository(owner:$owner,name:$name){pullRequest(number:$number){'
              'reviewThreads(first:100){nodes{isResolved}pageInfo{hasNextPage}}}}}',
              '-F',f'owner={owner}',
              '-F',f'name={name}',
              '-F',f'number={PR_NUMBER}',
          ])
          unresolved = None
          conversation_error = None
          if graphql.returncode == 0:
              payload = json.loads(graphql.stdout)
              nodes = (
                  payload.get('data', {}).get('repository', {})
                  .get('pullRequest', {}).get('reviewThreads', {}).get('nodes', [])
              )
              has_next = (
                  payload.get('data', {}).get('repository', {})
                  .get('pullRequest', {}).get('reviewThreads', {})
                  .get('pageInfo', {}).get('hasNextPage')
              )
              if has_next:
                  conversation_error = 'review thread pagination exceeds first 100'
              else:
                  unresolved = sum(not item.get('isResolved', False) for item in nodes)
          else:
              conversation_error = graphql.stderr.strip() or graphql.stdout.strip()
          conversations_closed = unresolved == 0 and conversation_error is None

          # Live governance readback. Desired-state files cannot satisfy this.
          rulesets_result = gh_optional(
              f'repos/{REPO}/rulesets?includes_parents=true'
          )
          branch_result = gh_optional(f'repos/{REPO}/branches/main')
          protection_result = gh_optional(f'repos/{REPO}/branches/main/protection')
          active_rulesets = []
          if rulesets_result['ok'] and isinstance(rulesets_result['value'], list):
              active_rulesets = [
                  item for item in rulesets_result['value']
                  if item.get('enforcement') == 'active'
              ]
          branch_value = branch_result.get('value') if branch_result['ok'] else {}
          protection = (
              protection_result.get('value') if protection_result['ok'] else {}
          )
          required_contexts = set()
          required_status = protection.get('required_status_checks')
          if isinstance(required_status, dict):
              required_contexts.update(
                  str(value) for value in required_status.get('contexts', []) if value
              )
              required_contexts.update(
                  str(value.get('context'))
                  for value in required_status.get('checks', [])
                  if isinstance(value, dict) and value.get('context')
              )
          reviews_policy = protection.get('required_pull_request_reviews') or {}
          governance_readback_closed = bool(
              active_rulesets
              and branch_value.get('protected') is True
              and protection_result['ok']
              and required_contexts
              and protection.get('allow_force_pushes', {}).get('enabled') is False
              and protection.get('allow_deletions', {}).get('enabled') is False
              and (reviews_policy.get('required_approving_review_count') or 0) >= 2
              and reviews_policy.get('dismiss_stale_reviews') is True
              and reviews_policy.get('require_code_owner_reviews') is True
          )
          # Negative probes must be separately retained; source readback alone is insufficient.
          governance_negative_probes_closed = False
          governance_closed = (
              governance_readback_closed and governance_negative_probes_closed
          )

          # Cross-repository and production acceptance are explicit external receipts.
          # A request or generated ledger never counts as acceptance.
          cross_repository_closed = False
          production_evidence_closed = False

          dimensions = {
              'repository_known_source_repair': repaired,
              'required_exact_head_workflows': required_green,
              'independent_repository_qualification': qualification_green,
              'current_head_independent_approvals': approvals_closed,
              'zero_unresolved_conversations': conversations_closed,
              'live_no_bypass_main_governance': governance_closed,
              'cross_repository_exact_tuple_acceptance': cross_repository_closed,
              'real_production_environment_evidence': production_evidence_closed,
          }
          all_closed = all(dimensions.values())
          certificate = {
              'schema': 'cex.sequence54-final-live-state.v3',
              'generated_at': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'repository': REPO,
              'pull_request': PR_NUMBER,
              'branch': BRANCH,
              'base_sha': base_sha,
              'head_sha': sha,
              'head_tree': tree,
              'prospective_merge_sha': merge_sha,
              'pr_state': pr.get('state'),
              'pr_draft': pr.get('draft'),
              'mergeable': pr.get('mergeable'),
              'dimensions': dimensions,
              'required_workflows': required_runs,
              'controller_workflows': controller_runs,
              'review_records': review_records,
              'eligible_current_head_approval_count': len(eligible),
              'security_approval_observed': any(
                  item['security_review_marker'] for item in eligible
              ),
              'unresolved_conversation_count': unresolved,
              'conversation_read_error': conversation_error,
              'governance': {
                  'rulesets_api_ok': rulesets_result['ok'],
                  'rulesets_error': rulesets_result.get('error'),
                  'active_ruleset_ids': [item.get('id') for item in active_rulesets],
                  'main_protected': branch_value.get('protected'),
                  'protection_api_ok': protection_result['ok'],
                  'protection_error': protection_result.get('error'),
                  'required_contexts': sorted(required_contexts),
                  'required_approving_review_count': reviews_policy.get(
                      'required_approving_review_count'
                  ),
                  'dismiss_stale_reviews': reviews_policy.get('dismiss_stale_reviews'),
                  'require_code_owner_reviews': reviews_policy.get(
                      'require_code_owner_reviews'
                  ),
                  'force_pushes_allowed': protection.get(
                      'allow_force_pushes', {}
                  ).get('enabled'),
                  'deletions_allowed': protection.get(
                      'allow_deletions', {}
                  ).get('enabled'),
                  'same_actor_positive_control_observed': False,
                  'direct_update_rejection_observed': False,
                  'non_fast_forward_rejection_observed': False,
                  'deletion_rejection_observed': False,
                  'independent_readback_observed': False,
              },
              'all_gaps_closed': all_closed,
              'certificate_issued': all_closed,
              'merge_authorized': all_closed,
              'production_authorization': 'granted' if all_closed else 'not_granted',
              'force_push_used': False,
              'administrator_bypass_used': False,
              'synthetic_status_used': False,
              'self_approval_used': False,
          }
          (OUT / 'final-live-state.json').write_text(
              json.dumps(certificate, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(certificate, indent=2, sort_keys=True))
          PY
          python3 /tmp/final_state.py

      - name: Persist final state on staging branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f "$OUTPUT_DIR/final-live-state.json"
          encoded="$(base64 -w0 "$OUTPUT_DIR/final-live-state.json")"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/$STATE_PATH?ref=$STAGING_BRANCH" --jq '.sha' 2>/dev/null || true)"
          jq -n \
            --arg message 'chore(sequence54): persist fail-closed live state certificate' \
            --arg content "$encoded" \
            --arg branch "$STAGING_BRANCH" \
            --arg sha "$existing" \
            'if $sha == "" then {message:$message,content:$content,branch:$branch} else {message:$message,content:$content,branch:$branch,sha:$sha} end' \
            >/tmp/state-update.json
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/$STATE_PATH" \
            --input /tmp/state-update.json

      - name: Publish final state to pull request
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if test ! -f "$OUTPUT_DIR/final-live-state.json"; then
            body='Final-state collection failed before a complete certificate was produced. No gap, merge or production authority is inferred.'
          else
            body="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('run/sequence54-final-state/final-live-state.json').read_text())
          lines=[
            '<!-- sequence54-final-live-state-v3 -->',
            '## Sequence 54 fail-closed final live state',
            '',
            f"- base: `{data['base_sha']}`",
            f"- head: `{data['head_sha']}`",
            f"- head tree: `{data['head_tree']}`",
            f"- prospective merge: `{data['prospective_merge_sha']}`",
            '',
            '| Dimension | Closed |',
            '|---|---|',
          ]
          for key,value in data['dimensions'].items():
            lines.append(f"| `{key}` | `{str(value).lower()}` |")
          lines += [
            '',
            f"- eligible current-head approvals: `{data['eligible_current_head_approval_count']}`",
            f"- unresolved conversations: `{data['unresolved_conversation_count']}`",
            f"- all gaps closed: `{str(data['all_gaps_closed']).lower()}`",
            f"- certificate issued: `{str(data['certificate_issued']).lower()}`",
            f"- merge authorized: `{str(data['merge_authorized']).lower()}`",
            f"- production authorization: `{data['production_authorization']}`",
            '',
            'No old-SHA run, source-only checker, requested review, desired-state policy, pin, generated ledger or same-actor statement receives authority credit.',
          ]
          print('\n'.join(lines))
          PY
          )"
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST/comments" \
            -f body="$body"

      - name: Upload final state certificate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sequence54-final-live-state-${{ github.run_id }}
          path: run/sequence54-final-state
          if-no-files-found: warn
          retention-days: 90
          compression-level: 9

      - name: Enforce certificate truth
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUTPUT_DIR/final-live-state.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('run/sequence54-final-state/final-live-state.json').read_text())
          assert data['force_push_used'] is False
          assert data['administrator_bypass_used'] is False
          assert data['synthetic_status_used'] is False
          assert data['self_approval_used'] is False
          if not data['all_gaps_closed']:
              assert data['certificate_issued'] is False
              assert data['merge_authorized'] is False
              assert data['production_authorization'] == 'not_granted'
          PY
