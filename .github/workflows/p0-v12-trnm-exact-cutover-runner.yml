name: p0-v12-trnm-exact-cutover-runner

on:
  push:
    branches:
      - fix/p0-v12-final-closure
    paths:
      - '.github/workflows/p0-v12-trnm-exact-cutover-runner.yml'

permissions:
  contents: write

concurrency:
  group: p0-v12-trnm-exact-cutover-runner-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://cex:cex_ci_password@127.0.0.1:5432/cex_ci
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cex
          POSTGRES_PASSWORD: cex_ci_password
          POSTGRES_DB: cex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cex -d cex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/p0-v12-final-closure
          fetch-depth: 0

      - name: Extract and execute exact cutover patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/p0-v12-trnm-exact-cutover.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install Rust stable"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = []
          for line in source[start:end].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/p0-v12-trnm-exact-cutover.py').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8'
          )
          PY
          python3 /tmp/p0-v12-trnm-exact-cutover.py

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format and static contract
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 scripts/check-trnm-settlement-receipt-lookup.py
          git diff --check

      - name: Ledger tests and Clippy
        run: |
          cargo test --locked -p ledger-service --all-targets --no-fail-fast
          cargo clippy --locked -p ledger-service --all-targets -- -D warnings

      - name: Apply complete migration chain
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done < <(find migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]_*.sql' | sort)

      - name: Build and qualify complete TRNM recovery lifecycle
        shell: bash
        env:
          CEX_P0_EVIDENCE_DIR: run/p0-release-evidence
        run: |
          set -euo pipefail
          cargo build --locked -p ledger-service --bin ledger-service
          bash scripts/check-trnm-settlement-receipt-lookup-http.sh

      - name: Commit exact cutover only after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CEX P0 closure automation'
          git config user.email 'actions@users.noreply.github.com'
          git add services/ledger-service/src/repository/native_economy.rs scripts/check-trnm-settlement-receipt-lookup.py
          git diff --cached --check
          git commit -m 'fix(trnm): cut native economy over to exact Ledger authority'
          git push origin HEAD:fix/p0-v12-final-closure
