[workspace]
members = [
  "crates/hepta-paper-raid-contracts",
  "services/hepta-research-league",
  "vendor/trnm-finality-types",
  "vendor/trnm-finality-verifier",
  "vendor/trnm-protocol",
  "vendor/trnm-research-protocol",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["Qi Team"]

[workspace.dependencies]
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
hepta-paper-raid-contracts = { path = "crates/hepta-paper-raid-contracts" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
trnm-finality-types = { version = "=0.1.0", path = "vendor/trnm-finality-types" }
trnm-finality-verifier = { version = "=0.1.0", path = "vendor/trnm-finality-verifier" }
trnm-protocol = { version = "=0.1.0", path = "vendor/trnm-protocol" }
trnm-research-protocol = { version = "=0.1.0", path = "vendor/trnm-research-protocol" }
uuid = { version = "1", features = ["v4", "serde"] }
