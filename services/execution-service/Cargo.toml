[package]
name = "execution-service"
version.workspace = true
edition.workspace = true
license.workspace = true
autotests = false

[features]
default = []
# Historical local-provider compatibility only. This feature is deliberately
# absent from every authoritative build/deployment path and the worker rejects
# beta, staging, and production profiles at startup.
legacy-local-provider-dispatch = []

[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
reqwest.workspace = true
sqlx.workspace = true
async-trait.workspace = true
shared-tracing = { path = "../../crates/shared-tracing" }
shared-types = { path = "../../crates/shared-types" }
shared-config = { path = "../../crates/shared-config" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "execution-provider-dispatch-worker"
path = "src/bin/execution-provider-dispatch-worker.rs"
required-features = ["legacy-local-provider-dispatch"]

[[test]]
name = "external_agent_boundary"
path = "tests/external_agent_boundary.rs"

# This large fixture suite documents the retired in-process Ollama/OpenClaw
# behavior. It is excluded from authoritative/default qualification so legacy
# expectations cannot reintroduce platform-owned Agent execution.
[[test]]
name = "legacy_local_provider_http_flow"
path = "tests/http_flow.rs"
required-features = ["legacy-local-provider-dispatch"]
